<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alexander Ferrari Miller | Resume Viewer</title>

    <style>
        :root {
            --background: #f5f5f2;
            --surface: #ffffff;
            --text: #1f2529;
            --muted: #5f686f;
            --accent: #2f536b;
            --accent-dark: #213d50;
            --border: #d9dde0;
            --shadow: rgba(0, 0, 0, 0.08);
            --max-width: 1100px;
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            font-family:
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                Roboto,
                Helvetica,
                Arial,
                sans-serif;
            background: var(--background);
            color: var(--text);
        }

        .container {
            width: min(94%, var(--max-width));
            margin: 0 auto;
        }

        .site-header { padding: 1.5rem 0; }

        .site-name {
            color: var(--accent-dark);
            font-size: 1.25rem;
            font-weight: 700;
            text-decoration: none;
        }

        main { padding-bottom: 3rem; }

        .viewer-header {
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            align-items: center;
            gap: 1rem;
            margin-bottom: 1rem;
        }

        .viewer-title {
            margin: 0;
            color: var(--accent-dark);
            font-size: clamp(1.4rem, 5vw, 2rem);
        }

        .actions {
            display: flex;
            flex-wrap: wrap;
            gap: 0.6rem;
        }

        .button {
            display: inline-block;
            padding: 0.7rem 1rem;
            border: 0;
            border-radius: 7px;
            background: var(--accent);
            color: white;
            font: inherit;
            font-weight: 600;
            text-decoration: none;
            cursor: pointer;
        }

        .button:hover,
        .button:focus {
            background: var(--accent-dark);
        }

        .button.secondary {
            background: var(--surface);
            color: var(--accent-dark);
            border: 1px solid var(--border);
        }

        .viewer {
            min-height: 70vh;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 12px;
            box-shadow: 0 4px 14px var(--shadow);
            overflow: hidden;
        }

        .html-viewer {
            width: 100%;
            min-height: 78vh;
            border: 0;
        }

        .pdf-viewer {
            width: 100%;
            height: 78vh;
            border: 0;
        }

        .document-viewer {
            padding: 2rem;
            overflow-x: auto;
        }

        .document-viewer h1,
        .document-viewer h2,
        .document-viewer h3 {
            color: var(--accent-dark);
        }

        .document-viewer p,
        .document-viewer li {
            line-height: 1.6;
        }

        .source-viewer {
            margin: 0;
            padding: 1.5rem;
            min-height: 70vh;
            overflow: auto;
            white-space: pre-wrap;
            word-break: break-word;
            font-family:
                ui-monospace,
                SFMono-Regular,
                Menlo,
                Monaco,
                Consolas,
                "Liberation Mono",
                "Courier New",
                monospace;
            font-size: 0.9rem;
            line-height: 1.5;
            background: #ffffff;
            color: #1f2529;
        }

        .fallback {
            padding: 3rem 2rem;
            text-align: center;
        }

        .fallback p {
            max-width: 650px;
            margin: 0 auto 1.5rem;
            color: var(--muted);
            line-height: 1.6;
        }

        .status {
            padding: 2rem;
            color: var(--muted);
        }

        .site-footer {
            border-top: 1px solid var(--border);
            padding: 1.5rem 0;
        }

        .site-nav {
            display: flex;
            flex-wrap: wrap;
            gap: 1rem 1.5rem;
        }

        .site-nav a {
            color: var(--accent-dark);
            text-decoration: none;
            font-weight: 600;
        }

        .site-nav a:hover,
        .site-nav a:focus {
            text-decoration: underline;
        }

        @media (max-width: 600px) {
            .document-viewer { padding: 1.25rem; }

            .html-viewer,
            .pdf-viewer {
                min-height: 72vh;
                height: 72vh;
            }
        }
    </style>

    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/jszip/dist/jszip.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/docx-preview/dist/docx-preview.min.js"></script>
</head>

<body>

    <header class="site-header">
        <div class="container">
            <a class="site-name" href="index.html">
                Alexander Ferrari Miller
            </a>
        </div>
    </header>

    <main>
        <div class="container">

            <div class="viewer-header">
                <h1 class="viewer-title" id="viewer-title">Resume</h1>

                <div class="actions">

                    <button
                        class="button secondary"
                        id="source-button"
                        type="button"
                    >
                        View Raw HTML
                    </button>

                    <a class="button secondary" id="back-to-resumes" href="resumes.html">
                        Back to Resumes
                    </a>
                </div>
            </div>

            <section class="viewer" id="viewer" aria-live="polite">
                <div class="status">Loading document…</div>
            </section>

        </div>
    </main>

    <footer class="site-footer">
        <div class="container">
            <nav class="site-nav" aria-label="Main navigation">
                <a href="index.html">Professional</a>
                <a href="performance.html">Performance</a>
                <a href="projects.html">Projects</a>
                <a href="social-media.html">Social Media</a>
                <a href="resumes.html">Resumes</a>
            </nav>
        </div>
    </footer>

    <script>
        const params = new URLSearchParams(window.location.search);

        const file = params.get("file");
        const type = (params.get("type") || "").toLowerCase();
        const title = params.get("title") || "Resume";

        const viewer = document.getElementById("viewer");
        const titleElement = document.getElementById("viewer-title");
        const sourceButton = document.getElementById("source-button");
        const backToResumes = document.getElementById("back-to-resumes");

        let showingSource = false;
        let htmlText = null;
        let markdownText = null;

        titleElement.textContent = title;

        if (file && /^kilroy\//i.test(file.replace(/^\/+/, ""))) {
            backToResumes.href = "kilroy/resumes.html";
            backToResumes.textContent = "Back to Kilroy Resumes";
        }

        if (!file) {
            viewer.innerHTML = `
                <div class="fallback">
                    <p>No document was specified.</p>
                </div>
            `;
            sourceButton.disabled = true;
        } else {
            const fileUrl = new URL(file, window.location.href).href;

            async function loadHtmlText() {
                if (htmlText !== null) {
                    return htmlText;
                }

                const response = await fetch(fileUrl);

                if (!response.ok) {
                    throw new Error("Unable to load HTML.");
                }

                htmlText = await response.text();
                return htmlText;
            }

            async function displayHtml() {
                try {
                    showingSource = false;
                    sourceButton.textContent = "View Raw HTML";

                    const text = await loadHtmlText();

                    viewer.innerHTML = "";

                    const frame = document.createElement("iframe");
                    frame.className = "html-viewer";
                    frame.title = title;

                    viewer.appendChild(frame);

                    const baseTag =
                        `<base href="${new URL(".", fileUrl).href}">`;

                    frame.srcdoc = text.replace(
                        /<head([^>]*)>/i,
                        `<head$1>${baseTag}`
                    );
                } catch (error) {
                    showFallback();
                }
            }

            async function displayHtmlSource() {
                try {
                    const text = await loadHtmlText();

                    viewer.innerHTML = "";

                    const pre = document.createElement("pre");
                    pre.className = "source-viewer";
                    pre.textContent = text;

                    viewer.appendChild(pre);

                    showingSource = true;
                    sourceButton.textContent = "View Rendered HTML";
                } catch (error) {
                    showFallback();
                }
            }

            async function loadMarkdownText() {
                if (markdownText !== null) {
                    return markdownText;
                }

                const response = await fetch(fileUrl);

                if (!response.ok) {
                    throw new Error("Unable to load Markdown.");
                }

                markdownText = await response.text();
                return markdownText;
            }

            async function displayMarkdown() {
                try {
                    showingSource = false;
                    sourceButton.textContent = "View Raw Markdown";

                    const text = await loadMarkdownText();

                    viewer.innerHTML = `
                        <article class="document-viewer">
                            ${marked.parse(text)}
                        </article>
                    `;
                } catch (error) {
                    showFallback();
                }
            }

            async function displayMarkdownSource() {
                try {
                    const text = await loadMarkdownText();

                    viewer.innerHTML = "";

                    const pre = document.createElement("pre");
                    pre.className = "source-viewer";
                    pre.textContent = text;

                    viewer.appendChild(pre);

                    showingSource = true;
                    sourceButton.textContent = "View Rendered Markdown";
                } catch (error) {
                    showFallback();
                }
            }

            async function displayText() {
                try {
                    const response = await fetch(fileUrl);

                    if (!response.ok) {
                        throw new Error("Unable to load text.");
                    }

                    const text = await response.text();

                    viewer.innerHTML = "";

                    const pre = document.createElement("pre");
                    pre.className = "source-viewer";
                    pre.textContent = text;

                    viewer.appendChild(pre);
                } catch (error) {
                    showFallback();
                }
            }

            async function displayDocx() {
                try {
                    const response = await fetch(fileUrl);

                    if (!response.ok) {
                        throw new Error("Unable to load DOCX.");
                    }

                    const data = await response.arrayBuffer();

                    viewer.innerHTML = "";

                    const docxContainer = document.createElement("div");
                    docxContainer.className = "document-viewer";
                    viewer.appendChild(docxContainer);

                    await docx.renderAsync(
                        data,
                        docxContainer,
                        null,
                        {
                            className: "docx",
                            inWrapper: true,
                            ignoreWidth: false,
                            ignoreHeight: false,
                            ignoreFonts: false,
                            breakPages: true
                        }
                    );

                } catch (error) {
                    showFallback();
                }
            }

            function displayPdf() {
                viewer.innerHTML = `
                    <iframe
                        class="pdf-viewer"
                        src="${fileUrl}"
                        title="${title}"
                    ></iframe>
                `;
            }

            function showFallback() {
                viewer.innerHTML = `
                    <div class="fallback">
                        <p>
                            This file format cannot be reliably previewed
                            in this browser. Return to Resumes to
                            open the original file directly.
                        </p>
                    </div>
                `;
            }

            sourceButton.addEventListener("click", () => {
                if (type === "html") {
                    if (showingSource) {
                        displayHtml();
                    } else {
                        displayHtmlSource();
                    }
                } else if (type === "md" || type === "markdown") {
                    if (showingSource) {
                        displayMarkdown();
                    } else {
                        displayMarkdownSource();
                    }
                }
            });

            if (type === "html") {
                displayHtml();
            } else if (type === "pdf") {
                sourceButton.style.display = "none";
                displayPdf();
            } else if (type === "docx") {
                sourceButton.style.display = "none";
                displayDocx();
            } else if (type === "txt" || type === "text") {
                sourceButton.style.display = "none";
                displayText();
            } else if (type === "md" || type === "markdown") {
                displayMarkdown();
            } else {
                sourceButton.style.display = "none";
                showFallback();
            }
        }
    </script>

</body>
</html>
