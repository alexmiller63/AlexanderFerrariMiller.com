<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 1480" role="img" aria-labelledby="solar-title solar-desc"><title id="solar-title">2029-06-12 partial solar eclipse study chart</title><desc id="solar-desc">Numbered shadow-plane cross-section, global UTC contacts and timeline, geometry ledger, and available calculated central-path coordinates.</desc><rect width="1400" height="1480" fill="#fbf8ef"/><style>text{font-family:DejaVu Sans,sans-serif;fill:#203747}.mono{font-family:DejaVu Sans Mono,monospace;font-variant-numeric:tabular-nums}</style><text x="50" y="45" font-size="17" letter-spacing="3">STAR ALMANACK  /  ECLIPSE STUDIES</text><text x="50" y="96" font-size="40" font-weight="bold">PARTIAL SOLAR ECLIPSE</text><text x="50" y="135" font-size="24" >12 June 2029  ·  all clocks UTC</text><text x="1350" y="45" font-size="16" text-anchor="end" class="mono">ECL-2029-06-12-S</text><line x1="50" y1="158" x2="1350" y2="158" stroke="#b8b3a4"/><text x="50" y="195" font-size="19" font-weight="bold">01  /  SHADOW-PLANE GEOMETRY AT GREATEST ECLIPSE</text><circle data-label="Earth section" cx="566.9433" cy="500.0" r="228.0567" fill="#96c9db" fill-opacity=".8" stroke="#536579"/><circle data-label="Penumbra" cx="271.8994" cy="500.0" r="126.8994" fill="#ded9ce" fill-opacity=".8" stroke="#536579"/><circle data-label="Antumbra" cx="271.8994" cy="500.0" r="2.3317" fill="#51485d" fill-opacity=".8" stroke="#536579"/><g id="shadow-coordinate-grid"><line x1="271.8993683675026" y1="230" x2="271.8993683675026" y2="770" stroke="#526c7b" stroke-opacity=".3" stroke-dasharray="3 5"/><text x="271.8993683675026" y="794" font-size="15" text-anchor="middle" class="mono">0</text><line x1="450.6793703335325" y1="230" x2="450.6793703335325" y2="770" stroke="#526c7b" stroke-opacity=".3" stroke-dasharray="3 5"/><text x="450.6793703335325" y="794" font-size="15" text-anchor="middle" class="mono">+5,000</text><line x1="629.4593722995625" y1="230" x2="629.4593722995625" y2="770" stroke="#526c7b" stroke-opacity=".3" stroke-dasharray="3 5"/><text x="629.4593722995625" y="794" font-size="15" text-anchor="middle" class="mono">+10,000</text><line x1="808.2393742655925" y1="230" x2="808.2393742655925" y2="770" stroke="#526c7b" stroke-opacity=".3" stroke-dasharray="3 5"/><text x="808.2393742655925" y="794" font-size="15" text-anchor="middle" class="mono">+15,000</text><line x1="120" y1="678.7800019660299" x2="820" y2="678.7800019660299" stroke="#526c7b" stroke-opacity=".3" stroke-dasharray="3 5"/><text x="112" y="683.7800019660299" font-size="15" text-anchor="end" class="mono">-5,000</text><line x1="120" y1="500.0" x2="820" y2="500.0" stroke="#526c7b" stroke-opacity=".3" stroke-dasharray="3 5"/><text x="112" y="505.0" font-size="15" text-anchor="end" class="mono">0</text><line x1="120" y1="321.2199980339701" x2="820" y2="321.2199980339701" stroke="#526c7b" stroke-opacity=".3" stroke-dasharray="3 5"/><text x="112" y="326.2199980339701" font-size="15" text-anchor="end" class="mono">+5,000</text></g><line x1="561.9433309200784" y1="500.0" x2="571.9433309200784" y2="500.0" stroke="#203747" stroke-width="2"/><line x1="566.9433309200784" y1="495.0" x2="566.9433309200784" y2="505.0" stroke="#203747" stroke-width="2"/><text x="135" y="835" font-size="17" >Earth section: center x = 8,251.6 km; radius = 6,378.1 km</text><line x1="266.8993683675026" y1="500.0" x2="276.8993683675026" y2="500.0" stroke="#203747" stroke-width="2"/><line x1="271.8993683675026" y1="495.0" x2="271.8993683675026" y2="505.0" stroke="#203747" stroke-width="2"/><text x="135" y="860" font-size="17" >Penumbra: center x = 0.0 km; radius = 3,549.0 km</text><line x1="266.8993683675026" y1="500.0" x2="276.8993683675026" y2="500.0" stroke="#203747" stroke-width="2"/><line x1="271.8993683675026" y1="495.0" x2="271.8993683675026" y2="505.0" stroke="#203747" stroke-width="2"/><text x="135" y="885" font-size="17" >Antumbra: center x = 0.0 km; radius = 65.2 km</text><text x="470" y="817" font-size="16" text-anchor="middle">Offset (km) · origin: shadow axis · +x toward Earth’s center</text><text x="50" y="936" font-size="17" >Both axes use kilometres at the same scale. Transverse orientation is arbitrary; no celestial compass is implied.</text><text x="50" y="961" font-size="17" >A cross-section through Earth’s center at closest axis approach, not the shadow footprint on Earth’s surface.</text><text x="930" y="230" font-size="19" font-weight="bold">02  /  GLOBAL CONTACTS</text><text x="930" y="268" font-size="17" >Global beginning</text><text x="930" y="292" font-size="17" class="mono">2029-06-12  02:26:43</text><text x="930" y="327" font-size="17" >Greatest eclipse</text><text x="930" y="351" font-size="17" class="mono">2029-06-12  04:05:44</text><text x="930" y="386" font-size="17" >Global ending</text><text x="930" y="410" font-size="17" class="mono">2029-06-12  05:44:40</text><text x="930" y="590" font-size="19" font-weight="bold">03  /  GEOMETRY</text><text x="930" y="624" font-size="17" >Axis distance</text><text x="930" y="645" font-size="18" class="mono">+8,251.593 km</text><text x="930" y="668" font-size="17" >Axis minus Earth radius</text><text x="930" y="689" font-size="18" class="mono">+1,873.456 km</text><text x="930" y="712" font-size="17" >Penumbral margin</text><text x="930" y="733" font-size="18" class="mono">-1,675.581 km</text><text x="930" y="756" font-size="17" >Signed core radius</text><text x="930" y="777" font-size="18" class="mono">-65.211 km</text><text x="930" y="912" font-size="16" >Core: + umbra / − antumbra</text><line x1="50" y1="980" x2="1350" y2="980" stroke="#b8b3a4"/><text x="50" y="1014" font-size="19" font-weight="bold">04  /  GLOBAL UTC TIMELINE</text><line x1="130" y1="1095" x2="1260" y2="1095" stroke="#526c7b" stroke-width="2"/><line x1="130.0" y1="1090" x2="130.0" y2="1100" stroke="#203747" stroke-width="2"/><line x1="130.0" y1="1095" x2="130.0" y2="1058" stroke="#526c7b"/><text x="130.0" y="1052" font-size="15" text-anchor="middle">Global beginning</text><text x="130.0" y="1071" font-size="17" text-anchor="middle" class="mono">02:26:43</text><line x1="695.2378546771071" y1="1090" x2="695.2378546771071" y2="1100" stroke="#203747" stroke-width="2"/><line x1="695.2378546771071" y1="1095" x2="695.2378546771071" y2="1114" stroke="#526c7b"/><text x="695.2378546771071" y="1133" font-size="15" text-anchor="middle">Greatest eclipse</text><text x="695.2378546771071" y="1152" font-size="17" text-anchor="middle" class="mono">04:05:44</text><line x1="1260.0" y1="1090" x2="1260.0" y2="1100" stroke="#203747" stroke-width="2"/><line x1="1260.0" y1="1095" x2="1260.0" y2="1058" stroke="#526c7b"/><text x="1260.0" y="1052" font-size="15" text-anchor="middle">Global ending</text><text x="1260.0" y="1071" font-size="17" text-anchor="middle" class="mono">05:44:40</text><text x="50" y="1194" font-size="17" >Global event window: 03h 17m 57s. These are global limits, not local contacts or duration.</text><line x1="50" y1="1215" x2="1350" y2="1215" stroke="#b8b3a4"/><text x="50" y="1250" font-size="19" font-weight="bold">05  /  CALCULATED CENTRAL PATH</text><text x="50" y="1310" font-size="23" >No calculated central-axis surface path for this event.</text><text x="50" y="1350" font-size="18" >The diagram above quantifies the offset and shadow overlap; global times appear in the ledger and timeline.</text><text x="50" y="1390" font-size="18" >For a partial eclipse, the central shadow axis misses Earth. A wider partial-visibility map is not yet calculated.</text><text x="50" y="1440" font-size="16" >Original chart and calculations: Star Almanack. Positions: JPL DE440s. Spherical Earth; instantaneous geometry; provisional model.</text><text x="50" y="1465" font-size="16" >Surface core extrema describe the sampled surface path; the cross-section core radius describes a different plane.</text></svg>