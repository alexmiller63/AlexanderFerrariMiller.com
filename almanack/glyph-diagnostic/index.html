<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Star Almanack Glyph Diagnostic</title>
  <style>
    html,body{margin:0;padding:0;background:#fff}
    main{max-width:760px;margin:0 auto;padding:24px 18px 60px}
    .glyph-panel{min-height:360px;display:flex;align-items:center;justify-content:center;background:#fff;border-bottom:1px solid #ddd}
    .glyph-panel:last-child{border-bottom:0}
    .glyph{display:block;width:min(86vw,420px);height:300px;object-fit:contain;background:#fff}
  </style>
</head>
<body>
  <main>
    <section class="glyph-panel"><img class="glyph" src="/assets/almanack/visibility-glyphs/masters/eye.svg" alt="Eye glyph"></section>
    <section class="glyph-panel"><img class="glyph" src="/assets/almanack/visibility-glyphs/masters/binoculars.svg" alt="Binoculars glyph"></section>
    <section class="glyph-panel"><img class="glyph" src="/assets/almanack/visibility-glyphs/masters/telescope.svg" alt="Telescope glyph"></section>
    <section class="glyph-panel"><img class="glyph" src="/assets/almanack/visibility-glyphs/masters/meteor-shower.svg" alt="Meteor shower glyph"></section>
    <section class="glyph-panel"><img class="glyph" src="/assets/almanack/visibility-glyphs/masters/solar-eclipse.svg" alt="Solar eclipse glyph"></section>
    <section class="glyph-panel"><img class="glyph" src="/assets/almanack/visibility-glyphs/masters/lunar-eclipse.svg" alt="Lunar eclipse glyph"></section>
  </main>
</body>
</html>
