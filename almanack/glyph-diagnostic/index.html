<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Star Almanack Glyph Diagnostic</title>
  <style>
    html,body{margin:0;padding:0;background:#fff;color:#111;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
    main{max-width:1100px;margin:0 auto;padding:28px 20px 56px}
    h1{font-size:2rem;margin:0 0 10px}
    p{margin:0 0 26px;font-size:1.05rem}
    .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:24px}
    .card{border:1px solid #bbb;border-radius:14px;padding:22px;text-align:center;background:#fff}
    .card h2{font-size:1.15rem;margin:0 0 18px}
    .glyph{display:block;width:min(100%,280px);height:220px;object-fit:contain;margin:0 auto;background:#fff}
    .path{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:.78rem;overflow-wrap:anywhere;margin-top:14px;color:#444}
  </style>
</head>
<body>
  <main>
    <h1>Star Almanack Glyph Diagnostic</h1>
    <p>Large diagnostic render on a plain white background.</p>
    <div class="grid">
      <section class="card"><h2>Eye</h2><img class="glyph" src="/assets/almanack/visibility-glyphs/masters/eye.svg" alt="Eye glyph"><div class="path">eye.svg</div></section>
      <section class="card"><h2>Binoculars</h2><img class="glyph" src="/assets/almanack/visibility-glyphs/masters/binoculars.svg" alt="Binoculars glyph"><div class="path">binoculars.svg</div></section>
      <section class="card"><h2>Telescope</h2><img class="glyph" src="/assets/almanack/visibility-glyphs/masters/telescope.svg" alt="Telescope glyph"><div class="path">telescope.svg</div></section>
      <section class="card"><h2>Meteor shower</h2><img class="glyph" src="/assets/almanack/visibility-glyphs/masters/meteor-shower.svg" alt="Meteor shower glyph"><div class="path">meteor-shower.svg</div></section>
      <section class="card"><h2>Solar eclipse</h2><img class="glyph" src="/assets/almanack/visibility-glyphs/masters/solar-eclipse.svg" alt="Solar eclipse glyph"><div class="path">solar-eclipse.svg</div></section>
      <section class="card"><h2>Lunar eclipse</h2><img class="glyph" src="/assets/almanack/visibility-glyphs/masters/lunar-eclipse.svg" alt="Lunar eclipse glyph"><div class="path">lunar-eclipse.svg</div></section>
    </div>
  </main>
</body>
</html>
