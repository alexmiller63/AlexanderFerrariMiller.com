# Star Almanack core orienting asterisms
#
# Scope is deliberately fixed at 25. This is not an attempt to catalog every
# published asterism. Membership provenance priority is:
#   1. NASA explicit member-star definition
#   2. Astronomical League explicit member-star definition
#   3. another authoritative published source only when unresolved
#
# A source that merely names or illustrates an asterism does not automatically
# establish exact membership. Member lists are filled only from explicit
# published definitions and should retain source provenance.
#
# Geometry downstream:
#   published members -> catalog coordinates -> zero-margin spherical boundary
#   -> spherical area centroid -> Star Almanack best-visibility date.
# Member stars also qualify independently for the calendar, with presentation
# deduplicated by physical observing target.

provenance_priority:
  - NASA
  - Astronomical League
  - other authoritative published source

asterisms:
  - name: Big Dipper
    status: membership-to-resolve
  - name: Little Dipper
    status: membership-to-resolve
  - name: Cassiopeia's W
    status: membership-to-resolve
  - name: Orion's Belt
    status: membership-to-resolve
  - name: Orion's Sword
    status: membership-to-resolve
  - name: Water Jar
    status: membership-to-resolve
  - name: Great Square of Pegasus
    status: resolved
    members: [Scheat, Alpheratz, Markab, Algenib]
    source: NASA
    source_url: https://science.nasa.gov/solar-system/skywatching/night-sky-network/connecting-the-dots-with-asterisms/
  - name: Sickle of Leo
    status: membership-to-resolve
  - name: Keystone of Hercules
