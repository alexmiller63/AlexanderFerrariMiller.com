name: Diagnose DE441 Eclipse Timescale

on:
  workflow_dispatch:

jobs:
  diagnose-eclipse-timescale:
    runs-on: ubuntu-latest

    steps:
      - name: Check out Star Almanack
        uses: actions/checkout@v6

      - name: Create debug file
        run: |
          echo "DE441 ECLIPSE TIMESCALE DIAGNOSTIC" > debug.txt
          echo "Workflow started." >> debug.txt

      - name: Install Python dependencies
        run: python3 -m pip install --disable-pip-version-check spiceypy pyyaml

      - name: Download NAIF leap-seconds kernel
        run: |
          { echo; echo "===== NAIF leap-seconds kernel download ====="; curl -L https://naif.jpl.nasa.gov/pub/naif/generic_kernels/lsk/naif0012.tls -o naif0012.tls; test -s naif0012.tls; ls -lh naif0012.tls; } 2>&1 | tee -a debug.txt

      - name: Run narrow eclipse timescale diagnostic
        if: always()
        run: |
          python3 <<'PY' 2>&1 | tee -a debug.txt
          import spiceypy as spice
          import yaml
          import eclipse_engine

          LSK = "naif0012.tls"
          TARGET_FIELDS = ("expected_greatest_utc", "nasa_greatest_utc")

          print("===== TIMESCALE DIAGNOSTIC =====")
          tested = 0

          try:
              spice.furnsh(LSK)

              with open("eclipse-validation-cases.yaml", "r") as f:
                  data = yaml.safe_load(f)

              def walk(obj):
                  global tested

                  if isinstance(obj, dict):
                      for field in TARGET_FIELDS:
                          if field in obj:
                              utc = obj[field]
                              tested += 1

                              try:
                                  approx = eclipse_engine.utc_to_tdb_approx(utc)
                                  spice_et = spice.str2et(utc)

                                  print()
                                  print("field:", field)
                                  print("id:", obj.get("id", "(no id)"))
                                  print("UTC:", utc)
                                  print("engine TDB:", approx)
                                  print("SPICE ET/TDB:", spice_et)
                                  print("difference:", approx - spice_et)

                              except Exception as exc:
                                  print()
                                  print("field:", field)
                                  print("id:", obj.get("id", "(no id)"))
                                  print("UTC:", utc)
                                  print("ERROR:", repr(exc))

                      for value in obj.values():
                          walk(value)

                  elif isinstance(obj, list):
                      for value in obj:
                          walk(value)

              walk(data)

              print()
              print("timestamps tested:", tested)

              if tested == 0:
                  print("ERROR: no greatest-eclipse UTC timestamps were found.")

          except Exception as exc:
              print("DIAGNOSTIC SETUP ERROR:", repr(exc))

          finally:
              spice.kclear()
          PY

      - name: Show debug file
        if: always()
        run: cat debug.txt || true

      - name: Upload debug.txt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eclipse-timescale-debug
          path: debug.txt
          if-no-files-found: error
          retention-days: 7
