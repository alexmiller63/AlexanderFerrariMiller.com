name: Validate Constellation Centroid Convergence

on:
  workflow_dispatch:
  push:
    paths:
      - 'validate_constellation_centroid_convergence.py'
      - 'compute_constellation_observance_2026.py'
      - 'compute_bayer_visibility_2026.py'
      - '.github/workflows/validate-constellation-centroid-convergence.yml'

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run 88-constellation convergence test
        run: python validate_constellation_centroid_convergence.py

      - name: Verify result shape
        run: |
          python - <<'PY'
          import csv
          with open('constellation-centroid-convergence-2026.csv', newline='', encoding='utf-8') as f:
              rows = list(csv.DictReader(f))
          assert len(rows) == 88, len(rows)
          assert len({r['abbr'] for r in rows}) == 88
          print('Centroid convergence result shape: 88/88 PASS')
          PY

      - name: Commit convergence table
        run: |
          if [ -z "$(git status --porcelain -- constellation-centroid-convergence-2026.csv)" ]; then
            echo 'No generated changes.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add constellation-centroid-convergence-2026.csv
          git commit -m 'Build constellation centroid convergence table'
          git push
