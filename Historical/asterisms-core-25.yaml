# Star Almanack core orienting asterisms
# Scope is fixed at 25.
# Membership provenance priority:
#   1. NASA explicit member-star definition
#   2. Astronomical League explicit member-star definition
#   3. another authoritative published source only when unresolved
# A source that merely names/illustrates an asterism does not establish exact membership.
# Geometry downstream: published members -> catalog coordinates -> zero-margin
# spherical boundary -> spherical area centroid -> Star Almanack visibility date.

provenance_priority:
  - NASA
  - Astronomical League
  - other authoritative published source

asterisms:
  - name: Big Dipper
    status: resolved
    members: [Alpha Ursae Majoris, Beta Ursae Majoris, Gamma Ursae Majoris, Delta Ursae Majoris, Epsilon Ursae Majoris, Zeta Ursae Majoris, Eta Ursae Majoris]
    source: Astronomical League
    source_url: https://www.astroleague.org/wp-content/uploads/2025/12/Asterism_List_20251223.pdf

  - name: Little Dipper
    status: resolved
    members: [Polaris, Beta Ursae Minoris, Gamma Ursae Minoris, Delta Ursae Minoris, Epsilon Ursae Minoris, Eta Ursae Minoris, Zeta Ursae Minoris]
    source: Astronomical League
    source_url: https://www.astroleague.org/wp-content/uploads/2025/12/Asterism_List_20251223.pdf

  - name: Cassiopeia's W
    status: resolved
    aliases: [W or M]
    members: [Alpha Cassiopeiae, Beta Cassiopeiae, Gamma Cassiopeiae, Delta Cassiopeiae, Epsilon Cassiopeiae]
    source: Astronomical League
    source_url: https://www.astroleague.org/wp-content/uploads/2025/12/Asterism_List_20251223.pdf

  - name: Orion's Belt
    status: resolved
    members: [Alnitak, Alnilam, Mintaka]
    source: NASA
    source_url: https://science.nasa.gov/image-article/apod-2025-november-20-alnitak-alnilam-mintaka/

  - name: Orion's Sword
    status: resolved
    members: [42 Orionis, Theta Orionis, Iota Orionis]
    source: Royal Astronomical Society of Canada World Asterisms Project
    source_url: https://www.rasc.ca/sites/default/files/World%20Asterisms%20Project%20Handbook%20V%202024.4.pdf
    note: Geometry uses the three stellar positions. M42 is an observing object within the Sword and is not an additional geometric vertex.

  - name: Water Jar
    status: resolved
    members: [Zeta Aquarii, Pi Aquarii, Eta Aquarii, Gamma Aquarii]
    source: Astronomical League
    source_url: https://www.astroleague.org/wp-content/uploads/2025/12/Asterism_List_20251223.pdf

  - name: Great Square of Pegasus
    status: resolved
    members: [Scheat, Alpheratz, Markab, Algenib]
    source: NASA
    source_url: https://science.nasa.gov/solar-system/skywatching/night-sky-network/connecting-the-dots-with-asterisms/

  - name: Sickle of Leo
    status: resolved
    members: [Alpha Leonis, Eta Leonis, Gamma Leonis, Zeta Leonis, Mu Leonis, Epsilon Leonis]
    source: Astronomical League
    source_url: https://www.astroleague.org/wp-content/uploads/2025/12/Asterism_List_20251223.pdf

  - name: Keystone of Hercules
    status: resolved
    members: [Epsilon Herculis, Zeta Herculis, Eta Herculis, Pi Herculis]
    source: Astronomical League
    source_url: https://www.astroleague.org/wp-content/uploads/2025/12/Asterism_List_20251223.pdf

  - name: Northern Cross
    status: resolved
    members: [Alpha Cygni, Beta Cygni, Gamma Cygni, Delta Cygni, Epsilon Cygni]
    source: Astronomical League
    source_url: https://www.astroleague.org/wp-content/uploads/2025/12/Asterism_List_20251223.pdf

  - name: Teapot of Sagittarius
    status: resolved
    members: [Delta Sagittarii, Epsilon Sagittarii, Zeta Sagittarii, Phi Sagittarii, Lambda Sagittarii, Gamma Sagittarii, Sigma Sagittarii, Tau Sagittarii]
    source: Astronomical League
    source_url: https://www.astroleague.org/wp-content/uploads/2025/12/Asterism_List_20251223.pdf

  - name: Scorpius's Fishhook
    status: resolved
    members: [Alpha Scorpii, Gamma Scorpii, Delta Scorpii, Epsilon Scorpii, Zeta Scorpii, Eta Scorpii, Theta Scorpii, Iota Scorpii, Kappa Scorpii, Lambda Scorpii, Mu Scorpii, Nu Scorpii, Sigma Scorpii]
    source: Astronomical League
    source_url: https://www.astroleague.org/wp-content/uploads/2025/12/Asterism_List_20251223.pdf
    note: League list spells Gamma as 'Gama'; normalized here.

  - name: Circlet of Pisces
    status: resolved
    members: [Theta Piscium, 7 Piscium, Gamma Piscium, Kappa Piscium, Lambda Piscium, TX Piscium, Iota Piscium]
    source: Astronomical League
    source_url: https://www.astroleague.org/wp-content/uploads/2025/12/Asterism_List_20251223.pdf

  - name: Head of Cetus
    status: resolved
    members: [Alpha Ceti, Gamma Ceti, Xi Ceti, Mu Ceti, Lambda Ceti]
    source: William Tyler Olcott, Star Lore of All Ages
    source_url: https://en.wikisource.org/wiki/Star_Lore_Of_All_Ages/Cetus
    note: Traditional five-star pentagon defining the Whale's head; selected as an observer-facing geometric asterism rather than a broader anatomical star grouping.

  - name: Hyades / V of Taurus
    status: resolved
    members: [Aldebaran, Theta Tauri, Gamma Tauri, Delta Tauri, Epsilon Tauri]
    source: Astronomy Magazine
    source_url: https://www.astronomy.com/astronomy-for-beginners/asterisms-hunt-the-night-skys-faux-constellations/
    note: Star Almanack defines the observer's five-vertex V. Aldebaran is a foreground star and not a physical member of the Hyades cluster; its inclusion here is visual, not astrophysical.

  - name: Pleiades
    status: resolved
    members: [Alcyone, Atlas, Electra, Maia, Merope, Taygeta, Pleione]
    source: Monthly Notices of the Royal Astronomical Society
    source_url: https://academic.oup.com/mnras/article/471/3/2882/4081952
    note: Star Almanack uses the seven brightest Pleiades members as the traditional naked-eye Seven Sisters observing set, distinct from the full physical M45 cluster. Star Note observing prompt: How many can you see?

  - name: Summer Triangle
    status: resolved
    members: [Vega, Altair, Deneb]
    source: NASA
    source_url: https://science.nasa.gov/solar-system/what-are-asterisms/

  - name: Winter Triangle
    status: resolved
    members: [Sirius, Betelgeuse, Procyon]
    source: NASA
    source_url: https://science.nasa.gov/solar-system/what-are-asterisms/

  - name: Winter Hexagon / Winter Circle
    status: resolved
    members: [Rigel, Aldebaran, Capella, Pollux, Procyon, Sirius]
    source: NASA
    source_url: https://science.nasa.gov/solar-system/skywatching/night-sky-network/connecting-the-dots-with-asterisms/

  - name: Spring Triangle
    status: resolved
    members: [Arcturus, Spica, Denebola]
    source: Sky & Telescope
    source_url: https://skyandtelescope.org/astronomy-news/observing-news/this-weeks-sky-at-a-glance-may-1-9-3/
    note: Definitions vary; Star Almanack uses George Lovi's Sky & Telescope Spring Triangle (Arcturus-Spica-Denebola), which is also geometrically consistent with the Great Diamond containing those three vertices plus Cor Caroli.

  - name: Great Diamond
    status: resolved
    aliases: [Diamond of Virgo]
    members: [Alpha Bootis, Alpha Virginis, Alpha Canum Venaticorum, Beta Leonis]
    source: NASA
    source_url: https://science.nasa.gov/solar-system/skywatching/night-sky-network/connecting-the-dots-with-asterisms/
    note: NASA calls this pattern Diamond of Virgo; membership matches the League's Great Diamond.

  - name: False Cross
    status: resolved
    members: [Avior, Aspidiske, Alsephina, Markeb]
    source: Sky & Telescope
    source_url: https://skyandtelescope.org/astronomy-blogs/southern-stargazing-jonathan-nally/the-stars-of-the-carina-constellation/

  - name: Southern Cross
    status: resolved
    members: [Alpha Crucis, Beta Crucis, Gamma Crucis, Delta Crucis]
    source: Astronomical League
    source_url: https://www.astroleague.org/wp-content/uploads/2025/12/Asterism_List_20251223.pdf

  - name: Southern Pointers
    status: resolved
    members: [Alpha Centauri, Beta Centauri]
    source: ESO
    source_url: https://www.eso.org/public/blog/navigating-the-stars/

  - name: Coathanger
    status: resolved
    aliases: [Brocchi's Cluster, Collinder 399]
    members: [4 Vulpeculae, 5 Vulpeculae, HD 182955, HD 182761, 7 Vulpeculae, HD 182422, HD 182972, HD 183261, HD 182293, HD 182620]
    source: published observing and catalog cross-check
    source_url: https://www.constellation-guide.com/the-coathanger-brocchis-cluster/
    note: Ten-star visual asterism: six stars form the straight bar and four form the hook. The stars are a visual grouping rather than a physical cluster.
