    <style>

        * {

            box-sizing: border-box;

        }

        html,

        body {

            margin: 0;

            min-height: 100%;

        }

        body {

            min-height: 100vh;

            display: flex;

            flex-direction: column;

            background: #ffffff;

            color: #000000;

            font-family: "Times New Roman", Times, serif;

        .container {

            width: 100%;

            max-width: 1100px;

        main {

            flex: 1;

        }

        .site-footer {

            padding-top: 24px;

            padding-bottom: 24px;

        }

        .site-nav {

            display: flex;

            flex-wrap: wrap;

            gap: 16px;

        }

        .site-nav a {

            color: #000000;

            text-decoration: underline;

            font-size: 1rem;

        }

        .site-nav a:hover,

        .site-nav a:focus {

            text-decoration-thickness: 2px;

        }

        @media (max-width: 600px) {

            .site-header {

                padding-top: 20px;

            }

            .site-name {

                font-size: 1.35rem;

            }

            .site-footer {

                padding-bottom: 18px;

            }

            .site-nav {

                gap: 10px 14px;

            }

            .site-nav a {

                font-size: 0.98rem;

            }
