name: Write Files

on:
  workflow_dispatch:
    inputs:
      files:
        description: 'JSON array of files: [{"path":"...","content":"...","encoding":"utf-8|base64"}]'
        required: true
        type: string
      commit_message:
        description: "Commit message"
        required: true
        default: "Write generated files"
        type: string

permissions:
  contents: write

jobs:
  write:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Write files
        env:
          FILES_JSON: ${{ inputs.files }}
        run: |
          python3 - <<'PY'
          import base64
          import json
          import os
          from pathlib import Path

          files = json.loads(os.environ["FILES_JSON"])

          if not isinstance(files, list):
              raise SystemExit("files must be a JSON array")

          for item in files:
              if not isinstance(item, dict):
                  raise SystemExit("Each file entry must be an object")

              path = item.get("path")
              content = item.get("content")
              encoding = item.get("encoding", "utf-8")

              if not isinstance(path, str) or not path:
                  raise SystemExit("Each file needs a non-empty path")

              if not isinstance(content, str):
                  raise SystemExit(f"Missing string content for {path}")

              if encoding not in ("utf-8", "base64"):
                  raise SystemExit(
                      f"Unsupported encoding for {path}: {encoding}"
                  )

              target = Path(path)

              if target.is_absolute():
                  raise SystemExit(
                      f"Absolute paths are not allowed: {path}"
                  )

              if ".." in target.parts:
                  raise SystemExit(
                      f"Parent-directory paths are not allowed: {path}"
                  )

              target.parent.mkdir(parents=True, exist_ok=True)

              if encoding == "base64":
                  try:
                      data = base64.b64decode(
                          content,
                          validate=True
                      )
                  except Exception as exc:
                      raise SystemExit(
                          f"Invalid base64 content for {path}: {exc}"
                      )

                  target.write_bytes(data)
              else:
                  target.write_text(content, encoding="utf-8")

              print(f"Wrote {path} ({encoding})")
          PY

      - name: Commit generated files
        env:
          FILES_JSON: ${{ inputs.files }}
          COMMIT_MESSAGE: ${{ inputs.commit_message }}
        run: |
          mapfile -t FILE_PATHS < <(
            python3 - <<'PY'
          import json
          import os

          files = json.loads(os.environ["FILES_JSON"])

          for item in files:
              print(item["path"])
          PY
          )

          chmod +x tools/commit-generated-files.sh

          tools/commit-generated-files.sh \
            "$COMMIT_MESSAGE" \
            "${FILE_PATHS[@]}"