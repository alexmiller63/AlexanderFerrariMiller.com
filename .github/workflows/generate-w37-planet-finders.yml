name: Generate W37 Planet Finders

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/generate-w37-planet-finders.yml'
      - 'tools/generate_planet_finders.py'
      - 'tools/populate_ephemeris.py'
  workflow_dispatch:
    inputs:
      planet_finder_max_seconds:
        description: 'Maximum search time per Planet Finder mode (seconds)'
        required: true
        default: '180'
        type: string

permissions:
  contents: write

concurrency:
  group: generate-w37-planet-finders
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Restore JPL/NAIF ephemeris source cache
        uses: actions/cache@v4
        with:
          path: |
            .cache/skyfield/de440s.bsp
            .cache/skyfield/ceres_1900_2100.bsp
          key: star-almanack-source-kernels-v1

      - name: Install pinned calculation dependency
        run: python -m pip install --disable-pip-version-check 'skyfield==1.55'

      - name: Download source kernels only when cache is empty
        run: |
          mkdir -p .cache/skyfield
          python - <<'PY'
          from pathlib import Path
          from urllib.request import urlretrieve
          from skyfield.api import Loader

          root = Path('.cache/skyfield')
          de440s = root / 'de440s.bsp'
          ceres = root / 'ceres_1900_2100.bsp'

          if de440s.exists():
              print(f'Reusing cached {de440s} ({de440s.stat().st_size:,} bytes)')
          else:
              print('Downloading JPL DE440s source kernel under NAIF distribution rules')
              Loader(str(root)).download('de440s.bsp')

          if ceres.exists():
              print(f'Reusing cached {ceres} ({ceres.stat().st_size:,} bytes)')
          else:
              print('Downloading JPL/NAIF Ceres source kernel under NAIF distribution rules')
              urlretrieve(
                  'https://naif.jpl.nasa.gov/pub/naif/generic_kernels/spk/asteroids/a_old_versions/ceres_1900_2100.bsp',
                  ceres,
              )
          PY

      - name: Generate W37 through production Ephemeris + Planet Finder path
        env:
          STAR_ALMANACK_EPHEMERIS_DIR: ${{ github.workspace }}/.cache/skyfield
          PLANET_FINDER_CANDIDATES: '2'
          PLANET_FINDER_MAX_CANDIDATES: '1000'
          PLANET_FINDER_MAX_SECONDS: ${{ inputs.planet_finder_max_seconds || '180' }}
          PLANET_FINDER_MAX_ORDER_SECONDS: '5'
          PLANET_FINDER_MAX_ORDER_NODES: '100000'
        run: |
          # Each notation mode gets the full user-selected search budget.
          python tools/populate_ephemeris_planet_finder_by_date.py \
            2026-09-07 2026-09-07
      - name: Commit W37 finder SVGs
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            almanack/2026/W37/finders/planet-finder-greek-symbols.svg \
            almanack/2026/W37/finders/planet-finder-latin.svg \
            almanack/2026/W37/finders/planet-finder-mixed-learner.svg
          if git diff --cached --quiet; then
            echo "W37 Planet Finders already current."
            exit 0
          fi
          git commit -m "Generate collision-safe W37 Planet Finders"
          for attempt in 1 2 3 4 5; do
            if git push origin HEAD:main; then exit 0; fi
            git fetch origin main
            git rebase origin/main
            sleep $((attempt * 2))
          done
          exit 1
