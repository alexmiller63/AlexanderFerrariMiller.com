name: Provisional Solar and Lunar Eclipses 2026–2035
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Install local lunar evaluator dependencies
        run: python -m pip install --disable-pip-version-check pyyaml
      - name: Prepare locally committed lunar coefficients
        working-directory: star-almanack-elp82b
        run: |
          set -euo pipefail
          python lunar_elp.py bootstrap data/elp82b
          python lunar_elp.py verify data/elp82b
          python normalize_elp82b.py data/elp82b elp82b-manifest.json
      - name: Generate provisional decade catalog
        run: python -u tools/generate_decade_eclipses.py --start-year 2026 --end-year 2035
      - uses: actions/upload-artifact@v4
        with:
          name: provisional-solar-lunar-eclipses-2026-2035
          path: generated/eclipse-catalog/
