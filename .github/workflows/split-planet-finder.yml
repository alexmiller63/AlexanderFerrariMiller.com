name: Split Planet Finder

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  split:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Split Planet Finder source
        run: |
          python tools/split_large_file.py tools/generate_planet_finders.py \
            --output tmp/file_chunks \
            --lines 200

      - name: Show manifest
        run: cat tmp/file_chunks/manifest.json

      - name: Upload chunks
        uses: actions/upload-artifact@v4
        with:
          name: planet-finder-source-chunks
          path: tmp/file_chunks/
          if-no-files-found: error
