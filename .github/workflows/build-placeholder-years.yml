name: Build 2025 and 2027 Placeholder Sources

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - Star-Almanack-Repo/publish_placeholder_years.py
      - tools/publish_placeholder_years.py
      - .github/workflows/build-placeholder-years.yml

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build placeholder source years only
        run: python tools/publish_placeholder_years.py 2025 2027

      - name: Commit generated placeholder sources
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Star-Almanack-Repo/site/2025 Star-Almanack-Repo/site/2027
          if git diff --cached --quiet; then
            echo 'Placeholder source years already current.'
            exit 0
          fi
          git commit -m 'Update placeholder source calendars'
          git push
