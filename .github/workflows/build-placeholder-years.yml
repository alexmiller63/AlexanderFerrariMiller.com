name: Legacy placeholder-year build (manual compatibility)

on:
  workflow_dispatch:
    inputs:
      years:
        description: 'Space-separated placeholder years to rebuild'
        required: false
        default: '2025 2027'

permissions:
  contents: write

env:
  ALMANACK_YEARS: ${{ inputs.years }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build legacy placeholder source years
        run: python tools/publish_placeholder_years.py $ALMANACK_YEARS

      - name: Commit generated placeholder sources
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for year in $ALMANACK_YEARS; do
            git add "Star-Almanack-Repo/site/$year"
          done
          if git diff --cached --quiet; then
            echo 'Requested placeholder source years already current.'
            exit 0
          fi
          git commit -m "Rebuild legacy placeholder source years: $ALMANACK_YEARS"
          git pull --rebase origin main
          git push
