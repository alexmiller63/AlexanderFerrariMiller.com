name: Nativitas Interpretation Draft Generator
on:
  workflow_dispatch:
    inputs:
      batch_size:
        description: Number of new placement drafts per run (max 120)
        required: false
        default: '20'
permissions:
  contents: write
concurrency:
  group: nativitas-draft-generator
  cancel-in-progress: false
jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Generate checkpointed drafts
        env:
          BATCH_SIZE: ${{ inputs.batch_size }}
        run: python nativitas/tools/generate_interpretation_drafts.py --batch-size "$BATCH_SIZE"
      - name: Persist checkpoints and monitor state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add nativitas/data/placement-interpretations.json nativitas/generation-progress.json
          if ! git diff --cached --quiet; then
            git commit -m "Checkpoint Nativitas interpretation drafts [skip ci]"
            git push
          fi
      - name: Report
        if: always()
        run: cat nativitas/generation-progress.json >> "$GITHUB_STEP_SUMMARY" || true
