name: Apply frozen W15 finders to 2025 and 2027

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .github/workflows/apply-frozen-w15-finders-2025-2027.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Apply frozen W15 finder template
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          repo = Path('.')
          source = repo / 'almanack/2026/W15/finders'
          templates = {
              'greek': source / 'planet-finder-greek-symbols.svg',
              'latin': source / 'planet-finder-latin.svg',
              'mixed': source / 'planet-finder-mixed-learner.svg',
          }
          names = {
              'greek': 'planet-finder-greek-symbols.svg',
              'latin': 'planet-finder-latin.svg',
              'mixed': 'planet-finder-mixed-learner.svg',
          }

          # W15 is the frozen canonical finder. Only the weekly title is changed.
          template_text = {k: p.read_text(encoding='utf-8') for k, p in templates.items()}

          finder_css = '''\n<style id="frozen-w15-finder-css">\n.frozen-finder-figure{max-width:820px;margin:1.1rem auto 1.6rem}\n.frozen-finder-figure img{display:block;width:100%;height:auto;border:1px solid var(--rule);border-radius:.4rem}\n.frozen-finder-figure figcaption{text-align:center;font-family:system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;font-size:.82rem;color:var(--muted);margin-top:.35rem}\n.frozen-finder-figure[data-finder-image]{display:none}\n.frozen-finder-figure[data-finder-image="greek"]{display:block}\n</style>'''

          finder_script = '''\n<script id="frozen-w15-finder-script">\ndocument.addEventListener('click',function(e){\n  const button=e.target.closest('[data-finder-mode]');\n  if(!button)return;\n  const wrap=button.closest('.planet-finder-block');\n  if(!wrap)return;\n  const mode=button.dataset.finderMode;\n  wrap.querySelectorAll('[data-finder-mode]').forEach(b=>b.setAttribute('aria-pressed',b===button?'true':'false'));\n  wrap.querySelectorAll('[data-finder-image]').forEach(f=>f.style.display=f.dataset.finderImage===mode?'block':'none');\n});\n</script>'''

          figures = '''<figure class="frozen-finder-figure" data-finder-image="greek"><img src="finders/planet-finder-greek-symbols.svg" alt="Planet Finder — Greek / Symbols"><figcaption>Greek / Symbols</figcaption></figure><figure class="frozen-finder-figure" data-finder-image="latin"><img src="finders/planet-finder-latin.svg" alt="Planet Finder — Latin"><figcaption>Latin</figcaption></figure><figure class="frozen-finder-figure" data-finder-image="mixed"><img src="finders/planet-finder-mixed-learner.svg" alt="Planet Finder — Mixed Learner"><figcaption>Mixed Learner</figcaption></figure>'''

          for year in (2025, 2027):
              root = repo / 'almanack' / str(year)
              for week_dir in sorted(root.glob('W[0-9][0-9]')):
                  week = int(week_dir.name[1:])
                  target_title = f'ISO {year}-W{week:02d} Planet Finder'
                  finders = week_dir / 'finders'
                  finders.mkdir(exist_ok=True)

                  for mode, src_text in template_text.items():
                      text = re.sub(r'ISO 2026-W15 Planet Finder', target_title, src_text, count=1)
                      (finders / names[mode]).write_text(text, encoding='utf-8')

                  page = week_dir / 'index.html'
                  if not page.exists():
                      continue
                  html = page.read_text(encoding='utf-8')

                  html = re.sub(
                      r'<figure class="finder"><svg.*?</svg><figcaption>.*?</figcaption></figure>',
                      figures,
                      html,
                      count=1,
                      flags=re.S,
                  )

                  if 'frozen-w15-finder-css' not in html:
                      html = html.replace('</head>', finder_css + '</head>', 1)
                  if 'frozen-w15-finder-script' not in html:
                      html = html.replace('</body>', finder_script + '</body>', 1)

                  page.write_text(html, encoding='utf-8')
          PY

      - name: Commit applied finders
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add almanack/2025 almanack/2027
          if git diff --cached --quiet; then
            echo '2025 and 2027 finders already match frozen W15 template.'
            exit 0
          fi
          git commit -m 'Apply frozen W15 planet finders to 2025 and 2027'
          git push
