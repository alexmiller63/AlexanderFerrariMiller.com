name: KISS W01 Extended Table

on:
  workflow_dispatch:
  push:
    paths:
      - tools/kiss_w01_extended_table.py

permissions:
  contents: write

jobs:
  edit-w01:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Check whether W01 already has the requested heading
        id: check
        run: |
          if python - <<'PY'
          from pathlib import Path
          import re

          path = Path("almanack/2026/W01/index.html")
          text = path.read_text(encoding="utf-8")
          tables = re.findall(r'<table class="[^"]*ephemeris[^"]*">.*?</table>', text, re.DOTALL)
          if len(tables) != 3:
              raise SystemExit(1)
          raise SystemExit(0 if tables[1].startswith('<table class="ephemeris"><thead><tr><th>Ceres</th>') else 1)
          PY
          then
            echo "needed=false" >> "$GITHUB_OUTPUT"
            echo "W01 already has the requested Ceres heading."
          else
            echo "needed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Run KISS W01 edit
        if: steps.check.outputs.needed == 'true'
        run: python tools/kiss_w01_extended_table.py

      - name: Commit W01 only
        if: steps.check.outputs.needed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add almanack/2026/W01/index.html
          if git diff --cached --quiet; then
            echo "No W01 change to commit."
          else
            git commit -m "KISS: change W01 table 2 first heading to Ceres"
            git push
          fi
