name: Convert Signature Icons to Email PNG

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  convert:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install SVG conversion dependency
        run: |
          python -m pip install --upgrade pip
          python -m pip install cairosvg

      - name: Convert signature contact icons
        run: |
          set -e

          python tools/convert-svg-to-email-png.py \
            images/signature-icons/address.svg \
            images/signature-icons/phone.svg \
            images/signature-icons/website.svg \
            images/signature-icons/email.svg \
            --output-dir images/signature-icons \
            --display-size 13 \
            --scale 4 \
            --overwrite

      - name: Verify generated files
        run: |
          set -e

          test -f images/signature-icons/address-email.png
          test -f images/signature-icons/phone-email.png
          test -f images/signature-icons/website-email.png
          test -f images/signature-icons/email-email.png

      - name: Commit generated email PNGs
        run: |
          set -e

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add \
            images/signature-icons/address-email.png \
            images/signature-icons/phone-email.png \
            images/signature-icons/website-email.png \
            images/signature-icons/email-email.png

          if git diff --cached --quiet; then
            echo "No generated PNG changes to commit."
            exit 0
          fi

          git commit -m "Generate email-safe signature contact icons"
          git push
