name: Sky Notes Finder Collision Regression

on:
  workflow_dispatch:
  push:
    paths:
      - 'tools/render_sky_note_finder.py'
      - 'tools/test_sky_note_finder_collisions.py'
      - '.github/workflows/sky-note-finder-collision-regression.yml'

jobs:
  collision-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install renderer dependencies
        run: python -m pip install matplotlib
      - name: Check rendered-label collision geometry
        run: python tools/test_sky_note_finder_collisions.py
