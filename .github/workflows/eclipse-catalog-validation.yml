name: Eclipse Catalog Validation (2025–2036)

on:
  workflow_dispatch:
  push:
    paths:
      - tools/generate_decade_eclipses.py
      - eclipse_engine.py
      - lunar_eclipse_engine.py
      - kernel_eclipse_engine.py
      - .github/workflows/eclipse-catalog-validation.yml

permissions:
  contents: write

jobs:
  catalog:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install kernel reader
        run: python -m pip install skyfield==1.55
      - uses: actions/cache@v4
        with:
          path: .cache/skyfield/de440s.bsp
          key: star-almanack-de440s-v1
      - name: Ensure cached production ephemeris
        run: python tools/ensure_ephemeris_kernels.py
      - name: Generate calculated eclipse catalog
        run: python -u tools/generate_decade_eclipses.py --start-year 2025 --end-year 2036 --kernel .cache/skyfield/de440s.bsp
      - name: Validate registry and catalog
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          base = Path("generated/eclipse-catalog")
          rows = json.loads((base / "eclipses-2025-2036.json").read_text())["eclipses"]
          registry = json.loads((base / "eclipse-registry.json").read_text())["events"]
          assert rows, "No eclipses generated"
          ids = [r["id"] for r in rows]
          assert len(ids) == len(set(ids)), "Duplicate permanent IDs"
          assert len(registry) == len(rows), "Registry/catalog mismatch"
          assert all(2025 <= int(r["date_utc"][:4]) <= 2036 for r in rows)
          expected = json.loads(Path("data/eclipse-visibility.json").read_text())["events"]
          actual = {(r["kind"], r["date_utc"]) for r in rows}
          missing = [(e["kind"], e["date"]) for e in expected.values()
                     if 2025 <= int(e["date"][:4]) <= 2036
                     and (e["kind"], e["date"]) not in actual]
          assert not missing, f"Missing reference events: {missing}"
          assert all(r["detail_path"] == "eclipses/" + r["id"] + ".html" for r in rows)
          print(f"Validated {len(rows)} provisional eclipse records")
          PY
      - name: Commit catalog to repository
        run: |
          git add generated/eclipse-catalog/
          git diff --cached --quiet && echo "Eclipse catalog already current" && exit 0
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -m "Publish validated eclipse catalog"
          git push
      - uses: actions/upload-artifact@v4
        with:
          name: eclipse-catalog-2025-2036
          path: generated/eclipse-catalog/
          retention-days: 30

