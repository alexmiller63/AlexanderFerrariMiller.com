name: Eclipse Catalog Validation (2025–2036)

on:
  workflow_dispatch:
  push:
    paths:
      - tools/generate_decade_eclipses.py
      - .github/workflows/eclipse-catalog-validation.yml

permissions:
  contents: write

jobs:
  catalog:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Bootstrap and normalize ELP2000 lunar data
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -s star-almanack-elp82b/elp82b-manifest.json ]; then
            (
              cd star-almanack-elp82b
              python lunar_elp.py bootstrap data/elp82b
              python lunar_elp.py verify data/elp82b
              python normalize_elp82b.py data/elp82b elp82b-manifest.json
            )
          fi
          test -s star-almanack-elp82b/elp82b-manifest.json
      - name: Generate provisional eclipse catalog
        run: python -u tools/generate_decade_eclipses.py --start-year 2025 --end-year 2036
      - name: Validate registry and catalog
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          base = Path("generated/eclipse-catalog")
          rows = json.loads((base / "eclipses-2025-2036.json").read_text())["eclipses"]
          registry = json.loads((base / "eclipse-registry.json").read_text())["events"]
          assert rows, "No eclipses generated"
          ids = [r["id"] for r in rows]
          assert len(ids) == len(set(ids)), "Duplicate permanent IDs"
          assert len(registry) == len(rows), "Registry/catalog mismatch"
          assert all(2025 <= int(r["date_utc"][:4]) <= 2036 for r in rows)
          assert all(r["detail_path"] == "eclipses/" + r["id"] + ".html" for r in rows)
          print(f"Validated {len(rows)} provisional eclipse records")
          PY
      - name: Commit catalog to repository
        run: |
          git add generated/eclipse-catalog/
          git diff --cached --quiet && echo "Eclipse catalog already current" && exit 0
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -m "Publish validated eclipse catalog"
          git push
      - uses: actions/upload-artifact@v4
        with:
          name: eclipse-catalog-2025-2036
          path: generated/eclipse-catalog/
          retention-days: 30
