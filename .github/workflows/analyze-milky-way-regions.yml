name: Milky Way Region Analysis

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Inspect scientific Mellinger FITS header
        run: |
          python - <<'PY'
          import urllib.parse
          import urllib.request

          endpoint = "https://skyview.gsfc.nasa.gov/cgi-bin/images"
          for survey in ("mell-r", "mell-g", "mell-b"):
              params = {
                  "Survey": survey,
                  "Position": "270,-29",
                  "Coordinates": "J2000",
                  "Projection": "Tan",
                  "Size": "1",
                  "Pixels": "32,32",
                  "Scaling": "Linear",
                  "Return": "FITS",
              }
              url = endpoint + "?" + urllib.parse.urlencode(params)
              print(f"Downloading live NASA SkyView {survey} FITS")
              with urllib.request.urlopen(url, timeout=120) as response:
                  payload = response.read()

              cards = []
              for offset in range(0, len(payload), 80):
                  card = payload[offset:offset + 80].decode("ascii", errors="replace")
                  cards.append(card)
                  if card.startswith("END"):
                      break
              else:
                  raise RuntimeError(f"{survey}: FITS END card not found")

              print(f"--- {survey} FITS PRIMARY HEADER ---")
              for key in ("BITPIX", "NAXIS", "NAXIS1", "NAXIS2", "NAXIS3", "BUNIT", "BSCALE", "BZERO", "DATAMIN", "DATAMAX"):
                  matches = [c for c in cards if c[:8].strip() == key]
                  print(matches[0] if matches else f"{key:<8}= <absent>")
          PY

      - name: Run Mellinger region analysis
        run: |
          python tools/analyze_milky_way_regions.py

      - name: Show machine-readable results
        if: always()
        run: |
          if [ -f .cache/source-data/milky-way-mellinger-validation.json ]; then
            cat .cache/source-data/milky-way-mellinger-validation.json
          fi
