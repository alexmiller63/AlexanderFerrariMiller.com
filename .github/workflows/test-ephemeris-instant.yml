name: Ephemeris instant regression
on:
  push:
    paths:
      - 'tests/test_ephemeris_instant.py'
      - 'tools/star_almanack_ephemeris.py'
      - '.github/workflows/test-ephemeris-instant.yml'
  workflow_dispatch:
jobs:
  instant-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install pytest skyfield==1.55
      - run: PYTHONPATH=tools python -m pytest -q tests/test_ephemeris_instant.py
