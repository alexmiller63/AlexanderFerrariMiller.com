name: Artwork Generator

on:
  workflow_dispatch:
    inputs:
      start_year:
        description: Start year
        required: true
        default: '2026'
        type: string
      start_week:
        description: Start week
        required: true
        default: '36'
        type: string
      end_year:
        description: End year
        required: true
        default: '2026'
        type: string
      end_week:
        description: End week
        required: true
        default: '36'
        type: string

permissions:
  contents: write

concurrency:
  group: artwork-generator
  cancel-in-progress: false

jobs:
  populate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install renderer dependency
        run: python -m pip install matplotlib

      - name: Fetch pinned HYG v4.1 catalog
        run: |
          curl -fL \
            https://raw.githubusercontent.com/astronexus/HYG-Database/3bf37f4b2d5460e1278286320d1d62fab9b493c1/hyg/CURRENT/hygdata_v41.csv \
            -o /tmp/hygdata_v41.csv

      - name: Resolve ISO week range
        id: range
        run: |
          read START_DATE END_DATE < <(python tools/resolve_iso_week_range.py \
            '${{ inputs.start_year }}' '${{ inputs.start_week }}' \
            '${{ inputs.end_year }}' '${{ inputs.end_week }}')
          echo "start_date=$START_DATE" >> "$GITHUB_OUTPUT"
          echo "end_date=$END_DATE" >> "$GITHUB_OUTPUT"

      - name: Generate Artwork request specs
        run: python tools/populate_fixed_object_artwork_by_date.py "${{ steps.range.outputs.start_date }}" "${{ steps.range.outputs.end_date }}"

      - name: Render fixed-object finder SVGs
        shell: bash
        run: |
          set -euo pipefail
          ids="$(python - <<'PY'
          import json
          from pathlib import Path
          seen=[]
          for week in range(int("${{ inputs.start_week }}"), int("${{ inputs.end_week }}")+1):
              p=Path("generated-sky-notes")/"${{ inputs.start_year }}"/f"W{week:02d}.json"
              if not p.exists(): continue
              for item in json.loads(p.read_text(encoding="utf-8")).get("fixed_sky") or []:
                  fid=item.get("fixed_object_id")
                  if isinstance(fid,int) and fid not in seen: seen.append(fid)
          print(" ".join(map(str,seen)))
          PY
          )"
          for fixed_id in $ids; do
            spec="sky-notes-artwork/specs/objects/${fixed_id}.json"
            [ -f "$spec" ] || { echo "missing fixed-object renderer spec $spec" >&2; exit 1; }
            out="sky-notes-artwork/objects/${fixed_id}/finder.svg"
            mkdir -p "$(dirname "$out")"
            python tools/render_sky_note_finder.py /tmp/hygdata_v41.csv "$spec" "$out"
            echo "fixed object $fixed_id -> $out"
          done

      - name: Publish fixed-object Artwork into weekly pages
        run: python tools/publish_sky_note_artwork.py "${{ steps.range.outputs.start_date }}" "${{ steps.range.outputs.end_date }}"

      - name: Chromium fixed-object Artwork acceptance check
        shell: bash
        run: |
          set -euo pipefail
          python -m http.server 8765 --directory . >/tmp/artwork-http.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          sleep 1
          chromium_bin="$(command -v chromium || command -v chromium-browser || command -v google-chrome || true)"
          [ -n "$chromium_bin" ] || { echo "Chromium/Chrome is not available." >&2; exit 1; }

          checked=0
          for ((week_value=10#${{ inputs.start_week }}; week_value<=10#${{ inputs.end_week }}; week_value++)); do
            week="W$(printf '%02d' "$week_value")"
            page="site/${{ inputs.start_year }}/${week}/index.html"
            spec="sky-notes-artwork/specs/${{ inputs.start_year }}/${week}.json"
            [ -f "$page" ] && [ -f "$spec" ] || continue
            fixed_id="$(python -c 'import json,sys; print(json.load(open(sys.argv[1]))["artwork_owner_identity"]["fixed_object_id"])' "$spec")"
            svg="sky-notes-artwork/objects/${fixed_id}/finder.svg"
            [ -f "$svg" ] || { echo "$week: missing artwork-owner asset $svg" >&2; exit 1; }

            checked=$((checked + 1))
            url="http://127.0.0.1:8765/site/${{ inputs.start_year }}/${week}/index.html"
            dom_file="/tmp/${week}-artwork-dom.html"
            "$chromium_bin" --headless --no-sandbox --disable-gpu --virtual-time-budget=3000 --dump-dom "$url" > "$dom_file"
            python tools/check_sky_note_artwork_dom.py "$dom_file" "$svg" "$week/fixed-object-$fixed_id"

            artwork_href="$(python -c 'import sys; from pathlib import Path; from tools.check_sky_note_artwork_dom import ArtworkParser; p=ArtworkParser(); p.feed(Path(sys.argv[1]).read_text(encoding="utf-8")); len(p.artwork_hrefs)==1 or (_ for _ in ()).throw(SystemExit(f"Expected exactly one Artwork link, found {p.artwork_hrefs!r}")); print(p.artwork_hrefs[0])' "$dom_file")"
            artwork_url="$(python -c 'import sys; from urllib.parse import urljoin; print(urljoin(sys.argv[1], sys.argv[2]))' "$url" "$artwork_href")"
            destination="/tmp/${week}-fixed-object-${fixed_id}-destination"
            "$chromium_bin" --headless --no-sandbox --disable-gpu --virtual-time-budget=3000 --dump-dom "$artwork_url" > "$destination"
            python -c 'import sys; from pathlib import Path; url=sys.argv[1]; text=Path(sys.argv[2]).read_text(encoding="utf-8",errors="replace").lstrip().lower(); "<svg" in text or (_ for _ in ()).throw(SystemExit(f"Artwork link did not render SVG: {url}")); print(f"PROOF: Chromium followed artwork-owner link to rendered SVG: {url}")' "$artwork_url" "$destination"
          done
          [ "$checked" -gt 0 ] || { echo "No fixed-object Artwork pages available for validation." >&2; exit 1; }
          echo "PROOF COMPLETE: Chromium validated $checked fixed-object Artwork page(s)."

      - name: Verify every selected Sky Note artwork owner is published
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path

          root = Path('.')
          year = int("${{ inputs.start_year }}")
          start = int("${{ inputs.start_week }}")
          end = int("${{ inputs.end_week }}")
          checked = 0
          for week in range(start, end + 1):
              key = f"W{week:02d}"
              source = root / "generated-sky-notes" / str(year) / f"{key}.json"
              if not source.exists():
                  continue
              payload = json.loads(source.read_text(encoding="utf-8"))
              descriptor = payload.get("artwork")
              if descriptor is None:
                  continue
              spec_path = root / "sky-notes-artwork" / "specs" / str(year) / f"{key}.json"
              if not spec_path.exists():
                  raise SystemExit(f"{key}: artwork descriptor exists but renderer spec is missing: {spec_path}")
              spec = json.loads(spec_path.read_text(encoding="utf-8"))
              owner = (spec.get("artwork_owner_identity") or {}).get("fixed_object_id")
              if not isinstance(owner, int):
                  raise SystemExit(f"{key}: renderer spec has no immutable artwork owner")
              svg = root / "sky-notes-artwork" / "objects" / str(owner) / "finder.svg"
              if not svg.exists():
                  raise SystemExit(f"{key}: selected artwork owner {owner} has no published finder: {svg}")
              svg_text = svg.read_text(encoding="utf-8", errors="replace").lstrip().lower()
              if "<svg" not in svg_text:
                  raise SystemExit(f"{key}: selected artwork owner {owner} asset is not SVG: {svg}")
              for page_root in ("site", "almanack"):
                  page = root / page_root / str(year) / key / "index.html"
                  if not page.exists():
                      raise SystemExit(f"{key}: missing published page copy: {page}")
                  html = page.read_text(encoding="utf-8", errors="replace")
                  expected = f"sky-notes-artwork/objects/{owner}/finder.svg"
                  if expected not in html:
                      raise SystemExit(f"{key}: {page} does not publish selected artwork owner {owner} ({expected})")
              print(f"PROOF: {key} selected artwork owner {owner} exists and is published in both page copies")
              checked += 1
          if checked == 0:
              raise SystemExit("No selected Sky Note artwork owners were available for validation.")
          print(f"PROOF COMPLETE: {checked} selected Sky Note artwork owner(s) are present and published.")
          PY

      - name: Commit Artwork changes only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- almanack site
          git add -A -- tools/publish_sky_note_artwork.py sky-notes-artwork
          if git diff --cached --quiet; then
            echo "No Artwork changes in requested ISO week range."
            exit 0
          fi
          git commit -m "Generate fixed-object Artwork ${{ inputs.start_year }}-W${{ inputs.start_week }}"
          git pull --rebase origin main
          git push
