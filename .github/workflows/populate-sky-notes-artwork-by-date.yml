name: Artwork Generator

on:
  workflow_dispatch:
    inputs:
      start_year:
        description: Start year
        required: true
        default: '2026'
        type: string
      start_week:
        description: Start week
        required: true
        default: '36'
        type: string
      end_year:
        description: End year
        required: true
        default: '2026'
        type: string
      end_week:
        description: End week
        required: true
        default: '36'
        type: string

permissions:
  contents: write

concurrency:
  group: artwork-generator
  cancel-in-progress: false

jobs:
  populate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install renderer dependency
        run: python -m pip install matplotlib

      - name: Fetch pinned HYG v4.1 catalog
        run: |
          curl -fL \
            https://raw.githubusercontent.com/astronexus/HYG-Database/3bf37f4b2d5460e1278286320d1d62fab9b493c1/hyg/CURRENT/hygdata_v41.csv \
            -o /tmp/hygdata_v41.csv

      - name: Resolve ISO week range
        id: range
        run: |
          read START_DATE END_DATE < <(python tools/resolve_iso_week_range.py \
            '${{ inputs.start_year }}' '${{ inputs.start_week }}' \
            '${{ inputs.end_year }}' '${{ inputs.end_week }}')
          echo "start_date=$START_DATE" >> "$GITHUB_OUTPUT"
          echo "end_date=$END_DATE" >> "$GITHUB_OUTPUT"

      - name: Generate Artwork request specs
        run: python tools/populate_fixed_object_artwork_by_date.py "${{ steps.range.outputs.start_date }}" "${{ steps.range.outputs.end_date }}"

      - name: Render fixed-object finder SVGs
        shell: bash
        run: |
          set -euo pipefail
          ids="$(python - <<'PY'
          import json
          from pathlib import Path
          seen=[]
          for week in range(int("${{ inputs.start_week }}"), int("${{ inputs.end_week }}")+1):
              p=Path("generated-sky-notes")/"${{ inputs.start_year }}"/f"W{week:02d}.json"
              if not p.exists(): continue
              payload=json.loads(p.read_text(encoding="utf-8"))
              for item in payload.get("fixed_sky") or []:
                  fid=item.get("fixed_object_id")
                  if isinstance(fid,int) and fid not in seen: seen.append(fid)
              for descriptor in payload.get("descriptors") or []:
                  did=str(descriptor.get("id",""))
                  if descriptor.get("type") in {"star","deep-sky-object"} and did.isdigit():
                      fid=int(did)
                      if fid not in seen: seen.append(fid)
          print(" ".join(map(str,seen)))
          PY
          )"
          for fixed_id in $ids; do
            spec="sky-notes-artwork/specs/objects/${fixed_id}.json"
            [ -f "$spec" ] || { echo "missing fixed-object renderer spec $spec" >&2; exit 1; }
            out="sky-notes-artwork/objects/${fixed_id}/finder.svg"
            mkdir -p "$(dirname "$out")"
            python tools/render_sky_note_finder.py /tmp/hygdata_v41.csv "$spec" "$out"
            echo "fixed object $fixed_id -> $out"
          done

      - name: Rebuild fixed-object story pages with rendered Artwork
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from tools.fixed_object_stories import available_stories, write_public_story
          seen=set()
          for week in range(int("${{ inputs.start_week }}"), int("${{ inputs.end_week }}")+1):
              p=Path("generated-sky-notes")/"${{ inputs.start_year }}"/f"W{week:02d}.json"
              if not p.exists(): continue
              for item in json.loads(p.read_text(encoding="utf-8")).get("fixed_sky") or []:
                  fid=item.get("fixed_object_id")
                  if not isinstance(fid,int) or fid in seen: continue
                  seen.add(fid)
                  for story in available_stories(fid):
                      write_public_story(story)
          print(f"Rebuilt {len(seen)} fixed-object story package(s) after Artwork rendering")
          PY

      - name: Publish fixed-object Artwork into weekly pages
        run: python tools/publish_sky_note_artwork.py "${{ steps.range.outputs.start_date }}" "${{ steps.range.outputs.end_date }}"

      - name: Verify weekly object-story Artwork links
        shell: bash
        run: |
          set -euo pipefail
          python -m http.server 8766 --directory . >/tmp/object-story-http.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          sleep 1
          chromium_bin="$(command -v chromium || command -v chromium-browser || command -v google-chrome || true)"
          [ -n "$chromium_bin" ] || { echo "Chromium/Chrome is not available." >&2; exit 1; }
          checked=0
          for ((week_value=10#${{ inputs.start_week }}; week_value<=10#${{ inputs.end_week }}; week_value++)); do
            week="W$(printf '%02d' "$week_value")"
            page="site/${{ inputs.start_year }}/$week/index.html"
            [ -f "$page" ] || continue
            url="http://127.0.0.1:8766/$page"
            dom="/tmp/$week-object-story-dom.html"
            "$chromium_bin" --headless --no-sandbox --disable-gpu --virtual-time-budget=3000 --dump-dom "$url" > "$dom"
            python - "$dom" "$week" <<'PY'
          import re, sys
          from pathlib import Path
          text=Path(sys.argv[1]).read_text(encoding="utf-8", errors="replace")
          week=sys.argv[2]
          sky_notes=re.search(r'<div\\b[^>]*\\bid="almanack-section-5"[^>]*>(.*?)(?=<div\\b[^>]*\\bid="almanack-section-|$)', text, re.S)
          if not sky_notes:
              raise SystemExit(f"{week}: missing Almanack section 5 (Sky Notes)")
          component=re.search(r'<section\\b[^>]*\\bid="other-objects-listed-this-week"[^>]*>(.*?)</section>', sky_notes.group(1), re.S)
          if not component:
              raise SystemExit(f"{week}: missing 'Other objects listed this week' component inside Sky Notes")
          links=re.findall(r'<a class="object-artwork-link" href="([^"]+)">([^<]+)</a>', component.group(1))
          if not links:
              raise SystemExit(f"{week}: no object artwork links rendered")
          for href, name in links:
              print(f"PROOF: {week} {name} -> {href}")
          print(f"OTHER_OBJECTS_COUNT={len(links)}")
          PY
            count="$(grep -o 'class="object-artwork-link"' "$dom" | wc -l)"
            checked=$((checked + count))
          done
          [ "$checked" -gt 0 ] || { echo "No weekly object-artwork links were rendered; refusing false green." >&2; exit 1; }
          echo "PROOF COMPLETE: Chromium verified $checked weekly object-artwork links."

      - name: Commit Artwork changes only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- almanack site
          git add -A -- tools/publish_sky_note_artwork.py tools/populate_fixed_object_artwork_by_date.py sky-notes-artwork stories
          if git diff --cached --quiet; then
            echo "No Artwork changes in requested ISO week range."
            exit 0
          fi
          git commit -m "Generate fixed-object Artwork ${{ inputs.start_year }}-W${{ inputs.start_week }}"
          git pull --rebase origin main
          git push
