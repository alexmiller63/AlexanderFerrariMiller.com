name: Artwork Generator

on:
  workflow_dispatch:
    inputs:
      start_year:
        description: Start year
        required: true
        default: '2026'
        type: string
      start_week:
        description: Start week
        required: true
        default: '36'
        type: string
      end_year:
        description: End year
        required: true
        default: '2026'
        type: string
      end_week:
        description: End week
        required: true
        default: '36'
        type: string

permissions:
  contents: write

concurrency:
  group: artwork-generator
  cancel-in-progress: false

jobs:
  populate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install renderer dependency
        run: python -m pip install matplotlib

      - name: Fetch pinned HYG v4.1 catalog
        run: |
          curl -fL \
            https://raw.githubusercontent.com/astronexus/HYG-Database/3bf37f4b2d5460e1278286320d1d62fab9b493c1/hyg/CURRENT/hygdata_v41.csv \
            -o /tmp/hygdata_v41.csv

      - name: Resolve ISO week range
        id: range
        run: |
          read START_DATE END_DATE < <(python tools/resolve_iso_week_range.py \
            '${{ inputs.start_year }}' '${{ inputs.start_week }}' \
            '${{ inputs.end_year }}' '${{ inputs.end_week }}')
          echo "start_date=$START_DATE" >> "$GITHUB_OUTPUT"
          echo "end_date=$END_DATE" >> "$GITHUB_OUTPUT"
          echo "$START_DATE through $END_DATE"

      - name: Generate Artwork specs
        run: python tools/populate_sky_notes_artwork_by_date.py "${{ steps.range.outputs.start_date }}" "${{ steps.range.outputs.end_date }}"

      - name: Render stellar finder SVGs
        shell: bash
        run: |
          set -euo pipefail
          for spec in sky-notes-artwork/specs/${{ inputs.start_year }}/W*.json; do
            [ -e "$spec" ] || continue
            week="$(basename "$spec" .json)"
            week_number="${week#W}"
            week_value=$((10#$week_number))
            start_value=$((10#${{ inputs.start_week }}))
            end_value=$((10#${{ inputs.end_week }}))
            if (( week_value < start_value || week_value > end_value )); then
              continue
            fi
            out="sky-notes-artwork/${{ inputs.start_year }}/${week}/finder.svg"
            python tools/render_sky_note_finder.py /tmp/hygdata_v41.csv "$spec" "$out"
          done

      - name: Publish rendered Artwork into weekly pages
        run: python tools/publish_sky_note_artwork.py "${{ steps.range.outputs.start_date }}" "${{ steps.range.outputs.end_date }}"

      - name: Chromium Artwork acceptance check
        shell: bash
        run: |
          set -euo pipefail
          python -m http.server 8765 --directory . >/tmp/artwork-http.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          sleep 1

          chromium_bin="$(command -v chromium || command -v chromium-browser || command -v google-chrome || true)"
          if [ -z "$chromium_bin" ]; then
            echo "Chromium/Chrome is not available on this runner." >&2
            exit 1
          fi

          checked=0
          for ((week_value=10#${{ inputs.start_week }}; week_value<=10#${{ inputs.end_week }}; week_value++)); do
            week="W$(printf '%02d' "$week_value")"
            page="site/${{ inputs.start_year }}/${week}/index.html"
            svg="sky-notes-artwork/${{ inputs.start_year }}/${week}/finder.svg"
            if [ ! -f "$page" ] || [ ! -f "$svg" ]; then
              continue
            fi

            checked=$((checked + 1))
            url="http://127.0.0.1:8765/site/${{ inputs.start_year }}/${week}/index.html"
            dom_file="/tmp/${week}-artwork-dom.html"
            "$chromium_bin" --headless --no-sandbox --disable-gpu --virtual-time-budget=3000 --dump-dom "$url" > "$dom_file"
            python tools/check_sky_note_artwork_dom.py "$dom_file" "$svg" "$week"

            artwork_href="$(python -c 'import sys; from pathlib import Path; from tools.check_sky_note_artwork_dom import ArtworkParser; p=ArtworkParser(); p.feed(Path(sys.argv[1]).read_text(encoding="utf-8")); len(p.artwork_hrefs)==1 or (_ for _ in ()).throw(SystemExit(f"Expected exactly one Artwork link, found {p.artwork_hrefs!r}")); print(p.artwork_hrefs[0])' "$dom_file")"
            case "$artwork_href" in
              http://*|https://*) artwork_url="$artwork_href" ;;
              /*) artwork_url="http://127.0.0.1:8765$artwork_href" ;;
              *) artwork_url="$(python -c 'import sys; from urllib.parse import urljoin; print(urljoin(sys.argv[1], sys.argv[2]))' "$url" "$artwork_href")" ;;
            esac

            destination="/tmp/${week}-artwork-destination"
            "$chromium_bin" --headless --no-sandbox --disable-gpu --virtual-time-budget=3000 --dump-dom "$artwork_url" > "$destination"
            python -c 'import sys; from pathlib import Path; from urllib.parse import urlparse; url=sys.argv[1]; path=Path(sys.argv[2]); urlparse(url).path.lower().endswith(".json") and (_ for _ in ()).throw(SystemExit(f"Artwork link resolved to JSON descriptor: {url}")); text=path.read_text(encoding="utf-8", errors="replace").lstrip().lower(); "<svg" in text or (_ for _ in ()).throw(SystemExit(f"Artwork link did not render SVG artwork: {url}")); print(f"Chromium followed Artwork link to rendered SVG: {url}")' "$artwork_url" "$destination"
          done

          if [ "$checked" -eq 0 ]; then
            echo "No generated Artwork pages were available for Chromium validation." >&2
            exit 1
          fi
          echo "Chromium validated $checked Artwork page(s), including link destinations."

      - name: Commit Artwork changes only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- almanack site
          git add -A -- tools/render_sky_note_finder.py tools/publish_sky_note_artwork.py
          if [ -e sky-notes-artwork ]; then
            git add -- sky-notes-artwork
          fi
          if git diff --cached --quiet; then
            echo "No Artwork changes in requested ISO week range."
            exit 0
          fi
          git commit -m "Generate Artwork ${{ inputs.start_year }}-W${{ inputs.start_week }}"
          git pull --rebase origin main
          git push
