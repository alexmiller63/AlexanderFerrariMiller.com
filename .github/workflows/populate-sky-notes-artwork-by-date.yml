name: Artwork Generator

on:
  workflow_dispatch:
    inputs:
      start_year:
        description: Start year
        required: true
        default: '2026'
        type: string
      start_week:
        description: Start week
        required: true
        default: '36'
        type: string
      end_year:
        description: End year
        required: true
        default: '2026'
        type: string
      end_week:
        description: End week
        required: true
        default: '40'
        type: string

permissions:
  contents: write

concurrency:
  group: artwork-generator
  cancel-in-progress: false

jobs:
  populate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install renderer dependency
        run: python -m pip install matplotlib

      - name: Fetch pinned HYG v4.1 catalog
        run: |
          curl -fL \
            https://raw.githubusercontent.com/astronexus/HYG-Database/3bf37f4b2d5460e1278286320d1d62fab9b493c1/hyg/CURRENT/hygdata_v41.csv \
            -o /tmp/hygdata_v41.csv

      - name: Resolve ISO week range
        id: range
        run: |
          read START_DATE END_DATE < <(python tools/resolve_iso_week_range.py \
            '${{ inputs.start_year }}' '${{ inputs.start_week }}' \
            '${{ inputs.end_year }}' '${{ inputs.end_week }}')
          echo "start_date=$START_DATE" >> "$GITHUB_OUTPUT"
          echo "end_date=$END_DATE" >> "$GITHUB_OUTPUT"
          echo "$START_DATE through $END_DATE"

      - name: Generate Artwork specs
        run: python tools/populate_sky_notes_artwork_by_date.py "${{ steps.range.outputs.start_date }}" "${{ steps.range.outputs.end_date }}"

      - name: Render stellar finder SVGs
        shell: bash
        run: |
          set -euo pipefail
          for spec in sky-notes-artwork/specs/${{ inputs.start_year }}/W*.json; do
            [ -e "$spec" ] || continue
            week="$(basename "$spec" .json)"
            week_number="${week#W}"
            week_value=$((10#$week_number))
            start_value=$((10#${{ inputs.start_week }}))
            end_value=$((10#${{ inputs.end_week }}))
            if (( week_value < start_value || week_value > end_value )); then
              continue
            fi
            out="sky-notes-artwork/${{ inputs.start_year }}/${week}/finder.svg"
            python tools/render_sky_note_finder.py /tmp/hygdata_v41.csv "$spec" "$out"
          done

      - name: Publish rendered Artwork into weekly pages
        run: python tools/publish_sky_note_artwork.py "${{ steps.range.outputs.start_date }}" "${{ steps.range.outputs.end_date }}"

      - name: Chromium Artwork acceptance check
        shell: bash
        run: |
          set -euo pipefail
          python -m http.server 8765 --directory . >/tmp/artwork-http.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          sleep 1

          chromium_bin="$(command -v chromium || command -v chromium-browser || command -v google-chrome || true)"
          if [ -z "$chromium_bin" ]; then
            echo "Chromium/Chrome is not available on this runner." >&2
            exit 1
          fi

          checked=0
          for ((week_value=10#${{ inputs.start_week }}; week_value<=10#${{ inputs.end_week }}; week_value++)); do
            week="W$(printf '%02d' "$week_value")"
            page="site/${{ inputs.start_year }}/${week}/index.html"
            svg="sky-notes-artwork/${{ inputs.start_year }}/${week}/finder.svg"

            if [ ! -f "$page" ] || [ ! -f "$svg" ]; then
              continue
            fi

            checked=$((checked + 1))
            url="http://127.0.0.1:8765/site/${{ inputs.start_year }}/${week}/index.html"
            dom="$($chromium_bin --headless --no-sandbox --disable-gpu --virtual-time-budget=3000 --dump-dom "$url")"

            python - "$week" "$svg" <<'PY' <<<"$dom"
import re
import sys
from html import unescape

week, expected_svg = sys.argv[1:]
dom = sys.stdin.read()
figures = re.findall(r'<figure[^>]*class="[^"]*sky-note-artwork[^"]*"[\s\S]*?</figure>', dom, flags=re.I)
if not figures:
    raise SystemExit(f"{week}: Chromium rendered no .sky-note-artwork figure")

figure = figures[0]
match = re.search(r'<img\b[^>]*class="[^"]*"[^>]*>|<img\b[^>]*>', figure, flags=re.I)
if not match:
    raise SystemExit(f"{week}: artwork figure has no rendered img")
img = match.group(0)
src = re.search(r'\bsrc="([^"]+)"', img, flags=re.I)
if not src:
    raise SystemExit(f"{week}: artwork img has no src")

src_value = unescape(src.group(1))
expected_suffix = "/" + expected_svg
if not src_value.endswith(expected_suffix):
    raise SystemExit(f"{week}: artwork img points to {src_value!r}, expected *{expected_suffix!r}")

if 'naturalWidth="0"' in img or 'naturalHeight="0"' in img:
    raise SystemExit(f"{week}: Chromium reports zero-size artwork")

print(f"{week}: Chromium rendered artwork from {src_value}")
PY
          done

          if [ "$checked" -eq 0 ]; then
            echo "No generated Artwork pages were available for Chromium validation." >&2
            exit 1
          fi
          echo "Chromium validated $checked Artwork page(s)."

      - name: Commit Artwork changes only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- almanack site
          git add -A -- tools/render_sky_note_finder.py tools/publish_sky_note_artwork.py
          if [ -e sky-notes-artwork ]; then
            git add -- sky-notes-artwork
          fi
          if git diff --cached --quiet; then
            echo "No Artwork changes in requested ISO week range."
            exit 0
          fi
          git commit -m "Generate Artwork ${{ inputs.start_year }}-W${{ inputs.start_week }}"
          git pull --rebase origin main
          git push
