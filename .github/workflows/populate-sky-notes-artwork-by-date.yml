name: Populate Sky Notes Artwork — by ISO date

on:
  workflow_dispatch:
    inputs:
      start_date:
        description: Start date (ISO YYYY-MM-DD)
        required: true
        type: string
      end_date:
        description: End date (ISO YYYY-MM-DD)
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: populate-sky-notes-artwork-by-date
  cancel-in-progress: false

jobs:
  populate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Populate Sky Notes artwork for requested ISO dates
        run: python tools/populate_sky_notes_artwork_by_date.py "${{ inputs.start_date }}" "${{ inputs.end_date }}"

      - name: Commit Sky Notes artwork changes only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- almanack Star-Almanack-Repo/site
          if [ -e Star-Almanack-Repo/sky-notes-artwork ]; then
            git add -- Star-Almanack-Repo/sky-notes-artwork
          fi
          if git diff --cached --quiet; then
            echo "No Sky Notes artwork changes in requested ISO date range."
            exit 0
          fi
          git commit -m "Populate Sky Notes artwork ${{ inputs.start_date }} through ${{ inputs.end_date }}"
          git pull --rebase origin main
          git push
