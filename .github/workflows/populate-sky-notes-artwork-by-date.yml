name: Artwork Generator

on:
  workflow_dispatch:
    inputs:
      start_year:
        description: Start year
        required: true
        default: '2026'
        type: string
      start_week:
        description: Start week
        required: true
        default: '36'
        type: string
      end_year:
        description: End year
        required: true
        default: '2026'
        type: string
      end_week:
        description: End week
        required: true
        default: '36'
        type: string

permissions:
  contents: write

concurrency:
  group: artwork-generator
  cancel-in-progress: false

jobs:
  populate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install renderer dependency
        run: python -m pip install matplotlib

      - name: Fetch pinned HYG v4.1 catalog
        run: |
          curl -fL \
            https://raw.githubusercontent.com/astronexus/HYG-Database/3bf37f4b2d5460e1278286320d1d62fab9b493c1/hyg/CURRENT/hygdata_v41.csv \
            -o /tmp/hygdata_v41.csv

      - name: Resolve ISO week range
        id: range
        run: |
          read START_DATE END_DATE < <(python tools/resolve_iso_week_range.py \
            '${{ inputs.start_year }}' '${{ inputs.start_week }}' \
            '${{ inputs.end_year }}' '${{ inputs.end_week }}')
          echo "start_date=$START_DATE" >> "$GITHUB_OUTPUT"
          echo "end_date=$END_DATE" >> "$GITHUB_OUTPUT"

      - name: Generate Artwork request specs
        run: python tools/populate_sky_notes_artwork_by_date.py "${{ steps.range.outputs.start_date }}" "${{ steps.range.outputs.end_date }}"

      - name: Render fixed-object finder SVGs
        shell: bash
        run: |
          set -euo pipefail
          for spec in sky-notes-artwork/specs/${{ inputs.start_year }}/W*.json; do
            [ -e "$spec" ] || continue
            week="$(basename "$spec" .json)"
            week_value=$((10#${week#W}))
            start_value=$((10#${{ inputs.start_week }}))
            end_value=$((10#${{ inputs.end_week }}))
            (( week_value >= start_value && week_value <= end_value )) || continue
            fixed_id="$(python -c 'import json,sys; d=json.load(open(sys.argv[1])); print(d["target_identity"]["fixed_object_id"])' "$spec")"
            out="sky-notes-artwork/objects/${fixed_id}/finder.svg"
            mkdir -p "$(dirname "$out")"
            python tools/render_sky_note_finder.py /tmp/hygdata_v41.csv "$spec" "$out"
            echo "$week -> fixed object $fixed_id -> $out"
          done

      - name: Publish fixed-object Artwork into weekly pages
        run: python tools/publish_sky_note_artwork.py "${{ steps.range.outputs.start_date }}" "${{ steps.range.outputs.end_date }}"

      - name: Chromium fixed-object Artwork acceptance check
        shell: bash
        run: |
          set -euo pipefail
          python -m http.server 8765 --directory . >/tmp/artwork-http.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          sleep 1
          chromium_bin="$(command -v chromium || command -v chromium-browser || command -v google-chrome || true)"
          [ -n "$chromium_bin" ] || { echo "Chromium/Chrome is not available." >&2; exit 1; }

          checked=0
          for ((week_value=10#${{ inputs.start_week }}; week_value<=10#${{ inputs.end_week }}; week_value++)); do
            week="W$(printf '%02d' "$week_value")"
            page="site/${{ inputs.start_year }}/${week}/index.html"
            spec="sky-notes-artwork/specs/${{ inputs.start_year }}/${week}.json"
            [ -f "$page" ] && [ -f "$spec" ] || continue
            fixed_id="$(python -c 'import json,sys; print(json.load(open(sys.argv[1]))["target_identity"]["fixed_object_id"])' "$spec")"
            svg="sky-notes-artwork/objects/${fixed_id}/finder.svg"
            [ -f "$svg" ] || { echo "$week: missing fixed-object artwork $svg" >&2; exit 1; }

            checked=$((checked + 1))
            url="http://127.0.0.1:8765/site/${{ inputs.start_year }}/${week}/index.html"
            dom_file="/tmp/${week}-artwork-dom.html"
            "$chromium_bin" --headless --no-sandbox --disable-gpu --virtual-time-budget=3000 --dump-dom "$url" > "$dom_file"
            python tools/check_sky_note_artwork_dom.py "$dom_file" "$svg" "$week/fixed-object-$fixed_id"

            artwork_href="$(python -c 'import sys; from pathlib import Path; from tools.check_sky_note_artwork_dom import ArtworkParser; p=ArtworkParser(); p.feed(Path(sys.argv[1]).read_text(encoding="utf-8")); len(p.artwork_hrefs)==1 or (_ for _ in ()).throw(SystemExit(f"Expected exactly one Artwork link, found {p.artwork_hrefs!r}")); print(p.artwork_hrefs[0])' "$dom_file")"
            artwork_url="$(python -c 'import sys; from urllib.parse import urljoin; print(urljoin(sys.argv[1], sys.argv[2]))' "$url" "$artwork_href")"
            destination="/tmp/${week}-fixed-object-${fixed_id}-destination"
            "$chromium_bin" --headless --no-sandbox --disable-gpu --virtual-time-budget=3000 --dump-dom "$artwork_url" > "$destination"
            python -c 'import sys; from pathlib import Path; url=sys.argv[1]; text=Path(sys.argv[2]).read_text(encoding="utf-8",errors="replace").lstrip().lower(); "<svg" in text or (_ for _ in ()).throw(SystemExit(f"Artwork link did not render SVG: {url}")); print(f"PROOF: Chromium followed fixed-object artwork link to rendered SVG: {url}")' "$artwork_url" "$destination"
          done
          [ "$checked" -gt 0 ] || { echo "No fixed-object Artwork pages available for validation." >&2; exit 1; }
          echo "PROOF COMPLETE: Chromium validated $checked fixed-object Artwork page(s)."

      - name: Commit Artwork changes only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- almanack site
          git add -A -- tools/publish_sky_note_artwork.py sky-notes-artwork
          if git diff --cached --quiet; then
            echo "No Artwork changes in requested ISO week range."
            exit 0
          fi
          git commit -m "Generate fixed-object Artwork ${{ inputs.start_year }}-W${{ inputs.start_week }}"
          git pull --rebase origin main
          git push
