name: Populate Sky Notes Artwork — by ISO date

on:
  workflow_dispatch:
    inputs:
      start_date:
        description: Start date (ISO YYYY-MM-DD)
        required: true
        type: string
      end_date:
        description: End date (ISO YYYY-MM-DD)
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: populate-sky-notes-artwork-by-date
  cancel-in-progress: false

jobs:
  populate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Resolve requested ISO weeks
        id: range
        env:
          START_DATE: ${{ inputs.start_date }}
          END_DATE: ${{ inputs.end_date }}
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import os
          from datetime import date, timedelta

          start = date.fromisoformat(os.environ['START_DATE'])
          end = date.fromisoformat(os.environ['END_DATE'])
          if end < start:
              raise SystemExit('end_date must be on or after start_date')
          if (end - start).days > 1096:
              raise SystemExit('Date range may span at most 3 years')

          weeks = []
          seen = set()
          d = start
          while d <= end:
              iso = d.isocalendar()
              key = (iso.year, iso.week)
              if key not in seen:
                  seen.add(key)
                  weeks.append(f'{iso.year}:W{iso.week:02d}')
              d += timedelta(days=1)
          print('weeks=' + ' '.join(weeks))
          PY

      - name: Create Sky Notes artwork for requested ISO weeks
        env:
          WEEKS: ${{ steps.range.outputs.weeks }}
        run: |
          for item in $WEEKS; do
            year="${item%%:*}"
            week="${item##*:}"
            week_number="${week#W}"

            if [ -f tools/populate_sky_notes_artwork.py ]; then
              python tools/populate_sky_notes_artwork.py --year "$year" --week "$week_number"
            elif [ -f "tools/sky-notes-artwork/$year-$week.py" ]; then
              python "tools/sky-notes-artwork/$year-$week.py"
            elif [ "$year" = "2026" ] && [ "$week" = "W41" ] && [ -f tools/assemble-w41-artwork.py ]; then
              python tools/assemble-w41-artwork.py
            else
              echo "No Sky Notes artwork generator is defined for ISO $year-$week; skipping."
            fi
          done

      - name: Commit only requested ISO-week artwork and embeds
        env:
          WEEKS: ${{ steps.range.outputs.weeks }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for item in $WEEKS; do
            year="${item%%:*}"
            week="${item##*:}"
            for path in "almanack/$year/$week" "Star-Almanack-Repo/site/$year/$week" "Star-Almanack-Repo/sky-notes-artwork/$year/$week"; do
              if [ -e "$path" ]; then git add "$path"; fi
            done
          done
          if git diff --cached --quiet; then
            echo "No Sky Notes artwork changes in requested ISO date range."
            exit 0
          fi
          git commit -m "Populate Sky Notes artwork ${{ inputs.start_date }} through ${{ inputs.end_date }}"
          git pull --rebase origin main
          git push
