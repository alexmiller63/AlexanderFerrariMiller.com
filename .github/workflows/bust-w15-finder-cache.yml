name: Bust W15 finder cache

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/bust-w15-finder-cache.yml

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update W15 finder cache keys
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('almanack/2026/W15/index.html')
          s = p.read_text(encoding='utf-8')
          s = s.replace('planet-finder-latin.svg?v=20260906-3','planet-finder-latin.svg?v=20260907-1')
          s = s.replace('planet-finder-mixed-learner.svg?v=20260906-3','planet-finder-mixed-learner.svg?v=20260907-1')
          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add almanack/2026/W15/index.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Bust W15 Latin and Mixed finder cache'
          git push
