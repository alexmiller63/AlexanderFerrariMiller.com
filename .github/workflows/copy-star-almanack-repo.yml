name: Copy Star Almanack Repository

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  copy:
    runs-on: ubuntu-latest

    steps:
      - name: Check out website repository
        uses: actions/checkout@v4

      - name: Refuse to overwrite an existing copy
        shell: bash
        run: |
          set -euo pipefail
          if [ -e Star-Almanack-Repo ]; then
            echo "ERROR: Star-Almanack-Repo already exists. Refusing to overwrite or merge."
            exit 1
          fi

      - name: Clone Star Almanack
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 --branch main https://github.com/alexmiller63/star-almanack.git /tmp/star-almanack-source
          git -C /tmp/star-almanack-source rev-parse HEAD > /tmp/star-almanack-commit.txt

      - name: Copy repository working tree
        shell: bash
        run: |
          set -euo pipefail
          mkdir Star-Almanack-Repo
          rsync -a --exclude='.git/' /tmp/star-almanack-source/ Star-Almanack-Repo/

      - name: Verify copy
        shell: bash
        run: |
          set -euo pipefail
          diff -qr --exclude='.git' /tmp/star-almanack-source Star-Almanack-Repo
          SOURCE_COUNT=$(find /tmp/star-almanack-source -type f ! -path '*/.git/*' | wc -l)
          TARGET_COUNT=$(find Star-Almanack-Repo -type f | wc -l)
          test "$SOURCE_COUNT" -eq "$TARGET_COUNT"
          echo "Verified $TARGET_COUNT files."

      - name: Write provenance
        shell: bash
        run: |
          set -euo pipefail
          SOURCE_COMMIT=$(cat /tmp/star-almanack-commit.txt)
          cat > Star-Almanack-Repo/COPY-PROVENANCE.txt <<EOF
          This directory is a file-level copy of the Star Almanack repository.
          Source repository: https://github.com/alexmiller63/star-almanack
          Source ref: main
          Source commit: $SOURCE_COMMIT
          The source repository's .git directory was intentionally not copied.
          The source repository was not modified by this workflow.
          EOF

      - name: Commit copy
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Star-Almanack-Repo
          git commit -m 'Copy Star Almanack repository'
          git push origin HEAD:main
