name: Deploy Alexander Ferrari Miller

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Check out site
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Deploy to AWS
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.AWS_HOST }}
          username: ${{ secrets.AWS_USER }}
          key: ${{ secrets.AWS_SSH_KEY }}
          script: |
            cd /var/www/AlexanderFerrariMiller
            git fetch origin main
            git reset --hard origin/main
            # Remove untracked files left by older deployments before rebuilding.\n            # Without this, obsolete Almanack subpages (for example W01/sky-notes/)\n            # can survive indefinitely even after they are removed from the repository.\n            git clean -fd\n            ~/build-alex.sh
