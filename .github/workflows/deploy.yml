name: Deploy Alexander Ferrari Miller

on:
  push:
    branches:
      - main
  workflow_dispatch:
  # Generator commits use GITHUB_TOKEN, so their pushes do not trigger this workflow.
  workflow_run:
    workflows:
      - Calendar Generator
      - Ephemeris Generator
      - Weekly Planet Finder
      - Sky Notes Generator
      - Artwork Generator
      - Legend Generator
      - Weekly Build All
    types: [completed]
    branches: [main]

permissions:
  contents: read

# Each deployment updates and rebuilds the same server checkout.
concurrency:
  group: alexander-ferrari-miller-deploy
  cancel-in-progress: false

jobs:
  deploy:
    if: >-
      ${{ github.event_name != 'workflow_run' ||
          (github.event.workflow_run.conclusion == 'success' &&
           github.event.workflow_run.head_repository.full_name == github.repository) }}
    runs-on: ubuntu-latest

    steps:
      - name: Check out site
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Deploy to AWS
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.AWS_HOST }}
          username: ${{ secrets.AWS_USER }}
          key: ${{ secrets.AWS_SSH_KEY }}
          script: |
            set -e
            cd /var/www/AlexanderFerrariMiller
            git fetch origin main
            git reset --hard origin/main
            # Remove untracked files left by older deployments before rebuilding.
            # Without this, obsolete Almanack subpages (for example W01/sky-notes/)
            # can survive indefinitely even after they are removed from the repository.
            git clean -fd
            ~/build-alex.sh
