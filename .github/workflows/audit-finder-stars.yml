name: Audit 2026 finder stars

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  finder-star-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Audit all 53 weeks
        run: python tools/audit_finder_stars.py --year 2026 --output audit-output/finder-stars
      - name: Upload audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: finder-star-audit-2026
          path: audit-output/finder-stars/
          if-no-files-found: warn
