name: Fix Ephemeris Runtime Path

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Correct canonical ephemeris runtime path
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('tools/populate_ephemeris_by_date.py')
          text = path.read_text(encoding='utf-8')
          old = 'runtime = \'<script src="../../../js/ephemeris.js"></script>\''
          new = 'runtime = \'<script src="../../js/ephemeris.js"></script>\''
          if old not in text:
              raise SystemExit('Expected runtime path not found; refusing to patch')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY

      - name: Verify
        run: grep -F '../../js/ephemeris.js' tools/populate_ephemeris_by_date.py

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools/populate_ephemeris_by_date.py
          git commit -m "Correct ephemeris runtime path"
          git pull --rebase origin main
          git push
