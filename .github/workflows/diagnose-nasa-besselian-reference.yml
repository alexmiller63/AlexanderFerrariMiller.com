name: Diagnose NASA Besselian Reference

on:
  workflow_dispatch:
  push:
    paths:
      - 'Historical/diagnose_nasa_besselian_reference.py'
      - '.github/workflows/diagnose-nasa-besselian-reference.yml'

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Run independent Besselian control
        run: python Historical/diagnose_nasa_besselian_reference.py
