name: Almanack type coverage regression

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/almanack-type-coverage-regression.yml'
      - 'tools/test_almanack_type_coverage.py'
      - 'tools/audit_almanack_population_counts.py'
      - 'tools/scaffold_almanack_weeks.py'
      - 'tools/populate_calendar.py'
      - 'tools/almanack_calendar.py'
      - 'tools/populate_meteor_showers.py'
      - 'tools/populate_ephemeris.py'
      - 'tools/populate_fixed_sky.py'
      - 'tools/standardize_messier_calendar.py'
      - 'tools/populate_constellations.py'
      - 'tools/populate_asterisms.py'
      - 'tools/populate_caldwell.py'
      - 'tools/populate_finest_ngc.py'
      - 'tools/reconcile_catalog_common_names.py'
      - '_includes/almanack-notation-legend.html'
      - 'constellation-observance-2026.csv'
      - 'asterism-geometry-2026.csv'
      - 'expanded-bayer-visibility-2026.csv'
      - 'messier-visibility-2026.csv'
      - 'caldwell-catalog.csv'
      - 'finest-ngc-catalog.csv'
      - 'generated/expanded-bayer-visibility-2026.csv'
      - 'generated/messier-visibility-2026.csv'
      - 'generated/caldwell-visibility-2026.csv'
      - 'generated/finest-ngc-visibility-2026.csv'
      - 'almanack/2026/**'

permissions:
  contents: read

env:
  STAR_ALMANACK_EPHEMERIS_DIR: ${{ github.workspace }}/.cache/skyfield

jobs:
  type-coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run permanent type coverage regression
        run: python tools/test_almanack_type_coverage.py
