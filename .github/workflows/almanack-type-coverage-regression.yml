name: Almanack type coverage regression

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/almanack-type-coverage-regression.yml'
      - 'tools/test_almanack_type_coverage.py'
      - 'tools/audit_almanack_population_counts.py'
      - 'tools/scaffold_almanack_weeks.py'
      - 'tools/populate_calendar.py'
      - 'tools/almanack_calendar.py'
      - 'tools/populate_meteor_showers.py'
      - 'tools/populate_ephemeris.py'
      - 'tools/wire_ephemeris_notation.py'
      - 'tools/populate_fixed_sky.py'
      - 'tools/standardize_messier_calendar.py'
      - 'tools/populate_constellations.py'
      - 'tools/populate_asterisms.py'
      - 'tools/populate_caldwell.py'
      - 'tools/populate_finest_ngc.py'
      - 'tools/reconcile_catalog_common_names.py'
      - '_includes/almanack-notation-legend.html'
      - 'constellation-observance-2026.csv'
      - 'asterism-geometry-2026.csv'
      - 'expanded-bayer-visibility-2026.csv'
      - 'messier-visibility-2026.csv'
      - 'caldwell-catalog.csv'
      - 'finest-ngc-catalog.csv'
      - 'generated/expanded-bayer-visibility-2026.csv'
      - 'generated/messier-visibility-2026.csv'
      - 'generated/caldwell-visibility-2026.csv'
      - 'generated/finest-ngc-visibility-2026.csv'
      - 'almanack/2026/**'

permissions:
  contents: read

env:
  STAR_ALMANACK_EPHEMERIS_DIR: ${{ github.workspace }}/.cache/skyfield

jobs:
  type-coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Restore astronomical source cache
        uses: actions/cache@v4
        with:
          path: |
            .cache/skyfield/de440s.bsp
            .cache/skyfield/ceres_1900_2100.bsp
          key: star-almanack-source-kernels-v1
      - name: Install astronomical calculation dependencies
        run: python -m pip install --disable-pip-version-check skyfield==1.55 PyYAML
      - name: Download source kernels only when cache is empty
        run: |
          mkdir -p .cache/skyfield
          python - <<'PY'
          from pathlib import Path
          from urllib.request import urlretrieve
          from skyfield.api import Loader

          root = Path('.cache/skyfield')
          de440s = root / 'de440s.bsp'
          ceres = root / 'ceres_1900_2100.bsp'
          if not de440s.exists():
              Loader(str(root)).download('de440s.bsp')
          if not ceres.exists():
              urlretrieve(
                  'https://naif.jpl.nasa.gov/pub/naif/generic_kernels/spk/asteroids/a_old_versions/ceres_1900_2100.bsp',
                  ceres,
              )
          PY
      - name: Scaffold 2026 Almanack pages for regression
        run: python tools/scaffold_almanack_weeks.py 2026 1 2026 53
      - name: Generate 2026 Almanack pages for regression
        run: |
          python tools/clean_event_cells.py 2026
          python tools/populate_calendar.py 2026
          python tools/populate_meteor_showers.py 2026
          python tools/populate_ephemeris.py 2026
          python tools/wire_ephemeris_notation.py 2026
          python tools/populate_fixed_sky.py 2026
          python tools/standardize_messier_calendar.py 2026
          python tools/populate_constellations.py 2026
          python tools/populate_asterisms.py 2026
          python tools/populate_caldwell.py 2026
          python tools/populate_finest_ngc.py 2026
          python tools/reconcile_catalog_common_names.py 2026
      - name: Run permanent type coverage regression
        run: python tools/test_almanack_type_coverage.py
      - name: Report Almanack population counts
        if: always()
        run: python tools/audit_almanack_population_counts.py
