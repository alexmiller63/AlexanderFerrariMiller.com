name: Almanack type coverage regression

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  STAR_ALMANACK_EPHEMERIS_DIR: ${{ github.workspace }}/.cache/skyfield

jobs:
  type-coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run permanent type coverage regression
        run: python tools/test_almanack_type_coverage.py
