name: Continuous Build All 2025

on:
  workflow_dispatch:
    inputs:
      weeks:
        description: 'Optional specific ISO weeks separated by spaces; blank builds start_week through end_week'
        type: string
        required: false
        default: ''
      start_week:
        description: 'First ISO week to build when weeks is blank'
        type: number
        required: true
        default: 1
      end_week:
        description: 'Last ISO week to build when weeks is blank (1–52)'
        type: number
        required: true
        default: 52

permissions:
  contents: write
  actions: write

concurrency:
  group: continuous-build-all-2025
  cancel-in-progress: false

jobs:
  week_01:
    name: 2025 Week 01
    if: ${{ always() && !cancelled() && ((inputs.weeks == '' && inputs.start_week <= 1 && inputs.end_week >= 1) || contains(format(' {0} ', inputs.weeks), ' 1 ')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4
      - name: Dispatch current weekly build and wait
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          echo "### 2025 build — ${{ github.job }}" >> "$GITHUB_STEP_SUMMARY"
          echo "Started: $(date -u +'%Y-%m-%d %H:%M:%S UTC')" >> "$GITHUB_STEP_SUMMARY"
          trap 'rc=$?; if [ "$rc" -eq 0 ]; then echo "✅ Weekly build succeeded" >> "$GITHUB_STEP_SUMMARY"; else echo "❌ Weekly build failed (exit $rc)" >> "$GITHUB_STEP_SUMMARY"; echo "::error::2025 ${{ github.job }} failed (exit $rc)"; fi; echo "Finished: $(date -u +%FT%TZ)" >> "$GITHUB_STEP_SUMMARY"' EXIT
          echo "::notice::Starting 2025 ${{ github.job }}"
          bash tools/run-workflow-and-wait.sh weekly-build-all.yml \
            -f start_year=2025 -f start_week=1 \
            -f end_year=2025 -f end_week=1 \
            -f resume_stage=Scaffold \
            -f resume_completed_weeks=true \
            -f candidate_layouts=1 \
            -f max_node_candidates=200 \
            -f max_search_seconds=360 \
            -f diagnostic_level=1
          sleep 90
