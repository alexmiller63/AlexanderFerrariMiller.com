name: Complete Star Almanack Live Migration

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/complete-star-almanack-migration.yml

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Promote backup content and repair non-workflow paths
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          import shutil

          root = Path.cwd()
          backup = root / "Historical"
          if not backup.is_dir():
              raise SystemExit("Historical backup directory is missing; refusing migration")

          excluded_backup_roots = {".github", "COPY-PROVENANCE.txt"}
          copied = []

          def copy_missing(src: Path, dst: Path) -> None:
              if src.is_dir():
                  dst.mkdir(parents=True, exist_ok=True)
                  for child in src.iterdir():
                      copy_missing(child, dst / child.name)
                  return
              if dst.exists():
                  return
              dst.parent.mkdir(parents=True, exist_ok=True)
              shutil.copy2(src, dst)
              copied.append(str(dst.relative_to(root)))

          for child in backup.iterdir():
              if child.name in excluded_backup_roots:
                  continue
              copy_missing(child, root / child.name)

          def repair_text(text: str) -> str:
              text = text.replace("Star-Almanack-Repo/", "")
              text = text.replace("Historical/", "")
              text = re.sub(r"\s*/\s*(['\"])(?:Historical|Star-Almanack-Repo)\1", "", text)
              text = text.replace('Path("Historical")', 'Path(".")')
              text = text.replace("Path('Historical')", "Path('.')")
              text = text.replace('Path("Star-Almanack-Repo")', 'Path(".")')
              text = text.replace("Path('Star-Almanack-Repo')", "Path('.')")
              return text

          changed = []
          for path in root.rglob("*"):
              if not path.is_file():
                  continue
              rel = path.relative_to(root)
              if rel.parts and rel.parts[0] in {".git", "Historical"}:
                  continue
              if len(rel.parts) >= 2 and rel.parts[0] == ".github" and rel.parts[1] == "workflows":
                  continue
              try:
                  text = path.read_text(encoding="utf-8")
              except (UnicodeDecodeError, OSError):
                  continue
              repaired = repair_text(text)
              if repaired != text:
                  path.write_text(repaired, encoding="utf-8")
                  changed.append(str(rel))

          print(f"Promoted {len(copied)} missing backup files into live locations")
          print(f"Repaired {len(changed)} non-workflow live text files")
          PY

      - name: Verify non-workflow live tree is independent of backup
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          root = Path.cwd()
          violations = []
          path_expr = re.compile(r"(?:/|Path\()\s*['\"](?:Historical|Star-Almanack-Repo)['\"]")
          for path in root.rglob("*"):
              if not path.is_file():
                  continue
              rel = path.relative_to(root)
              if rel.parts and rel.parts[0] in {"Historical", ".git"}:
                  continue
              if len(rel.parts) >= 2 and rel.parts[0] == ".github" and rel.parts[1] == "workflows":
                  continue
              try:
                  text = path.read_text(encoding="utf-8")
              except (UnicodeDecodeError, OSError):
                  continue
              if "Historical/" in text or "Star-Almanack-Repo/" in text or path_expr.search(text):
                  violations.append(str(rel))
          if violations:
              print("Non-workflow backup dependencies remain:")
              for item in violations:
                  print(item)
              raise SystemExit(1)
          print("PASS: non-workflow live tree is independent of backup")
          PY

      - name: Prepare repaired workflow files
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          import shutil

          root = Path.cwd()
          src = root / ".github/workflows"
          out = Path("/tmp/repaired-workflows")
          if out.exists():
              shutil.rmtree(out)
          out.mkdir(parents=True)
          self_name = "complete-star-almanack-migration.yml"

          def repair_text(text: str) -> str:
              text = text.replace("Star-Almanack-Repo/", "")
              text = text.replace("Historical/", "")
              text = re.sub(r"\s*/\s*(['\"])(?:Historical|Star-Almanack-Repo)\1", "", text)
              return text

          for path in sorted(src.glob("*.y*ml")):
              if path.name == self_name:
                  continue
              text = repair_text(path.read_text(encoding="utf-8"))
              if path.name == "audit-fixed-object-identity.yml":
                  text = re.sub(
                      r"\n\s*- name: Build permanent fixed-object registry\n\s*run: python tools/build_fixed_object_registry\.py\n",
                      "\n",
                      text,
                  )
                  text = text.replace("Commit audit and registry results", "Commit audit results")
                  text = text.replace(" database/fixed-object-registry.json", "")
                  text = text.replace("Identity audit and registry are already current.", "Identity audit is already current.")
                  text = text.replace("Update fixed-object identity audit and registry", "Update fixed-object identity audit")
              (out / path.name).write_text(text, encoding="utf-8")

          violations = []
          for path in out.glob("*.y*ml"):
              text = path.read_text(encoding="utf-8")
              if "Historical/" in text or "Star-Almanack-Repo/" in text:
                  violations.append(path.name)
          if violations:
              raise SystemExit("Workflow backup dependencies remain: " + ", ".join(violations))
          print(f"Prepared {len(list(out.glob('*.y*ml')))} repaired workflows")
          PY

      - name: Upload repaired workflow files
        uses: actions/upload-artifact@v4
        with:
          name: repaired-live-workflows
          path: /tmp/repaired-workflows
          if-no-files-found: error

      - name: Commit non-workflow migration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- . ':(exclude).github/workflows' ':(exclude).github/workflows/**'
          if git diff --cached --quiet; then
            echo "No non-workflow migration changes required"
            exit 0
          fi
          git commit -m "Promote Star Almanack live project data"
          git push
