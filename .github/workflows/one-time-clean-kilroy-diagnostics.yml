name: One-time repair and cleanup of W01 Kilroy diagnostic

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/one-time-clean-kilroy-diagnostics.yml

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore intact W01 and remove only Kilroy marker
        run: |
          set -euo pipefail
          GOOD_COMMIT=e44b1fccb98c292ff4d3e5d1dce26139fa29b0c9
          git show "$GOOD_COMMIT:almanack/2026/W01/index.html" > almanack/2026/W01/index.html
          git show "$GOOD_COMMIT:Star-Almanack-Repo/site/2026/W01/index.html" > Star-Almanack-Repo/site/2026/W01/index.html

          python - <<'PY'
          from pathlib import Path

          marker = '<p id="kilroy-deployment-diagnostic" style="text-align:center;font-family:system-ui,sans-serif;font-weight:700;border:2px solid currentColor;padding:.5rem;margin:1rem 0">KILROY WAS HERE — BUILD 2026-09-05 02:12 PDT</p>'
          targets = [
              Path('almanack/2026/W01/index.html'),
              Path('Star-Almanack-Repo/site/2026/W01/index.html'),
          ]
          for page in targets:
              text = page.read_text(encoding='utf-8')
              if marker not in text:
                  raise SystemExit(f'Expected Kilroy marker not found in restored {page}')
              new = text.replace(marker, '', 1)
              if len(text) - len(new) != len(marker):
                  raise SystemExit(f'Unexpected change size in {page}')
              page.write_text(new, encoding='utf-8')
              print(f'Restored and cleaned {page}')
          PY

      - name: Commit repair
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add almanack/2026/W01/index.html Star-Almanack-Repo/site/2026/W01/index.html
          git commit -m "Restore W01 and remove Kilroy marker safely"
          git push
