name: Diagnose DE441 Full Eclipse Audit

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/diagnose-de441-full-audit.yml
      - Star-Almanack-Repo/eclipse-validation-cases.yaml

permissions:
  contents: read

jobs:
  diagnose-full-audit:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: Star-Almanack-Repo

    steps:
      - name: Check out Star Almanack
        uses: actions/checkout@v6

      - name: Verify validated DE441 microkernel
        run: |
          test -s star-almanack-microkernel.bsp
          ls -lh star-almanack-microkernel.bsp

      - name: Verify preserved NAIF leap-seconds kernel
        run: |
          test -s kernels/naif0012.tls
          ls -lh kernels/naif0012.tls

      - name: Install Python dependencies
        run: python3 -m pip install --disable-pip-version-check spiceypy pyyaml

      - name: Bootstrap ELP2000-82B archive
        working-directory: Star-Almanack-Repo/star-almanack-elp82b
        run: |
          python lunar_elp.py bootstrap data/elp82b
          python lunar_elp.py verify data/elp82b
          python normalize_elp82b.py data/elp82b elp82b-manifest.json

      - name: Run DE441 eclipse geometry audit
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY' 2>&1 | tee de441-eclipse-full-audit.txt
          from datetime import datetime, timezone
          import statistics
          import spiceypy as spice
          import yaml
          import eclipse_engine

          BSP = "star-almanack-microkernel.bsp"
          LSK = "kernels/naif0012.tls"
          DAY = 86400.0
          J2000 = 2451545.0

          def iso_dt(text):
              return datetime.fromisoformat(text.replace("Z", "+00:00"))

          def signed_seconds(a, b):
              return (iso_dt(a) - iso_dt(b)).total_seconds()

          def iso_to_jd(text):
              dt = iso_dt(text).astimezone(timezone.utc)
              h = dt.hour + dt.minute/60 + dt.second/3600 + dt.microsecond/3_600_000_000
              return eclipse_engine.gregorian_to_jd(dt.year, dt.month, dt.day, h)

          spice.furnsh(LSK)
          spice.furnsh(BSP)

          def de441_sun(jd_tdb):
              et = (jd_tdb - J2000) * DAY
              p, _ = spice.spkpos("SUN", et, "ECLIPJ2000", "NONE", "EARTH")
              return eclipse_engine.Vec3(float(p[0]), float(p[1]), float(p[2]))

          with open("eclipse-validation-cases.yaml", "r", encoding="utf-8") as f:
              spec = yaml.safe_load(f)

          cases = []
          for c in spec["historical"]:
              if c.get("expected_greatest_utc"):
                  cases.append(("historical", c["label"], c["date_utc"], c["expected_greatest_utc"]))
          for c in spec["future_jello"]["cases"]:
              if c.get("nasa_greatest_utc"):
                  cases.append(("future", c["label"], c["date_utc"], c["nasa_greatest_utc"]))

          engine = eclipse_engine.EclipseEngine()
          original_sun = eclipse_engine.sun_vector_j2000
          de441_residuals = []
          historical_residuals = []
          future_residuals = []

          print("STAR ALMANACK — DE441 SUN / ELP2000-82B ECLIPSE GEOMETRY AUDIT")
          print("Reference: NASA greatest-eclipse UTC values in eclipse-validation-cases.yaml")
          print("Sun: DE441 geometric; Moon: production ELP2000-82B; geometry/search: production")
          print()
          print("For each case:")
          print("  ref  = geometry at the published greatest-eclipse instant")
          print("  calc = geometry at the Star Almanack minimizer's greatest-eclipse instant")
          print("  dA/dt is the centered 1-second derivative of shadow-axis distance")
          print()
          print(f"{'Case':<36} {'dt':>9} {'Aref km':>12} {'Acalc km':>12} {'dA km':>10} {'dA/dt ref':>12} {'dA/dt calc':>13}")
          print("-" * 112)

          try:
              eclipse_engine.sun_vector_j2000 = de441_sun

              for group, label, date, reference in cases:
                  de = engine.find_solar_eclipse(date)
                  de_res = signed_seconds(de.greatest_utc, reference)

                  de441_residuals.append(de_res)
                  (historical_residuals if group == "historical" else future_residuals).append(de_res)

                  ref_jd = iso_to_jd(reference)
                  calc_jd = de.greatest_jd_utc
                  one_sec = 1.0 / DAY

                  def axis_rate(jd):
                      gm = engine.geometry_at_utc_jd(jd - one_sec)
                      gp = engine.geometry_at_utc_jd(jd + one_sec)
                      return (gp.axis_distance_km - gm.axis_distance_km) / 2.0

                  g_ref = engine.geometry_at_utc_jd(ref_jd)
                  g_calc = engine.geometry_at_utc_jd(calc_jd)
                  ref_rate = axis_rate(ref_jd)
                  calc_rate = axis_rate(calc_jd)
                  axis_delta = g_calc.axis_distance_km - g_ref.axis_distance_km

                  print(
                      f"{label[:35]:<36} {de_res:+8.3f}s "
                      f"{g_ref.axis_distance_km:12.6f} {g_calc.axis_distance_km:12.6f} "
                      f"{axis_delta:+10.6f} {ref_rate:+12.6f} {calc_rate:+13.6f}"
                  )

                  print(
                      f"{'':36} "
                      f"core(ref/calc)={g_ref.core_radius_km:.6f}/{g_calc.core_radius_km:.6f} km  "
                      f"margin(ref/calc)={g_ref.eclipse_margin_km:.6f}/{g_calc.eclipse_margin_km:.6f} km"
                  )

              def summarize(label, values):
                  if not values:
                      return
                  abs_values = [abs(v) for v in values]
                  print(
                      f"{label:<12} n={len(values):2d}  "
                      f"mean signed={statistics.fmean(values):+7.3f}s  "
                      f"mean |err|={statistics.fmean(abs_values):7.3f}s  "
                      f"max |err|={max(abs_values):7.3f}s"
                  )

              print()
              print("DE441 TIMING ACCURACY SUMMARY")
              print("-" * 72)
              summarize("historical", historical_residuals)
              summarize("future", future_residuals)
              summarize("all", de441_residuals)
              print()
              print("Interpretation:")
              print("- dA/dt(calc) near zero means the search/minimizer is doing its job.")
              print("- If dA/dt(calc) is near zero but dA/dt(ref) is not, the remaining timing residual is geometric/model disagreement, not the solver.")
              print("- If dA/dt(calc) is materially nonzero, inspect the event-search/minimizer.")
              print("- Acalc should be <= Aref when the calculated instant is the minimum of this engine's own geometry.")
          finally:
              eclipse_engine.sun_vector_j2000 = original_sun
              spice.kclear()
          PY

      - name: Show audit output
        if: always()
        run: cat de441-eclipse-full-audit.txt || true

      - name: Upload audit artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: de441-eclipse-full-audit
          path: Star-Almanack-Repo/de441-eclipse-full-audit.txt
          if-no-files-found: error
          retention-days: 7
