name: W36 Refactor Equivalence Test

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compare:
    runs-on: ubuntu-latest
    steps:
      - name: Check out current refactored repository
        uses: actions/checkout@v4
        with:
          path: refactored

      - name: Check out pre-extraction monolithic repository
        uses: actions/checkout@v4
        with:
          ref: 9304a31469172046f2844578662d1900bda61105
          path: monolithic

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Restore JPL/NAIF ephemeris source cache
        uses: actions/cache@v4
        with:
          path: |
            .cache/skyfield/de440s.bsp
            .cache/skyfield/ceres_1900_2100.bsp
          key: star-almanack-source-kernels-v1

      - name: Install pinned calculation dependencies
        run: |
          python -m pip install --disable-pip-version-check --upgrade pip
          python -m pip install --disable-pip-version-check 'numpy==1.26.4' 'skyfield==1.55'

      - name: Ensure cached source kernels
        working-directory: refactored
        env:
          STAR_ALMANACK_EPHEMERIS_DIR: ${{ github.workspace }}/.cache/skyfield
        run: python tools/ensure_ephemeris_kernels.py --ceres

      - name: Run monolithic W36
        working-directory: monolithic
        env:
          STAR_ALMANACK_EPHEMERIS_DIR: ${{ github.workspace }}/.cache/skyfield
        run: python tools/generate_planet_finders.py --year 2026 --week 36

      - name: Run refactored W36
        working-directory: refactored
        env:
          STAR_ALMANACK_EPHEMERIS_DIR: ${{ github.workspace }}/.cache/skyfield
        run: python tools/generate_planet_finders.py --start-week 2026-W36 --end-week 2026-W36

      - name: Compare W36 Planet Finder output
        run: |
          set -e
          echo '=== Comparing generated W36 tree ==='
          if diff -ru --exclude='.git' monolithic/almanack/2026/W36 refactored/almanack/2026/W36; then
            echo 'PASS: W36 outputs are byte-for-byte identical.'
          else
            echo 'FAIL: W36 outputs differ.'
            exit 1
          fi
