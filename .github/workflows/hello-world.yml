name: W02 Diagnostic Test

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Restore JPL/NAIF ephemeris source cache
        uses: actions/cache@v4
        with:
          path: |
            .cache/skyfield/de440s.bsp
            .cache/skyfield/ceres_1900_2100.bsp
          key: star-almanack-source-kernels-v1

      - name: Install pinned calculation dependencies
        run: |
          python -m pip install --disable-pip-version-check --upgrade pip
          python -m pip install --disable-pip-version-check 'numpy==1.26.4' 'skyfield==1.55'

      - name: Ensure cached DE440s and Ceres source kernels
        run: python tools/ensure_ephemeris_kernels.py --ceres

      - name: Instrument forward-check dead body
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('tools/generate_planet_finders.py')
          text = p.read_text()
          old = (
              '            else:\n'
              '                body_stat["dead"] += 1\n'
              '                forward_stats["pruned"] += 1\n'
              '                return False\n'
          )
          new = (
              '            else:\n'
              '                body_stat["dead"] += 1\n'
              '                forward_stats["pruned"] += 1\n'
              '                print(f"FORWARD-CHECK DEAD future_body={future_name} future_depth={future_depth} next_depth={next_depth} raw_probes={witness_raw}", flush=True)\n'
              '                return False\n'
          )
          if old not in text:
              raise SystemExit('forward-check return block not found')
          p.write_text(text.replace(old, new, 1))
          PY

      - name: Run W02 Planet Finder diagnostic
        shell: bash
        env:
          STAR_ALMANACK_EPHEMERIS_DIR: ${{ github.workspace }}/.cache/skyfield
        run: |
          set -o pipefail
          python tools/generate_planet_finders.py --year 2026 --week 2 2>&1 | tee w02-forward-check.log
