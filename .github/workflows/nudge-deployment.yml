name: Nudge Deployment

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Nudge deployment on AWS
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.AWS_HOST }}
          username: ${{ secrets.AWS_USER }}
          key: ${{ secrets.AWS_SSH_KEY }}
          script: |
            ~/build-alex.sh

            echo
            echo '=== Deployment diagnostics ==='
            echo '--- Git HEAD ---'
            cd /var/www/AlexanderFerrariMiller
            git rev-parse HEAD || true

            echo '--- Jekyll destination ---'
            realpath /var/www/AlexanderFerrariMiller/_site || true
            ls -ld /var/www/AlexanderFerrariMiller/_site || true

            echo '--- Rendered Kilroy Sightings ---'
            RENDERED=/var/www/AlexanderFerrariMiller/_site/kilroy/kilroy-sightings.html
            if [ -f "$RENDERED" ]; then
              sha256sum "$RENDERED" || true
              grep -nE 'Wartime Kilroy|Kilroy Remembered|Kilroy Lives On|Legends of Kilroy|The Trail Continues' "$RENDERED" || true
            else
              echo "MISSING: $RENDERED"
            fi

            echo '--- Apache virtual hosts ---'
            apache2ctl -S 2>&1 || true

            echo '--- Apache DocumentRoot directives ---'
            grep -RHiE '^[[:space:]]*DocumentRoot[[:space:]]+' /etc/apache2/sites-enabled /etc/apache2/sites-available 2>/dev/null || true

            echo '--- Candidate web roots ---'
            for d in /var/www/html /var/www/AlexanderFerrariMiller /var/www/AlexanderFerrariMiller/_site; do
              if [ -e "$d" ]; then
                echo "$d -> $(realpath "$d" 2>/dev/null || echo '?')"
                ls -ld "$d" || true
              fi
            done

            echo '--- Local HTTP response headers ---'
            curl -sSI -H 'Host: alexanderferrarimiller.com' http://127.0.0.1/kilroy/kilroy-sightings.html || true

            echo '--- Local HTTPS rendered response ---'
            LIVE=/tmp/kilroy-sightings-live-https.html
            curl -ksS --resolve alexanderferrarimiller.com:443:127.0.0.1 \
              https://alexanderferrarimiller.com/kilroy/kilroy-sightings.html \
              -o "$LIVE" || true
            if [ -f "$LIVE" ]; then
              sha256sum "$LIVE" || true
              grep -nE 'Wartime Kilroy|Kilroy Remembered|Kilroy Lives On|Legends of Kilroy|The Trail Continues' "$LIVE" || true
            fi

            echo '--- Rendered-vs-local-HTTPS comparison ---'
            if [ -f "$RENDERED" ] && [ -f "$LIVE" ]; then
              cmp -s "$RENDERED" "$LIVE" && echo 'MATCH: Apache HTTPS serves the Jekyll-rendered file byte-for-byte.' || echo 'MISMATCH: Apache HTTPS is not serving the Jekyll-rendered file.'
            fi

            echo '=== End diagnostics ==='
