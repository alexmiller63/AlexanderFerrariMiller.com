name: AA- Test Planet Finder Conjunctions

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install test dependencies
        run: python -m pip install pytest skyfield

      - name: Run W36 Latin and Mixed exact regressions
        env:
          PYTHONPATH: tools
          PLANET_FINDER_DIAGNOSTIC_LEVEL: "2"
        run: |
          python -m pytest -q -s \
            'tests/test_planet_finder_ultimate_ladders.py::test_exact_w36_regression[latin]' \
            'tests/test_planet_finder_ultimate_ladders.py::test_exact_w36_regression[mixed]'
