name: Test Planet Finder Conjunctions

on:
  workflow_dispatch:
  push:
    paths:
      - "tools/planet_finder_geometry.py"
      - "tools/planet_finder_search.py"
      - "tools/planet_finder_search_core.py"
      - "tests/test_planet_finder_conjunctions.py"
      - "tests/test_planet_finder_system.py"
      - ".github/workflows/test-planet-finder-conjunctions.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install test dependencies
        run: python -m pip install pytest skyfield

      - name: Compile Planet Finder search controller
        run: python -m py_compile tools/planet_finder_search.py tools/planet_finder_search_core.py

      - name: Run isolated Greek W2 Venus-Sun conjunction regression
        env:
          PYTHONPATH: tools
          PLANET_FINDER_DIAGNOSTIC_LEVEL: "2"
        run: python -m pytest -q -s 'tests/test_planet_finder_system.py::test_level_30_progressive_real_w02_greek_breakpoint[venus-sun-conjunction]'
