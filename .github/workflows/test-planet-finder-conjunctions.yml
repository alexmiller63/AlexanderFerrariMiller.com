name: Test Planet Finder Conjunctions

on:
  workflow_dispatch:
  push:
    paths:
      - "tools/planet_finder_geometry.py"
      - "tests/test_planet_finder_conjunctions.py"
      - ".github/workflows/test-planet-finder-conjunctions.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pytest
        run: python -m pip install pytest

      - name: Run conjunction unit tests
        env:
          PYTHONPATH: tools
        run: python -m pytest -q tests/test_planet_finder_conjunctions.py
