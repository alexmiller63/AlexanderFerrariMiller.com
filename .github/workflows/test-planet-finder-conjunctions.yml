name: AA- Test Planet Finder Conjunctions

on:
  workflow_dispatch:
  push:
    paths:
      - "tools/planet_finder_geometry.py"
      - "tools/planet_finder_search*.py"
      - "tools/planet_finder_validation.py"
      - "tests/test_planet_finder_system.py"
      - "tests/test_planet_finder_ultimate_ladders.py"
      - ".github/workflows/test-planet-finder-conjunctions.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install test dependencies
        run: python -m pip install pytest skyfield

      - name: Run progressive W01, W02, W36 regression suite
        env:
          PYTHONPATH: tools
        run: |
          python -m pytest -q -s \
            tests/test_planet_finder_ultimate_ladders.py::test_ultimate_w01_ladder \
            tests/test_planet_finder_ultimate_ladders.py::test_ultimate_w02_ladder \
            tests/test_planet_finder_ultimate_ladders.py::test_exact_w36_regression
