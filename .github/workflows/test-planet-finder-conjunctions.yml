name: AA- Test Planet Finder Conjunctions

on:
  workflow_dispatch:
  push:
    paths:
      - "tools/planet_finder_geometry.py"
      - "tools/planet_finder_search.py"
      - "tools/planet_finder_search_core.py"
      - "tests/test_planet_finder_conjunctions.py"
      - "tests/test_planet_finder_system.py"
      - "tests/test_planet_finder_w01_ladder.py"
      - ".github/workflows/test-planet-finder-conjunctions.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install test dependencies
        run: python -m pip install pytest skyfield

      - name: Compile Planet Finder search controller
        run: python -m py_compile tools/planet_finder_search.py tools/planet_finder_search_core.py

      - name: Run original Planet Finder QA ladder
        env:
          PYTHONPATH: tools
          PLANET_FINDER_DIAGNOSTIC_LEVEL: "3"
        run: |
          set +e
          python -m pytest -q -s tests/test_planet_finder_conjunctions.py tests/test_planet_finder_system.py 2>&1 | tee planet-finder-test.log
          status=${PIPESTATUS[0]}
          echo "$status" > planet-finder-test.status
          exit "$status"

      - name: Write Planet Finder diagnostic summary
        if: always()
        shell: python
        run: |
          import os
          import re
          from collections import Counter
          from pathlib import Path

          log_path = Path("planet-finder-test.log")
          text = log_path.read_text(errors="replace") if log_path.exists() else ""
          lines = text.splitlines()

          categories = [
              ("immutable-reserved", r"immutable-reserved=(\d[\d,]*)"),
              ("immutable-rim", r"immutable-rim=(\d[\d,]*)"),
              ("placed-overlap", r"placed-overlap=(\d[\d,]*)"),
              ("existing-leader", r"existing-leader=(\d[\d,]*)"),
              ("route", r"route=(\d[\d,]*)"),
              ("leader-rim", r"leader-rim=(\d[\d,]*)"),
              ("leader-graze", r"leader-graze=(\d[\d,]*)"),
          ]

          # Preserve every diagnostic category even when its observed count is 0.
          totals = {name: 0 for name, _ in categories}
          for name, pattern in categories:
              totals[name] = sum(
                  int(value.replace(",", ""))
                  for value in re.findall(pattern, text)
              )

          terminal_errors = Counter()
          for match in re.finditer(r"terminal_validation\[checks=[^\]]*\]", text):
              block = match.group(0)
              for key, value in re.findall(r"([A-Za-z0-9_.:/ -]+)=(\d[\d,]*)", block):
                  key = key.strip()
                  if key not in {"checks", "rejected"}:
                      terminal_errors[key] += int(value.replace(",", ""))

          # Lambda-order failures are reported explicitly.  Count assertion/error
          # lines mentioning lambda/order rather than hiding a clean zero.
          lambda_failure_lines = [
              line for line in lines
              if re.search(r"lambda|λ", line, re.I)
              and re.search(r"fail|error|assert|order", line, re.I)
          ]
          lambda_failures = len(lambda_failure_lines)

          terminal = [line for line in lines if "TERMINAL " in line]
          capped = [line for line in lines if "CAPPED SUMMARY" in line]
          body_lines = [line for line in lines if "TERMINAL BODY" in line]
          deepest = []
          for line in terminal + capped:
              m = re.search(r"deepest=(\d+)/(\d+)", line)
              if m:
                  deepest.append((int(m.group(1)), int(m.group(2)), line))

          failed_tests = [line for line in lines if line.startswith("FAILED ")]
          status = Path("planet-finder-test.status").read_text().strip() if Path("planet-finder-test.status").exists() else "unknown"

          out = []
          out.append("# Planet Finder QA diagnostic summary")
          out.append("")
          out.append(f"**pytest exit status:** `{status}`")
          out.append(f"**lambda-order failures:** `{lambda_failures}`")
          if deepest:
              best = max(deepest, key=lambda item: item[0])
              out.append(f"**deepest search reached:** `{best[0]}/{best[1]}`")
          out.append("")
          out.append("## Geometry rejection totals")
          out.append("")
          out.append("| rejection | count |")
          out.append("|---|---:|")
          for name, _ in categories:
              out.append(f"| {name} | {totals[name]:,} |")
          out.append(f"| lambda-order | {lambda_failures:,} |")
          out.append("")
          out.append("## Terminal validation failures")
          out.append("")
          if terminal_errors:
              out.append("| validation error | count |")
              out.append("|---|---:|")
              for name, count in terminal_errors.most_common():
                  out.append(f"| {name} | {count:,} |")
          else:
              out.append("None recorded.")
          out.append("")
          out.append("## Failed tests")
          out.append("")
          out.extend(f"- `{line}`" for line in failed_tests) if failed_tests else out.append("None.")
          out.append("")
          out.append("## Per-body terminal diagnostics")
          out.append("")
          if body_lines:
              out.append("```text")
              out.extend(body_lines[-80:])
              out.append("```")
          else:
              out.append("No terminal-body diagnostics recorded.")
          out.append("")
          out.append("## Terminal / capped search summaries")
          out.append("")
          if terminal or capped:
              out.append("```text")
              out.extend((terminal + capped)[-80:])
              out.append("```")
          else:
              out.append("No terminal or capped search summary recorded.")

          summary = os.environ.get("GITHUB_STEP_SUMMARY")
          if summary:
              with open(summary, "a", encoding="utf-8") as f:
                  f.write("\n".join(out) + "\n")
          else:
              print("\n".join(out))
