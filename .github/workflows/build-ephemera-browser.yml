name: Build Ephemera Browser Runtime

on:
  push:
    branches: [ephemera-browser-release-20261022]
    paths:
      - '.github/workflows/build-ephemera-browser.yml'
      - 'tools/build_ephemera_browser.py'
      - 'tools/generate_observer_ephemera.py'
      - 'tools/star_almanack_ephemeris.py'
      - 'tools/almanack_time.py'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ephemera-browser-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/cache@v4
        with:
          path: |
            .cache/ephemera-browser
            .cache/skyfield
          key: ephemera-browser-pyodide-0.27.7-v1
      - name: Build bundled Python runtime, city list and source kernels
        run: python -u tools/build_ephemera_browser.py
      - name: Verify observer calculations
        run: |
          python -m pip install 'skyfield==1.55'
          PYTHONPATH=tools python -m unittest tools/test_observer_ephemera.py tools/test_almanack_time.py -v
      - name: Commit generated browser assets
        env:
          BUILD_BRANCH: ${{ github.ref_name }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add star-almanack/assets/ephemera/
          if ! git diff --cached --quiet; then
            git commit -m 'Build self-hosted ephemera browser assets'
            git push origin "HEAD:$BUILD_BRANCH"
          fi
