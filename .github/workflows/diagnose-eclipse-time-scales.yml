name: Diagnose Eclipse Time Scales

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose-eclipse-time-scales:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Star-Almanack-Repo

    steps:
      - name: Check out Star Almanack
        uses: actions/checkout@v6

      - name: Verify validated DE441 microkernel
        run: |
          test -s star-almanack-microkernel.bsp
          ls -lh star-almanack-microkernel.bsp

      - name: Verify preserved NAIF leap-seconds kernel
        run: |
          test -s kernels/naif0012.tls
          ls -lh kernels/naif0012.tls

      - name: Install Python dependencies
        run: python3 -m pip install --disable-pip-version-check spiceypy pyyaml

      - name: Bootstrap ELP2000-82B archive
        working-directory: Star-Almanack-Repo/star-almanack-elp82b
        run: |
          python lunar_elp.py bootstrap data/elp82b
          python lunar_elp.py verify data/elp82b
          python normalize_elp82b.py data/elp82b elp82b-manifest.json

      - name: Instrument UTC, TDB, and greatest-eclipse geometry
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY' 2>&1 | tee eclipse-time-scale-diagnostic.txt
          from __future__ import annotations

          from datetime import datetime, timedelta, timezone
          import spiceypy as spice
          import yaml
          import eclipse_engine

          KERNEL = "star-almanack-microkernel.bsp"
          LSK = "kernels/naif0012.tls"
          J2000 = 2451545.0
          SECONDS_PER_DAY = 86400.0

          def parse_iso_z(text: str) -> datetime:
              return datetime.fromisoformat(text.replace("Z", "+00:00")).astimezone(timezone.utc)

          def datetime_to_jd(dt: datetime) -> float:
              dt = dt.astimezone(timezone.utc)
              hour = dt.hour + dt.minute / 60.0 + dt.second / 3600.0 + dt.microsecond / 3_600_000_000.0
              return eclipse_engine.gregorian_to_jd(dt.year, dt.month, dt.day, hour)

          def jd_to_datetime(jd: float) -> datetime:
              return datetime(2000, 1, 1, 12, tzinfo=timezone.utc) + timedelta(days=jd - J2000)

          def jd_to_spice_utc(jd: float) -> str:
              return jd_to_datetime(jd).strftime("%Y-%m-%dT%H:%M:%S.%f")

          def signed_seconds(a: str, b: str) -> float:
              return (parse_iso_z(a) - parse_iso_z(b)).total_seconds()

          def de441_sun_geometric(jd_tdb: float) -> eclipse_engine.Vec3:
              et = (jd_tdb - J2000) * SECONDS_PER_DAY
              pos, _ = spice.spkpos("SUN", et, "ECLIPJ2000", "NONE", "EARTH")
              return eclipse_engine.Vec3(float(pos[0]), float(pos[1]), float(pos[2]))

          def spice_tdb_jd_from_utc_jd(jd_utc: float) -> float:
              et = spice.str2et(jd_to_spice_utc(jd_utc))
              return J2000 + et / SECONDS_PER_DAY

          spice.furnsh(LSK)
          spice.furnsh(KERNEL)

          original_sun = eclipse_engine.sun_vector_j2000
          original_time = eclipse_engine.utc_to_tdb_approx

          with open("eclipse-validation-cases.yaml", "r", encoding="utf-8") as handle:
              spec = yaml.safe_load(handle)

          cases = []
          for case in spec["historical"]:
              if case.get("expected_greatest_utc"):
                  cases.append((case["label"], case["date_utc"], case["expected_greatest_utc"]))
          for case in spec["future_jello"]["cases"]:
              if case.get("nasa_greatest_utc"):
                  cases.append((case["label"], case["date_utc"], case["nasa_greatest_utc"]))

          print("STAR ALMANACK — ECLIPSE TIME-SCALE ISOLATION")
          print("Sun: DE441 geometric; Moon: production ELP2000-82B")
          print("A = current engine UTC->TDB approximation")
          print("B = NAIF SPICE UTC->TDB")
          print()
          print(f"{'Case':<36} {'A current':>11} {'B SPICE':>11} {'B-A':>9} {'eng-SPICE':>12}")
          print("-" * 86)

          try:
              eclipse_engine.sun_vector_j2000 = de441_sun_geometric
              engine = eclipse_engine.EclipseEngine()

              for label, date_utc, reference_utc in cases:
                  eclipse_engine.utc_to_tdb_approx = original_time
                  event_a = engine.find_solar_eclipse(date_utc)
                  calc_jd_a = event_a.greatest_jd_utc
                  geom_a = engine.geometry_at_utc_jd(calc_jd_a)
                  spice_tdb_a = spice_tdb_jd_from_utc_jd(calc_jd_a)

                  eclipse_engine.utc_to_tdb_approx = spice_tdb_jd_from_utc_jd
                  event_b = engine.find_solar_eclipse(date_utc)

                  ar = signed_seconds(event_a.greatest_utc, reference_utc)
                  br = signed_seconds(event_b.greatest_utc, reference_utc)
                  ba = signed_seconds(event_b.greatest_utc, event_a.greatest_utc)
                  eng_spice = (geom_a.jd_tdb_approx - spice_tdb_a) * SECONDS_PER_DAY
                  print(f"{label[:35]:<36} {ar:+10.3f}s {br:+10.3f}s {ba:+8.3f}s {eng_spice:+11.3f}s")

              print()
              print("Interpretation:")
              print("- If B collapses the residuals, the UTC->TDB/JD path is isolated.")
              print("- If B does not materially improve them, inspect Sun geometry/reference convention next.")
          finally:
              eclipse_engine.sun_vector_j2000 = original_sun
              eclipse_engine.utc_to_tdb_approx = original_time
              spice.kclear()
          PY

      - name: Show diagnostic output
        if: always()
        run: cat eclipse-time-scale-diagnostic.txt || true

      - name: Upload diagnostic
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eclipse-time-scale-diagnostic
          path: Star-Almanack-Repo/eclipse-time-scale-diagnostic.txt
          if-no-files-found: error
          retention-days: 7
