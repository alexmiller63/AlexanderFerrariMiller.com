name: Verify Tracking and Restart Weeks 1-10

on:
  push:
    branches: [main]
    paths: [.github/workflows/verify-tracking-restart-w01-w10.yml]
  workflow_dispatch:

permissions:
  contents: read
  actions: write

jobs:
  verify-and-restart:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Verify real Scaffold dispatch and completion
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          bash tools/run-workflow-and-wait.sh scaffold-almanack-weeks.yml \
            -f start_year=2026 -f start_week=1 -f end_year=2026 -f end_week=1
      - name: Restart weeks 1 through 10 with corrected tracking
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh workflow run weekly-build-all.yml --repo "$GITHUB_REPOSITORY" --ref main \
            -f start_year=2026 -f start_week=1 -f end_year=2026 -f end_week=10 \
            -f candidate_layouts=5 -f max_node_candidates=200 \
            -f max_search_seconds=360 -f diagnostic_level=1
