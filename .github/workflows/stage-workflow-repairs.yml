name: Stage Repaired Star Almanack Workflows

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/stage-workflow-repairs.yml

permissions:
  contents: write

jobs:
  stage:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Prepare repaired workflows as ordinary staging files
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          import shutil

          root = Path.cwd()
          src = root / ".github/workflows"
          out = root / "workflow-migration-staging"
          if out.exists():
              shutil.rmtree(out)
          out.mkdir(parents=True)
          temporary = {
              "complete-star-almanack-migration.yml",
              "stage-workflow-repairs.yml",
          }

          def repair_text(text: str) -> str:
              text = text.replace("Star-Almanack-Repo/", "")
              text = text.replace("Historical/", "")
              text = re.sub(r"\s*/\s*(['\"])(?:Historical|Star-Almanack-Repo)\1", "", text)
              return text

          count = 0
          for path in sorted(src.glob("*.y*ml")):
              if path.name in temporary:
                  continue
              text = repair_text(path.read_text(encoding="utf-8"))
              if path.name == "audit-fixed-object-identity.yml":
                  text = re.sub(
                      r"\n\s*- name: Build permanent fixed-object registry\n\s*run: python tools/build_fixed_object_registry\.py\n",
                      "\n",
                      text,
                  )
                  text = text.replace("Commit audit and registry results", "Commit audit results")
                  text = text.replace(" database/fixed-object-registry.json", "")
                  text = text.replace("Identity audit and registry are already current.", "Identity audit is already current.")
                  text = text.replace("Update fixed-object identity audit and registry", "Update fixed-object identity audit")
              if "Historical/" in text or "Star-Almanack-Repo/" in text:
                  raise SystemExit(f"Unrepaired backup path in {path.name}")
              (out / path.name).write_text(text, encoding="utf-8")
              count += 1
          print(f"Staged {count} repaired workflows")
          PY

      - name: Commit staging blobs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add workflow-migration-staging
          git commit -m "Stage repaired workflow blobs"
          git push
