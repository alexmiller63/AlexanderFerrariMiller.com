name: Add Planet Finder search budget

on:
  push:
    paths:
      - '.github/workflows/add-planet-finder-search-budget.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Add bounded recursive search guard
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('tools/generate_planet_finders.py')
          text = path.read_text(encoding='utf-8')

          old = '''def _solve_order(mode: str, bodies, order):
              """Solve one complete placement pass in the supplied body order."""
              reserved = reserved_boxes(mode)
              staged = {}
              placed: list[Box] = []
              leaders: list[list[tuple[float, float]]] = []

              def solve(position: int) -> bool:
                  if position == len(order):
                      return True
'''
          new = '''def _solve_order(mode: str, bodies, order):
              """Solve one complete placement pass with a bounded search budget."""
              reserved = reserved_boxes(mode)
              staged = {}
              placed: list[Box] = []
              leaders: list[list[tuple[float, float]]] = []
              search_nodes = 0
              max_search_nodes = 1_000_000

              def solve(position: int) -> bool:
                  nonlocal search_nodes
                  search_nodes += 1
                  if search_nodes > max_search_nodes:
                      raise RuntimeError(
                          f"Planet Finder search budget exhausted in {mode} mode "
                          f"after {max_search_nodes:,} recursive nodes"
                      )
                  if position == len(order):
                      return True
'''
          if old not in text:
              raise SystemExit('Expected _solve_order header not found; refusing blind modification')
          text = text.replace(old, new, 1)

          old2 = '''        solved, result = _solve_order(mode, bodies, order)
        if solved:
            return result
'''
          new2 = '''        try:
            solved, result = _solve_order(mode, bodies, order)
        except RuntimeError as exc:
            if "search budget exhausted" in str(exc):
                raise RuntimeError(
                    f"Planet Finder search budget exhausted in {mode} mode "
                    f"while trying {bodies[start][1]} first"
                ) from exc
            raise
        if solved:
            return result
'''
          if old2 not in text:
              raise SystemExit('Expected layout solver call not found; refusing blind modification')
          text = text.replace(old2, new2, 1)

          path.write_text(text, encoding='utf-8')
          PY

      - name: Syntax check
        run: python -m py_compile tools/generate_planet_finders.py

      - name: Commit guard and remove fixer
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tools/generate_planet_finders.py
          git rm .github/workflows/add-planet-finder-search-budget.yml
          git commit -m 'Bound Planet Finder recursive search'
          git push origin HEAD:main
