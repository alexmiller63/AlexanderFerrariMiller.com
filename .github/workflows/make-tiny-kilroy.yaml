name: Make tiny Kilroy GIF

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  make-gif:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Pillow
        run: python -m pip install pillow

      - name: Create static 120px GIF
        run: |
          python - <<'PY'
          from PIL import Image
          from pathlib import Path

          src = Path("kilroy/images/IMG_2173.PNG")
          dst = Path("kilroy/images/tiny-kilroy.gif")

          with Image.open(src) as image:
              width = 120
              height = round(image.height * width / image.width)
              image = image.convert("RGB").resize((width, height), Image.Resampling.LANCZOS)
              image.save(dst, format="GIF", optimize=True)

          with Image.open(dst) as check:
              assert check.width == 120
              assert getattr(check, "n_frames", 1) == 1
              print(f"Created {dst}: {check.size}, 1 frame")
          PY

      - name: Commit GIF and remove one-off workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add kilroy/images/tiny-kilroy.gif
          git rm .github/workflows/make-tiny-kilroy.yaml
          git commit -m "Create tiny Kilroy GIF"
          git push
