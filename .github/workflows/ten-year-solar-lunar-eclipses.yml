name: Ten-Year Solar and Lunar Eclipses
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check pyyaml
      - name: Prepare local lunar coefficients
        working-directory: star-almanack-elp82b
        run: |
          set -euo pipefail
          python lunar_elp.py bootstrap data/elp82b
          python lunar_elp.py verify data/elp82b
          python normalize_elp82b.py data/elp82b elp82b-manifest.json
      - name: Discover eclipses with live log
        run: python -u tools/generate_decade_eclipses.py --start-year 2026 --end-year 2035
      - name: Save catalogs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ten-year-eclipses
          path: generated/eclipse-catalog/
          if-no-files-found: warn
