name: Weekly Build All

on:
  workflow_dispatch:
    inputs:
      start_year:
        description: Start ISO year
        required: true
        default: '2026'
        type: string
      start_week:
        description: Start ISO week
        required: true
        default: '36'
        type: string
      end_year:
        description: End ISO year
        required: true
        default: '2026'
        type: string
      end_week:
        description: End ISO week
        required: true
        default: '40'
        type: string

permissions:
  contents: read
  actions: write

concurrency:
  group: weekly-build-all
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Scaffold
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          bash tools/run-workflow-and-wait.sh scaffold-almanack-weeks.yml \
            -f start_year='${{ inputs.start_year }}' -f start_week='${{ inputs.start_week }}' \
            -f end_year='${{ inputs.end_year }}' -f end_week='${{ inputs.end_week }}'

      - name: Calendar
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          bash tools/run-workflow-and-wait.sh populate-calendar-by-date.yml \
            -f start_year='${{ inputs.start_year }}' -f start_week='${{ inputs.start_week }}' \
            -f end_year='${{ inputs.end_year }}' -f end_week='${{ inputs.end_week }}'

      - name: Ephemeris
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          bash tools/run-workflow-and-wait.sh populate-ephemeris-by-date.yml \
            -f start_year='${{ inputs.start_year }}' -f start_week='${{ inputs.start_week }}' \
            -f end_year='${{ inputs.end_year }}' -f end_week='${{ inputs.end_week }}'

      - name: Planet Finder
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          bash tools/run-workflow-and-wait.sh populate-ephemeris-planet-finder-by-date.yml \
            -f start_year='${{ inputs.start_year }}' -f start_week='${{ inputs.start_week }}' \
            -f end_year='${{ inputs.end_year }}' -f end_week='${{ inputs.end_week }}'

      - name: Sky Notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          bash tools/run-workflow-and-wait.sh populate-sky-notes-by-date.yml \
            -f start_year='${{ inputs.start_year }}' -f start_week='${{ inputs.start_week }}' \
            -f end_year='${{ inputs.end_year }}' -f end_week='${{ inputs.end_week }}'

      - name: Artwork
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          bash tools/run-workflow-and-wait.sh populate-sky-notes-artwork-by-date.yml \
            -f start_year='${{ inputs.start_year }}' -f start_week='${{ inputs.start_week }}' \
            -f end_year='${{ inputs.end_year }}' -f end_week='${{ inputs.end_week }}'

      - name: Legend
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          bash tools/run-workflow-and-wait.sh wire-almanack-legend.yml \
            -f start_year='${{ inputs.start_year }}' -f start_week='${{ inputs.start_week }}' \
            -f end_year='${{ inputs.end_year }}' -f end_week='${{ inputs.end_week }}'
