name: Weekly Build All

on:
  workflow_call:
    inputs:
      start_year:
        type: string
        required: false
        default: '2026'
      start_week:
        type: string
        required: false
        default: '36'
      end_year:
        type: string
        required: false
        default: '2026'
      end_week:
        type: string
        required: false
        default: '40'
      resume_stage:
        type: string
        required: false
        default: Scaffold
      resume_completed_weeks:
        type: boolean
        required: false
        default: false
      candidate_layouts:
        type: string
        required: false
        default: '1'
      max_node_candidates:
        type: string
        required: false
        default: '200'
      max_search_seconds:
        type: string
        required: false
        default: '360'
      diagnostic_level:
        type: string
        required: false
        default: '1'
  workflow_dispatch:
    inputs:
      start_year:
        description: Start ISO year
        required: true
        default: '2026'
        type: string
      start_week:
        description: Start ISO week
        required: true
        default: '36'
        type: string
      end_year:
        description: End ISO year
        required: true
        default: '2026'
        type: string
      end_week:
        description: End ISO week
        required: true
        default: '40'
        type: string
      resume_stage:
        description: Start at this stage for a partially completed week (manual verification required)
        required: true
        default: 'Scaffold'
        type: choice
        options:
          - Scaffold
          - Calendar
          - Ephemeris
          - Planet Finder
          - Sky Notes
          - Artwork
          - Legend
          - Story structural audit
          - Deployment
      resume_completed_weeks:
        description: Skip weeks previously marked COMPLETE (use only when prior outputs remain valid)
        required: true
        default: false
        type: boolean
      candidate_layouts:
        description: Planet Finder complete layouts to score per mode
        required: true
        default: '1'
        type: string
      max_node_candidates:
        description: Planet Finder maximum DFS node visits per body depth
        required: true
        default: '200'
        type: string
      max_search_seconds:
        description: Planet Finder search time per mode
        required: true
        default: '360'
        type: string
      diagnostic_level:
        description: Planet Finder diagnostic verbosity (0=silent, 1=major, 2=search, 3=forensic)
        required: true
        default: '1'
        type: string

permissions:
  contents: write
  actions: write

concurrency:
  group: weekly-build-all
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Inventory saved story structure (informational)
        run: python tools/story_audit.py --output generated/story-audit.json

      - name: Build, deploy, and structurally audit each week
        env:
          GH_TOKEN: ${{ github.token }}
          START_YEAR: ${{ inputs.start_year }}
          START_WEEK: ${{ inputs.start_week }}
          END_YEAR: ${{ inputs.end_year }}
          END_WEEK: ${{ inputs.end_week }}
        run: |
          mapfile -t WEEKS < <(
            read START_DATE END_DATE < <(python tools/resolve_iso_week_range.py \
              "$START_YEAR" "$START_WEEK" "$END_YEAR" "$END_WEEK")
            python - "$START_DATE" "$END_DATE" <<'PY'
          import sys
          from datetime import date
          from tools.iso_date_range import weeks_in_range
          for iso_week in weeks_in_range(date.fromisoformat(sys.argv[1]), date.fromisoformat(sys.argv[2])):
              print(iso_week.year, iso_week.week)
          PY
          )

          if [ "${#WEEKS[@]}" -eq 0 ]; then
            echo "::error::No ISO weeks were resolved from the requested range."
            exit 1
          fi

          echo "Resolved ${#WEEKS[@]} ISO week(s): ${WEEKS[*]}"

          total_stages=$((${#WEEKS[@]} * 9))
          completed_stages=0
          # Year-wide progress across the 52 chained weekly jobs (W02-W53).
          if [[ "$GITHUB_WORKFLOW" == "Continuous Build All 2026" && "$START_YEAR" == "2026" && "$END_YEAR" == "2026" ]]; then
            overall_total_stages=$((52 * 9))
            overall_base_stages=$(((10#$START_WEEK - 2) * 9))
          else
            overall_total_stages=$total_stages
            overall_base_stages=0
          fi

          # A checkpoint is written only after every stage, including deployment,
          # succeeds. Resume is opt-in because generator changes can invalidate
          # previously generated outputs.
          # Generator/workflow changes invalidate completed-week checkpoints.
          # Generated content and log commits do not change this fingerprint.
          source_fingerprint() {
            git ls-tree -r origin/main -- tools .github/workflows |
              sha256sum | cut -d' ' -f1
          }

          is_week_complete() {
            local target="$1" fingerprint
            git fetch origin main
            fingerprint="$(source_fingerprint)"
            git show origin/main:build-log.txt 2>/dev/null |
              grep -F " — COMPLETE $target — " |
              grep -F " — SOURCE_SHA256=$fingerprint" >/dev/null
          }

          # Append history across runs; refresh first because child workflows also commit.
          publish_log() {
            local entry="$1" attempt
            for attempt in 1 2 3 4 5; do
              git fetch origin main
              git reset --hard origin/main
              printf '%s\n' "$entry" >> build-log.txt
              printf '%s\n' "$entry" > build-status.txt
              git add build-log.txt build-status.txt
              git -c user.name='github-actions[bot]' \
                  -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
                  commit -m "Build All log: $week_label [skip ci]"
              if git push origin HEAD:main; then
                return 0
              fi
              # Replay this entry on the new tip without losing child commits.
            done
            echo "::error::Unable to save Build All log after five attempts."
            return 1
          }

          run_stage() {
            local workflow="$1" output child_pid child_rc run_id detail elapsed active_steps
            shift
            output="$(mktemp)"
            stage_started_at="$(date -u '+%Y-%m-%dT%H:%M:%SZ')"
            stage_started_seconds="$SECONDS"
            (
              for attempt in 1 2; do
                echo "Attempt $attempt/2 for $workflow"
                if bash tools/run-workflow-and-wait.sh "$workflow" "$@"; then exit 0; fi
                if [ "$attempt" -eq 2 ]; then exit 1; fi
                sleep 30
              done
            ) > "$output" 2>&1 &
            child_pid=$!
            while kill -0 "$child_pid" 2>/dev/null; do
              sleep 60
              if ! kill -0 "$child_pid" 2>/dev/null; then
                break
              fi
              run_id="$(sed -nE 's/^Found dispatched .* run ([0-9]+) .*/\1/p' "$output" | tail -n 1)"
              detail="$(tail -n 1 "$output")"
              if [[ -n "$run_id" ]]; then
                detail="https://github.com/$GITHUB_REPOSITORY/actions/runs/$run_id — $detail"
                # Best effort: an API failure must not hide the ongoing wait.
                active_steps="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run_id/jobs" \
                  --jq '[.jobs[] | .name as $job | .steps[]? | select(.status == "in_progress") | ($job + ": " + .name)] | join("; ")' 2>/dev/null || true)"
                if [[ -n "$active_steps" ]]; then
                  detail="$detail — $active_steps"
                fi
              fi
              elapsed=$((SECONDS - stage_started_seconds))
              report_progress WAITING "$current_stage" "$elapsed seconds elapsed — $detail"
            done
            if wait "$child_pid"; then
              child_rc=0
            else
              child_rc=$?
            fi
            cat "$output"
            detail="$(tail -n 1 "$output")"
            rm -f "$output"
            elapsed=$((SECONDS - stage_started_seconds))
            if [[ "$child_rc" -ne 0 ]]; then
              report_progress FAILED "$current_stage" "$elapsed seconds elapsed — $detail"
              return "$child_rc"
            fi
            completed_stages=$((completed_stages + 1))
            report_progress FINISHED "$current_stage" "$elapsed seconds elapsed — $detail"
          }

          report_progress() {
            local state="$1" stage="$2" detail="${3:-}" percent updated_at entry
            current_stage="$stage"
            percent=$(((overall_base_stages + completed_stages) * 100 / overall_total_stages))
            updated_at="$(date -u '+%Y-%m-%dT%H:%M:%SZ')"
            entry="$updated_at — RUN $GITHUB_RUN_ID/$GITHUB_RUN_ATTEMPT — $state $week_label — $percent% complete ($((overall_base_stages + completed_stages))/$overall_total_stages overall stages; $completed_stages/$total_stages this week) — $stage — WEEK STARTED $week_started_at${detail:+ — $detail}"
            printf '%s\n' "$entry"
            publish_log "$entry"
            {
              printf '### Build All: %s%% complete\n\n' "$percent"
              printf '%s of %s overall stages; %s of %s this week.\n\n' "$((overall_base_stages + completed_stages))" "$overall_total_stages" "$completed_stages" "$total_stages"
              printf '**%s — %s:** %s\n\n' "$week_label" "$state" "$stage"
              printf 'Week started: %s · Updated: %s\n\n' "$week_started_at" "$updated_at"
              printf 'Percentage counts completed stages; stages take different amounts of time.\n'
            } > "$GITHUB_STEP_SUMMARY"
          }

          # Stage resume is deliberately explicit: a previous successful job
          # does not prove that its output remains valid after source changes.
          case "${{ inputs.resume_stage }}" in
              "Scaffold") resume_index=0 ;;
              "Calendar") resume_index=1 ;;
              "Ephemeris") resume_index=2 ;;
              "Planet Finder") resume_index=3 ;;
              "Sky Notes") resume_index=4 ;;
              "Artwork") resume_index=5 ;;
              "Legend") resume_index=6 ;;
              "Story structural audit") resume_index=7 ;;
              "Deployment") resume_index=8 ;;
              *) echo "::error::Unknown resume stage"; exit 1 ;;
          esac
          if (( resume_index > 0 && ${#WEEKS[@]} != 1 )); then
            echo "::error::Partial-week resume requires a single-week range."
            exit 1
          fi
          if (( resume_index > 0 )); then
            echo "::warning::Manual stage resume selected. Verify earlier outputs and source compatibility before using this option."
          fi

          for week in "${WEEKS[@]}"; do
            read -r year iso_week <<< "$week"
            week_label="${year}-W$(printf '%02d' "$iso_week")"
            echo "::group::ISO ${week_label}"
            if [[ "${{ inputs.resume_completed_weeks }}" == "true" ]] && is_week_complete "$week_label"; then
              echo "Skipping previously completed $week_label (opt-in checkpoint resume)."
              completed_stages=$((completed_stages + 9))
              echo "::endgroup::"
              continue
            fi

            git fetch origin main
            git reset --hard origin/main
            week_started_at="$(date -u '+%Y-%m-%dT%H:%M:%SZ')"
            report_progress BUILDING "Scaffold"

            if (( resume_index <= 0 )); then
            run_stage scaffold-almanack-weeks.yml \
              -f start_year="$year" -f start_week="$iso_week" \
              -f end_year="$year" -f end_week="$iso_week"
            else
              completed_stages=$((completed_stages + 1))
              echo "Skipping previously verified stage: Scaffold"
            fi
            git fetch origin main
            git reset --hard origin/main
            report_progress BUILDING "Calendar"

            if (( resume_index <= 1 )); then
            run_stage calendar-generator.yml \
              -f start_year="$year" -f start_week="$iso_week" \
              -f end_year="$year" -f end_week="$iso_week"
            else
              completed_stages=$((completed_stages + 1))
              echo "Skipping previously verified stage: Calendar"
            fi
            git fetch origin main
            git reset --hard origin/main
            echo "Strict story preflight for $week_label after Calendar generation"
            python tools/story_audit.py --year "$year" --week "$iso_week" --output generated/story-audit.json --strict
            report_progress BUILDING "Ephemeris"

            if (( resume_index <= 2 )); then
            run_stage ephemeris-generator-by-date.yml \
              -f start_year="$year" -f start_week="$iso_week" \
              -f end_year="$year" -f end_week="$iso_week"
            else
              completed_stages=$((completed_stages + 1))
              echo "Skipping previously verified stage: Ephemeris"
            fi
            git fetch origin main
            git reset --hard origin/main
            report_progress BUILDING "Planet Finder"

            if (( resume_index <= 3 )); then
            run_stage populate-ephemeris-planet-finder-by-date.yml \
              -f start_year="$year" -f start_week="$iso_week" \
              -f end_year="$year" -f end_week="$iso_week" \
              -f candidate_layouts='1' \
              -f max_node_candidates='${{ inputs.max_node_candidates }}' \
              -f max_search_seconds='${{ inputs.max_search_seconds }}' \
              -f diagnostic_level='${{ inputs.diagnostic_level }}'
            else
              completed_stages=$((completed_stages + 1))
              echo "Skipping previously verified stage: Planet Finder"
            fi
            git fetch origin main
            git reset --hard origin/main
            report_progress BUILDING "Sky Notes"

            if (( resume_index <= 4 )); then
            run_stage populate-sky-notes-by-date.yml \
              -f start_year="$year" -f start_week="$iso_week" \
              -f end_year="$year" -f end_week="$iso_week"
            else
              completed_stages=$((completed_stages + 1))
              echo "Skipping previously verified stage: Sky Notes"
            fi
            git fetch origin main
            git reset --hard origin/main
            report_progress BUILDING "Artwork"

            if (( resume_index <= 5 )); then
            run_stage populate-sky-notes-artwork-by-date.yml \
              -f start_year="$year" -f start_week="$iso_week" \
              -f end_year="$year" -f end_week="$iso_week"
            else
              completed_stages=$((completed_stages + 1))
              echo "Skipping previously verified stage: Artwork"
            fi
            git fetch origin main
            git reset --hard origin/main
            report_progress BUILDING "Legend"

            if (( resume_index <= 6 )); then
            run_stage wire-almanack-legend.yml \
              -f start_year="$year" -f start_week="$iso_week" \
              -f end_year="$year" -f end_week="$iso_week"
            else
              completed_stages=$((completed_stages + 1))
              echo "Skipping previously verified stage: Legend"
            fi
            git fetch origin main
            git reset --hard origin/main

            # Quality gate: never deploy a week that fails its structural audit.
            report_progress BUILDING "Story structural audit"
            # Re-run the audit even on resumed builds: never trust an old pass.
            python tools/story_audit.py --year "$year" --week "$iso_week" --output generated/story-audit.json --strict
            completed_stages=$((completed_stages + 1))
            report_progress FINISHED "Story structural audit" "Automated structural checks passed; editorial approval remains separate"

            report_progress BUILDING "Deployment"
            # Deployment is best-effort: site deployment failures must never discard
            # a successfully generated/audited week or stop the continuous series.
            if run_stage deploy.yml; then
              deployment_state="deployment succeeded"
              git fetch origin main
              report_progress COMPLETE "Seven generator stages and structural audit finished; deployment succeeded; editorial approval not implied — SOURCE_SHA256=$(source_fingerprint)"
            else
              deployment_state="deployment failed after retries; continuing build series"
              report_progress DEPLOYMENT_DEFERRED "Deployment" "$deployment_state — generated outputs and structural audit are preserved; deployment can be retried separately"
              echo "::warning::Deployment failed for $week_label after retries. Continuing to the next week."
            fi

            echo "::endgroup::"
            # Give the deployment queue a chance to settle before the next week's
            # generator commits. This pause is not a deployment success condition.
            if [[ "$week" != "${WEEKS[-1]}" ]]; then
              report_progress PAUSED "Between-week cooldown" "Waiting 90 seconds before the next week; $deployment_state"
              sleep 90
            fi
          done

      - name: Preserve story audit report
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: story-audit-${{ github.run_id }}-${{ github.run_attempt }}
          path: generated/story-audit.json
          if-no-files-found: warn
          retention-days: 30
