name: Weekly Build All

on:
  workflow_dispatch:
    inputs:
      start_year:
        description: Start ISO year
        required: true
        default: '2026'
        type: string
      start_week:
        description: Start ISO week
        required: true
        default: '36'
        type: string
      end_year:
        description: End ISO year
        required: true
        default: '2026'
        type: string
      end_week:
        description: End ISO week
        required: true
        default: '40'
        type: string
      candidate_layouts:
        description: Planet Finder complete layouts to score per mode
        required: true
        default: '5'
        type: string
      max_node_candidates:
        description: Planet Finder maximum DFS node visits per body depth
        required: true
        default: '200'
        type: string
      max_search_seconds:
        description: Planet Finder search time per mode
        required: true
        default: '360'
        type: string
      diagnostic_level:
        description: Planet Finder diagnostic verbosity (0=silent, 1=major, 2=search, 3=forensic)
        required: true
        default: '1'
        type: string

permissions:
  contents: write
  actions: write

concurrency:
  group: weekly-build-all
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build each week through all 7 stages
        env:
          GH_TOKEN: ${{ github.token }}
          START_YEAR: ${{ inputs.start_year }}
          START_WEEK: ${{ inputs.start_week }}
          END_YEAR: ${{ inputs.end_year }}
          END_WEEK: ${{ inputs.end_week }}
        run: |
          mapfile -t WEEKS < <(
            read START_DATE END_DATE < <(python tools/resolve_iso_week_range.py \
              "$START_YEAR" "$START_WEEK" "$END_YEAR" "$END_WEEK")
            python - "$START_DATE" "$END_DATE" <<'PY'
          import sys
          from datetime import date
          from tools.iso_date_range import weeks_in_range
          for iso_week in weeks_in_range(date.fromisoformat(sys.argv[1]), date.fromisoformat(sys.argv[2])):
              print(iso_week.year, iso_week.week)
          PY
          )

          if [ "${#WEEKS[@]}" -eq 0 ]; then
            echo "::error::No ISO weeks were resolved from the requested range."
            exit 1
          fi

          echo "Resolved ${#WEEKS[@]} ISO week(s): ${WEEKS[*]}"

          total_stages=$((${#WEEKS[@]} * 7))
          completed_stages=0

          report_progress() {
            local state="$1" stage="$2" percent updated_at
            percent=$((completed_stages * 100 / total_stages))
            updated_at="$(date -u '+%Y-%m-%dT%H:%M:%SZ')"
            printf '%s %s — %s%% complete (%s/%s stages) — %s — STARTED %s UPDATED %s\n' \
              "$state" "$week_label" "$percent" "$completed_stages" "$total_stages" \
              "$stage" "$week_started_at" "$updated_at" > build-status.txt
            cat build-status.txt
            {
              printf '### Build All: %s%% complete\n\n' "$percent"
              printf '%s of %s stages completed.\n\n' "$completed_stages" "$total_stages"
              printf '**%s — %s:** %s\n\n' "$week_label" "$state" "$stage"
              printf 'Week started: %s · Updated: %s\n\n' "$week_started_at" "$updated_at"
              printf 'Percentage counts completed stages; stages take different amounts of time.\n'
            } > "$GITHUB_STEP_SUMMARY"
            git add build-status.txt
            if ! git diff --cached --quiet; then
              git -c user.name='github-actions[bot]' \
                  -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
                  commit -m "Build All: $week_label $percent% ($stage)"
              git push origin HEAD:main
            fi
          }

          for week in "${WEEKS[@]}"; do
            read -r year iso_week <<< "$week"
            week_label="${year}-W$(printf '%02d' "$iso_week")"
            echo "::group::ISO ${week_label}"

            git fetch origin main
            git reset --hard origin/main
            week_started_at="$(date -u '+%Y-%m-%dT%H:%M:%SZ')"
            report_progress BUILDING "Scaffold"

            bash tools/run-workflow-and-wait.sh scaffold-almanack-weeks.yml \
              -f start_year="$year" -f start_week="$iso_week" \
              -f end_year="$year" -f end_week="$iso_week"
            git fetch origin main
            git reset --hard origin/main
            completed_stages=$((completed_stages + 1))
            report_progress BUILDING "Calendar"

            bash tools/run-workflow-and-wait.sh calendar-generator.yml \
              -f start_year="$year" -f start_week="$iso_week" \
              -f end_year="$year" -f end_week="$iso_week"
            git fetch origin main
            git reset --hard origin/main
            completed_stages=$((completed_stages + 1))
            report_progress BUILDING "Ephemeris"

            bash tools/run-workflow-and-wait.sh ephemeris-generator-by-date.yml \
              -f start_year="$year" -f start_week="$iso_week" \
              -f end_year="$year" -f end_week="$iso_week"
            git fetch origin main
            git reset --hard origin/main
            completed_stages=$((completed_stages + 1))
            report_progress BUILDING "Planet Finder"

            bash tools/run-workflow-and-wait.sh populate-ephemeris-planet-finder-by-date.yml \
              -f start_year="$year" -f start_week="$iso_week" \
              -f end_year="$year" -f end_week="$iso_week" \
              -f candidate_layouts='${{ inputs.candidate_layouts }}' \
              -f max_node_candidates='${{ inputs.max_node_candidates }}' \
              -f max_search_seconds='${{ inputs.max_search_seconds }}' \
              -f diagnostic_level='${{ inputs.diagnostic_level }}'
            git fetch origin main
            git reset --hard origin/main
            completed_stages=$((completed_stages + 1))
            report_progress BUILDING "Sky Notes"

            bash tools/run-workflow-and-wait.sh populate-sky-notes-by-date.yml \
              -f start_year="$year" -f start_week="$iso_week" \
              -f end_year="$year" -f end_week="$iso_week"
            git fetch origin main
            git reset --hard origin/main
            completed_stages=$((completed_stages + 1))
            report_progress BUILDING "Artwork"

            bash tools/run-workflow-and-wait.sh populate-sky-notes-artwork-by-date.yml \
              -f start_year="$year" -f start_week="$iso_week" \
              -f end_year="$year" -f end_week="$iso_week"
            git fetch origin main
            git reset --hard origin/main
            completed_stages=$((completed_stages + 1))
            report_progress BUILDING "Legend"

            bash tools/run-workflow-and-wait.sh wire-almanack-legend.yml \
              -f start_year="$year" -f start_week="$iso_week" \
              -f end_year="$year" -f end_week="$iso_week"
            git fetch origin main
            git reset --hard origin/main

            completed_stages=$((completed_stages + 1))
            report_progress COMPLETE "All seven stages finished"

            echo "::endgroup::"
          done
