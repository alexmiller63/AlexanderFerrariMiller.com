name: Deploy vector notation glyphs site-wide

on:
  push:
    paths:
      - '.github/workflows/deploy-vector-notation.yml'

permissions:
  contents: write

jobs:
  glyphs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install glyph tooling
        run: |
          pip install fonttools
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-dejavu-core

      - name: Build vector-glyph renderer and remove forced color hacks
        run: |
          python - <<'PY'
          from pathlib import Path
          import json, re
          from fontTools.ttLib import TTFont
          from fontTools.pens.svgPathPen import SVGPathPen
          from fontTools.pens.boundsPen import BoundsPen

          repo = Path('.')
          font = TTFont('/usr/share/fonts/truetype/dejavu/DejaVuSans.ttf')
          cmap = font.getBestCmap()
          glyphset = font.getGlyphSet()
          chars = list('αβγδεζηθικλμνξοπρστυφχψω♈♉♊♋♌♍♎♏♐♑♒♓☉☽☿♀♂♃♄♅♆⚳')
          data = {}
          for ch in chars:
              name = cmap.get(ord(ch))
              if not name:
                  raise SystemExit(f'Missing glyph in font: {ch} U+{ord(ch):04X}')
              glyph = glyphset[name]
              bp = BoundsPen(glyphset); glyph.draw(bp)
              x0,y0,x1,y1 = bp.bounds
              pen = SVGPathPen(glyphset); glyph.draw(pen)
              data[ch] = {'d': pen.getCommands(), 'v': [x0, -y1, x1-x0, y1-y0]}

          js = '''(function(){\n'''
          js += 'const GLYPHS=' + json.dumps(data, ensure_ascii=False, separators=(',',':')) + ';\n'
          js += r'''
const NS='http://www.w3.org/2000/svg';
function glyph(ch){
  const g=GLYPHS[ch]; if(!g) return document.createTextNode(ch);
  const s=document.createElementNS(NS,'svg');
  s.setAttribute('class','vector-glyph');
  s.setAttribute('viewBox',g.v.join(' '));
  s.setAttribute('aria-hidden','true');
  s.setAttribute('focusable','false');
  const p=document.createElementNS(NS,'path'); p.setAttribute('d',g.d); p.setAttribute('transform','scale(1,-1)'); p.setAttribute('fill','currentColor'); s.append(p); return s;
}
function renderString(el,text){
  el.replaceChildren();
  let buf='';
  function flush(){if(buf){el.append(document.createTextNode(buf));buf='';}}
  for(const ch of text){if(GLYPHS[ch]){flush();el.append(glyph(ch));}else{buf+=ch;}} flush();
}
function activeMode(){const b=document.querySelector('[data-bayer-mode][aria-pressed="true"]');return b?b.dataset.bayerMode:'greek';}
function renderNotation(){
  const mode=activeMode();
  document.querySelectorAll('.notation-item').forEach(el=>renderString(el,el.dataset[mode]||el.dataset.greek||el.textContent));
}
function vectorizeStatic(root=document){
  const nodes=[]; const w=document.createTreeWalker(root,NodeFilter.SHOW_TEXT);
  while(w.nextNode()){
    const n=w.currentNode,p=n.parentElement;
    if(!p||p.closest('script,style,svg,.notation-item')||!Array.from(n.nodeValue).some(ch=>GLYPHS[ch])) continue;
    nodes.push(n);
  }
  for(const n of nodes){
    const f=document.createDocumentFragment(); let buf='';
    function flush(){if(buf){f.append(document.createTextNode(buf));buf='';}}
    for(const ch of n.nodeValue){if(GLYPHS[ch]){flush();f.append(glyph(ch));}else{buf+=ch;}} flush(); n.replaceWith(f);
  }
}
function refresh(){renderNotation();vectorizeStatic(document);}
document.querySelectorAll('[data-bayer-mode]').forEach(b=>b.addEventListener('click',()=>queueMicrotask(refresh)));
refresh();
})();
'''
          out = repo/'almanack/js/glyph-notation.js'
          out.parent.mkdir(parents=True, exist_ok=True)
          out.write_text(js, encoding='utf-8')

          # Remove the temporary forced-color text hacks. Vector glyphs now own symbol rendering.
          targets = [repo/'Star-Almanack-Repo/add_greek_latin_toggle.py', repo/'almanack/css/week.css']
          targets += sorted((repo/'almanack/2026').glob('W??/index.html'))
          targets += sorted((repo/'Star-Almanack-Repo/site/2026').glob('W??/index.html'))
          targets += sorted((repo/'almanack/2026').glob('W??/**/*.svg'))
          targets += sorted((repo/'Star-Almanack-Repo').glob('**/*.svg'))

          for path in targets:
              if not path.exists() or not path.is_file(): continue
              text = path.read_text(encoding='utf-8')
              old = text
              text = text.replace("color:currentColor;-webkit-text-fill-color:currentColor", "")
              text = text.replace("color:#111!important;-webkit-text-fill-color:#111!important", "")
              text = text.replace("fill:#111!important;", "fill:#111;")
              if text != old:
                  path.write_text(text, encoding='utf-8')

          tag = '<script src="/almanack/js/glyph-notation.js"></script>'
          for path in sorted((repo/'almanack/2026').glob('W??/index.html')) + sorted((repo/'Star-Almanack-Repo/site/2026').glob('W??/index.html')):
              text = path.read_text(encoding='utf-8')
              if tag not in text:
                  text = text.replace('</body>', tag+'</body>', 1)
                  path.write_text(text, encoding='utf-8')

          # Make future generated weekly pages include the renderer too.
          gen = repo/'Star-Almanack-Repo/add_greek_latin_toggle.py'
          text = gen.read_text(encoding='utf-8')
          if 'glyph-notation.js' not in text:
              text = text.replace('path.write_text(text, encoding="utf-8")', 'text = text.replace("</body>", \'<script src="/almanack/js/glyph-notation.js"></script></body>\', 1)\n    path.write_text(text, encoding="utf-8")')
              gen.write_text(text, encoding='utf-8')

          print('Generated', out)
          print('Injected renderer into 53 published and 53 source weekly pages')
          PY

      - name: Verify site-wide vector notation deployment
        run: |
          python - <<'PY'
          from pathlib import Path
          pages = sorted(Path('almanack/2026').glob('W??/index.html'))
          src = sorted(Path('Star-Almanack-Repo/site/2026').glob('W??/index.html'))
          assert len(pages)==53 and len(src)==53, (len(pages),len(src))
          for p in pages+src:
              t=p.read_text(encoding='utf-8')
              assert '/almanack/js/glyph-notation.js' in t, p
              assert '-webkit-text-fill-color:currentColor' not in t, p
          js=Path('almanack/js/glyph-notation.js').read_text(encoding='utf-8')
          for ch in ['ε','α','♎','☉','♅','♆','⚳']:
              assert ch in js, ch
          w41=Path('almanack/2026/W41/index.html').read_text(encoding='utf-8')
          assert 'Enif (ε Peg)' in w41
          assert 'Sadalmelik (α Aqr)' in w41
          print('PASS: all 53 published and source weekly pages use vector notation renderer')
          PY

      - name: Commit vector notation deployment
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add almanack/js/glyph-notation.js almanack/css/week.css almanack/2026 Star-Almanack-Repo/add_greek_latin_toggle.py Star-Almanack-Repo/site/2026 Star-Almanack-Repo/observer-views Star-Almanack-Repo/planet-finder 2>/dev/null || true
          git add -u
          git commit -m 'Render Almanack notation with vector glyphs' || exit 0
          git push origin main
