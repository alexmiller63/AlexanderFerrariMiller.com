name: Current-week navigation refresh

on:
  workflow_dispatch:
    inputs:
      years:
        description: 'Space-separated ISO years to refresh'
        required: true
        default: '2025 2026 2027'

env:
  ALMANACK_YEARS: ${{ inputs.years }}

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Refresh year and week navigation
        run: python tools/wire_week_navigation.py $ALMANACK_YEARS

      - name: Commit navigation refresh
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for year in $ALMANACK_YEARS; do
            git add "almanack/$year" "Star-Almanack-Repo/site/$year"
          done
          if git diff --cached --quiet; then
            echo 'No navigation changes'
            exit 0
          fi
          git commit -m "Refresh Almanack navigation for $ALMANACK_YEARS"
          git pull --rebase origin main
          git push
