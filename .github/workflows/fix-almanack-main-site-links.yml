name: Fix Almanack Main Site links

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-almanack-main-site-links.yml'
      - 'tools/fix_almanack_main_site_links.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix-links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix Pages-safe Main Site links
        run: python tools/fix_almanack_main_site_links.py
      - name: Commit link fixes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add almanack
          if git diff --cached --quiet; then
            echo 'No link changes'
            exit 0
          fi
          git commit -m 'Fix Almanack Main Site links for GitHub Pages'
          git push

# Triggered 2026-09-07 to apply Pages-safe Main Site links.
