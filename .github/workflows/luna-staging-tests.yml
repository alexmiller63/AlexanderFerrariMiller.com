name: Luna Staging Tests
on:
  push:
    branches: [luna-safe-publisher-20261013]
  pull_request:
    paths:
      - 'tools/luna_stage_approved.py'
      - 'tests/test_luna_stage_approved.py'
      - '.github/workflows/luna-staging-tests.yml'
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python3 -m unittest discover -s tests -p 'test_luna_stage_approved.py' -v
