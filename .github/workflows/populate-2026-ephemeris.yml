name: Populate 2026 ephemeris

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/populate-2026-ephemeris.yml'
      - 'tools/populate_2026_ephemeris.py'
      - 'tools/populate-2026-ephemeris-trigger.txt'

permissions:
  contents: write

jobs:
  populate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Populate 2026 weekly ephemerides
        run: python tools/populate_2026_ephemeris.py
      - name: Commit generated pages
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add almanack/2026
          if git diff --cached --quiet; then
            echo 'No page changes'
            exit 0
          fi
          git commit -m 'Populate 2026 weekly ephemeris with Pluto and beta'
          git pull --rebase origin main
          git push
