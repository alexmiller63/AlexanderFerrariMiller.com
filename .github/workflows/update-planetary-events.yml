name: Update Planetary Events
on:
  workflow_dispatch:
    inputs:
      week:
        description: 'all, or one ISO week (YYYY-Www)'
        required: true
        default: 'all'
        type: string
permissions:
  contents: write
concurrency:
  group: almanack-generator-main-writer
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install astronomical calculation dependency
        run: python -m pip install skyfield==1.55
      - name: Restore cached planetary kernel
        uses: actions/cache@v4
        with:
          path: .cache/skyfield
          key: star-almanack-de440s-v1
      - name: Ensure planetary kernel
        run: python tools/ensure_ephemeris_kernels.py
      - name: Verify planetary stations and calendar insertion
        run: python -m unittest discover -s tests -p test_planetary_stations.py
      - name: Calculate dated planetary phenomena
        run: python tools/calculate_planetary_events.py
      - name: Update affected weeks
        env:
          PLANETARY_WEEK: ${{ inputs.week }}
        run: |
          args=()
          if [[ "$PLANETARY_WEEK" != "all" ]]; then
            args=(--week "$PLANETARY_WEEK")
          fi
          python tools/update_planetary_events.py --dry-run "${args[@]}"
          python tools/update_planetary_events.py "${args[@]}"
      - name: Refresh seasonal pages only when weeks changed
        run: |
          if ! git diff --quiet -- almanack/; then
            python tools/build_seasonal_calendar.py
          fi
      - name: Commit calendar changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No generated changes to publish."
            exit 0
          fi
          git commit -m "Refresh dated planetary events in calendars"
          git pull --rebase origin main
          git push origin HEAD:main
