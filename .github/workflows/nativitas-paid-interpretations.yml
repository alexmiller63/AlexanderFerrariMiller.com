name: Nativitas Paid Interpretation Drafts
on:
  workflow_dispatch:
    inputs:
      batch_size:
        description: "Maximum drafts this run"
        default: '25'
        required: true
      budget_usd:
        description: "Cumulative API budget ceiling (maximum $1)"
        default: '1.00'
        required: true
permissions:
  contents: write
concurrency:
  group: nativitas-paid-interpretations
  cancel-in-progress: false
jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Generate checkpointed unpublished drafts
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          BATCH: ${{ inputs.batch_size }}
          BUDGET: ${{ inputs.budget_usd }}
        run: python nativitas/tools/generate_paid_interpretations.py --batch-size "$BATCH" --budget "$BUDGET"
      - name: Upload recoverable draft checkpoint
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nativitas-paid-drafts-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            nativitas/data/paid-interpretation-drafts.json
            nativitas/paid-interpretation-progress.json
          if-no-files-found: error
          retention-days: 90
      - name: Commit draft and cost checkpoints
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f nativitas/data/paid-interpretation-drafts.json nativitas/paid-interpretation-progress.json
          if ! git diff --cached --quiet; then
            git commit -m "Checkpoint paid Nativitas interpretation drafts [skip ci]"
            git push origin HEAD:${{ github.event.repository.default_branch }}
          fi
          git ls-files --error-unmatch nativitas/data/paid-interpretation-drafts.json nativitas/paid-interpretation-progress.json
      - name: Summary
        if: always()
        shell: bash
        run: |
          if [ -f nativitas/paid-interpretation-progress.json ]; then
            cat nativitas/paid-interpretation-progress.json >> "$GITHUB_STEP_SUMMARY"
          fi
