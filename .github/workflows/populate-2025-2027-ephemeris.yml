name: Populate 2025 and 2027 ephemerides

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/populate-2025-2027-ephemeris.yml'
      - 'tools/populate_2025_2027_ephemeris.py'
      - 'tools/populate-2025-2027-ephemeris-trigger.txt'

permissions:
  contents: write

jobs:
  populate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Populate weekly ephemerides
        run: python tools/populate_2025_2027_ephemeris.py
      - name: Commit generated pages
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add almanack/2025 almanack/2027
          if git diff --cached --quiet; then
            echo 'No page changes'
            exit 0
          fi
          git commit -m 'Populate 2025 and 2027 weekly ephemerides'
          git pull --rebase origin main
          git push
