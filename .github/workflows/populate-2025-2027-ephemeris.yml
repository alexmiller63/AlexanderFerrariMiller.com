name: Populate Almanack foundations

on:
  workflow_dispatch:
    inputs:
      years:
        description: 'Space-separated ISO years to regenerate'
        required: true
        default: '2025 2026 2027'
  push:
    paths:
      - '.github/workflows/populate-2025-2027-ephemeris.yml'
      - 'tools/almanack_calendar.py'
      - 'tools/audit_calendar_contract.py'
      - 'tools/audit_true_year_parameterization.py'
      - 'tools/audit_constellation_centers.py'
      - 'tools/clean_event_cells.py'
      - 'tools/populate_calendar.py'
      - 'tools/populate_meteor_showers.py'
      - 'tools/populate_ephemeris.py'
      - 'tools/wire_2026_eclipses.py'
      - 'tools/wire_ephemeris_notation.py'
      - 'tools/wire_week_navigation.py'
      - 'tools/wire_almanack_legend.py'
      - 'tools/populate_fixed_sky.py'
      - 'tools/standardize_messier_calendar.py'
      - 'tools/catalog_common_names.py'
      - 'tools/reconcile_catalog_common_names.py'
      - 'tools/populate_constellations.py'
      - 'tools/populate_asterisms.py'
      - 'tools/populate_caldwell.py'
      - 'tools/populate_finest_ngc.py'
      - 'tools/populate-2025-2027-ephemeris-trigger.txt'
      - 'Star-Almanack-Repo/eclipse.yaml'
      - 'Star-Almanack-Repo/compute_bayer_visibility_2026.py'
      - 'Star-Almanack-Repo/expanded-bayer-stars.csv'
      - 'Star-Almanack-Repo/compute_constellation_observance_2026.py'
      - 'Star-Almanack-Repo/fixed-objects.yaml'
      - 'Star-Almanack-Repo/messier-editorial.json'
      - 'Star-Almanack-Repo/messier-common-names-nasa.yaml'
      - 'Star-Almanack-Repo/expanded-bayer-visibility-2026.csv'
      - 'Star-Almanack-Repo/caldwell-catalog.csv'
      - 'Star-Almanack-Repo/finest-ngc-catalog.csv'
      - 'Star-Almanack-Repo/finest-ngc-caldwell-overlap.csv'
      - 'Star-Almanack-Repo/asterism-geometry-2025.csv'
      - 'Star-Almanack-Repo/asterism-geometry-2026.csv'
      - 'Star-Almanack-Repo/asterism-geometry-2027.csv'

env:
  ALMANACK_YEARS: ${{ github.event_name == 'workflow_dispatch' && inputs.years || '2025 2026 2027' }}

permissions:
  contents: write

jobs:
  populate:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Fetch pinned constellation-figure and stellar sources
        run: |
          curl -fL \
            https://raw.githubusercontent.com/dcf21/constellation-stick-figures/75d29c207bbd752023c447ddd1f9f4ff0eb47538/constellation_lines_iau.dat \
            -o /tmp/constellation_lines_iau.dat
          curl -fL \
            https://raw.githubusercontent.com/astronexus/HYG-Database/3bf37f4b2d5460e1278286320d1d62fab9b493c1/hyg/CURRENT/hygdata_v41.csv \
            -o /tmp/hygdata_v41.csv
      - name: Verify preserved 2026 best-visibility regression
        run: python Star-Almanack-Repo/compute_bayer_visibility_2026.py Star-Almanack-Repo/expanded-bayer-stars.csv /tmp/expanded-bayer-visibility-2026-regression.csv
      - name: Normalize calendar keys and clear requested event cells
        run: python tools/clean_event_cells.py $ALMANACK_YEARS
      - name: Populate Zodiac Days, ingresses, solar stations, and named lunar phases
        run: python tools/populate_calendar.py $ALMANACK_YEARS
      - name: Publish independently calculated 2026 eclipses
        run: |
          if [[ " $ALMANACK_YEARS " == *" 2026 "* ]]; then
            python tools/wire_2026_eclipses.py
          fi
      - name: Populate major meteor-shower maxima
        run: python tools/populate_meteor_showers.py $ALMANACK_YEARS
      - name: Populate weekly Solar-System ephemerides
        run: python tools/populate_ephemeris.py $ALMANACK_YEARS
      - name: Wire Solar-System ephemeris notation controls
        run: python tools/wire_ephemeris_notation.py $ALMANACK_YEARS
      - name: Populate fixed-sky visibility events
        run: python tools/populate_fixed_sky.py $ALMANACK_YEARS
      - name: Standardize Messier labels, instruments, magnitudes, declination bands, and seasons
        run: python tools/standardize_messier_calendar.py $ALMANACK_YEARS
      - name: Populate constellation centers
        run: python tools/populate_constellations.py $ALMANACK_YEARS
      - name: Populate core asterism centers
        run: python tools/populate_asterisms.py $ALMANACK_YEARS
      - name: Populate Caldwell C1-C109 in requested years
        run: python tools/populate_caldwell.py $ALMANACK_YEARS
      - name: Populate Finest NGC objects not already represented by Caldwell
        run: python tools/populate_finest_ngc.py $ALMANACK_YEARS
      - name: Reconcile common names across Messier, Caldwell, and Finest NGC
        run: python tools/reconcile_catalog_common_names.py $ALMANACK_YEARS
      - name: Wire highlighted current-week navigation
        run: python tools/wire_week_navigation.py $ALMANACK_YEARS
      - name: Wire canonical legend and glyph sizing
        run: python tools/wire_almanack_legend.py $ALMANACK_YEARS
      - name: Verify machine-readable calendar contract
        run: python tools/audit_calendar_contract.py $ALMANACK_YEARS
      - name: Verify all constellation centers survived downstream passes
        run: python tools/audit_constellation_centers.py $ALMANACK_YEARS
      - name: Audit true-year parameterization
        run: python tools/audit_true_year_parameterization.py $ALMANACK_YEARS
      - name: Commit generated Almanack foundations
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          regression() {
            python Star-Almanack-Repo/compute_bayer_visibility_2026.py \
              Star-Almanack-Repo/expanded-bayer-stars.csv \
              /tmp/expanded-bayer-visibility-2026-regression.csv
          }
          stage_generated() {
            for year in $ALMANACK_YEARS; do
              git add \
                "almanack/$year" \
                "Star-Almanack-Repo/site/$year" \
                "Star-Almanack-Repo/generated/calendar-$year.json" \
                "Star-Almanack-Repo/generated/meteor-showers-$year.json" \
                "Star-Almanack-Repo/generated/expanded-bayer-visibility-$year.csv" \
                "Star-Almanack-Repo/generated/bright-star-visibility-$year.csv" \
                "Star-Almanack-Repo/generated/messier-visibility-$year.csv" \
                "Star-Almanack-Repo/generated/constellation-observance-$year.csv" \
                "Star-Almanack-Repo/generated/caldwell-visibility-$year.csv" \
                "Star-Almanack-Repo/generated/finest-ngc-visibility-$year.csv"
            done
            if [[ " $ALMANACK_YEARS " == *" 2026 "* ]]; then
              git add Star-Almanack-Repo/almanack-expanded.md star-almanack/eclipses.html
            fi
          }
          regenerate() {
            regression
            python tools/clean_event_cells.py $ALMANACK_YEARS
            python tools/populate_calendar.py $ALMANACK_YEARS
            if [[ " $ALMANACK_YEARS " == *" 2026 "* ]]; then python tools/wire_2026_eclipses.py; fi
            python tools/populate_meteor_showers.py $ALMANACK_YEARS
            python tools/populate_ephemeris.py $ALMANACK_YEARS
            python tools/wire_ephemeris_notation.py $ALMANACK_YEARS
            python tools/populate_fixed_sky.py $ALMANACK_YEARS
            python tools/standardize_messier_calendar.py $ALMANACK_YEARS
            python tools/populate_constellations.py $ALMANACK_YEARS
            python tools/populate_asterisms.py $ALMANACK_YEARS
            python tools/populate_caldwell.py $ALMANACK_YEARS
            python tools/populate_finest_ngc.py $ALMANACK_YEARS
            python tools/reconcile_catalog_common_names.py $ALMANACK_YEARS
            python tools/wire_week_navigation.py $ALMANACK_YEARS
            python tools/wire_almanack_legend.py $ALMANACK_YEARS
            python tools/audit_calendar_contract.py $ALMANACK_YEARS
            python tools/audit_constellation_centers.py $ALMANACK_YEARS
            python tools/audit_true_year_parameterization.py $ALMANACK_YEARS
          }
          stage_generated
          if git diff --cached --quiet; then echo 'No Almanack foundation changes'; exit 0; fi
          git commit -m "Populate Almanack foundations for $ALMANACK_YEARS"
          if git push; then exit 0; fi
          echo 'main moved during generation; resynchronizing and regenerating once'
          git fetch origin main
          git reset --hard origin/main
          regenerate
          stage_generated
          if git diff --cached --quiet; then echo 'No Almanack foundation changes after resynchronization'; exit 0; fi
          git commit -m "Populate Almanack foundations for $ALMANACK_YEARS"
          git push
