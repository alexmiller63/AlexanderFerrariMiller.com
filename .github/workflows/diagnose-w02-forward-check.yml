name: Diagnose W02 Forward Check

on:
  push:
    branches: [diagnose-w02-forward-check]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Locate Planet Finder CLI
        run: |
          python tools/generate_planet_finders.py --help || true
      - name: Compile all Planet Finder modules
        run: |
          python -m py_compile             tools/generate_planet_finders.py             tools/planet_finder_geometry.py             tools/planet_finder_search.py             tools/planet_finder_render.py             tools/populate_ephemeris_planet_finder_by_date.py
      - name: Run Planet Finder unit tests
        run: |
          pip install pytest skyfield==1.55
          pytest -q tests/test_planet_finder_candidate_generation.py
      - name: Run W02 Planet Finder diagnostic
        shell: bash
        run: |
          set -o pipefail
          python tools/generate_planet_finders.py --year 2026 --week 2 2>&1 | tee w02-forward-check.log
