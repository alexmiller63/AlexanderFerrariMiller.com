name: Populate Ephemeris + Planet Finder — by ISO date

on:
  workflow_dispatch:
    inputs:
      start_date:
        description: Start date (ISO YYYY-MM-DD)
        required: true
        type: string
      end_date:
        description: End date (ISO YYYY-MM-DD)
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: populate-ephemeris-planet-finder-by-date
  cancel-in-progress: false

jobs:
  populate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Populate Ephemeris and Planet Finder for requested ISO dates
        run: python tools/populate_ephemeris_planet_finder_by_date.py "${{ inputs.start_date }}" "${{ inputs.end_date }}"

      - name: Commit Ephemeris and Planet Finder changes only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- almanack Star-Almanack-Repo/site
          if git diff --cached --quiet; then
            echo "No Ephemeris or Planet Finder changes in requested ISO date range."
            exit 0
          fi
          git commit -m "Populate Ephemeris and Planet Finder ${{ inputs.start_date }} through ${{ inputs.end_date }}"
          git pull --rebase origin main
          git push
