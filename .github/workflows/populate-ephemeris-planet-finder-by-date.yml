name: Planet Finder Generator

on:
  workflow_dispatch:
    inputs:
      start_year:
        description: Start year
        required: true
        default: '2026'
        type: string
      start_week:
        description: Start week
        required: true
        default: '36'
        type: string
      end_year:
        description: End year
        required: true
        default: '2026'
        type: string
      end_week:
        description: End week
        required: true
        default: '36'
        type: string
      candidate_layouts:
        description: Complete layouts to score per mode
        required: true
        default: '2'
        type: string
      max_search_candidates:
        description: Maximum candidate evaluations for the entire run
        required: true
        default: '1000'
        type: string
      max_search_seconds:
        description: Maximum Planet Finder search time for the entire run
        required: true
        default: '90'
        type: string

permissions:
  contents: write

concurrency:
  group: planet-finder-generator
  cancel-in-progress: true

jobs:
  populate:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Restore JPL/NAIF ephemeris source cache
        uses: actions/cache@v4
        with:
          path: |
            .cache/skyfield/de440s.bsp
            .cache/skyfield/ceres_1900_2100.bsp
          key: star-almanack-source-kernels-v1

      - name: Install pinned calculation dependency
        run: python -m pip install --disable-pip-version-check 'skyfield==1.55'

      - name: Download source kernels only when cache is empty
        run: |
          mkdir -p .cache/skyfield
          python - <<'PY'
          from pathlib import Path
          from urllib.request import urlretrieve
          from skyfield.api import Loader

          root = Path('.cache/skyfield')
          de440s = root / 'de440s.bsp'
          ceres = root / 'ceres_1900_2100.bsp'

          if de440s.exists():
              print(f'Reusing cached {de440s} ({de440s.stat().st_size:,} bytes)')
          else:
              print('Downloading JPL DE440s source kernel under NAIF distribution rules')
              Loader(str(root)).download('de440s.bsp')

          if ceres.exists():
              print(f'Reusing cached {ceres} ({ceres.stat().st_size:,} bytes)')
          else:
              print('Downloading JPL/NAIF Ceres source kernel under NAIF distribution rules')
              urlretrieve(
                  'https://naif.jpl.nasa.gov/pub/naif/generic_kernels/spk/asteroids/a_old_versions/ceres_1900_2100.bsp',
                  ceres,
              )
          PY

      - name: Compile-check Planet Finder Python
        run: |
          python -m py_compile \
            tools/generate_planet_finders.py \
            tools/populate_ephemeris_planet_finder_by_date.py

      - name: Resolve ISO week range
        id: range
        run: |
          read START_DATE END_DATE < <(python tools/resolve_iso_week_range.py \
            '${{ inputs.start_year }}' '${{ inputs.start_week }}' \
            '${{ inputs.end_year }}' '${{ inputs.end_week }}')
          echo "start_date=$START_DATE" >> "$GITHUB_OUTPUT"
          echo "end_date=$END_DATE" >> "$GITHUB_OUTPUT"
          echo "$START_DATE through $END_DATE"

      - name: Generate Ephemeris and Planet Finder from local calculations
        env:
          STAR_ALMANACK_EPHEMERIS_DIR: ${{ github.workspace }}/.cache/skyfield
          PLANET_FINDER_CANDIDATES: ${{ inputs.candidate_layouts }}
          PLANET_FINDER_MAX_CANDIDATES: ${{ inputs.max_search_candidates }}
          PLANET_FINDER_MAX_SECONDS: ${{ inputs.max_search_seconds }}
          PLANET_FINDER_MAX_ORDER_SECONDS: '5'
          PLANET_FINDER_MAX_ORDER_NODES: '100000'
        run: |
          # PLANET_FINDER_MAX_SECONDS is the generator's search-only budget.
          # Setup and annual ephemeris calculation happen before that clock starts.
          # Keep a separate emergency process ceiling so a non-search hang still dies.
          PROCESS_TIMEOUT_SECONDS=$((PLANET_FINDER_MAX_SECONDS + 60))
          timeout --signal=TERM --kill-after=5s \
            "${PROCESS_TIMEOUT_SECONDS}s" \
            python tools/populate_ephemeris_planet_finder_by_date.py \
              "${{ steps.range.outputs.start_date }}" "${{ steps.range.outputs.end_date }}"
          status=$?
          if [ "$status" -eq 124 ] || [ "$status" -eq 137 ]; then
            echo "::error::Planet Finder process exceeded the emergency ${PROCESS_TIMEOUT_SECONDS}-second ceiling (search budget: ${PLANET_FINDER_MAX_SECONDS}s)."
          fi
          exit "$status"

      - name: Commit Planet Finder changes only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- almanack site
          if git diff --cached --quiet; then
            echo "No Planet Finder changes in requested ISO week range."
            exit 0
          fi
          git commit -m "Generate Planet Finder ${{ inputs.start_year }}-W${{ inputs.start_week }}"
          git pull --rebase origin main
          git push
