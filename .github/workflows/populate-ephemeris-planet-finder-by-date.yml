name: Planet Finder Generator

on:
  workflow_dispatch:
    inputs:
      start_year:
        description: Start ISO week-year
        required: true
        default: '2026'
        type: string
      start_week:
        description: Start ISO week
        required: true
        default: '36'
        type: string
      end_year:
        description: End ISO week-year
        required: true
        default: '2026'
        type: string
      end_week:
        description: End ISO week
        required: true
        default: '36'
        type: string
      candidate_layouts:
        description: Complete layouts to score per mode
        required: true
        default: '5'
        type: string
      max_node_candidates:
        description: Maximum DFS node visits per body depth
        required: true
        default: '200'
        type: string
      max_search_seconds:
        description: Maximum Planet Finder search time per mode
        required: true
        default: '180'
        type: string
      diagnostic_level:
        description: Diagnostic verbosity (0=silent, 1=major, 2=search, 3=forensic)
        required: true
        default: '1'
        type: string

permissions:
  contents: write

concurrency:
  group: almanack-generator-main-writer
  cancel-in-progress: false

jobs:
  populate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/cache@v4
        with:
          path: |
            .cache/skyfield/de440s.bsp
            .cache/skyfield/ceres_1900_2100.bsp
          key: star-almanack-source-kernels-v1
      - name: Install pinned dependencies
        run: |
          python -m pip install --disable-pip-version-check --upgrade pip
          python -m pip install --disable-pip-version-check 'numpy==1.26.4' 'skyfield==1.55'
      - name: Prepare ephemeris kernels
        run: python tools/ensure_ephemeris_kernels.py --ceres
      - name: Run Planet Finder launcher
        env:
          PLANET_FINDER_START_YEAR: ${{ inputs.start_year }}
          PLANET_FINDER_START_WEEK: ${{ inputs.start_week }}
          PLANET_FINDER_END_YEAR: ${{ inputs.end_year }}
          PLANET_FINDER_END_WEEK: ${{ inputs.end_week }}
          PLANET_FINDER_CANDIDATES: ${{ inputs.candidate_layouts }}
          PLANET_FINDER_MAX_NODE_CANDIDATES: ${{ inputs.max_node_candidates }}
          PLANET_FINDER_MAX_SECONDS: ${{ inputs.max_search_seconds }}
          PLANET_FINDER_DIAGNOSTIC_LEVEL: ${{ inputs.diagnostic_level }}
          STAR_ALMANACK_EPHEMERIS_DIR: ${{ github.workspace }}/.cache/skyfield
        run: python tools/run_planet_finder_workflow.py
      - name: Commit generated Planet Finder files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add almanack site
          if git diff --cached --quiet; then
            echo "No generated Planet Finder changes."
            exit 0
          fi
          git commit -m "Generate Planet Finder"
          git pull --rebase origin main
          git push
