name: Planet Finder Generator

# Refresh GitHub Actions workflow registration.

on:
  workflow_dispatch:
    inputs:
      start_year:
        description: Start year
        required: true
        default: '2026'
        type: string
      start_week:
        description: Start week
        required: true
        default: '36'
        type: string
      end_year:
        description: End year
        required: true
        default: '2026'
        type: string
      end_week:
        description: End week
        required: true
        default: '36'
        type: string
      candidate_layouts:
        description: Complete layouts to score per mode
        required: true
        default: '5'
        type: string
      max_node_candidates:
        description: Maximum DFS node visits per body depth
        required: true
        default: '200'
        type: string
      max_search_seconds:
        description: Maximum Planet Finder search time per mode
        required: true
        default: '180'
        type: string

permissions:
  contents: write

concurrency:
  group: planet-finder-generator
  cancel-in-progress: false

jobs:
  populate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Restore JPL/NAIF ephemeris source cache
        uses: actions/cache@v4
        with:
          path: |
            .cache/skyfield/de440s.bsp
            .cache/skyfield/ceres_1900_2100.bsp
          key: star-almanack-source-kernels-v1

      - name: Install pinned calculation dependency
        run: |
          python -m pip install --disable-pip-version-check --upgrade pip
          python -m pip install --disable-pip-version-check 'numpy==1.26.4' 'skyfield==1.55'

      - name: Ensure cached DE440s and Ceres source kernels
        run: python tools/ensure_ephemeris_kernels.py --ceres
      - name: Compile-check Planet Finder Python
        run: |
          python -m py_compile \
            tools/generate_planet_finders.py \
            tools/populate_ephemeris_planet_finder_by_date.py

      - name: Resolve ISO week range
        id: range
        run: |
          read START_DATE END_DATE < <(python tools/resolve_iso_week_range.py \
            '${{ inputs.start_year }}' '${{ inputs.start_week }}' \
            '${{ inputs.end_year }}' '${{ inputs.end_week }}')
          echo "start_date=$START_DATE" >> "$GITHUB_OUTPUT"
          echo "end_date=$END_DATE" >> "$GITHUB_OUTPUT"
          echo "$START_DATE through $END_DATE"

      - name: Generate Ephemeris and Planet Finder from local calculations
        env:
          STAR_ALMANACK_EPHEMERIS_DIR: ${{ github.workspace }}/.cache/skyfield
          PLANET_FINDER_CANDIDATES: ${{ inputs.candidate_layouts }}
          PLANET_FINDER_MAX_NODE_CANDIDATES: ${{ inputs.max_node_candidates }}
          PLANET_FINDER_MAX_SECONDS: ${{ inputs.max_search_seconds }}
        run: |
          # PLANET_FINDER_MAX_SECONDS is the one user-controlled search clock:
          # each Greek, Latin, and Mixed layout receives this full budget.
          # Do not wrap the process in a second wall clock; the job-level timeout
          # remains the emergency guard for non-search hangs.
          python tools/populate_ephemeris_planet_finder_by_date.py \
            "${{ steps.range.outputs.start_date }}" "${{ steps.range.outputs.end_date }}"

      - name: Commit Planet Finder changes only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          python - <<'PY'
          from datetime import date
          import subprocess

          from tools.almanack_paths import week_dir
          from tools.iso_date_range import weeks_in_range

          start = date.fromisoformat("${{ steps.range.outputs.start_date }}")
          end = date.fromisoformat("${{ steps.range.outputs.end_date }}")

          paths = []
          for iso_week in weeks_in_range(start, end):
              paths.append(str(week_dir(iso_week.year, iso_week.week) / "finders"))

          # Stage only Planet Finder outputs. The generator also refreshes
          # Ephemeris, but this workflow must not commit those changes.
          subprocess.run(["git", "add", "--", *paths], check=True)

          if subprocess.run(["git", "diff", "--cached", "--quiet"]).returncode == 0:
              print("No Planet Finder changes in requested ISO week range.")
              raise SystemExit(0)

          subprocess.run([
              "git", "commit", "-m",
              f"Generate Planet Finder ${{ inputs.start_year }}-W${{ inputs.start_week }} through ${{ inputs.end_year }}-W${{ inputs.end_week }}",
          ], check=True)
          PY

          # Ephemeris refreshes are intentionally left uncommitted by this workflow.
          # Stash them while rebasing the Planet Finder commit, then restore them.
          git stash push --include-untracked --keep-index -m "planet-finder-non-pf-generated-changes"
          git pull --rebase origin main
          git push
          git stash pop || true
