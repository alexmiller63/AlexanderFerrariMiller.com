name: Generate current Planet Finders - OLD

on:
  workflow_dispatch:
    inputs:
      year:
        description: ISO week-year (blank = current UTC week)
        required: false
        type: string
      week:
        description: ISO week number (blank = current UTC week)
        required: false
        type: string
  schedule:
    - cron: '17 0 * * 1'
  push:
    paths:
      - 'tools/generate_planet_finders.py'
      - 'tools/populate_ephemeris.py'
      - 'tools/star_almanack_ephemeris.py'
      - 'EPHEMERIS-PROVENANCE.md'
      - 'THIRD-PARTY-LICENSES.md'
      - '.github/workflows/generate-current-planet-finders.yml'

permissions:
  contents: write

concurrency:
  group: planet-finders
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Restore JPL/NAIF ephemeris source cache
        uses: actions/cache@v4
        with:
          path: |
            .cache/skyfield/de440s.bsp
            .cache/skyfield/ceres_1900_2100.bsp
          key: star-almanack-source-kernels-v1

      - name: Install pinned calculation dependency
        run: python -m pip install --disable-pip-version-check 'skyfield==1.55'

      - name: Download source kernels only when cache is empty
        run: |
          mkdir -p .cache/skyfield
          python - <<'PY'
          from pathlib import Path
          from urllib.request import urlretrieve
          from skyfield.api import Loader
          root = Path('.cache/skyfield')
          de440s = root / 'de440s.bsp'
          ceres = root / 'ceres_1900_2100.bsp'
          if not de440s.exists():
              print('Downloading JPL DE440s source kernel under NAIF distribution rules')
              Loader(str(root)).download('de440s.bsp')
          else:
              print(f'Reusing cached {de440s}')
          if not ceres.exists():
              print('Downloading JPL/NAIF Ceres source kernel under NAIF distribution rules')
              urlretrieve('https://naif.jpl.nasa.gov/pub/naif/generic_kernels/spk/asteroids/a_old_versions/ceres_1900_2100.bsp', ceres)
          else:
              print(f'Reusing cached {ceres}')
          PY

      - name: Generate Planet Finders
        shell: bash
        env:
          INPUT_YEAR: ${{ inputs.year }}
          INPUT_WEEK: ${{ inputs.week }}
          STAR_ALMANACK_EPHEMERIS_DIR: ${{ github.workspace }}/.cache/skyfield
        run: |
          set -euo pipefail
          if [[ -n "${INPUT_YEAR:-}" || -n "${INPUT_WEEK:-}" ]]; then
            if [[ -z "${INPUT_YEAR:-}" || -z "${INPUT_WEEK:-}" ]]; then
              echo 'Both year and week are required when either input is supplied.' >&2
              exit 2
            fi
            python tools/generate_planet_finders.py --year "$INPUT_YEAR" --week "$INPUT_WEEK"
          else
            python tools/generate_planet_finders.py --current
          fi

      - name: Commit generated finders
        shell: bash
        env:
          INPUT_YEAR: ${{ inputs.year }}
          INPUT_WEEK: ${{ inputs.week }}
          STAR_ALMANACK_EPHEMERIS_DIR: ${{ github.workspace }}/.cache/skyfield
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          # Stage only published Almanack output. Runtime caches and Python
          # bytecode are deliberately never part of a generated-content commit.
          git add -- 'almanack/'
          if git diff --cached --quiet; then
            echo 'Planet Finders are already current.'
            exit 0
          fi
          git commit -m 'Generate current collision-free Planet Finders'

          for attempt in 1 2 3 4 5; do
            if git push origin HEAD:main; then
              exit 0
            fi
            echo "Push race on attempt $attempt; regenerating requested range from current main."
            git fetch origin main
            git reset --hard origin/main
            if [[ -n "${INPUT_YEAR:-}" && -n "${INPUT_WEEK:-}" ]]; then
              python tools/generate_planet_finders.py --year "$INPUT_YEAR" --week "$INPUT_WEEK"
            else
              python tools/generate_planet_finders.py --current
            fi
            git add -- 'almanack/'
            if git diff --cached --quiet; then
              echo 'Another workflow already produced the same output.'
              exit 0
            fi
            git commit -m 'Generate current collision-free Planet Finders'
          done
          echo 'Unable to push generated Planet Finders after 5 attempts.' >&2
          exit 1
