name: Diagnose Target Label Collisions

on:
  workflow_dispatch:

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Inventory W36 artwork candidates
        shell: bash
        run: |
          echo '=== W36 directories ==='
          find . -type d -iname '*W36*' -print | sort || true

          echo '=== Files mentioning W36 / Altair / Aquila in path ==='
          find . -type f -print \
            | grep -Ei 'W36|Altair|Aquila' \
            | sort \
            | head -n 500 || true

          echo '=== All SVG files ==='
          find . -type f -iname '*.svg' -print | sort | head -n 500 || true

          echo '=== References to Altair or Aquila in likely generated content ==='
          grep -RIlE 'Altair|Aquila' almanack 2>/dev/null | sort | head -n 500 || true
