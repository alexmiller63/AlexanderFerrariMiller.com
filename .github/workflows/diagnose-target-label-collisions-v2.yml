name: Diagnose Target Label Collisions

on:
  workflow_dispatch:

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Locate Altair fixed-object artwork
        shell: bash
        run: |
          set -euo pipefail
          TARGET='sky-notes-artwork/objects/109/finder.svg'
          SPEC='sky-notes-artwork/specs/objects/109.json'
          echo "Canonical target: $TARGET"
          echo "Canonical spec:   $SPEC"
          test -f "$TARGET"
          test -f "$SPEC"
          echo '=== Fixed object 109 files ==='
          find sky-notes-artwork/objects/109 -maxdepth 1 -type f -print | sort

      - name: Inspect Altair artwork identity
        shell: bash
        run: |
          set -euo pipefail
          TARGET='sky-notes-artwork/objects/109/finder.svg'
          echo '=== SVG identity / Altair references ==='
          grep -nE '<title>|<desc>|Target:|target|Altair|Aquila|Aql|AQL|α|Alpha' "$TARGET" | head -n 300 || true
          echo '=== Nearby SVG geometry ==='
          grep -nE '(Altair|Aquila|Aql|AQL|α|Alpha)' "$TARGET" -B 5 -A 5 | head -n 500 || true
          echo '=== Altair target-label and star-marker coordinates ==='
          python - <<'PY'
          from pathlib import Path
          import re

          p = Path('sky-notes-artwork/objects/109/finder.svg')
          lines = p.read_text().splitlines()

          hits = [i for i, line in enumerate(lines)
                  if ('α Aql, Altair' in line or 'Altair in Aquila' in line)]
          print('target-label references:', [i + 1 for i in hits])

          for i in hits:
              print(f'--- context around line {i + 1} ---')
              for j in range(max(0, i - 12), min(len(lines), i + 20)):
                  line = lines[j]
                  if ('transform=' in line or '<path' in line or '<use' in line
                          or '<g ' in line or 'Altair' in line):
                      print(f'{j + 1}: {line}')

          print('=== transforms near Altair references ===')
          for i in hits:
              lo, hi = max(0, i - 40), min(len(lines), i + 80)
              for j in range(lo, hi):
                  if re.search(r'transform="(?:translate|matrix)\(', lines[j]):
                      print(f'{j + 1}: {lines[j]}')
          PY

      - name: Inspect Altair spec
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path('sky-notes-artwork/specs/objects/109.json')
          d = json.loads(p.read_text())
          print('top-level keys:', sorted(d))
          for k, v in d.items():
              text = repr(v)
              if any(word.lower() in text.lower() for word in ('altair','target','109','aql','aquila')):
                  print(f'{k}: {text[:5000]}')
          PY

      - name: Trace target-label placement algorithm
        shell: bash
        run: |
          set -euo pipefail
          echo '=== place_target_label and call sites ==='
          grep -n -A 100 -B 10 'def place_target_label' tools/render_sky_note_finder.py || true
          grep -n -A 25 -B 25 'place_target_label(' tools/render_sky_note_finder.py || true

      - name: Trace Altair source references
        shell: bash
        run: |
          set -euo pipefail
          echo '=== Active source references only ==='
          grep -RInE --exclude='finder.svg' --exclude-dir='.git' --exclude-dir='Historical' \
            '(Altair|fixed_object_id.{0,20}109|target.*label|label.*target)' \
            generators scripts tools sky-notes-artwork database descriptors .github/workflows 2>/dev/null \
            | head -n 800 || true
