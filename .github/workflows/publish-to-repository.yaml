name: Publish to Repository

on:
  workflow_dispatch:

jobs:
  test-bridge-read:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Fetch publish bridge
        run: |
          DOC_ID="$(tr -d '[:space:]' < tools/id.txt)"

          if [ -z "$DOC_ID" ]; then
            echo "tools/id.txt is empty"
            exit 1
          fi

          curl --fail --location --silent --show-error \
            "https://docs.google.com/document/d/${DOC_ID}/export?format=txt" \
            --output /tmp/publish-bridge.txt

      - name: Validate bridge JSON
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          text = Path(
              "/tmp/publish-bridge.txt"
          ).read_text(
              encoding="utf-8-sig"
          ).strip()

          request = json.loads(text)

          if not isinstance(request, dict):
              raise SystemExit(
                  "Bridge must contain a JSON object"
              )

          files = request.get("files")

          if not isinstance(files, list) or not files:
              raise SystemExit(
                  "Bridge must contain a non-empty files array"
              )

          commit_message = str(
              request.get("commit_message", "")
          ).strip()

          print(
              f"Bridge read succeeded: {len(files)} file(s)"
          )
          print(
              f"Commit message: "
              f"{commit_message or '(automatic)'}"
          )

          for item in files:
              print(
                  f"File: "
                  f"{item.get('path', '(missing path)')}"
              )
          PY