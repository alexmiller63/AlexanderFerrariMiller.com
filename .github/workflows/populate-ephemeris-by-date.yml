name: Ephemeris Generator

on:
  workflow_dispatch:
    inputs:
      start_year:
        description: Start year
        required: true
        type: string
      start_week:
        description: Start week
        required: true
        type: string
      end_year:
        description: End year
        required: false
        default: ''
        type: string
      end_week:
        description: End week
        required: false
        default: ''
        type: string

permissions:
  contents: write

concurrency:
  group: ephemeris-generator
  cancel-in-progress: false

jobs:
  populate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Restore JPL/NAIF ephemeris source cache
        uses: actions/cache@v4
        with:
          path: |
            .cache/skyfield/de440s.bsp
            .cache/skyfield/ceres_1900_2100.bsp
          key: star-almanack-source-kernels-v1

      - name: Install pinned calculation dependency
        run: python -m pip install --disable-pip-version-check 'skyfield==1.55'

      - name: Download source kernels only when cache is empty
        run: |
          mkdir -p .cache/skyfield
          python - <<'PY'
          from pathlib import Path
          from urllib.request import urlretrieve
          from skyfield.api import Loader

          root = Path('.cache/skyfield')
          de440s = root / 'de440s.bsp'
          ceres = root / 'ceres_1900_2100.bsp'

          if de440s.exists():
              print(f'Reusing cached {de440s} ({de440s.stat().st_size:,} bytes)')
          else:
              print('Downloading JPL DE440s source kernel under NAIF distribution rules')
              Loader(str(root)).download('de440s.bsp')

          if ceres.exists():
              print(f'Reusing cached {ceres} ({ceres.stat().st_size:,} bytes)')
          else:
              print('Downloading JPL/NAIF Ceres source kernel under NAIF distribution rules')
              urlretrieve(
                  'https://naif.jpl.nasa.gov/pub/naif/generic_kernels/spk/asteroids/a_old_versions/ceres_1900_2100.bsp',
                  ceres,
              )
          PY

      - name: Resolve ISO week range
        id: range
        run: |
          read START_DATE END_DATE < <(python tools/resolve_iso_week_range.py \
            '${{ inputs.start_year }}' '${{ inputs.start_week }}' \
            '${{ inputs.end_year }}' '${{ inputs.end_week }}')
          echo "start_date=$START_DATE" >> "$GITHUB_OUTPUT"
          echo "end_date=$END_DATE" >> "$GITHUB_OUTPUT"
          echo "$START_DATE through $END_DATE"

      - name: Generate Ephemeris from local calculations
        env:
          STAR_ALMANACK_EPHEMERIS_DIR: ${{ github.workspace }}/.cache/skyfield
        run: python tools/populate_ephemeris_by_date.py "${{ steps.range.outputs.start_date }}" "${{ steps.range.outputs.end_date }}"

      - name: Verify observing notation markup
        run: |
          python - <<'PY'
          from datetime import date, timedelta
          from pathlib import Path
          import re

          start = date.fromisoformat('${{ steps.range.outputs.start_date }}')
          end = date.fromisoformat('${{ steps.range.outputs.end_date }}')
          day = start
          checked = 0
          while day <= end:
              iso = day.isocalendar()
              path = Path(f'almanack/{iso.year}/W{iso.week:02d}/index.html')
              text = path.read_text(encoding='utf-8')
              section = re.search(r'<h3>Weekly Solar-System Ephemeris</h3>.*?(?=<h3>Planet Finder</h3>)', text, re.S)
              if not section:
                  raise SystemExit(f'Missing Ephemeris section: {path}')
              html = section.group(0)
              bodies = re.findall(r'<thead><tr><th scope="col">Body</th>', html)
              if len(bodies) != 2:
                  raise SystemExit(f'Each Ephemeris table must contain a Body header: {path}')
              rows = re.findall(r'<tbody>(.*?)</tbody>', html, re.S)
              if len(rows) != 2:
                  raise SystemExit(f'Expected primary and extended Ephemeris tables: {path}')
              labels = re.findall(r'<tr><th scope="row">(Ecliptic|Observing|Rise|Set)</th>', html)
              if labels.count('Ecliptic') != 2 or labels.count('Observing') != 2 or labels.count('Rise') != 2 or labels.count('Set') != 2:
                  raise SystemExit(f'Each Ephemeris table must contain Ecliptic/Observing/Rise/Set rows: {path}')

              raw = re.findall(r'<tr><th scope="row">Observing</th>.*?</tr>', html, re.S)
              if not raw:
                  raise SystemExit(f'Missing Ephemeris observing row: {path}')
              observing = ''.join(raw)
              glyphs = observing.count('class="visibility-glyph"')
              wrapped = observing.count('class="observing-notation-item"')
              if glyphs and wrapped == 0:
                  raise SystemExit(f'Raw observing glyphs are not notation-aware: {path}')

              # data-greek-html deliberately contains encoded HTML whose tag
              # closing ">" appears inside the quoted attribute value.  Do not
              # parse the wrapper with [^>]*; scan through that quoted value to
              # the semantic data-latin attribute instead.
              labels = re.findall(
                  r'<span class="observing-notation-item"\s+'
                  r'data-greek-html=".*?"\s+'
                  r'data-latin="([^"]+)"',
                  observing,
                  re.S,
              )
              valid_labels = ('Naked eye', 'Binoculars', 'Telescope', 'Substantial telescope', 'Daylight', 'Solar glare', 'visible')
              if len(labels) != wrapped:
                  raise SystemExit(f'Observing aid lacks Latin notation markup: {path}')
              for label in labels:
                  if label not in valid_labels:
                      raise SystemExit(f'Observing aid lacks valid Latin notation: {path}')
              checked += 1
              day += timedelta(days=7)
          print(f'PASS: {checked} Ephemeris week(s) have notation-aware observing aids')
          PY

      - name: Commit Ephemeris changes only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- almanack
          if git diff --cached --quiet; then
            echo "No Ephemeris changes in requested ISO week range."
            exit 0
          fi
          git commit -m "Generate Ephemeris ${{ inputs.start_year }}-W${{ inputs.start_week }}"
          git pull --rebase origin main
          git push
