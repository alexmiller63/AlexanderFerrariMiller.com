name: Continuous Build Progress Monitor

on:
  workflow_dispatch:
  schedule:
    - cron: '*/15 * * * *'

permissions:
  actions: read
  contents: write

concurrency:
  group: continuous-build-progress-monitor
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - name: Publish machine-readable progress
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const workflow_id = 'continuous-build-all-2026.yml';
            const runs = await github.paginate(github.rest.actions.listWorkflowRuns, {
              owner, repo, workflow_id, per_page: 100
            });
            const run = runs.find(r => r.status !== 'completed') || runs[0];
            if (!run) {
              core.info('No continuous build runs found.');
              return;
            }
            const jobs = await github.paginate(github.rest.actions.listJobsForWorkflowRun, {
              owner, repo, run_id: run.id, per_page: 100
            });
            const weeks = jobs.filter(j => /^2026 Week (0[2-9]|[1-4][0-9]|5[0-3])$/.test(j.name));
            const completed = weeks.filter(j => j.conclusion === 'success').length;
            const failed = weeks.filter(j => ['failure','timed_out','cancelled'].includes(j.conclusion)).map(j => j.name);
            const active = weeks.filter(j => j.status === 'in_progress').map(j => j.name);
            const payload = {
              updated_at: new Date().toISOString(),
              run_id: run.id,
              run_url: run.html_url,
              run_status: run.status,
              run_conclusion: run.conclusion,
              total_weeks: 52,
              completed_weeks: completed,
              percent_complete: Number((100 * completed / 52).toFixed(1)),
              active_weeks: active,
              failed_weeks: failed,
              note: 'Snapshot of job status, not live stage logs or editorial approval.'
            };
            const path = 'status/continuous-build-2026.json';
            let sha;
            try {
              const existing = await github.rest.repos.getContent({owner, repo, path});
              sha = existing.data.sha;
            } catch (e) {
              if (e.status !== 404) throw e;
            }
            const encoded = Buffer.from(JSON.stringify(payload, null, 2) + '\n').toString('base64');
            for (let attempt = 0; attempt < 3; attempt++) {
              try {
                await github.rest.repos.createOrUpdateFileContents({
                  owner, repo, path, message: 'Update continuous build progress snapshot',
                  content: encoded, ...(sha ? {sha} : {})
                });
                break;
              } catch (e) {
                if (e.status !== 409 && e.status !== 422) throw e;
                const latest = await github.rest.repos.getContent({owner, repo, path});
                sha = latest.data.sha;
                if (attempt === 2) throw e;
              }
            }
            core.summary.addHeading('Continuous Build All 2026')
              .addRaw('Completed: ' + completed + '/52 (' + payload.percent_complete + '%)\\n')
              .addRaw('Active: ' + (active.join(', ') || 'none') + '\\n')
              .addRaw('Failed: ' + (failed.join(', ') || 'none') + '\\n')
              .addLink('Build run', run.html_url);
            await core.summary.write();
