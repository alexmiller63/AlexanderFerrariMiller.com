name: Generate Planet Finder

on:
  workflow_dispatch:
    inputs:
      start_year:
        description: 'ISO start year (blank = current ISO year)'
        required: false
        type: string
      start_week:
        description: 'ISO start week 1-53 (blank = current ISO week)'
        required: false
        type: string
      end_year:
        description: 'ISO end year (blank = start year)'
        required: false
        type: string
      end_week:
        description: 'ISO end week 1-53 (blank = start week)'
        required: false
        type: string
  push:
    paths:
      - tools/generate-current-planet-finder.py
      - tools/star_almanack_ephemeris.py
      - tools/almanack_time.py
      - .github/workflows/generate-current-planet-finder.yml

env:
  STAR_ALMANACK_EPHEMERIS_DIR: ${{ github.workspace }}/.cache/skyfield

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Restore astronomical source cache
        uses: actions/cache@v4
        with:
          path: |
            .cache/skyfield/de440s.bsp
            .cache/skyfield/ceres_1900_2100.bsp
          key: star-almanack-source-kernels-v1

      - name: Install astronomical calculation dependency
        run: python -m pip install --disable-pip-version-check skyfield==1.55

      - name: Download source kernels only when cache is empty
        run: |
          mkdir -p .cache/skyfield
          python - <<'PY'
          from pathlib import Path
          from urllib.request import urlretrieve
          from skyfield.api import Loader

          root = Path('.cache/skyfield')
          de440s = root / 'de440s.bsp'
          ceres = root / 'ceres_1900_2100.bsp'

          if de440s.exists():
              print(f'Reusing cached {de440s} ({de440s.stat().st_size:,} bytes)')
          else:
              print('Downloading JPL/NAIF DE440s source kernel')
              Loader(str(root)).download('de440s.bsp')

          if ceres.exists():
              print(f'Reusing cached {ceres} ({ceres.stat().st_size:,} bytes)')
          else:
              print('Downloading JPL/NAIF Ceres 1900-2100 source kernel')
              urlretrieve(
                  'https://naif.jpl.nasa.gov/pub/naif/generic_kernels/spk/asteroids/a_old_versions/ceres_1900_2100.bsp',
                  ceres,
              )
          PY

      - name: Resolve ISO week range
        id: range
        env:
          INPUT_START_YEAR: ${{ inputs.start_year }}
          INPUT_START_WEEK: ${{ inputs.start_week }}
          INPUT_END_YEAR: ${{ inputs.end_year }}
          INPUT_END_WEEK: ${{ inputs.end_week }}
        run: |
          python - <<'PY'
          import os
          from datetime import date

          today = date.today()
          current_year, current_week, _ = today.isocalendar()

          def parse_int(name, raw, default):
              raw = (raw or '').strip()
              if not raw:
                  return default
              try:
                  return int(raw)
              except ValueError:
                  raise SystemExit(f'{name} must be an integer')

          sy = parse_int('start_year', os.getenv('INPUT_START_YEAR'), current_year)
          sw = parse_int('start_week', os.getenv('INPUT_START_WEEK'), current_week)
          ey = parse_int('end_year', os.getenv('INPUT_END_YEAR'), sy)
          ew = parse_int('end_week', os.getenv('INPUT_END_WEEK'), sw)

          def monday(y, w):
              try:
                  return date.fromisocalendar(y, w, 1)
              except ValueError as exc:
                  raise SystemExit(f'Invalid ISO week {y}-W{w:02d}: {exc}')

          start = monday(sy, sw)
          end = monday(ey, ew)
          if end < start:
              raise SystemExit('End ISO week must not precede start ISO week')

          with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
              f.write(f'start_year={sy}\n')
              f.write(f'start_week={sw}\n')
              f.write(f'end_year={ey}\n')
              f.write(f'end_week={ew}\n')
              f.write(f'start_date={start.isoformat()}\n')
              f.write(f'end_date={end.isoformat()}\n')
          PY

      - name: Calculate local Planet Finder positions
        env:
          START_DATE: ${{ steps.range.outputs.start_date }}
          END_DATE: ${{ steps.range.outputs.end_date }}
        run: |
          python - <<'PY'
          import csv
          import os
          import sys
          from collections import defaultdict
          from datetime import date, timedelta
          from pathlib import Path

          sys.path.insert(0, 'tools')
          from star_almanack_ephemeris import StarAlmanackEphemeris

          signs = '♈♉♊♋♌♍♎♏♐♑♒♓'
          bodies = ('sun', 'moon', 'mercury', 'venus', 'mars', 'jupiter', 'saturn', 'uranus', 'neptune', 'ceres')

          def zodiac(longitude):
              minutes = int(round((longitude % 360.0) * 60.0)) % (360 * 60)
              sign_index, within = divmod(minutes, 1800)
              degree, minute = divmod(within, 60)
              return f'{signs[sign_index]} {degree}°{minute:02d}′'

          start = date.fromisoformat(os.environ['START_DATE'])
          end = date.fromisoformat(os.environ['END_DATE'])
          engine = StarAlmanackEphemeris()
          rows_by_year = defaultdict(list)

          d = start
          while d <= end:
              year, week, _ = d.isocalendar()
              row = {
                  'iso_week': f'{year}-W{week:02d}',
                  'monday_utc': d.isoformat(),
              }
              for body in bodies:
                  row[body] = zodiac(engine.sample(body, d).longitude_deg)
              rows_by_year[year].append(row)
              d += timedelta(days=7)

          root = Path('Historical')
          fields = ['iso_week', 'monday_utc', *bodies]
          for year, rows in sorted(rows_by_year.items()):
              path = root / f'weekly-ephemeris-{year}.csv'
              with path.open('w', encoding='utf-8', newline='') as f:
                  writer = csv.DictWriter(f, fieldnames=fields)
                  writer.writeheader()
                  writer.writerows(rows)
              print(f'Calculated {len(rows)} local Planet Finder position rows in {path}')
          PY

      - name: Generate Planet Finder range
        env:
          START_DATE: ${{ steps.range.outputs.start_date }}
          END_DATE: ${{ steps.range.outputs.end_date }}
        run: |
          python - <<'PY'
          import os
          import subprocess
          from datetime import date, timedelta

          d = date.fromisoformat(os.environ['START_DATE'])
          end = date.fromisoformat(os.environ['END_DATE'])
          while d <= end:
              year, week, _ = d.isocalendar()
              print(f'Generating ISO {year}-W{week:02d}')
              subprocess.run(
                  ['python', 'tools/generate-current-planet-finder.py', str(year), str(week)],
                  check=True,
              )
              d += timedelta(days=7)
          PY

      - name: Commit generated finders
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add almanack/*/W*/finders/planet-finder-greek-symbols.svg \
                  almanack/*/W*/finders/planet-finder-latin.svg \
                  almanack/*/W*/finders/planet-finder-mixed-learner.svg

          # The weekly ephemeris CSVs are temporary local inputs for this workflow.
          # Restore tracked canonical CSVs, then delete only untracked temporary slices.
          git ls-files -z 'weekly-ephemeris-*.csv' \
            | xargs -0 -r git restore --worktree --
          git ls-files --others --exclude-standard -z -- 'weekly-ephemeris-*.csv' \
            | xargs -0 -r rm -f --

          if git diff --cached --quiet; then
            echo "Planet Finder output already current."
            exit 0
          fi
          if ! git diff --quiet; then
            echo "Unexpected unstaged tracked changes remain before commit:"
            git status --short
            exit 1
          fi
          git commit -m "Generate Planet Finder ISO week range"
          git pull --rebase origin main
          git push origin HEAD:main
