name: Chromium Artwork Acceptance

on:
  workflow_dispatch:
    inputs:
      year:
        description: Year
        required: true
        default: '2026'
        type: string
      start_week:
        description: Start week
        required: true
        default: '36'
        type: string
      end_week:
        description: End week
        required: true
        default: '36'
        type: string

permissions:
  contents: read

jobs:
  chromium-artwork-acceptance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Install Playwright Chromium
        run: |
          python -m pip install playwright
          python -m playwright install --with-deps chromium

      - name: Validate published GitHub Pages artwork
        shell: bash
        env:
          YEAR: ${{ inputs.year }}
          START_WEEK: ${{ inputs.start_week }}
          END_WEEK: ${{ inputs.end_week }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import os
          from urllib.parse import urljoin
          from playwright.sync_api import sync_playwright

          year = os.environ['YEAR']
          start = int(os.environ['START_WEEK'])
          end = int(os.environ['END_WEEK'])
          base = 'https://alexmiller63.github.io/AlexanderFerrariMiller.com'
          checked = 0

          with sync_playwright() as p:
              browser = p.chromium.launch()
              context = browser.new_context()
              page = context.new_page()
              for n in range(start, end + 1):
                  week = f'W{n:02d}'
                  url = f'{base}/site/{year}/{week}/index.html'
                  response = page.goto(url, wait_until='networkidle')
                  status = None if response is None else response.status
                  if response is None or not response.ok:
                      raise SystemExit(f'{week}: published week page failed: HTTP {status}: {url}')

                  artwork = page.locator('figure.sky-note-artwork a', has_text='Artwork')
                  if artwork.count() != 1:
                      raise SystemExit(f'{week}: expected exactly one published Artwork link, found {artwork.count()}')
                  href = artwork.first.get_attribute('href')
                  if not href:
                      raise SystemExit(f'{week}: published Artwork link has no href')

                  destination_url = urljoin(page.url, href)
                  destination = context.new_page()
                  response = destination.goto(destination_url, wait_until='networkidle')
                  status = None if response is None else response.status
                  if response is None or not response.ok:
                      raise SystemExit(f'{week}: published Artwork destination failed: HTTP {status}: {destination_url}')
                  if destination.locator('svg').count() < 1:
                      body = destination.locator('body').inner_text()[:200]
                      raise SystemExit(f'{week}: published Artwork destination is not rendered SVG: {destination_url}; body={body!r}')
                  print(f'{week}: published Chromium check passed: {destination_url}')
                  destination.close()
                  checked += 1
              context.close()
              browser.close()

          if checked == 0:
              raise SystemExit('No published Artwork pages were checked.')
          print(f'Chromium validated {checked} published GitHub Pages Artwork page(s).')
          PY
