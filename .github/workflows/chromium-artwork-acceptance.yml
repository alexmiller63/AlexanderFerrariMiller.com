name: Chromium Artwork Acceptance

on:
  workflow_dispatch:
    inputs:
      year:
        description: Year
        required: true
        default: '2026'
        type: string
      start_week:
        description: Start week
        required: true
        default: '36'
        type: string
      end_week:
        description: End week
        required: true
        default: '36'
        type: string

permissions:
  contents: read

jobs:
  chromium-artwork-acceptance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Chromium Artwork acceptance check
        shell: bash
        run: |
          set -euo pipefail
          python -m http.server 8765 --directory . >/tmp/artwork-http.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          sleep 1

          chromium_bin="$(command -v chromium || command -v chromium-browser || command -v google-chrome || true)"
          if [ -z "$chromium_bin" ]; then
            echo "Chromium/Chrome is not available on this runner." >&2
            exit 1
          fi

          checked=0
          for ((week_value=10#${{ inputs.start_week }}; week_value<=10#${{ inputs.end_week }}; week_value++)); do
            week="W$(printf '%02d' "$week_value")"
            page="site/${{ inputs.year }}/${week}/index.html"
            svg="sky-notes-artwork/${{ inputs.year }}/${week}/finder.svg"
            if [ ! -f "$page" ] || [ ! -f "$svg" ]; then
              continue
            fi

            checked=$((checked + 1))
            url="http://127.0.0.1:8765/site/${{ inputs.year }}/${week}/index.html"
            dom_file="/tmp/${week}-artwork-dom.html"
            "$chromium_bin" --headless --no-sandbox --disable-gpu --virtual-time-budget=3000 --dump-dom "$url" > "$dom_file"
            python tools/check_sky_note_artwork_dom.py "$dom_file" "$svg" "$week"

            artwork_href="$(python - "$dom_file" <<'PY'
import sys
from pathlib import Path
from tools.check_sky_note_artwork_dom import ArtworkParser
p = ArtworkParser()
p.feed(Path(sys.argv[1]).read_text(encoding='utf-8'))
if len(p.artwork_hrefs) != 1:
    raise SystemExit(f'Expected exactly one Artwork link, found {p.artwork_hrefs!r}')
print(p.artwork_hrefs[0])
PY
)"
            case "$artwork_href" in
              http://*|https://*) artwork_url="$artwork_href" ;;
              /*) artwork_url="http://127.0.0.1:8765$artwork_href" ;;
              *) artwork_url="$(python - "$url" "$artwork_href" <<'PY'
import sys
from urllib.parse import urljoin
print(urljoin(sys.argv[1], sys.argv[2]))
PY
)" ;;
            esac

            destination="/tmp/${week}-artwork-destination"
            "$chromium_bin" --headless --no-sandbox --disable-gpu --virtual-time-budget=3000 --dump-dom "$artwork_url" > "$destination"
            python - "$artwork_url" "$destination" <<'PY'
import sys
from pathlib import Path
from urllib.parse import urlparse
url, path = sys.argv[1], Path(sys.argv[2])
if urlparse(url).path.lower().endswith('.json'):
    raise SystemExit(f'Artwork link resolved to JSON descriptor: {url}')
text = path.read_text(encoding='utf-8', errors='replace').lstrip().lower()
if '<svg' not in text:
    raise SystemExit(f'Artwork link did not render SVG artwork: {url}')
print(f'Chromium followed Artwork link to rendered SVG: {url}')
PY
          done

          if [ "$checked" -eq 0 ]; then
            echo "No generated Artwork pages were available for Chromium validation." >&2
            exit 1
          fi
          echo "Chromium validated $checked Artwork page(s), including link destinations."
