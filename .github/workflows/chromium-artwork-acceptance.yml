name: Chromium Artwork Acceptance

on:
  workflow_dispatch:
    inputs:
      year:
        description: Year
        required: true
        default: '2026'
        type: string
      start_week:
        description: Start week
        required: true
        default: '36'
        type: string
      end_week:
        description: End week
        required: true
        default: '36'
        type: string

permissions:
  contents: read

jobs:
  chromium-artwork-acceptance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Install Playwright Chromium
        run: |
          python -m pip install playwright
          python -m playwright install --with-deps chromium

      - name: Prove verifier rejects a bad deployed URL
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from playwright.sync_api import sync_playwright

          url = 'https://alexmiller63.github.io/AlexanderFerrariMiller.com/__chromium_verifier_must_404__.html'
          print(f'NEGATIVE CONTROL URL: {url}')
          with sync_playwright() as p:
              browser = p.chromium.launch()
              page = browser.new_page()
              response = page.goto(url, wait_until='networkidle')
              status = None if response is None else response.status
              print(f'NEGATIVE CONTROL HTTP STATUS: {status}')
              browser.close()

          if response is not None and response.ok:
              raise SystemExit(f'Negative control unexpectedly succeeded: HTTP {status}: {url}')
          print('NEGATIVE CONTROL PASSED: Chromium correctly observed the deliberately missing deployed URL.')
          PY

      - name: Validate published GitHub Pages artwork
        shell: bash
        env:
          YEAR: ${{ inputs.year }}
          START_WEEK: ${{ inputs.start_week }}
          END_WEEK: ${{ inputs.end_week }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import os
          from urllib.parse import urljoin
          from playwright.sync_api import sync_playwright

          year = os.environ['YEAR']
          start = int(os.environ['START_WEEK'])
          end = int(os.environ['END_WEEK'])
          base = 'https://alexmiller63.github.io/AlexanderFerrariMiller.com'
          checked = 0

          with sync_playwright() as p:
              browser = p.chromium.launch()
              context = browser.new_context()
              page = context.new_page()
              for n in range(start, end + 1):
                  week = f'W{n:02d}'
                  url = f'{base}/almanack/{year}/{week}/index.html'
                  print(f'WEEK PAGE URL: {url}')
                  response = page.goto(url, wait_until='networkidle')
                  status = None if response is None else response.status
                  print(f'{week}: WEEK PAGE HTTP STATUS: {status}')
                  if response is None or not response.ok:
                      raise SystemExit(f'{week}: published week page failed: HTTP {status}: {url}')

                  # Acceptance is reader-facing: every Sky Notes link must resolve on the
                  # deployed page, not merely exist in generated source.
                  links = page.locator('.sky-note a')
                  link_count = links.count()
                  print(f'{week}: SKY NOTES LINK COUNT: {link_count}')
                  if link_count == 0:
                      raise SystemExit(f'{week}: Sky Notes contains no reader-facing links: {url}')
                  for i in range(link_count):
                      href = links.nth(i).get_attribute('href')
                      label = links.nth(i).inner_text().strip() or f'link {i + 1}'
                      if not href:
                          raise SystemExit(f'{week}: Sky Notes link has no href: {label!r}: {url}')
                      link_url = urljoin(page.url, href)
                      target = context.new_page()
                      link_response = target.goto(link_url, wait_until='networkidle')
                      link_status = None if link_response is None else link_response.status
                      print(f'{week}: SKY NOTES LINK: {label!r} -> HTTP {link_status}: {link_url}')
                      if link_response is None or not link_response.ok:
                          raise SystemExit(
                              f'{week}: reader-facing Sky Notes link failed: '
                              f'{label!r} -> HTTP {link_status}: {link_url}'
                          )
                      target.close()

                  artwork = page.locator('figure.sky-note-artwork a', has_text='Artwork')
                  count = artwork.count()
                  print(f'{week}: ARTWORK LINK COUNT: {count}')
                  if count != 1:
                      raise SystemExit(f'{week}: expected exactly one published Artwork link, found {count}: {url}')
                  href = artwork.first.get_attribute('href')
                  if not href:
                      raise SystemExit(f'{week}: published Artwork link has no href: {url}')

                  destination_url = urljoin(page.url, href)
                  print(f'{week}: ARTWORK DESTINATION URL: {destination_url}')
                  destination = context.new_page()
                  response = destination.goto(destination_url, wait_until='networkidle')
                  status = None if response is None else response.status
                  print(f'{week}: ARTWORK DESTINATION HTTP STATUS: {status}')
                  if response is None or not response.ok:
                      raise SystemExit(f'{week}: published Artwork destination failed: HTTP {status}: {destination_url}')
                  svg_count = destination.locator('svg').count()
                  print(f'{week}: RENDERED SVG COUNT: {svg_count}')
                  if svg_count < 1:
                      body = destination.locator('body').inner_text()[:200]
                      raise SystemExit(f'{week}: published Artwork destination is not rendered SVG: {destination_url}; body={body!r}')
                  print(f'{week}: POSITIVE CONTROL PASSED: deployed artwork rendered in Chromium: {destination_url}')
                  destination.close()
                  checked += 1
              context.close()
              browser.close()

          if checked == 0:
              raise SystemExit('No published Artwork pages were checked.')
          print(f'VERIFIER PROOF COMPLETE: Chromium validated {checked} published GitHub Pages Artwork page(s) after passing the negative control.')
          PY
