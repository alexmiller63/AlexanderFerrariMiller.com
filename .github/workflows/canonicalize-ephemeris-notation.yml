name: Canonicalize ephemeris notation

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Make generator emit canonical notation markup
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('tools/populate_ephemeris.py')
          text = path.read_text(encoding='utf-8')
          old = '''def target_heading(display):
              glyph, name = display.split(" ", 1)
              return f"{symbol_html(glyph)} {name}"
          '''
          new = '''def target_heading(display):
              glyph, name = display.split(" ", 1)
              greek = f"{glyph}\\ufe0e"
              mixed = f"{greek} {name}"
              return (
                  '<span class="notation-item ephemeris-notation-item" '
                  f'data-greek="{html.escape(greek, quote=True)}" '
                  f'data-latin="{html.escape(name, quote=True)}" '
                  f'data-mixed="{html.escape(mixed, quote=True)}">'
                  f'{symbol_html(glyph)}</span>'
              )
          '''
          if old not in text:
              raise SystemExit('Expected target_heading implementation not found; refusing blind edit')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY

      - name: Make shared notation controller own all ephemeris bodies
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('almanack/js/notation.js')
          text = path.read_text(encoding='utf-8')
          old = "const bodyNames = {'☉':'Sun','☽':'Moon','☿':'Mercury','♀':'Venus','♂':'Mars','♃':'Jupiter','♄':'Saturn'};"
          new = "const bodyNames = {'☉':'Sun','☽':'Moon','☿':'Mercury','♀':'Venus','♂':'Mars','♃':'Jupiter','♄':'Saturn','⚳':'Ceres','♅':'Uranus','♆':'Neptune','♇':'Pluto'};"
          if old not in text:
              raise SystemExit('Expected bodyNames definition not found; refusing blind edit')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY

      - name: Verify canonical architecture
        run: |
          python - <<'PY'
          from pathlib import Path

          generator = Path('tools/populate_ephemeris.py').read_text(encoding='utf-8')
          controller = Path('almanack/js/notation.js').read_text(encoding='utf-8')
          wrapper = Path('tools/populate_ephemeris_by_date.py').read_text(encoding='utf-8')

          required = ('data-greek=', 'data-latin=', 'data-mixed=', 'ephemeris-notation-item')
          missing = [token for token in required if token not in generator]
          if missing:
              raise SystemExit('Generator missing canonical notation markup: ' + ', '.join(missing))

          for glyph, name in (('⚳','Ceres'),('♅','Uranus'),('♆','Neptune'),('♇','Pluto')):
              if f"'{glyph}':'{name}'" not in controller:
                  raise SystemExit(f'Shared controller missing {name}')

          if '_symbol_only_target_heading' in wrapper or 'ephemeris.target_heading =' in wrapper:
              raise SystemExit('Ephemeris monkey patch still present')

          if Path('tools/wire_ephemeris_notation.py').exists():
              raise SystemExit('Legacy notation controller still exists')
          PY

      - name: Commit canonical notation architecture
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tools/populate_ephemeris.py almanack/js/notation.js
          git diff --cached --check
          git commit -m 'Make shared notation controller canonical for ephemeris'
          git pull --rebase origin main
          git push origin HEAD:main
