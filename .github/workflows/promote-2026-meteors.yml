name: Promote 2026 meteor showers
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/promote-2026-meteors.yml'
      - 'tools/promote_2026_meteor_showers.py'
permissions:
  contents: write
jobs:
  promote:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python tools/promote_2026_meteor_showers.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add almanack/2026
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Add meteor shower peaks to 2026 calendar"
          git pull --rebase origin main
          git push
