name: Legacy 2026 Meteor Showers (manual compatibility)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  promote:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Populate canonical 2026 meteor showers through parameterized generator
        run: python tools/populate_meteor_showers.py 2026

      - name: Commit canonical 2026 meteor output
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            almanack/2026 \
            Star-Almanack-Repo/site/2026 \
            Star-Almanack-Repo/generated/meteor-showers-2026.json
          if git diff --cached --quiet; then
            echo "No 2026 meteor changes"
            exit 0
          fi
          git commit -m "Regenerate canonical 2026 meteor showers"
          git pull --rebase origin main
          git push
