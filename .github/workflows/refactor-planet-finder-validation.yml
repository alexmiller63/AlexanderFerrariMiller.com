name: Refactor Planet Finder Validation

on:
  push:
    branches: [refactor/planet-finder-search]
    paths:
      - tools/refactor_planet_finder_validation.py
      - .github/workflows/refactor-planet-finder-validation.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract-validate-commit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/planet-finder-search
          fetch-depth: 0
      - name: Install pinned dependencies
        run: |
          python -m pip install --disable-pip-version-check 'numpy==1.26.4' 'skyfield==1.55'
      - name: Ensure kernels
        run: python tools/ensure_ephemeris_kernels.py --ceres
      - name: Baseline W36
        shell: bash
        run: |
          set -euo pipefail
          FINDERS_DIR="$(PYTHONPATH=tools python - <<'PY'
          from almanack_paths import week_dir
          print(week_dir(2026, 36) / 'finders')
          PY
          )"
          echo "FINDERS_DIR=$FINDERS_DIR" >> "$GITHUB_ENV"
          python tools/generate_planet_finders.py --year 2026 --week 36
          rm -rf /tmp/pf-baseline && cp -a "$FINDERS_DIR" /tmp/pf-baseline
          git checkout -- "$FINDERS_DIR" 2>/dev/null || true
      - name: Extract validation
        run: python tools/refactor_planet_finder_validation.py
      - name: Compile
        run: |
          python -m py_compile tools/planet_finder_validation.py
          python -m py_compile tools/generate_planet_finders.py
      - name: Verify import identity
        env:
          PYTHONPATH: tools
        run: |
          python - <<'PY'
          import generate_planet_finders as g
          import planet_finder_validation as v
          assert g.validate_layout is v.validate_layout
          PY
      - name: Regenerate W36
        run: python tools/generate_planet_finders.py --year 2026 --week 36
      - name: Verify byte equivalence
        shell: bash
        run: |
          set -euo pipefail
          diff -ru /tmp/pf-baseline "$FINDERS_DIR"
          git checkout -- "$FINDERS_DIR" 2>/dev/null || true
      - name: Commit atomically
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add tools/generate_planet_finders.py tools/planet_finder_validation.py
          git diff --cached --quiet && exit 0
          git commit -m "Extract Planet Finder layout validation"
          git push origin HEAD:refactor/planet-finder-search
