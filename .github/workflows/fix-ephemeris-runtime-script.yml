name: Fix Ephemeris Runtime Script

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Make ephemeris generator install shared runtime
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('tools/populate_ephemeris_by_date.py')
          text = path.read_text(encoding='utf-8')

          old = '''    new = ephemeris.put_ephemeris(text, replacement, path)\n    if new != text:\n        path.write_text(new, encoding="utf-8")\n        changed += 1\n'''
          new = '''    new = ephemeris.put_ephemeris(text, replacement, path)\n    runtime = '<script src="../../../js/ephemeris.js"></script>'\n    if runtime not in new:\n        if '</body>' not in new:\n            raise RuntimeError(f"Missing </body> in weekly page: {path.relative_to(ephemeris.ROOT)}")\n        new = new.replace('</body>', runtime + '\\n</body>', 1)\n    if new != text:\n        path.write_text(new, encoding="utf-8")\n        changed += 1\n'''

          if old not in text:
              raise SystemExit('Expected canonical generator block not found; refusing to patch')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY

      - name: Verify source change
        run: |
          grep -F 'runtime = '\''<script src="../../../js/ephemeris.js"></script>'\''' tools/populate_ephemeris_by_date.py

      - name: Commit and push
        run: |
          if git diff --quiet; then
            echo "No changes needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools/populate_ephemeris_by_date.py
          git commit -m "Load ephemeris runtime from canonical generator"
          git pull --rebase origin main
          git push origin HEAD:main
