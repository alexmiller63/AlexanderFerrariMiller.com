name: Repair Historical Path References

on:
  push:
    branches: [main]
    paths:
      - tools/trigger-historical-path-repair.txt

permissions:
  contents: read

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Prepare repaired workflow files
        run: |
          python - <<'PY'
          from pathlib import Path

          old = "Star-Almanack-Repo"
          new = "Historical"
          changed = []
          root = Path('.github/workflows')
          for path in sorted(root.glob('*.y*ml')):
              text = path.read_text(encoding='utf-8')
              if old not in text:
                  continue
              path.write_text(text.replace(old, new), encoding='utf-8')
              changed.append(str(path))
          print(f"Prepared {len(changed)} repaired workflow files")
          for path in changed:
              print(path)
          PY

      - name: Upload repaired workflows
        uses: actions/upload-artifact@v4
        with:
          name: repaired-workflows
          path: .github/workflows
          if-no-files-found: error
