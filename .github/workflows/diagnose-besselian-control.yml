name: Diagnose Besselian Eclipse Control

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/diagnose-besselian-control.yml'
      - 'eclipse-validation-cases.yaml'

jobs:
  compare-besselian:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install diagnostic dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyyaml scipy skyfield pandas numpy
          python -m pip install 'git+https://github.com/lkangas/eclipse-calc.git@23853a8f9e0d1a25e026203207aca16de1d7bb31'

      - name: Download complete DE440s ephemeris for apparent-position deflection
        run: |
          python - <<'PY'
          from skyfield.api import load
          eph = load('de440s.bsp')
          for body in (0, 3, 5, 6, 10, 301, 399):
              eph[body]
          print('DE440s ephemeris includes Jupiter and Saturn barycenters')
          PY

      - name: Run independent Besselian greatest-eclipse comparison
        run: |
          python - <<'PY'
          from datetime import datetime, timezone
          from pathlib import Path

          import yaml
          from scipy.optimize import minimize_scalar
          from skyfield.api import load
          from eclipse_calc import BesselianEclipse

          ROOT = Path('.')
          CASES = ROOT / 'eclipse-validation-cases.yaml'
          KERNEL = Path('de440s.bsp')

          if not KERNEL.exists():
              raise SystemExit(f'missing preserved ephemeris kernel: {KERNEL}')

          data = yaml.safe_load(CASES.read_text())
          cases = []
          for case in data['historical']:
              cases.append((case['label'], case['nasa_greatest_td']))
          for case in data['future_jello']['cases']:
              cases.append((case['label'], case['nasa_greatest_td']))

          ts = load.timescale()
          eph = load(str(KERNEL))

          def parse_iso(s):
              if s.endswith('Z'):
                  raise ValueError('TD reference must not carry a UTC Z suffix')
              dt = datetime.fromisoformat(s)
              if dt.tzinfo is not None:
                  raise ValueError('TD reference must be a timezone-free TT calendar label')
              return dt

          def fmt(dt):
              return dt.astimezone(timezone.utc).strftime('%Y-%m-%dT%H:%M:%S.%fZ')

          print('STAR ALMANACK — INDEPENDENT BESSELIAN CONTROL')
          print('Implementation: lkangas/eclipse-calc (MIT), ephemeris-direct Besselian elements')
          print('Ephemeris: complete DE440s (Jupiter and Saturn barycenters included)')
          print('Residual: calculated TT minus published NASA TD; no UT/UTC conversion')
          print('Greatest eclipse criterion: minimum x^2 + y^2 in the Bessel fundamental plane')
          print()
          print(f"{'Case':38s} {'NASA TD':>11s} {'Bessel TT':>11s} {'Residual':>10s}")
          print('-' * 76)

          residuals = []
          for label, ref_iso in cases:
              ref_dt = parse_iso(ref_iso)
              t0 = ts.tt(ref_dt.year, ref_dt.month, ref_dt.day,
                         ref_dt.hour, ref_dt.minute, ref_dt.second + ref_dt.microsecond / 1e6)
              eclipse = BesselianEclipse(t0, eph)

              def objective(seconds):
                  t = ts.tt_jd(t0.tt + seconds / 86400.0)
                  row = eclipse.elements_at(t, derivatives=False).iloc[0]
                  return float(row['x'])**2 + float(row['y'])**2

              result = minimize_scalar(
                  objective,
                  bounds=(-300.0, 300.0),
                  method='bounded',
                  options={'xatol': 1e-5},
              )
              if not result.success:
                  raise RuntimeError(result.message)
              seconds = float(result.x)
              calc = ts.tt_jd(t0.tt + seconds / 86400.0)
              residual = float((calc.tt - t0.tt) * 86400.0)
              residuals.append(residual)

              print(
                  f"{label:38.38s} "
                  f"{ref_dt.strftime('%H:%M:%S'):>11s} "
                  f"{calc.tt_strftime('%H:%M:%S'):>11s} "
                  f"{residual:+9.3f}s"
              )

          mean_signed = sum(residuals) / len(residuals)
          mean_abs = sum(abs(x) for x in residuals) / len(residuals)
          max_abs = max(abs(x) for x in residuals)

          print()
          print('SUMMARY')
          print('-' * 76)
          print(f'n={len(residuals)}')
          print(f'mean signed residual = {mean_signed:+.3f} s')
          print(f'mean absolute residual = {mean_abs:.3f} s')
          print(f'max absolute residual = {max_abs:.3f} s')
          tolerance = float(data['tolerances']['besselian_greatest_time_seconds'])
          if max_abs > tolerance:
              raise SystemExit(f'Besselian TT regression: {max_abs:.3f}s > {tolerance:.3f}s')
          PY
