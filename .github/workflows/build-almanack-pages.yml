name: Publish 2026 Star Almanack Pages

"on":
  workflow_dispatch:
  schedule:
    - cron: '17 * * * *'
  push:
    paths:
      - .github/workflows/build-almanack-pages.yml

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Check out website
        uses: actions/checkout@v4

      - name: Fetch generated 2026 Star Almanack pages
        run: |
          set -euo pipefail
          rm -rf almanack/2026
          mkdir -p almanack/2026

          curl -fsSL \
            https://raw.githubusercontent.com/alexmiller63/star-almanack/main/site/2026/index.html \
            -o almanack/2026/index.html

          for n in $(seq -w 1 53); do
            mkdir -p "almanack/2026/W${n}"
            curl -fsSL \
              "https://raw.githubusercontent.com/alexmiller63/star-almanack/main/site/2026/W${n}/index.html" \
              -o "almanack/2026/W${n}/index.html"
          done

      - name: Validate complete 53-page publication
        run: |
          python - <<'PY'
          from pathlib import Path

          root = Path('almanack/2026')
          assert (root / 'index.html').is_file(), 'Missing 2026 Almanack index'
          pages = [root / f'W{i:02d}' / 'index.html' for i in range(1, 54)]
          missing = [str(p) for p in pages if not p.is_file()]
          assert not missing, f'Missing weekly pages: {missing}'
          assert len(pages) == 53
          for i, p in enumerate(pages, 1):
              text = p.read_text(encoding='utf-8')
              assert f'W{i:02d}' in text, f'Week identity missing in {p}'
          print('Validated index + 53 weekly Star Almanack pages')
          PY

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"

      - name: Install Jekyll
        run: gem install jekyll --no-document

      - name: Examine Jekyll configuration
        run: jekyll doctor

      - name: Build Jekyll with full diagnostics
        run: jekyll build --trace

      - name: Examine rendered Star Almanack
        run: python tools/examine-almanack-jekyll.py

      - name: Commit published pages
        id: publish
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add almanack/2026
          if git diff --cached --quiet; then
            echo "No published Almanack changes."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git commit -m "Publish 2026 Star Almanack weekly pages"
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Deploy synchronized pages to AWS
        if: steps.publish.outputs.changed == 'true'
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.AWS_HOST }}
          username: ${{ secrets.AWS_USER }}
          key: ${{ secrets.AWS_SSH_KEY }}
          script: |
            ~/build-alex.sh
