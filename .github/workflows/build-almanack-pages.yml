name: Build Almanack Pages

"on":
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/build-almanack-pages.yml
      - tools/build_almanack_pages.py

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out website
        uses: actions/checkout@v4

      - name: Install Markdown renderer
        run: python -m pip install markdown

      - name: Fetch authoritative Almanack source
        run: curl -fsSL https://raw.githubusercontent.com/alexmiller63/star-almanack/main/almanack.md -o /tmp/almanack.md

      - name: Build ISO week pages
        run: python tools/build_almanack_pages.py

      - name: Commit generated pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add almanack/weeks
          if git diff --cached --quiet; then
            echo "No Almanack page changes."
            exit 0
          fi
          git commit -m "Build Almanack ISO week pages"
          git push
