name: Publish 2026 Star Almanack Pages

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths-ignore:
      - 'almanack/**'

permissions:
  contents: write

concurrency:
  group: publish-2026-star-almanack
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Check out website repository
        uses: actions/checkout@v4
        with:
          path: website

      - name: Replace Almanack with one atomic in-repository source snapshot
        run: |
          set -euo pipefail
          cd website
          SOURCE_ROOT="Star-Almanack-Repo"
          SOURCE_SITE="$SOURCE_ROOT/site/2026"
          PROVENANCE="$SOURCE_ROOT/COPY-PROVENANCE.txt"
          test -d "$SOURCE_SITE" || { echo "ERROR: Missing in-repository Star Almanack source: $SOURCE_SITE"; exit 1; }
          test -f "$PROVENANCE" || { echo "ERROR: Missing copy provenance: $PROVENANCE"; exit 1; }
          SOURCE_SHA="$(sed -n 's/^Source commit: //p' "$PROVENANCE")"
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "ERROR: Invalid Source commit in $PROVENANCE: $SOURCE_SHA"; exit 1; }
          rm -f almanack/ISO2026-W*.html
          rm -rf almanack/weeks almanack/2026
          mkdir -p almanack/2026
          cp -a "$SOURCE_SITE"/. almanack/2026/
          printf '%s\n' "$SOURCE_SHA" > almanack/2026/.source-commit

      - name: Build ISO placeholder layers
        run: |
          cd website
          python tools/build-almanack-placeholders.py

      - name: Validate complete fresh canonical publication
        run: |
          set -euo pipefail
          cd website
          python - <<'PY'
          from pathlib import Path
          from datetime import date
          root = Path('almanack/2026')
          assert (root / 'index.html').is_file()
          marker = root / '.source-commit'
          assert marker.is_file() and len(marker.read_text().strip()) == 40
          pages = [root / f'W{i:02d}' / 'index.html' for i in range(1,54)]
          assert not [str(p) for p in pages if not p.is_file()]
          for i,p in enumerate(pages,1):
              text=p.read_text(encoding='utf-8')
              assert f'W{i:02d}' in text
              assert '<table class="calendar">' in text
              assert 'Best visibility:' not in text
              assert 'data-bayer-mode="greek"' in text and 'data-bayer-mode="latin"' in text and 'data-bayer-mode="mixed"' in text
              assert 'Greek/Symbols' in text and 'Mixed Learner' in text
              assert '© 2026 Alexander Ferrari Miller. All rights reserved.' in text
          for year in (2025,2027):
              yroot=Path('almanack')/str(year)
              assert (yroot/'index.html').is_file()
              count=date(year,12,28).isocalendar().week
              for week in range(1,count+1):
                  page=yroot/f'W{week:02d}'/'index.html'
                  assert page.is_file()
                  text=page.read_text(encoding='utf-8')
                  assert f'ISO week {week:02d} {year}' in text
                  assert 'currently in preparation' in text
          assert not list(Path('almanack').glob('ISO2026-W*.html'))
          assert not Path('almanack/weeks').exists()
          print('Validated canonical 2026 publication plus 2025/2027 ISO placeholder layers')
          PY

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"

      - name: Install Jekyll
        run: |
          cd website
          gem install jekyll --no-document

      - name: Examine Jekyll configuration
        run: |
          cd website
          jekyll doctor

      - name: Build Jekyll with full diagnostics
        run: |
          cd website
          jekyll build --trace

      - name: Examine rendered Star Almanack
        run: |
          cd website
          python tools/examine-almanack-jekyll.py

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: website/_site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Commit published pages
        run: |
          set -euo pipefail
          cd website
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A almanack
          if git diff --cached --quiet; then
            echo "No published Almanack changes."
            exit 0
          fi
          SOURCE_SHA=$(cat almanack/2026/.source-commit)
          git commit -m "Publish Star Almanack source ${SOURCE_SHA:0:12}"
          git pull --rebase origin main
          git push

      - name: Deploy synchronized pages to AWS
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.AWS_HOST }}
          username: ${{ secrets.AWS_USER }}
          key: ${{ secrets.AWS_SSH_KEY }}
          script: |
            ~/build-alex.sh
