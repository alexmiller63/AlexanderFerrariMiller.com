name: Wire ephemeris notation modes

on:
  workflow_dispatch:
    inputs:
      start_year:
        description: 'First ISO year'
        required: true
        default: '2026'
      start_week:
        description: 'First ISO week'
        required: true
        default: '38'
      end_year:
        description: 'Last ISO year (blank = start week only)'
        required: false
        default: ''
      end_week:
        description: 'Last ISO week (blank = start week only)'
        required: false
        default: ''
  push:
    branches: [main]
    paths:
      - .github/workflows/wire-ephemeris-notation.yml
      - tools/ephemeris-notation-trigger.txt
      - tools/wire_ephemeris_notation.py

env:
  START_YEAR: ${{ github.event_name == 'workflow_dispatch' && inputs.start_year || '2025' }}
  START_WEEK: ${{ github.event_name == 'workflow_dispatch' && inputs.start_week || '1' }}
  END_YEAR: ${{ github.event_name == 'workflow_dispatch' && inputs.end_year || '2027' }}
  END_WEEK: ${{ github.event_name == 'workflow_dispatch' && inputs.end_week || '52' }}

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Wire ephemeris notation
        run: python tools/wire_ephemeris_notation.py "$START_YEAR" "$START_WEEK" "$END_YEAR" "$END_WEEK"

      - name: Commit changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add almanack
          if git diff --cached --quiet; then
            echo 'No ephemeris-notation changes'
            exit 0
          fi
          git commit -m "Wire ephemeris notation modes for ISO range $START_YEAR-W$START_WEEK to $END_YEAR-W$END_WEEK"
          git pull --rebase origin main
          git push
