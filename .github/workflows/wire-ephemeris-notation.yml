name: Wire ephemeris notation modes

on:
  workflow_dispatch:
    inputs:
      years:
        description: 'Space-separated ISO years to update'
        required: true
        default: '2025 2026 2027'
  push:
    branches: [main]
    paths:
      - .github/workflows/wire-ephemeris-notation.yml
      - tools/ephemeris-notation-trigger.txt
      - tools/wire_ephemeris_notation.py

env:
  ALMANACK_YEARS: ${{ github.event_name == 'workflow_dispatch' && inputs.years || '2025 2026 2027' }}

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Wire ephemeris notation
        run: python tools/wire_ephemeris_notation.py $ALMANACK_YEARS

      - name: Commit changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for year in $ALMANACK_YEARS; do
            git add "almanack/$year"
          done
          if git diff --cached --quiet; then
            echo 'No ephemeris-notation changes'
            exit 0
          fi
          git commit -m "Wire ephemeris notation modes for $ALMANACK_YEARS"
          git pull --rebase origin main
          git push
