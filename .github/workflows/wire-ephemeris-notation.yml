name: Wire ephemeris notation modes

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/wire-ephemeris-notation.yml
      - tools/ephemeris-notation-trigger.txt
      - tools/wire_ephemeris_notation.py

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Wire ephemeris notation
        run: python tools/wire_ephemeris_notation.py
      - name: Commit changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add almanack/2025 almanack/2026 almanack/2027
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Wire ephemeris notation modes'
          git push
