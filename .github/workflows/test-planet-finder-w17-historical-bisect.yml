name: AA- Bisect Exact W17 Five-Candidate Regression

on:
  workflow_dispatch:

jobs:
  w17-bisect:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out repository history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install test dependencies
        run: python -m pip install pytest skyfield

      - name: Bisect exact W17 five-candidate regression
        shell: bash
        env:
          GOOD_REF: "e9cd89e7dd5e3f4d20fa22be6ef17b6a2a4b75e5"
          BAD_REF: "2e96878e4011101317ce8ccfd8c5a5844da7b388"
        run: |
          set -euo pipefail
          HARNESS_DIR="$RUNNER_TEMP/w17-bisect-harness"
          mkdir -p "$HARNESS_DIR"
          cp tests/test_planet_finder_w17_ladder.py "$HARNESS_DIR/test_planet_finder_w17_ladder.py"

          cat > "$HARNESS_DIR/oracle.py" <<'PY'
          import sys
          sys.path.insert(0, "tools")
          sys.path.insert(0, sys.argv[1])
          from test_planet_finder_w17_ladder import (
              ALIGNMENT_CHAIN, bodies_for, names, expected_alignment,
              expected_conjunction, assert_valid,
          )
          from planet_finder_geometry import FinderMode, alignment_groups, conjunction_groups
          from planet_finder_search import layout

          selected = ALIGNMENT_CHAIN[:6] + ["Venus"]
          source = bodies_for(selected)
          assert names(alignment_groups(source)) == expected_alignment(7)
          assert names(conjunction_groups(source)) == expected_conjunction(7)
          result = layout(
              FinderMode.GREEK,
              source,
              target_solutions=5,
              budget={"max_node_candidates": 200, "max_seconds": 60.0},
              context_label="W17-bisect-venus-exact-54.923",
          )
          assert_valid(result, source)
          PY

          cat > "$HARNESS_DIR/test-one.sh" <<'SH'
          #!/usr/bin/env bash
          set -uo pipefail
          ref="$(git rev-parse HEAD)"
          echo "::group::Testing $ref"
          log="$HARNESS_DIR/$ref.log"
          PLANET_FINDER_DIAGNOSTIC_LEVEL=3 timeout 70s python "$HARNESS_DIR/oracle.py" "$HARNESS_DIR" 2>&1 | tee "$log"
          rc=${PIPESTATUS[0]}
          # Search success is the regression oracle. Historical versions can
          # spend substantial time in makeup after already finding solution 5.
          if grep -Eq "solutions=5|complete valid candidate 5/5" "$log"; then
            rc=0
          fi
          echo "::endgroup::"
          if [ "$rc" -eq 0 ]; then
            echo "PASS $ref"
            exit 0
          fi
          echo "FAIL $ref (rc=$rc)"
          exit 1
          SH
          chmod +x "$HARNESS_DIR/test-one.sh"
          export HARNESS_DIR

          echo "Verifying known-good endpoint $GOOD_REF"
          git checkout --detach "$GOOD_REF"
          "$HARNESS_DIR/test-one.sh"

          echo "Measuring comparison endpoint $BAD_REF"
          git checkout --detach "$BAD_REF"
          "$HARNESS_DIR/test-one.sh"

          echo "===== DETERMINISTIC COMPARISON COMPLETE ====="
          echo "Historical endpoint: $GOOD_REF"
          echo "Current endpoint:    $BAD_REF"
          echo "Both endpoint logs are retained above at diagnostic level 3."
          echo "::notice::Do not bisect yet. First derive a deterministic work threshold from these two endpoint traces."
