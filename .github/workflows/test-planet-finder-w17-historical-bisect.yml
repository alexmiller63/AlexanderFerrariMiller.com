name: AA- Bisect Exact W17 Five-Candidate Regression

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/test-planet-finder-w17-historical-bisect.yml

jobs:
  w17-bisect:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out repository history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore JPL/NAIF ephemeris source cache
        uses: actions/cache@v4
        with:
          path: |
            .cache/skyfield/de440s.bsp
            .cache/skyfield/ceres_1900_2100.bsp
          key: star-almanack-source-kernels-v1

      - name: Install test dependencies
        run: python -m pip install pytest 'skyfield==1.55'

      - name: Download source kernels only when cache is empty
        run: |
          mkdir -p .cache/skyfield
          python - <<'PY'
          from pathlib import Path
          from urllib.request import urlretrieve
          from skyfield.api import Loader
          root = Path('.cache/skyfield')
          de440s = root / 'de440s.bsp'
          ceres = root / 'ceres_1900_2100.bsp'
          if not de440s.exists():
              Loader(str(root)).download('de440s.bsp')
          if not ceres.exists():
              urlretrieve('https://naif.jpl.nasa.gov/pub/naif/generic_kernels/spk/asteroids/a_old_versions/ceres_1900_2100.bsp', ceres)
          PY

      - name: Bisect actual W17 generation
        shell: bash
        run: bash tools/w17_bisect.sh
