name: AA- Bisect W17 Historical Solver

on:
  workflow_dispatch:
    inputs:
      solver_ref:
        description: Historical commit SHA to test
        required: true
        type: string

jobs:
  w17:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out current harness
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Overlay historical Planet Finder solver
        shell: bash
        run: |
          set -euo pipefail
          ref="${{ inputs.solver_ref }}"
          git cat-file -e "$ref^{commit}"
          for path in \
            tools/planet_finder_search.py \
            tools/planet_finder_search_core.py \
            tools/planet_finder_geometry.py
          do
            if git cat-file -e "$ref:$path" 2>/dev/null; then
              git show "$ref:$path" > "$path"
            fi
          done
          echo "Testing historical solver ref $ref"
          git diff --stat

      - name: Install test dependencies
        run: python -m pip install pytest skyfield

      - name: Run fixed W17 alignment-8 oracle
        env:
          PYTHONPATH: tools
          PLANET_FINDER_DIAGNOSTIC_LEVEL: "1"
        run: |
          python - <<'PY'
          from tests.test_planet_finder_w17_ladder import (
              ALIGNMENT_CHAIN, bodies_for, names, expected_alignment,
              expected_conjunction, assert_valid,
          )
          from planet_finder_geometry import FinderMode, alignment_groups, conjunction_groups
          from planet_finder_search import layout

          selected = ALIGNMENT_CHAIN[:8]
          source = bodies_for(selected)
          assert names(alignment_groups(source)) == expected_alignment(8)
          assert names(conjunction_groups(source)) == expected_conjunction(8)
          print("W17 HISTORICAL ALIGNMENT-8 START", flush=True)
          result = layout(
              FinderMode.GREEK,
              source,
              target_solutions=1,
              budget={"max_node_candidates": 200, "max_seconds": 30.0},
              context_label="W17-historical-alignment-8",
          )
          assert_valid(result, source)
          print("W17 HISTORICAL ALIGNMENT-8 PASS", flush=True)
          PY
