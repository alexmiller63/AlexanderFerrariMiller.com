name: AA- Bisect Exact W17 Five-Candidate Regression

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/test-planet-finder-w17-historical-bisect.yml

jobs:
  w17-bisect:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out repository history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install test dependencies
        run: python -m pip install pytest skyfield

      - name: Bisect exact W17 oracle
        shell: bash
        run: bash tools/w17_bisect.sh
