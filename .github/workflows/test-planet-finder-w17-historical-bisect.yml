name: AA- Bisect Exact W17 Five-Candidate Regression

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/test-planet-finder-w17-historical-bisect.yml

jobs:
  w17-bisect:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out repository history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install test dependencies
        run: python -m pip install pytest skyfield

      - name: Repeat exact W17 oracle three times
        shell: bash
        env:
          GOOD_REF: "e9cd89e7dd5e3f4d20fa22be6ef17b6a2a4b75e5"
          BAD_REF: "2e96878e4011101317ce8ccfd8c5a5844da7b388"
        run: |
          set -uo pipefail
          HARNESS_DIR="$RUNNER_TEMP/w17-bisect-harness"
          mkdir -p "$HARNESS_DIR"
          cp tests/test_planet_finder_w17_ladder.py "$HARNESS_DIR/test_planet_finder_w17_ladder.py"

          cat > "$HARNESS_DIR/oracle.py" <<'PY'
          import sys
          sys.path.insert(0, "tools")
          sys.path.insert(0, sys.argv[1])
          from test_planet_finder_w17_ladder import (
              ALIGNMENT_CHAIN, bodies_for, names, expected_alignment,
              expected_conjunction, assert_valid,
          )
          from planet_finder_geometry import FinderMode, alignment_groups, conjunction_groups
          from planet_finder_search import layout

          selected = ALIGNMENT_CHAIN[:6] + ["Venus"]
          source = bodies_for(selected)
          assert names(alignment_groups(source)) == expected_alignment(7)
          assert names(conjunction_groups(source)) == expected_conjunction(7)
          result = layout(
              FinderMode.GREEK, source, target_solutions=5,
              budget={"max_node_candidates": 200, "max_seconds": 60.0},
              context_label="W17-bisect-venus-exact-54.923",
          )
          assert_valid(result, source)
          PY

          cat > "$HARNESS_DIR/test-one.sh" <<'SH'
          #!/usr/bin/env bash
          set -uo pipefail
          ref="$(git rev-parse HEAD)"
          log="$HARNESS_DIR/$ref.log"
          echo "::group::Testing $ref"
          PLANET_FINDER_DIAGNOSTIC_LEVEL=0 timeout 70s python "$HARNESS_DIR/oracle.py" "$HARNESS_DIR" >"$log" 2>&1
          rc=$?
          cat "$log"
          echo "::endgroup::"
          if [ "$rc" -eq 0 ]; then
            echo "RESULT $ref PASS"
            exit 0
          else
            echo "RESULT $ref FAIL (rc=$rc)"
            exit 1
          fi
          SH
          chmod +x "$HARNESS_DIR/test-one.sh"
          export HARNESS_DIR

          TEST_REF="$GOOD_REF"
          git checkout --detach "$TEST_REF"
          failures=0
          for trial in 1 2 3; do
            echo "===== TRIAL $trial ====="
            if "$HARNESS_DIR/test-one.sh"; then
              echo "TRIAL $trial PASS"
            else
              echo "TRIAL $trial FAIL"
              failures=$((failures + 1))
            fi
          done
          echo "REPRODUCIBILITY: $((3-failures)) PASS / $failures FAIL"
          test "$failures" -eq 0
