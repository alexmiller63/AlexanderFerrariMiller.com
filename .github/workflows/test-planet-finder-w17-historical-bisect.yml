name: AA- Bisect W17 Historical Solver

on:
  workflow_dispatch:

jobs:
  w17-bisect:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out repository history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install test dependencies
        run: python -m pip install pytest skyfield

      - name: Automatically bisect W17 alignment-8 regression
        shell: bash
        env:
          GOOD_REF: "01485d100e8ed3a09048b8c251d6f2674ad0057c"
          BAD_REF: "07d9eb72d8ff8198fd793d6b28fac1d40b7eb1cb"
        run: |
          set -euo pipefail
          HARNESS_DIR="$RUNNER_TEMP/w17-bisect-harness"
          mkdir -p "$HARNESS_DIR"
          cp tests/test_planet_finder_w17_ladder.py "$HARNESS_DIR/test_planet_finder_w17_ladder.py"

          cat > "$HARNESS_DIR/oracle.py" <<'PY'
          import sys
          sys.path.insert(0, "tools")
          sys.path.insert(0, sys.argv[1])
          from test_planet_finder_w17_ladder import (
              ALIGNMENT_CHAIN, bodies_for, names, expected_alignment,
              expected_conjunction, assert_valid,
          )
          from planet_finder_geometry import FinderMode, alignment_groups, conjunction_groups
          from planet_finder_search import layout

          selected = ALIGNMENT_CHAIN[:8]
          source = bodies_for(selected)
          assert names(alignment_groups(source)) == expected_alignment(8)
          assert names(conjunction_groups(source)) == expected_conjunction(8)
          result = layout(
              FinderMode.GREEK,
              source,
              target_solutions=1,
              budget={"max_node_candidates": 200, "max_seconds": 30.0},
              context_label="W17-historical-alignment-8",
          )
          assert_valid(result, source)
          PY

          cat > "$HARNESS_DIR/test-one.sh" <<'SH'
          #!/usr/bin/env bash
          set -uo pipefail
          ref="$(git rev-parse HEAD)"
          echo "::group::Testing $ref"
          PLANET_FINDER_DIAGNOSTIC_LEVEL=1 timeout 40s python "$HARNESS_DIR/oracle.py" "$HARNESS_DIR"
          rc=$?
          echo "::endgroup::"
          if [ "$rc" -eq 0 ]; then
            echo "PASS $ref"
            exit 0
          fi
          echo "FAIL $ref (rc=$rc)"
          exit 1
          SH
          chmod +x "$HARNESS_DIR/test-one.sh"
          export HARNESS_DIR

          echo "Verifying known-good endpoint $GOOD_REF"
          git checkout --detach "$GOOD_REF"
          "$HARNESS_DIR/test-one.sh"

          echo "Verifying known-bad endpoint $BAD_REF"
          git checkout --detach "$BAD_REF"
          if "$HARNESS_DIR/test-one.sh"; then
            echo "::error::BAD_REF unexpectedly passes; refusing to report a false boundary."
            exit 2
          fi

          git bisect reset || true
          git bisect start "$BAD_REF" "$GOOD_REF"
          git bisect run "$HARNESS_DIR/test-one.sh" || rc=$?
          rc=${rc:-0}

          echo "===== BISECT RESULT ====="
          git bisect log
          first_bad="$(git rev-parse HEAD)"
          echo "First bad commit candidate: $first_bad"
          git show --no-patch --format='%H%n%ci%n%s' "$first_bad"

          # git bisect run returns 0 when it identifies the boundary.
          if [ "$rc" -ne 0 ]; then
            echo "::warning::git bisect run exited $rc; inspect the bisect log above."
            exit "$rc"
          fi
