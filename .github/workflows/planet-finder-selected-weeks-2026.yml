name: Planet Finder Selected Weeks 2026

on:
  workflow_dispatch:
    inputs:
      weeks:
        description: 'Comma-separated ISO weeks to test'
        required: true
        default: '17,20,25,39'
        type: string

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      PLANET_FINDER_CANDIDATES: '1'
      PLANET_FINDER_MAX_NODE_CANDIDATES: '200'
      PLANET_FINDER_MAX_SECONDS: '360'
      PLANET_FINDER_DIAGNOSTIC_LEVEL: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/cache@v4
        with:
          path: .cache/skyfield
          key: star-almanack-source-kernels-v1
      - name: Install calculation dependency
        run: python -m pip install --disable-pip-version-check 'skyfield==1.55'
      - name: Ensure source kernels
        run: python tools/ensure_ephemeris_kernels.py --ceres
      - name: Test selected weeks in all modes
        env:
          WEEKS: ${{ inputs.weeks }}
        shell: bash
        run: |
          python tools/planet_finder_full_regression.py --weeks "$WEEKS"
      - name: Show regression summary
        if: always()
        shell: bash
        run: |
          if [ -f generated/planet-finder-regression/summary.md ]; then
            cat generated/planet-finder-regression/summary.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'Regression did not produce a report; check setup steps.' >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Preserve reports even after failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: planet-finder-regression-selected-weeks
          path: generated/planet-finder-regression/
          if-no-files-found: warn
