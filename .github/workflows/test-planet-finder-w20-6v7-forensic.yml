name: AA- Test Planet Finder W20 6v7 Forensic

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependencies
        run: python -m pip install pytest skyfield
      - name: Compare W20 Latin six vs seven
        env:
          PYTHONPATH: tools
          PLANET_FINDER_DIAGNOSTIC_LEVEL: "4"
        run: |
          python -m pytest -q -s \
            'tests/test_planet_finder_ultimate_ladders.py::test_w20_latin_6_vs_7_forensic'
