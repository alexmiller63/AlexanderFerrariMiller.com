name: Optimize planet label and leader routing

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/optimize-planet-label-routing.yml'

permissions:
  contents: write

jobs:
  optimize-routing:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Couple label placement to leader quality
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('tools/generate-current-planet-finder.py')
          text = path.read_text()

          old = '''    if not solve(): raise RuntimeError(f'No collision-free label arrangement for {mode} after {search_nodes} search states')
    return [assigned[i] for i in range(len(rows))]
'''

          new = '''    if not solve(): raise RuntimeError(f'No collision-free label arrangement for {mode} after {search_nodes} search states')

    # Collision-free labels are only the starting point. Improve the complete
    # arrangement using the leader router itself, so a small label move can open
    # a much cleaner approach corridor for a neighboring leader. This is a
    # general layout rule: no body names or planet pairs are special-cased.
    def arrangement_score(layout):
        total=0.0
        for i,row in enumerate(rows):
            L=row[-1]; anchor=anchors[i]
            obstacles=list(reserved)+[layout[j] for j in range(len(rows)) if j!=i]
            other_anchors=[anchors[j] for j in range(len(rows)) if j!=i]
            try:
                route=route_leader(anchor,layout[i],L,mode,obstacles,other_anchors)
            except RuntimeError:
                return float('inf')
            length=sum(math.hypot(b[0]-a[0],b[1]-a[1]) for a,b in zip(route,route[1:]))
            # Short, simple leaders are easier to associate with their anchors.
            # The router already enforces collision, rim, and anchor separation.
            total += length + 18.0*max(0,len(route)-2)
        return total

    layout=[assigned[i] for i in range(len(rows))]
    best_score=arrangement_score(layout)
    # Coordinate descent is deliberately bounded: placement remains deterministic
    # and inexpensive while allowing neighboring labels to cooperate.
    for _ in range(3):
        improved=False
        for i in original_order:
            current=layout[i]; local_best=current; local_score=best_score
            for box in candidates[i]:
                if box==current: continue
                if any(overlap(box,layout[j],label_pad) for j in range(len(rows)) if j!=i): continue
                trial=list(layout); trial[i]=box
                score=arrangement_score(trial)
                if score+1e-6<local_score:
                    local_best=box; local_score=score
            if local_best!=current:
                layout[i]=local_best; best_score=local_score; improved=True
        if not improved: break
    return layout
'''

          if old not in text:
              raise SystemExit('Expected placement return block not found; refusing a blind patch')

          path.write_text(text.replace(old,new,1))
          PY

      - name: Syntax check
        run: python -m py_compile tools/generate-current-planet-finder.py

      - name: Regenerate W38 as routing regression check
        run: python tools/generate-current-planet-finder.py 2026 38

      - name: Commit optimizer and regenerated W38
        run: |
          if git diff --quiet; then
            echo 'No change needed.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tools/generate-current-planet-finder.py almanack/2026/W38/finders/
          git commit -m 'Optimize label placement with leader routing'
          git push
