name: AA-Repair Once

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply capped-body rejection diagnostic
        run: python tools/patch_planet_finder_canonical_lattice.py
      - name: Syntax check
        run: python -m py_compile tools/planet_finder_search_core.py
      - name: Commit repair
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools/planet_finder_search_core.py
          git commit -m "Expose capped-body rejection diagnostics"
          git push
