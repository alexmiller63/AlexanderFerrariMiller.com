name: Fix split Bayer notation generation

on:
  push:
    paths:
      - '.github/workflows/fix-split-bayer-notation.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Fix Bayer notation when Greek letter is wrapped separately
        run: |
          python - <<'PY'
          from pathlib import Path

          generator = Path('tools/wire_ephemeris_notation.py')
          text = generator.read_text(encoding='utf-8')
          needle = """    const pattern=/([αβγδεζηθικλμνξοπρστυφχψω])(\\d+)?\\s+([A-Z][A-Za-z]{2})\\b/g;\n    document.querySelectorAll('table.calendar tbody td:nth-child(3)').forEach(function(cell){\n"""
          replacement = """    /* Normalize Bayer designations whose Greek letter has already been wrapped\n       by calendar generation, e.g. <span class=\"greek-letter\">ε</span> Peg.\n       Treat the Greek letter plus following 3-letter constellation abbreviation\n       as one notation item so Latin mode can render the proper genitive (Pegasi). */\n    document.querySelectorAll('table.calendar tbody td:nth-child(3) .greek-letter').forEach(function(el){\n      if(el.closest('.calendar-notation-item'))return;\n      const letter=el.textContent.replace(/\\ufe0e/g,'').trim();\n      if(!greekNames[letter])return;\n      const next=el.nextSibling;\n      if(!next||next.nodeType!==Node.TEXT_NODE)return;\n      const m=next.nodeValue.match(/^(\\d+)?\\s+([A-Z][A-Za-z]{2})\\b/);\n      if(!m)return;\n      const suffix=m[1]||'',abbr=m[2],constellation=constellations[abbr]||abbr;\n      const span=document.createElement('span');\n      const greek=letter+suffix+' '+abbr;\n      const latin=(greekNames[letter]||letter)+suffix+' '+constellation;\n      const mixed=letter+suffix+' '+(greekNames[letter]||letter)+suffix+' '+constellation;\n      item(span,greek,latin,mixed,'calendar-notation-item');\n      span.textContent=greek;\n      next.nodeValue=next.nodeValue.slice(m[0].length);\n      el.replaceWith(span);\n    });\n    const pattern=/([αβγδεζηθικλμνξοπρστυφχψω])(\\d+)?\\s+([A-Z][A-Za-z]{2})\\b/g;\n    document.querySelectorAll('table.calendar tbody td:nth-child(3)').forEach(function(cell){\n"""
          if replacement not in text:
              if needle not in text:
                  raise SystemExit('Generator insertion point not found')
              text = text.replace(needle, replacement, 1)
              generator.write_text(text, encoding='utf-8')

          runtime = Path('almanack/js/notation.js')
          text = runtime.read_text(encoding='utf-8')
          needle = """  const main = document.querySelector('main');\n  if (main) {\n"""
          replacement = """  const main = document.querySelector('main');\n  if (main) {\n    /* Calendar generation may wrap the Greek Bayer letter separately from the\n       constellation abbreviation. Recombine that split token before the normal\n       text-node pass so Latin mode uses the constellation genitive. */\n    main.querySelectorAll('table.calendar tbody td:nth-child(3) .greek-letter').forEach(function (el) {\n      if (el.closest('.notation-item,.notation-rendered')) return;\n      const letter = el.textContent.replace(/\\ufe0e/g, '').trim();\n      if (!greekNames[letter]) return;\n      const next = el.nextSibling;\n      if (!next || next.nodeType !== Node.TEXT_NODE) return;\n      const match = next.nodeValue.match(/^(\\d+)?\\s+([A-Z][A-Za-z]{2})\\b/);\n      if (!match) return;\n      const suffix = match[1] || '';\n      const abbr = match[2];\n      const constellation = constellationNames[abbr] || abbr;\n      const span = notationSpan(\n        letter + suffix + ' ' + abbr,\n        greekNames[letter] + suffix + ' ' + constellation,\n        letter + suffix + ' ' + greekNames[letter] + suffix + ' ' + constellation\n      );\n      next.nodeValue = next.nodeValue.slice(match[0].length);\n      el.replaceWith(span);\n    });\n"""
          if 'Recombine that split token before the normal' not in text:
              if needle not in text:
                  raise SystemExit('Runtime insertion point not found')
              text = text.replace(needle, replacement, 1)
              runtime.write_text(text, encoding='utf-8')
          PY

      - name: Regenerate notation on weekly pages
        run: python tools/wire_ephemeris_notation.py 2025 2026 2027

      - name: Verify Enif Latin genitive path
        run: |
          python - <<'PY'
          from pathlib import Path
          generator = Path('tools/wire_ephemeris_notation.py').read_text(encoding='utf-8')
          runtime = Path('almanack/js/notation.js').read_text(encoding='utf-8')
          w41 = Path('almanack/2026/W41/index.html').read_text(encoding='utf-8')
          assert "constellation=constellations[abbr]||abbr" in generator
          assert "constellation = constellationNames[abbr] || abbr" in runtime
          assert "<span class=\"greek-letter\">ε</span> Peg" in w41
          assert "constellation=constellations[abbr]||abbr" in w41
          assert "Peg:'Pegasi'" in w41
          print('PASS: split ε + Peg is recombined and Latin mode resolves Pegasi')
          PY

      - name: Commit generator and regenerated pages
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tools/wire_ephemeris_notation.py almanack/js/notation.js almanack/2025/W??/index.html almanack/2026/W??/index.html almanack/2027/W??/index.html
          if git diff --cached --quiet; then
            echo 'No changes to commit.'
            exit 0
          fi
          git commit -m 'Handle split Bayer designations in Latin notation'
          git pull --rebase origin main
          git push origin main
