name: Ephemeris Generator

on:
  workflow_dispatch:
    inputs:
      start_year:
        description: Start ISO year
        required: true
        default: '2026'
        type: string
      start_week:
        description: Start ISO week
        required: true
        default: '36'
        type: string
      end_year:
        description: End ISO year
        required: true
        default: '2026'
        type: string
      end_week:
        description: End ISO week
        required: true
        default: '36'
        type: string

permissions:
  contents: write

concurrency:
  group: almanack-generator-main-writer
  cancel-in-progress: false

jobs:
  populate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: actions/cache@v4
        with:
          path: |
            .cache/skyfield/de440s.bsp
            .cache/skyfield/ceres_1900_2100.bsp
          key: star-almanack-source-kernels-v1

      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check 'skyfield==1.55'

      - name: Prepare ephemeris kernels
        run: python tools/ensure_ephemeris_kernels.py --ceres

      - name: Resolve ISO week range
        id: range
        run: |
          read START_DATE END_DATE < <(python tools/resolve_iso_week_range.py \
            '${{ inputs.start_year }}' '${{ inputs.start_week }}' \
            '${{ inputs.end_year }}' '${{ inputs.end_week }}')
          echo "start_date=$START_DATE" >> "$GITHUB_OUTPUT"
          echo "end_date=$END_DATE" >> "$GITHUB_OUTPUT"

      - name: Generate Ephemeris
        env:
          STAR_ALMANACK_EPHEMERIS_DIR: ${{ github.workspace }}/.cache/skyfield
        run: python tools/populate_ephemeris_by_date.py "${{ steps.range.outputs.start_date }}" "${{ steps.range.outputs.end_date }}"

      - name: Commit generated Ephemeris
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- almanack
          if git diff --cached --quiet; then
            echo "No Ephemeris changes."
            exit 0
          fi
          git commit -m "Generate Ephemeris ${{ inputs.start_year }}-W${{ inputs.start_week }}"
          git pull --rebase origin main
          git push
