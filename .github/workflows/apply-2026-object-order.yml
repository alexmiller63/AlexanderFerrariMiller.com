name: Apply 2026 Object Order

on:
  push:
    paths:
      - tools/apply_2026_object_order.py
      - Star-Almanack-Repo/messier-editorial.json
      - Star-Almanack-Repo/enrich_stellar_entries.py
      - .github/workflows/apply-2026-object-order.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Standardize calendar object order
        run: python tools/apply_2026_object_order.py

      - name: Validate examples
        run: |
          python - <<'PY'
          from pathlib import Path
          pages = ''.join(p.read_text(encoding='utf-8') for p in sorted(Path('almanack/2026').glob('W??/index.html')))
          assert 'Diadem (α Com) — B V 4 — Tropical — Spring' in pages
          assert 'Messier 53 (M53), globular cluster in Coma Berenices — 🔭 — Tropical — Spring' in pages
          assert 'Messier 15 (M15), globular cluster in Pegasus' in pages
          assert 'Orion Nebula (M42), emission nebula in Orion' in pages
          assert 'Trifid Nebula (M20), emission and reflection nebula in Sagittarius' in pages
          assert 'Great Pegasus Globular' not in pages
          print('Validated fixed-star ordering and data-driven Messier labels')
          PY

      - name: Commit standardized pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Star-Almanack-Repo/almanack-expanded.md Star-Almanack-Repo/site/2026/W??/index.html almanack/2026/W??/index.html
          if git diff --cached --quiet; then
            echo "No object-order changes."
            exit 0
          fi
          git commit -m "Standardize 2026 fixed-object calendar order"
          git pull --rebase origin main
          git push origin main
