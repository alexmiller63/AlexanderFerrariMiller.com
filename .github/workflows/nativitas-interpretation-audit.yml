name: Nativitas Interpretation Audit

on:
  workflow_dispatch:
    inputs:
      batch_size:
        description: Number of unreviewed interpretations to queue
        required: false
        default: '20'
  push:
    paths:
      - 'nativitas/data/aspect-interpretations.json'
      - 'nativitas/tools/audit_interpretations.py'
      - '.github/workflows/nativitas-interpretation-audit.yml'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate catalog and build review queue
        env:
          BATCH_SIZE: ${{ github.event.inputs.batch_size || '20' }}
        run: python nativitas/tools/audit_interpretations.py --batch-size "$BATCH_SIZE"
      - name: Publish audit summary
        if: always()
        run: |
          if [ -f nativitas-review/report.md ]; then
            cat nativitas-review/report.md >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nativitas-interpretation-review
          path: nativitas-review/
          if-no-files-found: warn
