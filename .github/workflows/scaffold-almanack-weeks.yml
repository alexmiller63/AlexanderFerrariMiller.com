name: Scaffold Generator

# Registration nudge: keep this manually dispatchable in GitHub Actions.

on:
  workflow_dispatch:
    inputs:
      start_year:
        description: Start ISO year
        required: true
        default: '2026'
      start_week:
        description: Start ISO week
        required: true
        default: '36'
      end_year:
        description: End ISO year
        required: true
        default: '2026'
      end_week:
        description: End ISO week
        required: true
        default: '40'

permissions:
  contents: write
  actions: write

jobs:
  scaffold:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Rebuild clean week scaffolds
        run: >-
          python tools/scaffold_almanack_weeks.py
          "${{ inputs.start_year }}" "${{ inputs.start_week }}"
          "${{ inputs.end_year }}" "${{ inputs.end_week }}"
      - name: Commit scaffolded weeks
        run: |
          if git diff --quiet; then
            echo "No scaffold changes."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            while read -r year week; do
              git add -- "almanack/$year/W$(printf '%02d' "$week")" "site/$year/W$(printf '%02d' "$week")"
            done < <(python - <<'PY'
from datetime import date, timedelta
start=date.fromisocalendar(int("${{ inputs.start_year }}"), int("${{ inputs.start_week }}"), 1)
end=date.fromisocalendar(int("${{ inputs.end_year }}"), int("${{ inputs.end_week }}"), 1)
while start <= end:
    iso=start.isocalendar()
    print(iso.year, iso.week)
    start += timedelta(days=7)
PY
            )
            git commit -m "Rebuild Almanack week scaffolds ${{ inputs.start_year }}-W${{ inputs.start_week }} through ${{ inputs.end_year }}-W${{ inputs.end_week }}"
            git push origin HEAD:main
          fi
