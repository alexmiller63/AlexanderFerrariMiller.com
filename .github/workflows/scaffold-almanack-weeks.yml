name: Scaffold Generator

on:
  workflow_dispatch:
    inputs:
      start_year:
        description: Start ISO year
        required: true
        default: '2026'
      start_week:
        description: Start ISO week
        required: true
        default: '36'
      end_year:
        description: End ISO year
        required: true
        default: '2026'
      end_week:
        description: End ISO week
        required: true
        default: '36'

concurrency:
  # All active Almanack generators write to main; serialize them to prevent push races.
  group: almanack-generator-main-writer
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  scaffold:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Rebuild clean week scaffolds
        run: python tools/scaffold_almanack_weeks.py "${{ inputs.start_year }}" "${{ inputs.start_week }}" "${{ inputs.end_year }}" "${{ inputs.end_week }}"
      - name: Diagnose scaffold output
        run: |
          echo "=== git status ==="
          git status --short
          echo "=== requested week output ==="
          target="almanack/${{ inputs.start_year }}/W$(printf '%02d' ${{ inputs.start_week }})/index.html"
          echo "$target"
          ls -l "$target"

      - name: Commit scaffolded weeks
        run: |
          if git diff --quiet; then
            echo "No scaffold changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- almanack
          git commit -m "Rebuild Almanack week scaffolds ${{ inputs.start_year }}-W${{ inputs.start_week }} through ${{ inputs.end_year }}-W${{ inputs.end_week }}"
          git push origin HEAD:main
