name: Restart Weekly Build 2026 W01-W10

on:
  push:
    branches: [main]
    paths: [.github/workflows/restart-weekly-build-2026-w01-w10.yml]
  workflow_dispatch:

permissions:
  contents: read
  actions: write

concurrency:
  group: restart-weekly-build-2026-w01-w10
  cancel-in-progress: false

jobs:
  restart:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Stop superseded build and its active child
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          repo="$GITHUB_REPOSITORY"
          old_run=37856159380
          status="$(gh api "repos/$repo/actions/runs/$old_run" --jq '.status')"
          if [[ "$status" != completed ]]; then
            gh run cancel "$old_run" --repo "$repo"
          fi
          for attempt in $(seq 1 60); do
            status="$(gh api "repos/$repo/actions/runs/$old_run" --jq '.status')"
            [[ "$status" == completed ]] && break
            sleep 5
          done
          [[ "$status" == completed ]] || { echo "Old build has not stopped"; exit 1; }
          # Only stop children identified by the old build's status record.
          gh api "repos/$repo/contents/build-status.txt?ref=main" --jq '.content' | base64 --decode > /tmp/old-build-status.txt
          child="$(python - <<'PY'
          import re
          from pathlib import Path
          text = Path("/tmp/old-build-status.txt").read_text()
          if "RUN 37856159380/1" in text:
              matches = re.findall(r"https://github.com/[^ ]+/actions/runs/(\d+)", text)
              if matches:
                  print(matches[-1])
          PY
          )"
          for run_id in 37860379911 ${child:-}; do
            status="$(gh api "repos/$repo/actions/runs/$run_id" --jq '.status')"
            if [[ "$status" != completed ]]; then
              gh run cancel "$run_id" --repo "$repo"
            fi
            for attempt in $(seq 1 60); do
              status="$(gh api "repos/$repo/actions/runs/$run_id" --jq '.status')"
              [[ "$status" == completed ]] && break
              sleep 5
            done
            [[ "$status" == completed ]] || { echo "Child $run_id has not stopped"; exit 1; }
          done
      - name: Publish already generated finder controls
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash tools/run-workflow-and-wait.sh deploy.yml
      - name: Start corrected weeks 1 through 10
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          before="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow weekly-build-all.yml --limit 1 --json databaseId --jq '.[0].databaseId // 0')"
          gh workflow run weekly-build-all.yml --repo "$GITHUB_REPOSITORY" --ref main \
            -f start_year=2026 -f start_week=1 -f end_year=2026 -f end_week=10 \
            -f candidate_layouts=5 -f max_node_candidates=200 \
            -f max_search_seconds=360 -f diagnostic_level=1
          new_run=""
          for attempt in $(seq 1 30); do
            new_run="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow weekly-build-all.yml --event workflow_dispatch --limit 5 --json databaseId --jq "map(select(.databaseId > $before)) | first | .databaseId // empty")"
            [[ -n "$new_run" ]] && break
            sleep 5
          done
          [[ -n "$new_run" ]] || { echo "Restart was not discovered"; exit 1; }
          echo "RESTARTED_RUN_ID=$new_run"
          echo "Restarted: https://github.com/$GITHUB_REPOSITORY/actions/runs/$new_run" >> "$GITHUB_STEP_SUMMARY"
