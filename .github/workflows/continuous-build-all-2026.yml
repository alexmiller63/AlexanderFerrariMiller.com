name: Continuous Build All 2026

on:
  workflow_dispatch:
    inputs:
      start_week:
        description: 'First unfinished ISO week (2 through 53); previous weeks remain untouched'
        type: number
        required: true
        default: 2

permissions:
  contents: write
  actions: write

# Each week has a separate orchestration job. Each job dispatches the current
# main-branch Weekly Build All workflow rather than pinning a reusable workflow
# to the SHA of the original continuous run.
# The child must finish before the next week starts. Review and edit
# weekly-build-all.yml on main to change the NEXT dispatched week's behavior.
concurrency:
  group: continuous-build-all-2026
  cancel-in-progress: false

jobs:
  week_02:
    name: 2026 Week 02
    if: ${{ !cancelled() && inputs.start_week <= 2 }}
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4
      - name: Dispatch current approved weekly workflow and wait
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          echo "Starting week 02 using current main-branch weekly-build-all.yml."
          echo "The orchestration job does not pin the reusable workflow to its original SHA."
          bash tools/run-workflow-and-wait.sh weekly-build-all.yml \
            -f start_year=2026 -f start_week=2 \
            -f end_year=2026 -f end_week=2 \
            -f resume_stage=Scaffold \
            -f resume_completed_weeks=true \
            -f candidate_layouts=5 \
            -f max_node_candidates=200 \
            -f max_search_seconds=360 \
            -f diagnostic_level=1
          echo "Week 02 finished. Cooldown for independent deployment activity."
          sleep 90
  week_03:
    name: 2026 Week 03
    needs: week_02
    if: ${{ !cancelled() && inputs.start_week <= 3 && (needs.week_02.result == 'success' || needs.week_02.result == 'skipped') }}
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4
      - name: Dispatch current approved weekly workflow and wait
