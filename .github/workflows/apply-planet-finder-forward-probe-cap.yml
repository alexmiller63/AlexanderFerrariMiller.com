name: Apply Planet Finder Forward Probe Cap

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - tools/patch_planet_finder_forward_probe_cap.py

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply guarded repair
        run: python tools/patch_planet_finder_forward_probe_cap.py
      - name: Verify syntax
        run: |
          python -m py_compile \
            tools/generate_planet_finders.py \
            tools/planet_finder_search.py \
            tools/planet_finder_search_core.py \
            tools/planet_finder_geometry.py \
            tools/planet_finder_validation.py
      - name: Commit repair
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools/planet_finder_search_core.py
          git diff --cached --quiet && exit 0
          git commit -m "Bound Planet Finder shared forward-check probes"
          git push
