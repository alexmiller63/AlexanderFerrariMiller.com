name: Build All 2026 — Resume W49

on:
  workflow_dispatch:
    inputs:
      candidate_layouts:
        description: Planet Finder complete layouts to score per mode
        required: true
        default: '5'
        type: string
      max_node_candidates:
        description: Planet Finder maximum DFS node visits per body depth
        required: true
        default: '200'
        type: string
      max_search_seconds:
        description: Planet Finder search time per mode
        required: true
        default: '360'
        type: string
      diagnostic_level:
        description: Planet Finder diagnostic verbosity
        required: true
        default: '1'
        type: string

permissions:
  contents: write
  actions: write

concurrency:
  group: build-all-2026-resume-w49
  cancel-in-progress: false

# Resume after the interrupted overnight run. One outer job per week avoids
# GitHub's six-hour job ceiling; failures are recorded and the chain continues.
jobs:
  w49_1:
    name: Build 2026 W49
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Dispatch and wait for W49
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          bash tools/run-workflow-and-wait.sh weekly-build-all.yml \\
            -f start_year='2026' -f start_week='49' \\
            -f end_year='2026' -f end_week='49' \\
            -f candidate_layouts='${{ inputs.candidate_layouts }}' \\
            -f max_node_candidates='${{ inputs.max_node_candidates }}' \\
            -f max_search_seconds='${{ inputs.max_search_seconds }}' \\
            -f diagnostic_level='${{ inputs.diagnostic_level }}'

  w50_2:
    name: Build 2026 W50
    runs-on: ubuntu-latest
    needs: w49_1
