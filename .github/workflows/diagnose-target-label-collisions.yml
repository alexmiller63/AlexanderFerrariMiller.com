name: Diagnose target label collisions

'on':
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Instrument target-label candidate scoring
        shell: python
        run: |
          from pathlib import Path
          
          p = Path("tools/render_sky_note_finder.py")
          text = p.read_text(encoding="utf-8")
          old = "            geometry_hits = sum(segment_hits_display_bbox(ax, start, end, bbox)\n                                for start, end in obstacle_segments)\n"
          new = "            hit_segments = [\n                (index, start, end)\n                for index, (start, end) in enumerate(obstacle_segments)\n                if segment_hits_display_bbox(ax, start, end, bbox)\n            ]\n            geometry_hits = len(hit_segments)\n"
          if text.count(old) != 1:
              raise SystemExit(f"Expected one target-label scoring block, found {text.count(old)}")
          text = text.replace(old, new)
          
          old2 = "            anchor_distance = math.hypot(nearest_x - anchor_x, nearest_y - anchor_y)\n            annotation.remove()\n"
          new2 = "            anchor_distance = math.hypot(nearest_x - anchor_x, nearest_y - anchor_y)\n            print(\n                f\"TARGET_LABEL_DIAG label={label!r} rank={rank} offset=({dx:.2f},{dy:.2f}) \"\n                f\"distance={anchor_distance:.2f} label_hits={label_hits} \"\n                f\"geometry_hits={geometry_hits} marker_hits={marker_hits} hit_segments={hit_segments}\"\n            )\n            annotation.remove()\n"
          if text.count(old2) != 1:
              raise SystemExit(f"Expected one target-label distance block, found {text.count(old2)}")
          p.write_text(text.replace(old2, new2), encoding="utf-8")
      - name: Verify syntax
        run: python -m py_compile tools/render_sky_note_finder.py
      - name: Run W36 artwork diagnostic
        run: |
          python tools/generate_sky_note_artwork.py --start-week 2026-W36 --end-week 2026-W36 2>&1 | tee target-label-diagnostic.log
      - name: Show target-label diagnostics
        run: grep 'TARGET_LABEL_DIAG' target-label-diagnostic.log || true
