name: White Box Planet Finder

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run white-box test
        run: python tools/run_white_box_planet_finder_workflow.py
