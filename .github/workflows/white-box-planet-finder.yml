name: White Box Planet Finder

on:
  workflow_dispatch:
    inputs:
      diagnostic_level:
        description: "Diagnostic level (0=silent, 1=summary, 2=per-body, 3=candidate detail, 4+=deep geometry)"
        required: true
        default: "1"
        type: string

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run white-box test
        env:
          WHITE_BOX_DIAGNOSTIC: ${{ inputs.diagnostic_level }}
        run: python tools/run_white_box_planet_finder_workflow.py
      - name: Upload White Box diagnostic
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: white-box-diagnostic-level-${{ inputs.diagnostic_level }}
          path: white-box-diagnostic.txt
          if-no-files-found: warn
