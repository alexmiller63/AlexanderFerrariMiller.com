name: Generate Constellation Atlas pilot
on:
  workflow_dispatch:
  push:
    paths:
      - 'tools/generate_constellation_atlas.py'
      - 'finder-geometry/martz-macrobert.json'
      - 'reference-data/iau-constellation-boundaries/**'
      - 'asterism-figure-paths.json'
      - 'asterism-member-coordinates.csv'
      - 'bright-stars-2mag.csv'
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Generate Orion pilot
        run: python tools/generate_constellation_atlas.py
      - name: Commit generated atlas
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add star-almanack/chart-library/constellations/
          if ! git diff --cached --quiet; then
            git commit -m "Publish generated Orion constellation portrait"
            git push
          fi
