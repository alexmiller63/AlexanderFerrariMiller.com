name: Generate Constellation Atlas
on:
  workflow_dispatch:
  push:
    paths:
      - 'tools/generate_constellation_atlas.py'
      - 'tools/constellation_cards.py'
      - 'constellation-cards.json'
      - 'finder-geometry/martz-macrobert.json'
      - 'reference-data/iau-constellation-boundaries/**'
      - 'asterism-figure-paths.json'
      - 'asterism-member-coordinates.csv'
      - 'bright-stars-2mag.csv'
concurrency:
  group: constellation-atlas-publisher
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Generate constellation portraits and cards
        run: python tools/generate_constellation_atlas.py
      - name: Commit generated atlas
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add star-almanack/chart-library/constellations/ star-almanack/constellations/ star-almanack/chart-library/index.html
          if ! git diff --cached --quiet; then
            git commit -m "Publish constellation portraits and shared cards"
            for attempt in 1 2 3 4 5; do
              git fetch origin main
              git rebase origin/main || { echo 'Rebase conflict; refusing to overwrite changes'; git rebase --abort; exit 1; }
              if git push origin HEAD:main; then
                exit 0
              fi
              echo "Concurrent update detected (attempt $attempt); retrying"
              sleep $((attempt * 2))
            done
            echo 'Unable to publish after five safe attempts'
            exit 1
          fi
