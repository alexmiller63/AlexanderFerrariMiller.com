name: Wire complete Almanack legend

on:
  push:
    paths:
      - 'tools/wire_almanack_legend.py'
      - '_includes/almanack-notation-legend.html'

permissions:
  contents: write

jobs:
  wire:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Wire legend on all weekly pages
        run: python tools/wire_almanack_legend.py

      - name: Commit generated legends
        run: |
          if git diff --quiet; then
            echo "No legend changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add almanack/2025 almanack/2026 almanack/2027 \
                  Star-Almanack-Repo/site/2025 Star-Almanack-Repo/site/2026 Star-Almanack-Repo/site/2027
          git commit -m "Apply complete legend to all Almanack years"
          git push
