name: Legend Generator

on:
  workflow_dispatch:
    inputs:
      start_year:
        description: Start ISO year
        required: true
        default: '2026'
        type: string
      start_week:
        description: Start ISO week
        required: true
        default: '36'
        type: string
      end_year:
        description: End ISO year
        required: true
        default: '2026'
        type: string
      end_week:
        description: End ISO week
        required: true
        default: '36'
        type: string
  push:
    paths:
      - 'tools/wire_almanack_legend.py'
      - '_includes/almanack-notation-legend.html'
      - '.github/workflows/wire-almanack-legend.yml'

env:
  ALMANACK_START_YEAR: ${{ github.event_name == 'workflow_dispatch' && inputs.start_year || '2026' }}
  ALMANACK_START_WEEK: ${{ github.event_name == 'workflow_dispatch' && inputs.start_week || '36' }}
  ALMANACK_END_YEAR: ${{ github.event_name == 'workflow_dispatch' && inputs.end_year || '2026' }}
  ALMANACK_END_WEEK: ${{ github.event_name == 'workflow_dispatch' && inputs.end_week || '36' }}

permissions:
  contents: write

jobs:
  wire:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Wire legend on requested weekly pages
        run: >-
          python tools/wire_almanack_legend.py
          "$ALMANACK_START_YEAR" "$ALMANACK_START_WEEK"
          "$ALMANACK_END_YEAR" "$ALMANACK_END_WEEK"

      - name: Commit generated legends
        run: |
          if git diff --quiet; then
            echo "No legend changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add almanack
          if git diff --cached --quiet; then
            echo "No requested-week legend changes."
            exit 0
          fi
          git commit -m "Apply complete legend $ALMANACK_START_YEAR-W$ALMANACK_START_WEEK through $ALMANACK_END_YEAR-W$ALMANACK_END_WEEK"
          git pull --rebase origin main
          git push
