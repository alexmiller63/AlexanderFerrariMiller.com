name: AA- Test Planet Finder W17 Ladder

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install test dependencies
        run: python -m pip install pytest skyfield

      - name: Run progressive W17 Greek ladder
        env:
          PYTHONPATH: tools
          PLANET_FINDER_DIAGNOSTIC_LEVEL: "2"
        run: |
          python -m pytest -q -s \
            'tests/test_planet_finder_w17_ladder.py::test_w17_greek_progressive_ladder'
