name: Calendar navigation retrofit

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/calendar-nav-retrofit.yml
      - tools/calendar-nav-trigger.txt
      - tools/wire_week_navigation.py

permissions:
  contents: write

jobs:
  retrofit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply navigation fix
        run: python3 tools/apply-calendar-nav-fix.py
      - name: Standardize year and week buttons
        run: python3 tools/wire_week_navigation.py
      - name: Commit navigation fix
        run: |
          if git diff --quiet; then
            echo "No changes needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add almanack Star-Almanack-Repo
          git commit -m "Standardize Almanack navigation button styling"
          git push
# trigger enabled
