name: Calendar navigation retrofit

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/calendar-nav-retrofit.yml'
      - 'tools/calendar-nav-trigger.txt'

permissions:
  contents: write

jobs:
  retrofit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply calendar navigation hierarchy
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          BUTTON_CSS = '''
/* year-navigation-buttons */
.yearnav { display:grid; grid-template-columns:1fr auto 1fr; align-items:center; gap:.8rem; margin:.4rem 0 2rem; font-family:system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif; font-size:.9rem; }
.yearnav > :first-child { justify-self:start; }
.yearnav > :last-child { justify-self:end; }
.yearnav a,.yearnav a:visited,.yearnav span { display:inline-block; min-width:5.5rem; padding:.58rem .8rem; border:1px solid #c8d3dc; border-radius:.45rem; text-decoration:none; text-align:center; color:var(--link); background:#fff; white-space:nowrap; }
@media (max-width:760px) { .yearnav{gap:.4rem}.yearnav a,.yearnav a:visited,.yearnav span{min-width:0;padding:.6rem .45rem} }
@media (prefers-color-scheme:dark) { .yearnav a,.yearnav a:visited,.yearnav span{background:#1c2a36;border-color:#405567;color:#b6dcff} }
'''

          def patch_html(path):
              text = path.read_text(encoding='utf-8')
              text = text.replace('>Calendar Home<', '>Almanack Home<')
              if 'class="yearnav"' in text and '/* year-navigation-buttons */' not in text:
                  text = text.replace('</style>', BUTTON_CSS + '</style>', 1)
              path.write_text(text, encoding='utf-8')

          for year in (2025, 2026, 2027):
              for root in (Path('almanack') / str(year), Path('Star-Almanack-Repo/site') / str(year)):
                  if root.exists():
                      for path in root.rglob('index.html'):
                          patch_html(path)

          path = Path('Star-Almanack-Repo/publish_weekly_pages.py')
          text = path.read_text(encoding='utf-8')
          text = text.replace('>Calendar Home<', '>Almanack Home<')
          old_year_css = '''.yearnav { display:grid; grid-template-columns:1fr auto 1fr; align-items:center; gap:1.5rem; margin:.65rem 0 2rem; font-family:system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif; font-size:1.1rem; }
.yearnav > :first-child { justify-self:start; }
.yearnav > :last-child { justify-self:end; }
.yearnav a,.yearnav a:visited { color:var(--link); text-decoration:underline; white-space:nowrap; }
.yearnav span { color:var(--ink); text-align:center; white-space:nowrap; }'''
          new_year_css = '''/* year-navigation-buttons */
.yearnav { display:grid; grid-template-columns:1fr auto 1fr; align-items:center; gap:.8rem; margin:.4rem 0 2rem; font-family:system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif; font-size:.9rem; }
.yearnav > :first-child { justify-self:start; }
.yearnav > :last-child { justify-self:end; }
.yearnav a,.yearnav a:visited,.yearnav span { display:inline-block; min-width:5.5rem; padding:.58rem .8rem; border:1px solid #c8d3dc; border-radius:.45rem; text-decoration:none; text-align:center; color:var(--link); background:#fff; white-space:nowrap; }'''
          text = text.replace(old_year_css, new_year_css)
          text = text.replace('.yearnav{gap:.8rem;font-size:1.05rem}', '.yearnav{gap:.4rem}.yearnav a,.yearnav a:visited,.yearnav span{min-width:0;padding:.6rem .45rem}')
          text = text.replace('.weekgrid a,.weekgrid a:visited{background:#1c2a36;border-color:#405567;color:#b6dcff} }', '.weekgrid a,.weekgrid a:visited{background:#1c2a36;border-color:#405567;color:#b6dcff}.yearnav a,.yearnav a:visited,.yearnav span{background:#1c2a36;border-color:#405567;color:#b6dcff} }')
          path.write_text(text, encoding='utf-8')

          path = Path('Star-Almanack-Repo/publish_placeholder_years.py')
          if path.exists():
              text = path.read_text(encoding='utf-8').replace('>Calendar Home<', '>Almanack Home<')
              path.write_text(text, encoding='utf-8')
          PY

      - name: Commit retrofit
        shell: bash
        run: |
          if git diff --quiet; then
            echo 'No changes needed.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add almanack Star-Almanack-Repo/publish_weekly_pages.py Star-Almanack-Repo/publish_placeholder_years.py Star-Almanack-Repo/site
          git commit -m 'Buttonize year navigation and rename Almanack Home'
          git push
