name: Calendar navigation retrofit

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/calendar-nav-retrofit.yml
      - tools/calendar-nav-trigger.txt
      - tools/wire_week_navigation.py

permissions:
  contents: write

jobs:
  retrofit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply navigation fix
        run: python3 tools/apply-calendar-nav-fix.py
      - name: Standardize year and week buttons
        run: python3 tools/wire_week_navigation.py
      - name: Commit navigation fix
        run: |
          if git diff --quiet; then
            echo "No changes needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add almanack Star-Almanack-Repo
          git commit -m "Standardize Almanack navigation button styling"

          # Other deployment workflows may commit to main at the same time.
          # Rebase and retry so a harmless concurrent commit does not lose
          # the generated Almanack navigation changes.
          for attempt in 1 2 3 4 5; do
            git pull --rebase origin main
            if git push origin HEAD:main; then
              exit 0
            fi
            echo "Push raced with another main commit; retrying ($attempt/5)..."
            sleep 2
          done
          echo "Unable to push Almanack navigation changes after retries."
          exit 1
# trigger enabled
