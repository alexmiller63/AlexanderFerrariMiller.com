name: Calendar navigation retrofit

on:
  push:
    branches:
      - main
    paths:
      - tools/calendar-nav-trigger.txt

permissions:
  contents: write

jobs:
  retrofit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply navigation fix
        run: python3 tools/apply-calendar-nav-fix.py
      - name: Commit navigation fix
        run: |
          if git diff --quiet; then
            echo "No changes needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add almanack Star-Almanack-Repo
          git commit -m "Buttonize year navigation and rename Almanack Home"
          git push
# navigation retrofit
