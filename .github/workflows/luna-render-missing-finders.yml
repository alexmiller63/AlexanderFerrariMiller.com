name: Luna Generate Missing Finders
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'tools/luna_render_missing_finders.py'
      - '.github/workflows/luna-render-missing-finders.yml'
permissions:
  contents: write
concurrency:
  group: almanack-generator-main-writer
  cancel-in-progress: false
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install existing finder renderer dependencies
        run: python -m pip install matplotlib skyfield
      - name: Fetch pinned HYG catalogue
        run: |
          curl -fL --retry 3 https://raw.githubusercontent.com/astronexus/HYG-Database/3bf37f4b2d5460e1278286320d1d62fab9b493c1/hyg/CURRENT/hygdata_v41.csv -o /tmp/hygdata_v41.csv
      - name: Prepare ten permanent object IDs
        run: |
          python tools/luna_prepare_editorial.py
          python tools/luna_review_queue.py
      - name: Generate missing object-owned finder charts
        run: python tools/luna_render_missing_finders.py /tmp/hygdata_v41.csv
      - name: Commit generated finder charts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sky-notes-artwork/objects sky-notes-artwork/specs/objects
          if git diff --cached --quiet; then
            echo "All requested finders already exist"
          else
            git commit -m "Generate missing pilot stellar finder artwork"
            git push origin HEAD:main
          fi
      - name: Preserve report even if a chart fails
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: luna-finder-generation
          path: generated/luna-editorial/finder-generation.json
          if-no-files-found: warn
