name: Generate seasonal celestial atlas

on:
  workflow_dispatch:
    inputs:
      year:
        description: "Atlas year"
        required: true
        default: "2026"

permissions:
  contents: write

jobs:
  atlas:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile atlas generator
        run: python -m py_compile tools/generate_panoramic_atlas.py
      - name: Generate 14 seasonal charts
        run: python tools/generate_panoramic_atlas.py --year "${{ inputs.year }}" --output /tmp/seasonal-atlas
      - name: Validate atlas
        run: |
          python - <<'PY'
          import json
          import pathlib
          import xml.etree.ElementTree as ET
          root = pathlib.Path('/tmp/seasonal-atlas')
          manifest = json.loads((root/'manifest.json').read_text())
          assert len(manifest['views']) == 14, manifest
          assert len({v['file'] for v in manifest['views']}) == 14
          assert any(v['region'] == 'Northern' and v['season'] == 'Winter' for v in manifest['views'])
          for view in manifest['views']:
              path = root/view['file']
              assert path.is_file() and path.stat().st_size > 1000, path
              assert ET.parse(path).getroot().tag.endswith('svg'), path
          print('PASS: 14 SVGs, including Northern Winter')
          PY
      - name: Publish generated charts to Chart Library
        run: |
          mkdir -p star-almanack/chart-library/panoramic
          cp /tmp/seasonal-atlas/*.svg star-almanack/chart-library/panoramic/
          cp /tmp/seasonal-atlas/manifest.json star-almanack/chart-library/panoramic/
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add star-almanack/chart-library/panoramic/
          if ! git diff --cached --quiet; then
            git commit -m "Publish seasonal atlas charts for ${{ inputs.year }}"
            git push
          fi
      - name: Upload atlas charts
        uses: actions/upload-artifact@v4
        with:
          name: star-almanack-seasonal-atlas
          path: /tmp/seasonal-atlas/
          if-no-files-found: error
