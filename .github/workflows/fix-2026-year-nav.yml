name: One-time add 2026 year navigation

on:
  push:
    paths:
      - '.github/workflows/fix-2026-year-nav.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Add durable 2026 year navigation
        run: |
          python - <<'PY'
          from pathlib import Path

          nav = '<nav class="yearnav"><a href="../2025/">← 2025</a><span>ISO 2026</span><a href="../2027/">2027 →</a></nav>'
          css = '''\n.yearnav { display:grid; grid-template-columns:1fr auto 1fr; align-items:center; gap:.8rem; margin:.4rem 0 2rem; font-family:system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif; font-size:.9rem; }\n.yearnav > :last-child { justify-self:end; }\n.yearnav a,.yearnav a:visited,.yearnav span { display:inline-block; min-width:5.5rem; padding:.58rem .8rem; border:1px solid #c8d3dc; border-radius:.45rem; text-decoration:none; text-align:center; color:var(--link); background:#fff; }\n'''

          gen = Path('Star-Almanack-Repo/publish_weekly_pages.py')
          text = gen.read_text()
          if '.yearnav {' not in text:
              text = text.replace('h1,h2,h3 { line-height:1.2; color:#17344d; }', css + 'h1,h2,h3 { line-height:1.2; color:#17344d; }')
          old = "index_body='<h1>2026 Weekly Almanack</h1><p>Select an ISO week.</p>'+prefix+'\\n'+'\\n'.join(groups); (OUT/\"index.html\").write_text(page_shell(\"2026 Weekly Almanack\",index_body),encoding=\"utf-8\")"
          new = "year_nav='" + nav.replace("'", "\\'") + "'; index_body=year_nav+'<h1>2026 Weekly Almanack</h1><p>Select an ISO week.</p>'+prefix+'\\n'+'\\n'.join(groups)+year_nav; (OUT/\"index.html\").write_text(page_shell(\"2026 Weekly Almanack\",index_body),encoding=\"utf-8\")"
          if old in text:
              text = text.replace(old, new)
          gen.write_text(text)

          for path in [Path('Star-Almanack-Repo/site/2026/index.html'), Path('almanack/2026/index.html')]:
              s = path.read_text()
              if '.yearnav {' not in s:
                  s = s.replace('h1,h2,h3 { line-height:1.2; color:#17344d; }', css + 'h1,h2,h3 { line-height:1.2; color:#17344d; }')
              marker = '<main class="wrap">'
              if nav not in s:
                  s = s.replace(marker, marker + nav, 1)
                  s = s.replace('</main>', nav + '</main>', 1)
              path.write_text(s)
          PY
      - name: Remove one-time workflow
        run: rm .github/workflows/fix-2026-year-nav.yml
      - name: Commit
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add Star-Almanack-Repo/publish_weekly_pages.py Star-Almanack-Repo/site/2026/index.html almanack/2026/index.html .github/workflows/fix-2026-year-nav.yml
          git commit -m "Add directional year navigation to 2026 Almanack"
          git push
