name: Publish Luna Draft Stories
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: luna-draft-publication
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Render permanent-ID draft pages
        run: python3 tools/publish_luna_drafts.py
      - name: Commit generated story pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- stories/drafts
          if git diff --cached --quiet; then
            echo "No story changes."
          else
            git commit -m "Publish Luna drafts by permanent object ID"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
