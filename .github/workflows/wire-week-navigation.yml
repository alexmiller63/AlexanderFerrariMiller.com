name: Wire Week Navigation

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  wire-navigation:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Wire Almanack navigation
        run: python tools/wire_week_navigation.py

      - name: Commit generated navigation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add almanack Star-Almanack-Repo/site
          if git diff --cached --quiet; then
            echo "No navigation changes to commit."
          else
            git commit -m "Wire Almanack week navigation"
            git push
          fi
