name: Audit Timed Event Publication

on:
  workflow_dispatch:
  push:
    paths:
      - 'tools/almanack_time.py'
      - 'tools/test_almanack_time.py'
      - 'tools/audit_timed_event_publication.py'
      - 'tools/populate_calendar.py'
      - 'tools/populate_galactic_center.py'
      - 'tools/populate_meteor_showers.py'
      - 'tools/wire_2026_eclipses.py'
      - 'Historical/besselian_eclipse_engine.py'
      - 'Historical/eclipse.yaml'
      - 'Historical/generated/*.json'
      - '.github/workflows/audit-timed-event-publication.yml'

permissions:
  contents: read

jobs:
  publication-invariant:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run canonical time regression tests
        run: python tools/test_almanack_time.py

      - name: Audit timed-event UTC publication invariant
        run: python tools/audit_timed_event_publication.py
