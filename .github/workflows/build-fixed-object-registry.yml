name: Build Fixed Object Registry

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install astronomy dependency
        run: python -m pip install astropy

      - name: Acquire Roman VI/42 constellation lookup once
        run: python tools/acquire_roman_constellation_lookup.py

      - name: Acquire Hipparcos figure-star positions once
        run: python tools/acquire_hipparcos_figure_stars.py

      - name: Audit fixed-object identity
        run: python tools/audit_fixed_object_identity.py

      - name: Build permanent fixed-object registry
        id: build_registry
        continue-on-error: true
        run: python tools/build_fixed_object_registry.py

      - name: Repair fixed-object ID collisions in batch
        if: steps.build_registry.outcome == 'failure'
        run: python tools/repair_fixed_object_id_collisions.py

      - name: Rebuild permanent fixed-object registry after batch repair
        id: build_registry_repaired
        if: steps.build_registry.outcome == 'failure'
        continue-on-error: true
        run: python tools/build_fixed_object_registry.py

      - name: Commit residual collision report
        if: steps.build_registry.outcome == 'failure' && steps.build_registry_repaired.outcome == 'failure'
        run: |
          if [ -f generated/fixed-object-identity-collisions.json ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add generated/fixed-object-identity-collisions.json database/fixed-object-id-merges.json
            if ! git diff --cached --quiet; then
              git commit -m "Record unresolved fixed-object identity collisions"
              git pull --rebase --autostash origin main
              git push origin HEAD:main
            fi
          fi

      - name: Fail after batch repair if collisions remain
        if: steps.build_registry.outcome == 'failure' && steps.build_registry_repaired.outcome != 'success'
        run: exit 1

      - name: Migrate catalog targets to permanent IDs
        if: steps.build_registry.outcome == 'success' || steps.build_registry_repaired.outcome == 'success'
        run: python tools/migrate_catalog_targets_to_fixed_ids.py

      - name: Build normalized fixed-object records
        run: python tools/build_fixed_object_records.py

      - name: Build constellation memberships
        run: python tools/build_constellation_memberships.py

      - name: Validate constellation memberships with Roman VI/42
        run: python tools/validate_constellation_memberships.py

      - name: Commit normalized fixed-object database
        run: |
          echo "Generated changes before commit:"
          git status --short
          git add -A
          if git diff --cached --quiet; then
            echo "No fixed-object database changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Build normalized fixed-object database"
          git pull --rebase --autostash origin main
          git push origin HEAD:main
