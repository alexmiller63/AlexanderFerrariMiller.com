name: Build Fixed Object Registry

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install astronomy dependency
        run: python -m pip install astropy

      - name: Acquire Roman VI/42 constellation lookup once
        run: python tools/acquire_roman_constellation_lookup.py

      - name: Audit fixed-object identity
        run: python tools/audit_fixed_object_identity.py

      - name: Build permanent fixed-object registry
        run: python tools/build_fixed_object_registry.py

      - name: Migrate catalog targets to permanent IDs
        run: python tools/migrate_catalog_targets_to_fixed_ids.py

      - name: Build normalized fixed-object records
        run: python tools/build_fixed_object_records.py

      - name: Build constellation memberships
        run: python tools/build_constellation_memberships.py

      - name: Validate constellation memberships with Roman VI/42
        run: python tools/validate_constellation_memberships.py

      - name: Commit normalized fixed-object database
        run: |
          git add database/fixed-object-registry.json database/fixed-objects.json database/catalog-entry-targets.json database/constellation-memberships.json generated/fixed-object-identity-audit.json generated/constellation-membership-validation.json reference-data/roman-vi42/data.dat
          if git diff --cached --quiet; then
            echo "No fixed-object database changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Build normalized fixed-object database"
          git pull --rebase origin main
          git push origin HEAD:main
