name: Build Fixed Object Registry

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Audit fixed-object identity
        run: python tools/audit_fixed_object_identity.py

      - name: Build permanent fixed-object registry
        run: python tools/build_fixed_object_registry.py

      - name: Commit registry
        run: |
          git add database/fixed-object-registry.json generated/fixed-object-identity-audit.json
          if git diff --cached --quiet; then
            echo "No registry changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Build permanent fixed-object registry"
          git pull --rebase origin main
          git push origin HEAD:main
