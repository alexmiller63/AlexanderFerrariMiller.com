name: Audit Pilot Stories
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: python3 tools/audit_pilot_stories.py
      - uses: actions/upload-artifact@v4
        with:
          name: pilot-publication-audit
          path: pilot-publication-audit.json
