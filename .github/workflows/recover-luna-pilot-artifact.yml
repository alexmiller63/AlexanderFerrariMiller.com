name: Recover Existing Luna Pilot Artifact

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/recover-luna-pilot-artifact.yml'

permissions:
  contents: write
  actions: read

concurrency:
  group: recover-luna-pilot-artifact
  cancel-in-progress: false

jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SOURCE_RUN_ID: "38194839310"
      SOURCE_ARTIFACT_ID: "11723308507"
    steps:
      - uses: actions/checkout@v4
      - name: Download the existing paid pilot results
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl --fail --location --silent --show-error \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/artifacts/$SOURCE_ARTIFACT_ID/zip" \
            --output "$RUNNER_TEMP/luna-pilot.zip"
          mkdir -p "$RUNNER_TEMP/luna-pilot-unpacked"
          unzip -q "$RUNNER_TEMP/luna-pilot.zip" -d "$RUNNER_TEMP/luna-pilot-unpacked"
          count="$(find "$RUNNER_TEMP/luna-pilot-unpacked" -maxdepth 1 -type f | wc -l)"
          test "$count" -ge 41
          test -s "$RUNNER_TEMP/luna-pilot-unpacked/ledger.json"
          echo "Recovered $count files from source run $SOURCE_RUN_ID."
      - name: Commit recovery copy without replacing prior recovery files
        shell: bash
        run: |
          set -euo pipefail
          branch="${GITHUB_REF_NAME}"
          target="research/luna-pilot-recovered/$SOURCE_RUN_ID"
          mkdir -p "$target"
          cp -n "$RUNNER_TEMP/luna-pilot-unpacked/"* "$target/"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$target"
          if git diff --cached --quiet; then
            echo "Recovery copy already exists; no files overwritten."
            exit 0
          fi
          git commit -m "Recover existing Luna pilot results without regeneration"
          for attempt in 1 2 3 4 5 6 7 8; do
            git fetch origin "$branch"
            if git rebase "origin/$branch"; then
              if git push origin "HEAD:$branch"; then
                echo "Existing pilot results saved to $target."
                exit 0
              fi
            else
              git rebase --abort || true
            fi
            echo "Save raced with another update (attempt $attempt/8)."
            sleep "$((attempt * 3))"
          done
          echo "Unable to commit recovery copy; source artifact remains preserved."
          exit 1
