name: Sky Notes Generator

on:
  workflow_dispatch:
    inputs:
      start_year:
        description: Start year
        required: true
        default: '2026'
        type: string
      start_week:
        description: Start week
        required: true
        default: '36'
        type: string
      end_year:
        description: End year
        required: true
        default: '2026'
        type: string
      end_week:
        description: End week
        required: true
        default: '40'
        type: string

permissions:
  contents: write
  actions: write

concurrency:
  group: sky-notes-generator
  cancel-in-progress: false

jobs:
  populate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Resolve ISO week range
        id: range
        run: |
          read START_DATE END_DATE < <(python tools/resolve_iso_week_range.py \
            '${{ inputs.start_year }}' '${{ inputs.start_week }}' \
            '${{ inputs.end_year }}' '${{ inputs.end_week }}')
          echo "start_date=$START_DATE" >> "$GITHUB_OUTPUT"
          echo "end_date=$END_DATE" >> "$GITHUB_OUTPUT"
          echo "$START_DATE through $END_DATE"

      - name: Compile Sky Notes generator sources
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile \
            tools/populate_sky_notes_descriptor_by_date.py \
            tools/populate_sky_notes_by_date.py \
            tools/fixed_object_stories.py \
            tools/sky_note_descriptors.py
          echo "Sky Notes generator sources compile cleanly."

      - name: Generate descriptor-first Sky Notes
        run: python tools/populate_sky_notes_descriptor_by_date.py "${{ steps.range.outputs.start_date }}" "${{ steps.range.outputs.end_date }}"

      - name: Verify reader-facing Sky Note links
        shell: bash
        run: |
          set -euo pipefail
          python tools/verify_sky_note_human_links.py '${{ inputs.start_year }}' '${{ inputs.start_week }}' '${{ inputs.end_week }}'
      - name: Commit Sky Notes, JSON descriptors, artwork descriptors, and generated sources only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- almanack site stories
          git add --all -- generated-sky-notes descriptors
          if git diff --cached --quiet; then
            echo "No Sky Notes changes in requested ISO week range."
            exit 0
          fi
          git commit -m "Generate descriptor-first Sky Notes ${{ inputs.start_year }}-W${{ inputs.start_week }}"
          git pull --rebase origin main
          git push

      - name: Install Playwright Chromium
        run: |
          python -m pip install playwright
          python -m playwright install --with-deps chromium

      - name: Verify deployed Sky Note links in Chromium
        shell: bash
        env:
          START_YEAR: ${{ inputs.start_year }}
          START_WEEK: ${{ inputs.start_week }}
          END_YEAR: ${{ inputs.end_year }}
          END_WEEK: ${{ inputs.end_week }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import os, time
          from datetime import date, timedelta
          from urllib.parse import urljoin
          from playwright.sync_api import sync_playwright
          base = 'https://alexmiller63.github.io/AlexanderFerrariMiller.com/'
          sy, sw = int(os.environ['START_YEAR']), int(os.environ['START_WEEK'])
          ey, ew = int(os.environ['END_YEAR']), int(os.environ['END_WEEK'])
          d, end = date.fromisocalendar(sy, sw, 1), date.fromisocalendar(ey, ew, 1)
          weeks = []
          while d <= end:
              y, w, _ = d.isocalendar(); weeks.append((y, w)); d += timedelta(days=7)
          def load(page, url):
              status = None
              for attempt in range(1, 13):
                  response = page.goto(url, wait_until='networkidle')
                  status = None if response is None else response.status
                  if response is not None and response.ok: return
                  print(f'WAITING FOR DEPLOYMENT attempt={attempt} status={status} url={url}')
                  time.sleep(10)
              raise SystemExit(f'DEPLOYED PAGE FAILED: HTTP {status}: {url}')
          checked = 0
          with sync_playwright() as p:
              browser = p.chromium.launch(); context = browser.new_context()
              for year, week in weeks:
                  page = context.new_page()
                  week_url = urljoin(base, f'almanack/{year}/W{week:02d}/')
                  load(page, week_url)
                  links = page.locator('[data-fixed-object-id] a[href]')
                  for i in range(links.count()):
                      link = links.nth(i); href = link.get_attribute('href')
                      if not href or href.startswith(('#','mailto:','javascript:')): continue
                      label = link.inner_text().strip(); destination_url = urljoin(page.url, href)
                      destination = context.new_page()
                      response = destination.goto(destination_url, wait_until='networkidle')
                      status = None if response is None else response.status
                      print(f'{year}-W{week:02d}: {label!r} -> {destination_url} HTTP {status}')
                      if response is None or not response.ok:
                          raise SystemExit(f'DEPLOYED SKY NOTE LINK FAILED: {year}-W{week:02d} {label!r}: HTTP {status}: {destination_url}')

                      # HTTP 200 is necessary but not sufficient. A fixed-object human
                      # destination is complete only when its story package is present.
                      # Story fields are typed in the generated HTML. Never infer
                      # body or descriptor presence from generic page prose.
                      # GitHub Pages can return HTTP 200 for the previous deployed
                      # revision while the just-pushed story package is still propagating.
                      # Inspect what Chromium actually renders, and retry the rendered
                      # package rather than treating the first HTTP 200 as authoritative.
                      diagnostics = {}
                      descriptor_text = ''
                      descriptor_href = ''
                      for package_attempt in range(1, 13):
                          story_root = destination.locator('main.sky-note-story-page[data-fixed-object-id]')
                          hed = destination.locator('[data-story-field="hed"]:visible')
                          dek = destination.locator('[data-story-field="dek"]:visible')
                          body = destination.locator('[data-story-field="body"]:visible')
                          descriptor = destination.locator('[data-story-field="descriptor"]:visible')
                          descriptor_link = descriptor.locator('a[href]').first if descriptor.count() == 1 else None
                          art_count = destination.locator('main.sky-note-story-page img:visible, main.sky-note-story-page svg:visible, main.sky-note-story-page picture:visible').count()
                          hed_text = hed.first.inner_text().strip() if hed.count() == 1 else ''
                          dek_text = dek.first.inner_text().strip() if dek.count() == 1 else ''
                          body_text = body.first.inner_text().strip() if body.count() == 1 else ''
                          body_excerpt = ' '.join(body_text.split())[:240]
                          descriptor_text = descriptor.first.inner_text().strip() if descriptor.count() == 1 else ''
                          descriptor_href = descriptor_link.get_attribute('href') if descriptor_link is not None and descriptor_link.count() == 1 else ''
                          descriptor_url = urljoin(destination.url, descriptor_href) if descriptor_href else ''
                          descriptor_status = None
                          descriptor_id = None
                          if descriptor_url:
                              descriptor_response = context.request.get(descriptor_url)
                              descriptor_status = descriptor_response.status
                              if descriptor_response.ok:
                                  try:
                                      descriptor_json = descriptor_response.json()
                                      descriptor_id = str(descriptor_json.get('id')) if isinstance(descriptor_json, dict) else None
                                  except Exception:
                                      descriptor_id = None
                          root_id = story_root.first.get_attribute('data-fixed-object-id') if story_root.count() == 1 else None
                          diagnostics = {
                              'hed': hed.count() == 1 and bool(hed_text),
                              'dek': dek.count() == 1 and bool(dek_text),
                              'body': body.count() == 1 and len(body_text) >= 40,
                              'art': art_count > 0,
                              # Descriptor presence is a rendered-page fact, and the
                              # descriptor target must itself resolve successfully.
                              'descriptor': (
                                  descriptor.count() == 1
                                  and bool(descriptor_text)
                                  and bool(descriptor_href)
                                  and descriptor_status is not None
                                  and 200 <= descriptor_status < 300
                                  and descriptor_id == root_id
                              ),
                          }
                          art_urls = destination.locator('main.sky-note-story-page img:visible').evaluate_all("els => els.map(e => e.currentSrc || e.src).filter(Boolean)")
                          art_url = art_urls[0] if art_urls else 'NONE'
                          print(
                              f'DIAGNOSTIC attempt={package_attempt} {year}-W{week:02d} {label!r}: '
                              + ' '.join(f'{key}={"YES" if value else "NO"}' for key, value in diagnostics.items())
                              + f' hed_text={hed_text!r} dek_text={dek_text!r} body_excerpt={body_excerpt!r}'
                              + f' art_url={art_url!r} descriptor_text={descriptor_text!r} descriptor_href={descriptor_href!r}\n'
                              + f' descriptor_url={descriptor_url!r} descriptor_status={descriptor_status!r} descriptor_id={descriptor_id!r}'
                              + f' root_id={root_id!r} url={destination_url}'
                          )
                          # Every required field must be rendered inside the one typed
                          # story root for this numeric object identity. This prevents
                          # unrelated DOM content from satisfying package acceptance.
                          same_story = (
                              story_root.count() == 1
                              and root_id is not None
                              and hed.count() == 1 and story_root.locator('[data-story-field="hed"]:visible').count() == 1
                              and dek.count() == 1 and story_root.locator('[data-story-field="dek"]:visible').count() == 1
                              and body.count() == 1 and story_root.locator('[data-story-field="body"]:visible').count() == 1
                              and descriptor.count() == 1 and story_root.locator('[data-story-field="descriptor"]:visible').count() == 1
                          )
                          # Sky Notes owns the story package and descriptor, but Artwork is
                          # generated by the downstream Artwork Generator. Keep reporting
                          # art here for diagnostics without making Populate depend on it.
                          required = {key: diagnostics[key] for key in ('hed', 'dek', 'body', 'descriptor')}
                          if all(required.values()) and same_story:
                              break
                          diagnostics['same_story'] = same_story
                          if package_attempt < 12:
                              time.sleep(10)
                              destination.reload(wait_until='networkidle')
                      missing = [key for key, value in diagnostics.items() if key != 'art' and not value]
                      if missing:
                          raise SystemExit(
                              f'DEPLOYED FIXED-OBJECT PACKAGE INCOMPLETE AFTER RENDERED RETRIES: '
                              f'{year}-W{week:02d} {label!r}; missing={",".join(missing)}; '
                              f'descriptor_text={descriptor_text!r}; descriptor_href={descriptor_href!r}; \n'                              f'descriptor_url={descriptor_url!r}; descriptor_status={descriptor_status!r}; descriptor_id={descriptor_id!r}; '
                              f'url={destination_url}'
                          )
                      destination.close(); checked += 1
                  page.close()
              context.close(); browser.close()
          if checked == 0: raise SystemExit('No deployed reader-facing Sky Note links were exercised.')
          print(f'DEPLOYED ACCEPTANCE PASSED: Chromium exercised {checked} reader-facing Sky Note link(s).')
          PY
