name: AA-Planet Finder Regression Bisect

on:
  workflow_dispatch:

jobs:
  regression-ab:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - run: pip install pytest skyfield==1.55
      - name: Create standalone tight-5 regression
        run: |
          cat > /tmp/test_tight5_ab.py <<'PY'
          import os
          from planet_finder_geometry import CANONICAL, FinderMode
          from planet_finder_search import layout
          from planet_finder_validation import validate_layout

          W01 = {
              "Sun": 277.511945972904,
              "Mercury": 264.1023447351197,
              "Venus": 275.4313050776394,
              "Mars": 280.39213202805865,
              "Pluto": 302.62909367404063,
          }
          ISOLATED = {
              "Saturn": 20, "Neptune": 60, "Ceres": 100,
              "Moon": 140, "Uranus": 180, "Jupiter": 220,
          }

          def test_tight5():
              os.environ["PLANET_FINDER_ALIGNMENT_FIX"] = "1"
              os.environ["PLANET_FINDER_DIAGNOSTIC_LEVEL"] = "1"
              longitudes = dict(ISOLATED)
              longitudes.update(W01)
              assert set(longitudes) == set(CANONICAL)
              bodies = [(name.lower(), name, float(longitudes[name])) for name in CANONICAL]
              result = layout(
                  FinderMode.GREEK,
                  bodies,
                  target_solutions=5,
                  budget={"max_node_candidates": 2000, "max_seconds": 60.0},
                  context_label="W01-tight5-historical-AB",
              )
              expected = {name for _, name, _ in bodies}
              actual = [name for _, name, _, _, _ in result]
              assert len(actual) == len(expected)
              assert set(actual) == expected
              valid, errors = validate_layout(FinderMode.GREEK, result)
              assert valid, errors
          PY

      - name: Create bisect runner
        run: |
          cat > /tmp/run_tight5.sh <<'SH'
          #!/usr/bin/env bash
          PYTHONPATH=tools pytest -q -s /tmp/test_tight5_ab.py
          SH
          chmod +x /tmp/run_tight5.sh

      - name: Bisect first bad solver commit
        run: |
          git bisect start
          git bisect bad ebc2e56ef97b1357481daa8dda3f9dbed345e386
          git bisect good c6f960995932d1c8ad85584678abd13db68e04d0
          git bisect run /tmp/run_tight5.sh
          echo "===== BISECT RESULT ====="
          git bisect log
