name: Classify fixed objects — Milky Way mask

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: classify-fixed-object-regions
  cancel-in-progress: false

jobs:
  classify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install YAML parser
        run: python -m pip install --disable-pip-version-check PyYAML

      - name: Classify fixed objects against Milky Way mask
        run: python tools/classify_fixed_object_regions.py

      - name: Show motivating Sirius classification
        run: |
          python - <<'PY'
          import yaml
          from pathlib import Path

          data = yaml.safe_load(Path('Historical/fixed-object-regions.yaml').read_text())
          sirius = data['objects']['bayer'].get('α CMa')
          if sirius is None:
              raise SystemExit('Sirius (α CMa) was not found in fixed-object-regions.yaml')
          print('Sirius:', sirius['milky_way'])
          PY

      - name: Commit fixed-object region metadata
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- Historical/fixed-object-regions.yaml
          if git diff --cached --quiet; then
            echo "Fixed-object region metadata is already current."
            exit 0
          fi
          git commit -m "Classify fixed objects by Milky Way mask"

          for attempt in 1 2 3 4 5; do
            if git push origin HEAD:main; then
              exit 0
            fi
            echo "Push attempt $attempt failed; rebasing on current main and regenerating."
            git fetch origin main
            git rebase origin/main
            python tools/classify_fixed_object_regions.py
            git add -- Historical/fixed-object-regions.yaml
            if ! git diff --cached --quiet; then
              git commit --amend --no-edit
            fi
            sleep $((attempt * 2))
          done

          echo "Unable to push fixed-object region metadata after 5 attempts."
          exit 1
