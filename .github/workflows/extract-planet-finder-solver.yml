name: Extract Planet Finder Solver

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Extract fixed-order solver
        run: python tools/extract_planet_finder_solver.py
      - name: Syntax check
        run: python -m py_compile tools/generate_planet_finders.py tools/planet_finder_search.py
      - name: Commit extraction
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools/generate_planet_finders.py tools/planet_finder_search.py
          if git diff --cached --quiet; then
            echo "No extraction changes to commit."
          else
            git commit -m "Extract Planet Finder fixed-order solver"
            git push
          fi
