name: Python source preflight

on:
  push:
    paths:
      - '**/*.py'
      - '.github/workflows/python-source-preflight.yml'
  pull_request:
    paths:
      - '**/*.py'
      - '.github/workflows/python-source-preflight.yml'
  workflow_dispatch:

jobs:
  validate-python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Compile all Python source
        run: python -m compileall -q .

      - name: Reject suspicious literal newline escapes
        shell: python
        run: |
          from pathlib import Path
          import io
          import tokenize

          failures = []
          for path in Path(".").rglob("*.py"):
              if ".git" in path.parts:
                  continue
              raw = path.read_bytes()
              try:
                  list(tokenize.tokenize(io.BytesIO(raw).readline))
              except (tokenize.TokenError, IndentationError, SyntaxError) as exc:
                  failures.append(f"{path}: tokenization failed: {exc}")

          if failures:
              raise SystemExit("\n".join(failures))
