name: Populate Calendar by Date

on:
  workflow_dispatch:
    inputs:
      start_date:
        description: Start date (YYYY-MM-DD)
        required: true
        type: string
      end_date:
        description: End date (YYYY-MM-DD, optional; defaults to start date)
        required: false
        type: string

permissions:
  contents: write

jobs:
  populate:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Populate requested calendar dates
        env:
          START_DATE: ${{ inputs.start_date }}
          END_DATE: ${{ inputs.end_date }}
        run: |
          python tools/populate_calendar_by_date.py \
            --start-date "$START_DATE" \
            ${END_DATE:+--end-date "$END_DATE"}

      - name: Commit generated changes
        id: commit
        run: |
          if git diff --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No generated changes to commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Populate Almanack calendar by date"
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Install Playwright Chromium
        run: |
          python -m pip install --upgrade pip
          python -m pip install playwright
          python -m playwright install --with-deps chromium

      - name: Verify generated pages locally in Chromium
        env:
          START_DATE: ${{ inputs.start_date }}
          END_DATE: ${{ inputs.end_date }}
        run: |
          python - <<'PY'
          import datetime as dt
          import os
          import pathlib
          import threading
          from http.server import ThreadingHTTPServer, SimpleHTTPRequestHandler
          from playwright.sync_api import sync_playwright

          start = dt.date.fromisoformat(os.environ['START_DATE'])
          end_text = (os.environ.get('END_DATE') or '').strip()
          end = dt.date.fromisoformat(end_text) if end_text else start
          if end < start:
              raise SystemExit('end_date must not be before start_date')

          root = pathlib.Path.cwd()
          os.chdir(root)
          server = ThreadingHTTPServer(('127.0.0.1', 0), SimpleHTTPRequestHandler)
          thread = threading.Thread(target=server.serve_forever, daemon=True)
          thread.start()
          base = f'http://127.0.0.1:{server.server_port}'

          weeks = []
          d = start
          while d <= end:
              iso = d.isocalendar()
              pair = (iso.year, iso.week)
              if pair not in weeks:
                  weeks.append(pair)
              d += dt.timedelta(days=1)

          with sync_playwright() as p:
              browser = p.chromium.launch()
              page = browser.new_page()
              for year, week in weeks:
                  rel = f'star-almanack/{year}/W{week:02d}/index.html'
                  path = root / rel
                  if not path.exists():
                      raise SystemExit(f'Missing generated page: {rel}')
                  url = f'{base}/{rel}'
                  response = page.goto(url, wait_until='networkidle')
                  if response is None or not response.ok:
                      status = None if response is None else response.status
                      raise SystemExit(f'Local Chromium failed to load {url}: HTTP {status}')
                  if page.locator('table.calendar').count() != 1:
                      raise SystemExit(f'Calendar table missing in {rel}')
                  if page.locator('td.calendar-events-region .calendar-events').count() == 0:
                      raise SystemExit(f'Event-cell container missing in {rel}')
                  print(f'Local Chromium PASS: {rel}')
              browser.close()

          server.shutdown()
          PY

      - name: Verify complete published GitHub Pages
        env:
          START_DATE: ${{ inputs.start_date }}
          END_DATE: ${{ inputs.end_date }}
        run: |
          python - <<'PY'
          import datetime as dt
          import hashlib
          import os
          import pathlib
          import time
          import urllib.request

          start = dt.date.fromisoformat(os.environ['START_DATE'])
          end_text = (os.environ.get('END_DATE') or '').strip()
          end = dt.date.fromisoformat(end_text) if end_text else start
          if end < start:
              raise SystemExit('end_date must not be before start_date')

          weeks = []
          d = start
          while d <= end:
              iso = d.isocalendar()
              pair = (iso.year, iso.week)
              if pair not in weeks:
                  weeks.append(pair)
              d += dt.timedelta(days=1)

          root = pathlib.Path.cwd()
          expected = {}
          for year, week in weeks:
              rel = pathlib.Path('star-almanack') / str(year) / f'W{week:02d}' / 'index.html'
              data = (root / rel).read_bytes()
              expected[(year, week)] = hashlib.sha256(data).hexdigest()

          base = 'https://alexmiller63.github.io/AlexanderFerrariMiller.com'
          deadline = time.time() + 6 * 60
          attempt = 0
          while True:
              attempt += 1
              all_ok = True
              for year, week in weeks:
                  url = f'{base}/star-almanack/{year}/W{week:02d}/index.html?verify={int(time.time())}'
                  try:
                      req = urllib.request.Request(url, headers={'Cache-Control': 'no-cache', 'Pragma': 'no-cache'})
                      with urllib.request.urlopen(req, timeout=30) as response:
                          actual_bytes = response.read()
                      actual = hashlib.sha256(actual_bytes).hexdigest()
                  except Exception as exc:
                      print(f'Attempt {attempt}: W{week:02d} fetch failed: {exc}')
                      all_ok = False
                      continue

                  wanted = expected[(year, week)]
                  if actual != wanted:
                      print(f'Attempt {attempt}: W{week:02d} mismatch generated={wanted[:12]} pages={actual[:12]}')
                      all_ok = False
                  else:
                      print(f'Attempt {attempt}: W{week:02d} published content matches')

              if all_ok:
                  print('Published GitHub Pages verification PASS')
                  break
              if time.time() >= deadline:
                  raise SystemExit('Published GitHub Pages did not match generated content within 6 minutes')
              time.sleep(10)
          PY
