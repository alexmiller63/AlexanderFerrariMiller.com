name: Build asterism geometry

on:
  workflow_dispatch:
  push:
    paths:
      - 'Star-Almanack-Repo/asterisms-core-25.yaml'
      - 'Star-Almanack-Repo/asterism-coordinate-resolution.yaml'
      - 'Star-Almanack-Repo/expanded-bayer-stars.csv'
      - 'Star-Almanack-Repo/build_asterism_member_coordinates.py'
      - 'Star-Almanack-Repo/compute_asterism_geometry_2026.py'
      - '.github/workflows/build-asterism-geometry.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install YAML dependency
        run: python -m pip install --disable-pip-version-check pyyaml

      - name: Resolve member coordinates
        working-directory: Star-Almanack-Repo
        run: python build_asterism_member_coordinates.py

      - name: Validate coordinate cross-match
        working-directory: Star-Almanack-Repo
        run: |
          python - <<'PY'
          import csv
          from collections import Counter
          from pathlib import Path
          from build_asterism_member_coordinates import load_asterisms

          cat = load_asterisms(Path('asterisms-core-25.yaml'))
          expected = sum(len(a['members']) for a in cat)
          with open('asterism-member-coordinates.csv', newline='', encoding='utf-8') as f:
              rows = list(csv.DictReader(f))
          assert len(cat) == 25, len(cat)
          assert len(rows) == expected, (len(rows), expected)
          counts = Counter(r['asterism'] for r in rows)
          for a in cat:
              assert counts[a['name']] == len(a['members']), a['name']
          for r in rows:
              ra = float(r['ra_h']); dec = float(r['dec_deg'])
              assert 0.0 <= ra < 24.0, r
              assert -90.0 <= dec <= 90.0, r
          print(f'PASS: 25 asterisms, {len(rows)} resolved member rows')
          PY

      - name: Compute 2026 asterism centroids and visibility
        working-directory: Star-Almanack-Repo
        run: python compute_asterism_geometry_2026.py asterism-member-coordinates.csv asterism-geometry-2026.csv

      - name: Validate geometry output
        working-directory: Star-Almanack-Repo
        run: |
          python - <<'PY'
          import csv
          with open('asterism-geometry-2026.csv', newline='', encoding='utf-8') as f:
              rows = list(csv.DictReader(f))
          assert len(rows) == 25, len(rows)
          names = {r['asterism'] for r in rows}
          assert len(names) == 25
          for r in rows:
              assert r['best_date'].startswith('2026-') or r['best_date'] == '2027-01-01', r
              assert 0.0 <= float(r['centroid_ra_h']) < 24.0, r
              assert -90.0 <= float(r['centroid_dec_deg']) <= 90.0, r
              assert float(r['area_sr']) >= 0.0, r
          southern = next(r for r in rows if r['asterism'] == 'Southern Pointers')
          assert southern['geometry_method'] == 'great-circle-midpoint', southern
          print('PASS: 25 geometry rows; Southern Pointers uses geodesic midpoint')
          PY

      - name: Commit generated coordinate and geometry files
        run: |
          if git diff --quiet -- Star-Almanack-Repo/asterism-member-coordinates.csv Star-Almanack-Repo/asterism-geometry-2026.csv; then
            echo 'Generated asterism files unchanged.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Star-Almanack-Repo/asterism-member-coordinates.csv Star-Almanack-Repo/asterism-geometry-2026.csv
          git commit -m 'Generate 2026 core asterism geometry'
          git push
