name: Build Almanack Weeks

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/build-almanack-weeks.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch canonical Star Almanack weekly site
        run: |
          rm -rf /tmp/star-almanack
          git clone --depth 1 https://github.com/alexmiller63/star-almanack.git /tmp/star-almanack

      - name: Publish canonical 2026 weekly pages
        run: |
          rm -rf almanack/2026
          mkdir -p almanack/2026
          cp -R /tmp/star-almanack/site/2026/. almanack/2026/

      - name: Commit generated Almanack pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add almanack/2026
          if git diff --cached --quiet; then
            echo "No Almanack page changes."
            exit 0
          fi
          git commit -m "Publish canonical 2026 Star Almanack pages"
          git push

