name: Build Almanack Weeks

on:
  push:
    paths:
      - '.github/workflows/build-almanack-weeks.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Markdown renderer
        run: python -m pip install markdown

      - name: Fetch Star Almanack source
        run: |
          curl -fsSL \
            https://raw.githubusercontent.com/alexmiller63/star-almanack/main/almanack.md \
            -o /tmp/almanack.md

      - name: Build 53 ISO-week pages
        run: |
          python - <<'PY'
          from pathlib import Path
          import html
          import re
          import markdown

          source = Path('/tmp/almanack.md').read_text(encoding='utf-8')
          out = Path('almanack')

          pattern = re.compile(r'^## ISO 2026-W(\d{2})\s*$', re.M)
          matches = list(pattern.finditer(source))
          if len(matches) != 53:
              raise SystemExit(f'Expected 53 ISO weeks, found {len(matches)}')

          def shell(title, body, prev_week=None, next_week=None):
              links = ['<a href="index.html">Almanack Home</a>', '<a href="2026.html">2026 Weeks</a>']
              if prev_week:
                  links.append(f'<a href="ISO2026-W{prev_week:02d}.html">← Week {prev_week:02d}</a>')
              if next_week:
                  links.append(f'<a href="ISO2026-W{next_week:02d}.html">Week {next_week:02d} →</a>')
              weeknav = ' '.join(links)
              return f'''---
layout: null
---
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{html.escape(title)}</title>
  <link rel="stylesheet" href="css/almanack.css">
</head>
<body>
  {{% include_relative includes/nav.html %}}
  <main class="page-shell almanack-week">
    <nav class="week-nav" aria-label="Week navigation">{weeknav}</nav>
    {body}
    <nav class="week-nav" aria-label="Week navigation">{weeknav}</nav>
  </main>
  {{% include_relative includes/footer.html %}}
</body>
</html>
'''

          rows = []
          for i, match in enumerate(matches):
              week = int(match.group(1))
              start = match.start()
              end = matches[i + 1].start() if i + 1 < len(matches) else len(source)
              section = source[start:end].strip()
              civil = re.search(r'^\*\*Civil dates:\*\*\s*(.+)$', section, re.M)
              civil_text = civil.group(1).strip() if civil else ''
              body = markdown.markdown(section, extensions=['tables'])
              prev_week = week - 1 if week > 1 else None
              next_week = week + 1 if week < 53 else None
              page = shell(f'Star Almanack — ISO 2026-W{week:02d}', body, prev_week, next_week)
              (out / f'ISO2026-W{week:02d}.html').write_text(page, encoding='utf-8')
              rows.append((week, civil_text))

          cards = '\n'.join(
              f'''      <article class="card">
        <h2>Week {week:02d}</h2>
        <p>{html.escape(civil)}</p>
        <a class="button" href="ISO2026-W{week:02d}.html">Open week</a>
      </article>'''
              for week, civil in rows
          )

          index = f'''---
layout: null
---
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Star Almanack — 2026</title>
  <link rel="stylesheet" href="css/almanack.css">
</head>
<body>
  {{% include_relative includes/nav.html %}}
  <main class="page-shell">
    <section class="hero">
      <p class="eyebrow">Star Almanack · ISO 2026</p>
      <h1>53 Weeks of the Night Sky</h1>
      <p class="tagline">The 2026 Almanack, organized by ISO week.</p>
    </section>
    <section class="cards week-cards" aria-label="2026 ISO weeks">
{cards}
    </section>
  </main>
  {{% include_relative includes/footer.html %}}
</body>
</html>
'''
          (out / '2026.html').write_text(index, encoding='utf-8')
          PY

      - name: Add 2026 Almanack link to minisite home
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('almanack/index.html')
          text = path.read_text(encoding='utf-8')
          marker = '''    <section class="cards" aria-label="Almanack sections">'''
          card = '''    <section class="cards" aria-label="Almanack sections">
      <article class="card">
        <h2>2026 Almanack</h2>
        <p>The complete Star Almanack arranged as 53 ISO weeks.</p>
        <a class="button" href="2026.html">Browse 2026</a>
      </article>'''
          if 'href="2026.html"' not in text:
              if marker not in text:
                  raise SystemExit('Almanack cards section not found')
              text = text.replace(marker, card, 1)
              path.write_text(text, encoding='utf-8')
          PY

      - name: Add weekly-page styling
        run: |
          cat >> almanack/css/almanack.css <<'CSS'

.week-cards {
  grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
}

.almanack-week {
  padding-top: 36px;
  padding-bottom: 48px;
}

.almanack-week table {
  width: 100%;
  border-collapse: collapse;
  margin: 18px 0 28px;
}

.almanack-week th,
.almanack-week td {
  padding: 9px 10px;
  border: 1px solid var(--border);
  text-align: left;
  vertical-align: top;
}

.almanack-week code {
  color: var(--accent);
}

.week-nav {
  display: flex;
  flex-wrap: wrap;
  gap: 12px 20px;
  margin: 0 0 28px;
  padding: 14px 0;
  border-bottom: 1px solid var(--border);
}

.week-nav:last-child {
  margin: 32px 0 0;
  border-top: 1px solid var(--border);
  border-bottom: 0;
}

.week-nav a {
  color: var(--accent);
  text-decoration: none;
}
CSS

      - name: Commit generated Almanack pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add almanack
          git commit -m "Publish 2026 Almanack as ISO-week pages"
          git push
