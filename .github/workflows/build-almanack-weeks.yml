name: Build Almanack Weeks

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/build-almanack-weeks.yml'
      - 'tools/build-almanack-weeks.py'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Markdown renderer
        run: python -m pip install markdown

      - name: Fetch Star Almanack source
        run: curl -fsSL https://raw.githubusercontent.com/alexmiller63/star-almanack/main/almanack.md -o /tmp/almanack.md

      - name: Build available ISO-week pages
        run: python tools/build-almanack-weeks.py

      - name: Commit generated Almanack pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add almanack
          if git diff --cached --quiet; then
            echo "No Almanack page changes."
            exit 0
          fi
          git commit -m "Publish 2026 Almanack as ISO-week pages"
          git push
