name: Fix Planet Finder retry after search-budget exhaustion

on:
  push:
    paths:
      - '.github/workflows/fix-planet-finder-retry-order.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Apply root-cause retry fix
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('tools/generate_planet_finders.py')
          text = path.read_text(encoding='utf-8')

          old = '''        solved, result = _solve_order(mode, bodies, order)\n        if solved:\n            print(\n                f"Planet Finder {mode}: solved with {order[0][1][1]} first",\n                flush=True,\n            )\n            return result\n        print(\n            f"Planet Finder {mode}: no solution with {order[0][1][1]} first",\n            flush=True,\n        )\n'''

          new = '''        try:\n            solved, result = _solve_order(mode, bodies, order)\n        except RuntimeError as exc:\n            if "Planet Finder search budget exhausted" not in str(exc):\n                raise\n            solved, result = False, None\n            print(\n                f"Planet Finder {mode}: search budget exhausted with "\n                f"{order[0][1][1]} first; restarting from scratch with the next body",\n                flush=True,\n            )\n\n        if solved:\n            print(\n                f"Planet Finder {mode}: solved with {order[0][1][1]} first",\n                flush=True,\n            )\n            return result\n        print(\n            f"Planet Finder {mode}: no solution with {order[0][1][1]} first",\n            flush=True,\n        )\n'''

          if old not in text:
              raise SystemExit('Expected Planet Finder retry block not found; refusing blind patch')
          text = text.replace(old, new, 1)
          path.write_text(text, encoding='utf-8')
          PY

      - name: Syntax check
        run: python -m py_compile tools/generate_planet_finders.py

      - name: Commit root-cause fix and remove one-shot workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tools/generate_planet_finders.py
          git rm .github/workflows/fix-planet-finder-retry-order.yml
          git commit -m 'Continue Planet Finder retries after search budget exhaustion'
          git push origin HEAD:main
