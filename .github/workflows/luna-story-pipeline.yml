name: Luna Story Pilot - Research Write Audit
on:
  workflow_dispatch:
    inputs:
      model:
        description: "Verified OpenAI API model ID"
        required: true
        default: "gpt-4.1-nano"
        type: string
      input_price:
        description: "Verified USD per 1M input tokens"
        default: "0.10"
        required: true
        type: string
      output_price:
        description: "Verified USD per 1M output tokens"
        default: "0.40"
        required: true
        type: string
      paid_execute:
        description: "Explicitly authorize paid API calls (default false)"
        required: true
        default: false
        type: boolean
permissions:
  contents: write

# Prevent overlapping pilot runs from racing to save the same output directory.
concurrency:
  group: luna-story-pilot-${{ github.ref }}
  cancel-in-progress: false
# Publication intentionally disabled until deterministic editorial validation is implemented.
# A model-produced audit checklist is not publication approval.
jobs:
  pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      OPENAI_API_KEY: ${{ inputs.paid_execute && secrets.OPENAI_API_KEY || '' }}
    steps:
      - uses: actions/checkout@v4
      - name: Run pilot (dry-run by default)
        shell: bash
        env:
          MODEL: ${{ inputs.model }}
          INPUT_PRICE: ${{ inputs.input_price }}
          OUTPUT_PRICE: ${{ inputs.output_price }}
          PAID_EXECUTE: ${{ inputs.paid_execute }}
        run: |
          set -euo pipefail
          args=(--model "$MODEL" --input-price "$INPUT_PRICE" --output-price "$OUTPUT_PRICE")
          if [[ "$PAID_EXECUTE" == "true" ]]; then args+=(--execute); fi
          python3 tools/luna_story_pipeline.py "${args[@]}"
      - name: Check reviewed story publication eligibility
        run: python3 tools/publish_stories.py --dry-run
      - name: Compile-check editorial pipeline
        run: python3 -m py_compile tools/luna_story_pipeline.py
      - name: Validate pilot output structure
        if: always()
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          manifest = json.loads(Path('research/luna-pilot-candidates.json').read_text())
          assert len(manifest) == 10
          assert len({str(t['id']) for t in manifest}) == 10
          output = Path('generated/luna-pilot')
          if output.exists():
              for story in output.glob('*.md'):
                  assert story.stat().st_size > 0, f'Empty draft: {story}'
                  assert story.with_suffix('.audit.txt').exists(), f'Missing audit: {story}'
                  assert story.with_suffix('.research.txt').exists(), f'Missing research: {story}'
          print('Pilot output structure validated; drafts remain unpublished.')
          PY
      - name: Permanently save every completed pilot output
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          branch="${GITHUB_REF_NAME}"
          snapshot="$RUNNER_TEMP/luna-pilot-save"
          mkdir -p "$snapshot"
          if [[ ! -d generated/luna-pilot ]]; then
            echo "No pilot output directory exists; nothing to save."
            exit 0
          fi
          cp -a generated/luna-pilot/. "$snapshot/"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Preserve existing repository files. Conflicting run output is saved separately.
          for attempt in 1 2 3 4 5 6 7 8; do
            git fetch origin "$branch"
            git reset --hard "origin/$branch"
            while IFS= read -r -d '' source; do
              rel="${source#"$snapshot"/}"
              dest="generated/luna-pilot/$rel"
              if [[ -f "$dest" ]]; then
                if cmp -s "$source" "$dest"; then
                  continue
                fi
                dest="generated/luna-pilot-recovery/${GITHUB_RUN_ID}/$rel"
                echo "Preserving conflicting output separately: $dest"
              fi
              mkdir -p "$(dirname "$dest")"
              cp "$source" "$dest"
            done < <(find "$snapshot" -type f -print0)
            git add -A -- generated/luna-pilot/
            if [[ -d generated/luna-pilot-recovery ]]; then
              git add -A -- generated/luna-pilot-recovery/
            fi
            if git diff --cached --quiet; then
              echo "All pilot outputs are already saved; no changes needed."
              exit 0
            fi
            git commit -m "Save completed Luna pilot outputs"
            if git push origin "HEAD:$branch"; then
              echo "All completed pilot outputs are committed to $branch."
              exit 0
            fi
            echo "Save push raced with another repository update (attempt $attempt/8)."
            sleep "$((attempt * 3))"
          done
          echo "Save did not reach the repository after eight attempts; uploaded artifact remains the recovery copy."
          exit 1
      - name: Publish already-reviewed stories
        if: success()
        run: |
          python3 tools/publish_stories.py
          git add stories/
          if ! git diff --cached --quiet; then
            git -c user.name=github-actions -c user.email=actions@users.noreply.github.com commit -m "Render reviewed stories"
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: luna-pilot-results
          path: generated/luna-pilot/
          if-no-files-found: warn
