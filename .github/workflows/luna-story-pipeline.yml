name: Luna Story Batch - $1.50 Writing Only
on:
  workflow_dispatch:
    inputs:
      count:
        description: "Number of stories to generate (1-1000)"
        required: true
        default: "200"
        type: string
      model:
        description: "Verified OpenAI API model ID"
        required: true
        default: "gpt-6-luna"
        type: string
      input_price:
        description: "Verified USD per 1M input tokens"
        default: "0.10"
        required: true
        type: string
      output_price:
        description: "Verified USD per 1M output tokens"
        default: "0.50"
        required: true
        type: string
      paid_execute:
        description: "Explicitly authorize paid API calls (default false)"
        required: true
        default: false
        type: boolean
permissions:
  contents: write

# Prevent overlapping pilot runs from racing to save the same output directory.
concurrency:
  group: luna-story-pilot-${{ github.ref }}
  cancel-in-progress: false
# Publication intentionally disabled until deterministic editorial validation is implemented.
# A model-produced audit checklist is not publication approval.
jobs:
  pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      OPENAI_API_KEY: ${{ inputs.paid_execute && secrets.OPENAI_API_KEY || '' }}
    steps:
      - uses: actions/checkout@v4
      - name: Select new candidates and preflight identities (free)
        run: python3 tools/select_missing_story_candidates.py --resume-interrupted --limit "${{ inputs.count }}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: story-selection-preflight
          path: |
            generated/luna-pilot-selected.json
            generated/story-selection-preflight.json
          if-no-files-found: warn
      - name: Test curated selection and catalogue identities (free)
        run: |
          python3 -m unittest discover -s tests -p test_curated_story_preflight.py
          python3 -m unittest discover -s tests -p test_missing_story_candidates.py
      - name: Preflight selected catalogue identities (free)
        run: |
          python3 - <<'PY'
          import json
          from tools.luna_story_pipeline import ROOT, resolve_objects
          tasks = json.loads((ROOT / "generated/luna-pilot-selected.json").read_text())
          resolved = resolve_objects(tasks)
          assert len(resolved) > 0 and len(set(resolved.values())) == len(resolved)
          for task in tasks:
              print(f"Task {task['id']}: {task['title']} -> permanent object {resolved[str(task['id'])]}")
          PY
      - name: Test response retries, budget and restart recovery (free)
        run: python3 -m unittest discover -s tests -p test_luna_response_recovery.py
      - name: Test checkpoint persistence and recovery (free)
        run: |
          python3 - <<'PY'
          import ast
          import tempfile
          from pathlib import Path
          from tools import luna_story_pipeline as p
          source = Path("tools/luna_story_pipeline.py").read_text()
          tree = ast.parse(source)
          main = next(n for n in tree.body if isinstance(n, ast.FunctionDef) and n.name == "main")
          stage = next(n for n in main.body if isinstance(n, ast.FunctionDef) and n.name == "stage")
          code = compile(ast.Module(body=[stage], type_ignores=[]), "<checkpoint-test>", "exec")
          with tempfile.TemporaryDirectory() as directory:
              calls = []
              def ask(name, instruction, source):
                  calls.append(name)
                  return "verified checkpoint content"
              namespace = {"OUT": Path(directory), "ask": ask, "ledger_file": Path(directory) / "ledger.json", "persist_checkpoint": lambda *a: None}
              exec(code, namespace)
              saved = namespace["stage"]("123", "research", "instruction", "source")
              recovered = namespace["stage"]("123", "research", "instruction", "source")
              assert saved == recovered == "verified checkpoint content"
              assert calls == ["123:research"], "Recovery unexpectedly repeated a paid call"
              assert (Path(directory) / "123.research.stage.txt").exists()
              print("PASS: stage persisted; resume reused saved output without API call")
          PY
      - name: Test evidence preservation and recovery (free)
        run: |
          python3 - <<'PY'
          import json
          import tempfile
          from pathlib import Path
          from tools.luna_story_pipeline import save_or_recover_evidence
          with tempfile.TemporaryDirectory() as folder:
              target = Path(folder) / "sample.evidence.json"
              ledger = Path(folder) / "ledger.json"
              calls = []
              original = [{"url": "https://example.org/star", "excerpt": "Original observed evidence"}]
              changed = [{"url": "https://example.org/star", "excerpt": "Changed upstream page"}]
              def persist(path, ledger_file):
                  calls.append(path.read_bytes())
              first = save_or_recover_evidence(target, original, ledger, persist)
              second = save_or_recover_evidence(target, changed, ledger, persist)
              assert first == second == original
              assert len(calls) == 1
              assert json.loads(target.read_text()) == original
              print("PASS: saved evidence remains identical after restart; no second push")
          PY
      - name: Verify paid calls restricted to writing (free)
        run: |
          python3 - <<'PY'
          from pathlib import Path
          source = Path('tools/luna_story_pipeline.py').read_text()
          assert 'research = stage(' not in source
          assert 'audit = stage(' not in source
          assert 'revised_audit = stage(' not in source
          assert 'stage(ident, "draft"' in source
          assert 'stage(ident, "correction"' in source
          print('PASS: paid stages limited to draft and correction')
          PY
      - name: Verify recovery code and ledger initialization (free)
        run: |
          python3 -m py_compile tools/luna_story_pipeline.py
          python3 - <<'PY'
          from pathlib import Path
          source = Path("tools/luna_story_pipeline.py").read_text()
          assert 'if evidence_path.exists():' in source
          assert source.index('if evidence_path.exists():') < source.index('for url in task["sources"][:3]:')
          assert 'if not ledger_file.exists():' in source
          print("PASS: evidence recovery precedes source retrieval; ledger initialized")
          PY
      - name: Test real Git checkpoint push (free)
        if: ${{ !inputs.paid_execute }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          import subprocess
          from pathlib import Path
          from tools.luna_story_pipeline import ROOT, OUT, persist_checkpoint
          marker = OUT / ("checkpoint-push-test-" + os.environ["GITHUB_RUN_ID"] + ".stage.txt")
          ledger = OUT / ("checkpoint-push-test-" + os.environ["GITHUB_RUN_ID"] + ".ledger.json")
          OUT.mkdir(parents=True, exist_ok=True)
          if not ledger.exists():
              ledger.write_text('{"estimated_usd": 0.0, "calls": []}' + chr(10))
          marker.write_text("free GitHub checkpoint persistence test\\n")
          persist_checkpoint(marker, ledger)
          remote = subprocess.check_output(
              ["git", "show", "origin/" + os.environ["GITHUB_REF_NAME"] + ":" + str(marker.relative_to(ROOT))],
              cwd=ROOT, text=True)
          assert remote == marker.read_text(), "Remote checkpoint content mismatch"
          print("PASS: real checkpoint pushed and verified on GitHub")
          PY
      - name: Paid API preflight (minimal request)
        if: ${{ inputs.paid_execute }}
        shell: bash
        env:
          MODEL: ${{ inputs.model }}
        run: |
          python3 - <<'PY'
          import json, os, urllib.request, urllib.error
          key = os.environ.get("OPENAI_API_KEY")
          if not key:
              raise SystemExit("PREFLIGHT FAILED: OPENAI_API_KEY is missing")
          model = os.environ["MODEL"]
          headers = {"Authorization": "Bearer " + key, "Content-Type": "application/json"}
          def call(url, payload=None):
              req = urllib.request.Request(url, data=json.dumps(payload).encode() if payload is not None else None,
                                           headers=headers, method="POST" if payload is not None else "GET")
              try:
                  with urllib.request.urlopen(req, timeout=45) as response:
                      return json.load(response)
              except urllib.error.HTTPError as exc:
                  body = exc.read(2048).decode("utf-8", "replace")
                  try:
                      error = json.loads(body).get("error", {})
                      detail = f"type={error.get('type')}, code={error.get('code')}, message={error.get('message')}"
                  except ValueError:
                      detail = "non-JSON error body"
                  raise SystemExit(f"PREFLIGHT FAILED: HTTP {exc.code} at {url}: {detail}")
          models = call("https://api.openai.com/v1/models")
          if model not in {entry.get("id") for entry in models.get("data", [])}:
              raise SystemExit(f"PREFLIGHT FAILED: model {model!r} not listed for this API key")
          print("PREFLIGHT: API key authenticated; requested model listed", flush=True)
          response = call("https://api.openai.com/v1/responses",
                          {"model": model, "input": "Reply with OK.", "max_output_tokens": 32})
          if not response.get("id") or not response.get("output"):
              raise SystemExit("PREFLIGHT FAILED: missing response id or output")
          print("PREFLIGHT PASSED: paid Responses API request succeeded", flush=True)
          PY
      - name: Run pilot (dry-run by default)
        shell: bash
        env:
          MODEL: ${{ inputs.model }}
          INPUT_PRICE: ${{ inputs.input_price }}
          OUTPUT_PRICE: ${{ inputs.output_price }}
          PAID_EXECUTE: ${{ inputs.paid_execute }}
        run: |
          set -euo pipefail
          args=(--manifest generated/luna-pilot-selected.json --model "$MODEL" --input-price "$INPUT_PRICE" --output-price "$OUTPUT_PRICE")
          if [[ "$PAID_EXECUTE" == "true" ]]; then args+=(--execute); fi
          python3 tools/luna_story_pipeline.py "${args[@]}"
      - name: Check reviewed story publication eligibility
        run: python3 tools/publish_stories.py --dry-run
      - name: Compile-check editorial pipeline
        run: python3 -m py_compile tools/luna_story_pipeline.py
      - name: Validate pilot output structure
        if: always()
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          manifest = json.loads(Path('research/luna-pilot-candidates.json').read_text())
          assert len(manifest) > 0
          assert len({str(t['id']) for t in manifest}) == len(manifest)
          output = Path('generated/luna-pilot')
          if output.exists():
              for story in output.glob('*.md'):
                  assert story.stat().st_size > 0, f'Empty draft: {story}'
                  assert story.with_suffix('.audit.txt').exists(), f'Missing audit: {story}'
                  assert story.with_suffix('.research.txt').exists(), f'Missing research: {story}'
          print('Pilot output structure validated; drafts remain unpublished.')
          PY
      - name: Permanently save every completed pilot output
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          branch="${GITHUB_REF_NAME}"
          snapshot="$RUNNER_TEMP/luna-pilot-save"
          mkdir -p "$snapshot"
          if [[ ! -d generated/luna-pilot ]]; then
            echo "No pilot output directory exists; nothing to save."
            exit 0
          fi
          cp -a generated/luna-pilot/. "$snapshot/"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Preserve existing repository files. Conflicting run output is saved separately.
          for attempt in 1 2 3 4 5 6 7 8; do
            git fetch origin "$branch"
            git reset --hard "origin/$branch"
            while IFS= read -r -d '' source; do
              rel="${source#"$snapshot"/}"
              dest="generated/luna-pilot/$rel"
              if [[ -f "$dest" ]]; then
                if cmp -s "$source" "$dest"; then
                  continue
                fi
                dest="generated/luna-pilot-recovery/${GITHUB_RUN_ID}/$rel"
                echo "Preserving conflicting output separately: $dest"
              fi
              mkdir -p "$(dirname "$dest")"
              cp "$source" "$dest"
            done < <(find "$snapshot" -type f -print0)
            git add -A -- generated/luna-pilot/
            if [[ -d generated/luna-pilot-recovery ]]; then
              git add -A -- generated/luna-pilot-recovery/
            fi
            if git diff --cached --quiet; then
              echo "All pilot outputs are already saved; no changes needed."
              exit 0
            fi
            git commit -m "Save completed Luna pilot outputs"
            if git push origin "HEAD:$branch"; then
              echo "All completed pilot outputs are committed to $branch."
              exit 0
            fi
            echo "Save push raced with another repository update (attempt $attempt/8)."
            sleep "$((attempt * 3))"
          done
          echo "Save did not reach the repository after eight attempts; uploaded artifact remains the recovery copy."
          exit 1
      - name: Publish already-reviewed stories
        if: success()
        run: |
          python3 tools/publish_stories.py
          git add stories/
          if ! git diff --cached --quiet; then
            git -c user.name=github-actions -c user.email=actions@users.noreply.github.com commit -m "Render reviewed stories"
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: luna-pilot-results
          path: generated/luna-pilot/
          if-no-files-found: warn
