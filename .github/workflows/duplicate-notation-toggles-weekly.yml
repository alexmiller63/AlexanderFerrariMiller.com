name: Duplicate notation toggles on weekly pages

on:
  workflow_dispatch:
    inputs:
      years:
        description: 'Space-separated Almanack years to update'
        required: false
        default: '2025 2026 2027'
  push:
    branches:
      - main
    paths:
      - .github/workflows/duplicate-notation-toggles-weekly.yml

permissions:
  contents: write

env:
  ALMANACK_YEARS: ${{ github.event_name == 'workflow_dispatch' && inputs.years || '2025 2026 2027' }}

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Add independently targeted notation toggles
        run: |
          python - $ALMANACK_YEARS <<'PY'
          from pathlib import Path
          import re
          import sys

          repo = Path('.')
          try:
            years = tuple(dict.fromkeys(int(arg) for arg in sys.argv[1:]))
          except ValueError as exc:
            raise SystemExit('Years must be integers, e.g. 2025 2027') from exc
          if not years or any(year < 1900 or year > 2100 for year in years):
            raise SystemExit('Supply one or more Almanack years from 1900 through 2100')

          def toggle(target):
            return (
              f'<div class="bayer-toggle-wrap section-notation-toggle" data-notation-target="{target}">'
              '<div class="bayer-toggle" role="group" aria-label="Astronomical notation">'
              '<span class="bayer-toggle-label">Notation:</span>'
              '<button type="button" data-bayer-mode="greek" aria-pressed="true">Greek/Symbols</button>'
              '<button type="button" data-bayer-mode="latin" aria-pressed="false">Latin</button>'
              '<button type="button" data-bayer-mode="mixed" data-legacy-label="Mixed · Learner" aria-pressed="false">Mixed Learner</button>'
              '</div></div>'
            )

          calendar_toggle = toggle('calendar')
          ephemeris_toggle = toggle('ephemeris')
          finder_toggle = toggle('finder')

          css = '''\n<style id="section-notation-toggle-css">\n.bayer-toggle-wrap{max-width:1080px;margin:0 auto;padding:.75rem 1.5rem 0;font-family:system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif}\n.bayer-toggle{display:flex;align-items:center;justify-content:flex-end;gap:.35rem;flex-wrap:wrap;font-size:.86rem}\n.bayer-toggle-label{margin-right:.2rem;color:var(--muted)}\n.bayer-toggle button{appearance:none;border:1px solid #c8d3dc;background:#fff;color:var(--link);padding:.35rem .62rem;border-radius:.4rem;font:inherit;cursor:pointer}\n.bayer-toggle button[aria-pressed=true]{background:var(--navy);color:#fff;border-color:var(--navy)}\n.section-notation-toggle{padding:.15rem 0 .35rem;margin:0;width:100%;max-width:100%}\n.section-notation-toggle .bayer-toggle{justify-content:flex-start;min-height:2.15rem}\n/* Keep notation changes inside the ephemeris scroller so switching Greek/Latin/Mixed cannot widen the page and move its toggle. */\ntable.ephemeris{min-width:0!important;max-width:100%!important}\n/* Planet Finder always occupies one stable slot; only the selected notation artwork is displayed. */\n.planet-finder-strip,.w15-finder-strip{margin:1.25rem 0 2rem}\n.planet-finder-strip figure,.w15-finder-strip figure{display:none;margin:0 auto;max-width:820px}\n.planet-finder-strip figure.is-active,.w15-finder-strip figure.is-active{display:block}\n.planet-finder-strip img,.w15-finder-strip img{display:block;width:100%;height:auto}\n.planet-finder-strip figcaption,.w15-finder-strip figcaption{text-align:center;font-family:system-ui,sans-serif;font-size:.82rem;color:var(--muted);margin-top:.35rem}\n@media(max-width:760px) and (orientation:portrait){.bayer-toggle-wrap{padding-left:1rem;padding-right:1rem}.section-notation-toggle{padding-left:0;padding-right:0}.bayer-toggle{justify-content:center;flex-wrap:nowrap;gap:.2rem;font-size:.74rem}.section-notation-toggle .bayer-toggle{justify-content:center}.bayer-toggle-label{margin-right:.05rem;white-space:nowrap}.bayer-toggle button{padding:.3rem .42rem;white-space:nowrap}}\n@media(prefers-color-scheme:dark){.bayer-toggle button{background:#1c2a36;border-color:#405567;color:#b6dcff}.bayer-toggle button[aria-pressed=true]{background:#eef7ff;color:#102a43;border-color:#eef7ff}}\n</style>'''

          changed = 0
          for year in years:
            for tree in ('almanack', 'Star-Almanack-Repo/site'):
              root = repo / tree / str(year)
              if not root.exists():
                raise SystemExit(f'Missing Almanack year tree: {root}')
              for page in sorted(root.glob('W[0-9][0-9]/index.html')):
                html = page.read_text(encoding='utf-8')
                original = html

                # Remove every legacy/global/duplicated notation control first.
                html = re.sub(r'<div class="bayer-toggle-wrap section-notation-toggle"(?:\s+data-notation-target="[^"]+")?>.*?</div></div>', '', html, flags=re.S)
                html = re.sub(r'(</header>)\s*<div class="bayer-toggle-wrap"><div class="bayer-toggle" role="group" aria-label="Astronomical notation">.*?</div></div>', r'\1', html, count=1, flags=re.S)
                html = re.sub(r'<div class="finder-controls" role="group" aria-label="Planet finder notation">.*?</div>', '', html, count=1, flags=re.S)
                html = re.sub(r'\s*<script id="section-notation-toggle-sync">.*?</script>', '', html, flags=re.S)

                # One control per section.  The ephemeris control belongs under
                # Snapshot, not above the section heading.
                html = html.replace('<h3>Calendar</h3>', calendar_toggle + '<h3>Calendar</h3>', 1)
                snapshot = re.compile(r'(<h3>Weekly Solar-System Ephemeris</h3>\s*<p><strong>Snapshot:</strong>.*?</p>)', re.S)
                html, count = snapshot.subn(lambda m: m.group(1) + ephemeris_toggle, html, count=1)
                if count != 1:
                  raise SystemExit(f'Could not place ephemeris notation toggle in {page}')
                html = html.replace('<h3>Planet Finder</h3>', finder_toggle + '<h3>Planet Finder</h3>', 1)

                # Replace the canonical control CSS so regenerated pages do not retain stale sizing/visibility rules.
                html = re.sub(r'<style id="section-notation-toggle-css">.*?</style>', css.strip(), html, count=1, flags=re.S)
                if 'section-notation-toggle-css' not in html:
                  html = html.replace('</head>', css + '</head>', 1)
                if html != original:
                  page.write_text(html, encoding='utf-8')
                  changed += 1
          print(f'Updated {changed} weekly pages for years: {" ".join(map(str, years))}')
          PY

      - name: Commit notation toggle layout
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for year in $ALMANACK_YEARS; do
            git add "almanack/$year" "Star-Almanack-Repo/site/$year"
          done
          if git diff --cached --quiet; then
            echo 'Weekly notation toggles are already in place.'
            exit 0
          fi
          git commit -m "Update weekly notation toggles for $ALMANACK_YEARS"
          git pull --rebase origin main
          git push