name: Generate Resumes

on:
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pandoc libreoffice

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install markdown

      - name: Generate all resumes
        run: |
          set -e

          for source in resumes/*-resume.md
          do
              stem="$(basename "$source" .md)"

              echo "Generating $stem"

              python tools/generate-resumes.py "$stem"
          done

      - name: Package all resume files
        run: |
          set -e

          mkdir -p resume-output

          for source in resumes/*-resume.md
          do
              stem="$(basename "$source" .md)"

              cp "resumes/$stem.html" resume-output/
              cp "resumes/$stem.pdf" resume-output/
              cp "resumes/$stem.docx" resume-output/
              cp "resumes/$stem.odt" resume-output/
              cp "resumes/$stem.txt" resume-output/
          done

      - name: Upload resume files
        uses: actions/upload-artifact@v4
        with:
          name: all-resumes
          path: resume-output/