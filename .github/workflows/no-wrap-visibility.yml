name: Keep visibility labels together

on:
  workflow_dispatch:
    inputs:
      years:
        description: 'Space-separated ISO years to patch'
        required: true
        default: '2025 2026 2027'
  push:
    paths:
      - .github/workflows/no-wrap-visibility.yml

env:
  ALMANACK_YEARS: ${{ github.event_name == 'workflow_dispatch' && inputs.years || '2025 2026 2027' }}

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Keep fixed-star visibility labels on one line
        env:
          ALMANACK_YEARS: ${{ env.ALMANACK_YEARS }}
        run: |
          python - <<'PY'
          from pathlib import Path
          import os
          import re

          years = tuple(dict.fromkeys(os.environ['ALMANACK_YEARS'].split()))
          if not years or any(not re.fullmatch(r'\d{4}', year) for year in years):
              raise SystemExit('Years must be four digits, e.g. 2025 2027')

          publisher = Path('Star-Almanack-Repo/publish_weekly_pages.py')
          text = publisher.read_text(encoding='utf-8')

          css_old = 'table.calendar td:nth-child(3) { line-height:1.6; }'
          css_new = css_old + '\n.visibility { white-space:nowrap; }'
          if '.visibility { white-space:nowrap; }' not in text:
              if css_old not in text:
                  raise SystemExit('Calendar CSS insertion point not found in publisher')
              text = text.replace(css_old, css_new, 1)

          markup_old = 'sentinel="@@BR@@"; text=text.replace("<br>",sentinel); text=html.escape(text)'
          markup_new = markup_old + '\n    text=re.sub(r"(👁 V [+-]?\\d+|B V [+-]?\\d+)",r\'<span class="visibility">\\1</span>\',text)'
          if 'class="visibility"' not in text.split('def inline_markup', 1)[1].split('def is_separator_row', 1)[0]:
              if markup_old not in text:
                  raise SystemExit('inline_markup insertion point not found in publisher')
              text = text.replace(markup_old, markup_new, 1)

          publisher.write_text(text, encoding='utf-8')

          css_marker = 'table.calendar td:nth-child(3) { line-height:1.6; }'
          pattern = re.compile(r'(?<!class="visibility">)(👁 V [+-]?\d+|B V [+-]?\d+)')
          pages = []
          for year in years:
              pages.extend(sorted((Path('almanack') / year).glob('W??/index.html')))
              pages.extend(sorted((Path('Star-Almanack-Repo/site') / year).glob('W??/index.html')))
          if not pages:
              raise SystemExit(f'No weekly pages found for requested years: {" ".join(years)}')

          changed = 0
          for page in pages:
              html = page.read_text(encoding='utf-8')
              new = html
              if '.visibility { white-space:nowrap; }' not in new:
                  if css_marker in new:
                      new = new.replace(css_marker, css_marker + '\n.visibility { white-space:nowrap; }', 1)
                  else:
                      new = new.replace('</style>', '.visibility{white-space:nowrap}</style>', 1)
              new = pattern.sub(r'<span class="visibility">\1</span>', new)
              if new != html:
                  page.write_text(new, encoding='utf-8')
                  changed += 1

          print(f'Patched visibility no-wrap rule in publisher and {changed} weekly HTML files for {" ".join(years)}')
          PY

      - name: Commit changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Star-Almanack-Repo/publish_weekly_pages.py
          for year in $ALMANACK_YEARS; do
            git add "Star-Almanack-Repo/site/$year"/W??/index.html "almanack/$year"/W??/index.html
          done
          if git diff --cached --quiet; then
            echo 'No visibility wrapping changes.'
            exit 0
          fi
          git commit -m "Prevent visibility labels from wrapping for $ALMANACK_YEARS"
          git pull --rebase origin main
          git push
