name: Expand Planet Finder label candidates

on:
  push:
    paths:
      - '.github/workflows/expand-planet-finder-label-candidates.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Expand Latin and mixed candidate grid
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('tools/generate-current-planet-finder.py')
          text = p.read_text()
          old = """    radii=(340,300,260,380,220,180); shifts=(0,-70,70,-120,120,-170,170)\n    candidate_specs=([(r,sh) for sh in (0,-45,45,-80,80,-120,120) for r in radii] if mode=='symbols' else [(r,sh) for r in radii for sh in shifts])\n"""
          new = """    # Dense candidate geometry lets wide Latin/mixed labels find valid\n    # collision-free placements in crowded weeks without weakening constraints.\n    symbol_radii=(340,300,260,380,220,180)\n    symbol_shifts=(0,-45,45,-80,80,-120,120)\n    text_radii=(380,360,340,320,300,280,260,240,220,200,180,160)\n    text_shifts=(0,-35,35,-70,70,-105,105,-140,140,-175,175,-210,210)\n    candidate_specs=([(r,sh) for sh in symbol_shifts for r in symbol_radii] if mode=='symbols' else [(r,sh) for r in text_radii for sh in text_shifts])\n"""
          if old not in text:
              raise SystemExit('Expected candidate-grid block not found; refusing blind edit')
          p.write_text(text.replace(old, new, 1))
          PY
      - name: Verify generator syntax
        run: python -m py_compile tools/generate-current-planet-finder.py
      - name: Commit source fix
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add tools/generate-current-planet-finder.py
          git commit -m "Broaden planet finder label candidate geometry"
          git push
