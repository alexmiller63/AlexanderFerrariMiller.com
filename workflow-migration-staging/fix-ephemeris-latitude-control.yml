name: Fix Ephemeris Latitude Control

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Update canonical latitude control
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('tools/populate_ephemeris.py')
          text = path.read_text(encoding='utf-8')
          old = '<input id="ephemeris-latitude" name="ephemeris-latitude" type="number" min="-90" max="90" step="0.1" value="45" data-ephemeris-latitude>°</label> <span>(default +45°)</span>'
          new = '<input id="ephemeris-latitude" name="ephemeris-latitude" type="text" inputmode="text" value="45" data-ephemeris-latitude aria-describedby="ephemeris-latitude-range">°</label> <button type="button" data-ephemeris-apply>Apply</button> <span id="ephemeris-latitude-range">(−90° to +90°; default +45°)</span>'
          if old not in text:
              raise SystemExit('Expected latitude control not found; refusing to patch')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY

      - name: Verify
        run: |
          grep -F 'data-ephemeris-apply' tools/populate_ephemeris.py
          grep -F 'inputmode="text"' tools/populate_ephemeris.py

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools/populate_ephemeris.py
          git commit -m "Add ephemeris latitude Apply control"
          git pull --rebase origin main
          git push
