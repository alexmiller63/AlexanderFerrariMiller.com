name: Examine Jekyll Site

"on":
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  examine:
    runs-on: ubuntu-latest
    steps:
      - name: Check out website
        uses: actions/checkout@v4

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"

      - name: Install Jekyll
        run: gem install jekyll --no-document

      - name: Examine Jekyll configuration
        run: jekyll doctor

      - name: Build Jekyll with full diagnostics
        run: jekyll build --trace

      - name: Examine rendered Star Almanack
        run: python tools/examine-almanack-jekyll.py 2025 2026 2027
