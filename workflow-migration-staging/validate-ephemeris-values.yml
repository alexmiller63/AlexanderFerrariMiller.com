name: Validate ephemeris values

on:
  workflow_dispatch:
    inputs:
      year:
        description: 'ISO week-year to validate'
        required: true
        default: '2026'
      tolerance_arcmin:
        description: 'Maximum longitude/latitude error in arcminutes'
        required: true
        default: '1.0'
  push:
    paths:
      - '.github/workflows/validate-ephemeris-values.yml'
      - 'tools/validate_ephemeris_against_horizons.py'
      - 'tools/star_almanack_ephemeris.py'

env:
  STAR_ALMANACK_EPHEMERIS_DIR: ${{ github.workspace }}/.cache/skyfield

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Restore astronomical source cache
        uses: actions/cache@v4
        with:
          path: |
            .cache/skyfield/de440s.bsp
            .cache/skyfield/ceres_1900_2100.bsp
          key: star-almanack-source-kernels-v1

      - name: Install calculation dependency
        run: python -m pip install --disable-pip-version-check skyfield==1.55

      - name: Download source kernels only when cache is empty
        run: |
          mkdir -p .cache/skyfield
          python - <<'PY'
          from pathlib import Path
          from urllib.request import urlretrieve
          from skyfield.api import Loader

          root = Path('.cache/skyfield')
          de440s = root / 'de440s.bsp'
          ceres = root / 'ceres_1900_2100.bsp'
          if not de440s.exists():
              Loader(str(root)).download('de440s.bsp')
          if not ceres.exists():
              urlretrieve(
                  'https://naif.jpl.nasa.gov/pub/naif/generic_kernels/spk/asteroids/a_old_versions/ceres_1900_2100.bsp',
                  ceres,
              )
          PY

      - name: Compare every weekly publication position with Horizons
        env:
          VALIDATION_YEAR: ${{ github.event_name == 'workflow_dispatch' && inputs.year || '2026' }}
          TOLERANCE_ARCMIN: ${{ github.event_name == 'workflow_dispatch' && inputs.tolerance_arcmin || '1.0' }}
        run: |
          python tools/validate_ephemeris_against_horizons.py \
            "$VALIDATION_YEAR" \
            --tolerance-arcmin "$TOLERANCE_ARCMIN"
