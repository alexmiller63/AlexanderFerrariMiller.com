name: Preserve nearby planet label order

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/balance-planet-leader-routing.yml'

permissions:
  contents: write

jobs:
  preserve-order:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Preserve angular order for nearby labels
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('tools/generate-current-planet-finder.py')
          text = path.read_text()

          old = '''    assigned={}; search_nodes=0; node_limit=1_000_000
              def compatible(box): return all(not overlap(box,q,label_pad) for q in assigned.values())
              def solve():
                  nonlocal search_nodes
                  search_nodes+=1
                  if search_nodes>node_limit: raise RuntimeError(f'Label placement search exceeded {node_limit} states')
                  if len(assigned)==len(rows): return True
                  best_i=None; best_options=None
                  for i in range(len(rows)):
                      if i in assigned: continue
                      options=[box for box in candidates[i] if compatible(box)]
          '''

          new = '''    assigned={}; search_nodes=0; node_limit=1_000_000
              def angular_delta(a,b): return (a-b+180)%360-180
              def label_longitude(box):
                  x,y,_,_=box
                  return (math.degrees(math.atan2(C-y,x-C))-180)%360
              def preserves_local_order(i,box):
                  # Nearby bodies should read around the wheel in the same angular
                  # order as their exact anchors. This prevents two close labels from
                  # visually swapping places even when both arrangements are collision-free.
                  box_lon=label_longitude(box)
                  for j,q in assigned.items():
                      anchor_delta=angular_delta(lons[i],lons[j])
                      if abs(anchor_delta)>=18: continue
                      label_delta=angular_delta(box_lon,label_longitude(q))
                      if abs(label_delta)<1e-6 or anchor_delta*label_delta<=0: return False
                  return True
              def compatible(i,box):
                  return preserves_local_order(i,box) and all(not overlap(box,q,label_pad) for q in assigned.values())
              def solve():
                  nonlocal search_nodes
                  search_nodes+=1
                  if search_nodes>node_limit: raise RuntimeError(f'Label placement search exceeded {node_limit} states')
                  if len(assigned)==len(rows): return True
                  best_i=None; best_options=None
                  for i in range(len(rows)):
                      if i in assigned: continue
                      options=[box for box in candidates[i] if compatible(i,box)]
          '''

          if old not in text:
              raise SystemExit('Expected placement block not found; refusing a blind patch')

          path.write_text(text.replace(old, new, 1))
          PY

      - name: Syntax check
        run: python -m py_compile tools/generate-current-planet-finder.py

      - name: Commit root-cause fix
        run: |
          if git diff --quiet; then
            echo 'No change needed.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tools/generate-current-planet-finder.py
          git commit -m 'Preserve angular order of nearby planet labels'
          git push
