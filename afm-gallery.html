<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>AFM Photo Gallery</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 8px;
            font-family:
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                Roboto,
                Helvetica,
                Arial,
                sans-serif;
            background: #f5f5f2;
            color: #1f2529;
        }

        h1 {
            margin: 4px 0 8px;
            text-align: center;
            font-size: 20px;
        }

        .gallery {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 6px;
            max-width: 1000px;
            margin: 0 auto;
        }

        figure {
            margin: 0;
            padding: 3px;
            background: white;
            border: 1px solid #d9dde0;
        }

        img {
            display: block;
            width: 100%;
            aspect-ratio: 1 / 1;
            object-fit: cover;
        }

        figcaption {
            padding: 3px 1px 1px;
            text-align: center;
            font-size: 11px;
            font-weight: 600;
        }

        @media (min-width: 700px) {
            .gallery {
                grid-template-columns: repeat(6, 1fr);
            }
        }
    </style>
</head>

<body>

    <h1>AFM Bartending Photos</h1>

    <main class="gallery" id="gallery"></main>

    <script>
        const gallery = document.getElementById("gallery");

        for (let number = 1; number <= 30; number += 1) {
            const filename = `AFM-${number}-web.png`;

            const figure = document.createElement("figure");
            const image = document.createElement("img");
            const caption = document.createElement("figcaption");

            image.src = `images/${filename}?v=20260831-2201`;
            image.alt = `AFM ${number}`;
            image.loading = "lazy";

            caption.textContent = `AFM-${number}`;

            image.addEventListener("error", () => {
                figure.remove();
            });

            figure.appendChild(image);
            figure.appendChild(caption);
            gallery.appendChild(figure);
        }
    </script>

</body>

</html>
