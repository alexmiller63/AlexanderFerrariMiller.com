<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Asterism Atlas · Star Almanack</title><link rel="stylesheet" href="../../css/star-almanack-nav-20261022.css"><style>main{max-width:1100px;margin:auto;padding:1.5rem}.atlas-list{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:1rem}.atlas-list a{display:block;padding:1rem;border:1px solid #7290ac;border-radius:.5rem;color:#d9efff;text-decoration:none;background:#10263b}.atlas-list a:hover{border-color:#69dc94}</style></head><body>{% include star-almanack-nav.html %}<main><p><a href="../">← Chart Library</a></p><h1>Asterism Atlas</h1><p>Twenty-eight original J2000 asterism charts. Select a title for its full-resolution SVG.</p><div class="atlas-list" id="atlas-list">Charts are awaiting generation.</div></main><script>fetch("manifest.json").then(r=>{if(!r.ok)throw Error(r.status);return r.json()}).then(data=>{const list=document.getElementById("atlas-list");list.replaceChildren();for(const item of data.views){const a=document.createElement("a");a.href=encodeURIComponent(item.file);a.textContent=item.name;list.append(a)}}).catch(()=>{});</script>{% include star-almanack-footer.html %}</body></html>
