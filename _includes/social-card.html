<article class="social-card">
    <h2>{{ include.social.name }}</h2>

    <img
        class="social-icon"
        src="{{ '/images/source-svg/' | append: include.social.icon_file | relative_url }}"
        alt="{{ include.social.name }}"
        width="38"
        height="38"
        loading="lazy"
        decoding="async"
    >

    {% if include.social.value %}
    <div class="social-value">
        {% if include.social.name == "WhatsApp" %}
            {{ include.social.value | replace: "-", "&#8209;" }}
        {% else %}
            {{ include.social.value }}
        {% endif %}
    </div>
    {% endif %}

    <a
        class="social-link"
        href="{{ include.social.url }}"
        target="_blank"
        rel="noopener noreferrer"
    >
        {{ include.social.url }}
    </a>
</article>
