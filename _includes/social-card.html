<article class="social-card">
    <h2>{{ include.social.name }}</h2>

    <span
        class="social-icon"
        role="img"
        aria-label="{{ include.social.name }}"
        style="--social-icon-url: url('{{ '/images/source-svg/' | append: include.social.icon_file | relative_url }}');"
    ></span>

    {% if include.social.value %}
    <div class="social-value">
        {% if include.social.name == "WhatsApp" %}
            {{ include.social.value | replace: "-", "&#8209;" }}
        {% else %}
            {{ include.social.value }}
        {% endif %}
    </div>
    {% endif %}

    <a
        class="social-link"
        href="{{ include.social.url }}"
        target="_blank"
        rel="noopener noreferrer"
    >
        {{ include.social.url }}
    </a>
</article>
