<script>
(() => {
  const menu = document.querySelector('.star-menu');
  const mobile = window.matchMedia('(max-width: 700px)');
  const updateMenu = () => { menu.open = !mobile.matches; };
  updateMenu();
  mobile.addEventListener('change', updateMenu);
})();
</script>
