<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="description"
        content="Social media links for Alexander Ferrari Miller."
    >

    <title>Alexander Ferrari Miller | Social Media</title>

    <style>
        :root {
            --background: #f5f5f2;
            --surface: #ffffff;
            --text: #1f2529;
            --muted: #5f686f;
            --accent: #2f536b;
            --accent-dark: #213d50;
            --border: #d9dde0;
            --shadow: rgba(0, 0, 0, 0.08);
            --max-width: 1100px;
        }

        * {
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;

            font-family:
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                Roboto,
                Helvetica,
                Arial,
                sans-serif;

            background: var(--background);
            color: var(--text);
            line-height: 1.6;
        }

        a {
            color: var(--accent);
        }

        a:hover {
            color: var(--accent-dark);
        }

        .container {
            width: min(calc(100% - 40px), var(--max-width));
            margin: 0 auto;
        }

        .site-header {
            padding: 32px 0 18px;
        }

        .site-name {
            color: var(--text);
            text-decoration: none;
            font-size: 1.15rem;
            font-weight: 600;
        }

        main {
            flex: 1;
        }

        .hero {
            padding: 55px 0 30px;
        }

        .hero h1 {
            margin: 0 0 12px;
            font-size: clamp(2.25rem, 7vw, 4.5rem);
            line-height: 1.05;
            font-weight: 600;
            letter-spacing: -0.04em;
        }

        .hero p {
            margin: 0;
            max-width: 700px;
            color: var(--muted);
            font-size: 1.1rem;
        }

        .social-list {
            display: grid;
            grid-template-columns:
                repeat(auto-fit, minmax(260px, 1fr));
            gap: 20px;
            padding: 25px 0 60px;
        }

        .social-card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 28px;
            box-shadow: 0 4px 18px var(--shadow);
        }

        .social-card h2 {
            margin: 0 0 18px;
            font-size: 1.35rem;
            font-weight: 600;
        }

        .social-icon {
            display: block;
            width: 38px;
            height: 38px;
            margin-bottom: 18px;
            background-color: var(--accent);
            -webkit-mask: var(--social-icon-url) center / contain no-repeat;
            mask: var(--social-icon-url) center / contain no-repeat;
        }

        .social-link,
        .social-value {
            display: block;
            overflow-wrap: anywhere;
            word-break: break-word;
            font-size: 0.98rem;
        }

        .social-value {
            margin-bottom: 6px;
            color: var(--muted);
        }

        .site-footer {
            margin-top: auto;
            border-top: 1px solid var(--border);
            padding: 24px 0 36px;
        }

        .site-nav {
            display: flex;
            flex-wrap: wrap;
            gap: 12px 24px;
        }

        .site-nav a {
            color: var(--text);
            text-decoration: none;
        }

        .site-nav a:hover {
            text-decoration: underline;
        }

        @media (max-width: 600px) {
            .container {
                width: min(calc(100% - 28px), var(--max-width));
            }

            .hero {
                padding-top: 35px;
            }

            .social-card {
                padding: 22px;
            }
        }
    </style>
</head>

<body>

    <header class="site-header">
        <div class="container">
            <a
                class="site-name"
                href="index.html"
            >
                Alexander Ferrari Miller
            </a>
        </div>
    </header>

    <main>

        <section class="hero">
            <div class="container">
                <h1>Social Media</h1>

                <p>
                    Find Alexander Ferrari Miller across social media
                    and communication platforms.
                </p>
            </div>
        </section>

        <div class="container">

            <section
                class="social-list"
                aria-label="Social media links"
            >
                {% for social in site.data["social-media"] %}
                    {% include social-card.html social=social %}
                {% endfor %}
            </section>

        </div>

    </main>

    {% include footer.html %}

</body>

</html>
