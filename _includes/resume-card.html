{% assign resume = site.data.resumes[include.resume] %}

<article class="resume-card">
    <div>
        <h2>
            {{ resume.title }}
        </h2>

        <p>
            {{ resume.description }}
        </p>
    </div>

    <div class="resume-actions">
        <a
            class="resume-link"
            href="c3po.html?file=resumes/{{ resume.basename }}.html&amp;type=html&amp;title={{ resume.viewer_title | url_encode }}"
        >
            View Resume
        </a>

        <div class="download-links">
            <strong>Formats:</strong>

            <a href="c3po.html?file=resumes/{{ resume.basename }}.html&amp;type=html&amp;title={{ resume.viewer_title | url_encode }}">
                HTML
            </a>

            ·

            <a href="c3po.html?file=resumes/{{ resume.basename }}.pdf&amp;type=pdf&amp;title={{ resume.viewer_title | url_encode }}">
                PDF
            </a>

            ·

            <a href="c3po.html?file=resumes/{{ resume.basename }}.docx&amp;type=docx&amp;title={{ resume.viewer_title | url_encode }}">
                DOCX
            </a>

            ·

            <a href="c3po.html?file=resumes/{{ resume.basename }}.md&amp;type=md&amp;title={{ resume.viewer_title | url_encode }}">
                MD
            </a>

            ·

            <a href="c3po.html?file=resumes/{{ resume.basename }}.txt&amp;type=txt&amp;title={{ resume.viewer_title | url_encode }}">
                ASCII Text
            </a>

            ·

            <a href="c3po.html?file=resumes/{{ resume.basename }}.odt&amp;type=odt&amp;title={{ resume.viewer_title | url_encode }}">
                ODT
            </a>
        </div>

        <div class="source-link">
            <a href="resumes/{{ resume.basename }}.md">
                View Markdown Source
            </a>
        </div>
    </div>
</article>
