# Star Almanack — Special Stars
# Editorial working file.
# "Special Star" is an editorial designation, not an inclusion rule.
# Long notes are intentionally preserved; weekly-page versions can be shortened later.
# observing_method is practical: naked-eye, binocular, telescope, or variable.

special_stars:

  - id: proxima-centauri
    name: Proxima Centauri
    designation: V645 Centauri
    already_in_main_inventory: true
    inventory_status: special-addition
    observing_method: telescope
    tags: [stellar-neighborhood, nearest-star, red-dwarf, flare-star, alpha-centauri-system, exoplanets, science-fiction, cultural-significance]
    notes: >
      Proxima Centauri is the nearest known star to the Sun, apart from the Sun itself,
      and the faint, widely separated third member of the Alpha Centauri system. It is
      a red dwarf and flare star, far too faint for naked-eye observing. Proxima hosts
      confirmed planets, including Proxima b, an approximately Earth-mass planet in the
      star's habitable zone, and Proxima d, a smaller world on a much tighter orbit.
      Proxima is physically associated with Alpha Centauri A and B but lies far enough
      from them on the sky that its Star Almanack best-visibility date is about two days
      earlier. That is a useful demonstration that membership in the same physical
      stellar system does not require exactly the same apparent direction. Alpha
      Centauri also has an unusually strong place in science fiction: Pandora in Avatar
      belongs to a fictional planetary system placed in Alpha Centauri. That connection
      is to the Alpha Centauri system generally, not specifically to Proxima.

  - id: barnards-star
    name: Barnard's Star
    designation: null
    already_in_main_inventory: false
    inventory_status: special-addition-needed
    observing_method: telescope
    tags: [stellar-neighborhood, red-dwarf, proper-motion, exoplanets, astronomical-history]
    notes: >
      Barnard's Star is one of the Sun's nearest stellar neighbors and is visually faint,
      around ninth magnitude. E. E. Barnard recognized its extraordinary proper motion
      in 1916. At roughly ten arcseconds per year it has the largest known proper motion
      of any star. The star therefore makes the phrase "fixed stars" visibly temporary
      on the scale of a human lifetime: its position changes measurably on sufficiently
      detailed charts. Barnard's Star also hosts a system of small exoplanets. Its
      importance comes not from brightness but from proximity, motion, and the modern
      study of nearby planetary systems.

  - id: wolf-359
    name: Wolf 359
    designation: CN Leonis
    already_in_main_inventory: false
    inventory_status: special-addition-needed
    observing_method: telescope
    tags: [stellar-neighborhood, red-dwarf, flare-star, faint-neighbor, science-fiction, cultural-significance]
    notes: >
      Wolf 359 is one of the nearest stars to the Sun, yet it is only about thirteenth
      magnitude. It is a low-mass red dwarf and an active flare star. Its combination
      of extreme proximity and extreme faintness demonstrates that the naked-eye sky
      gives a biased picture of the actual stellar neighborhood: many of our nearest
      neighbors are dim red dwarfs invisible without optical aid. Wolf 359 also has
      unusually rich science-fiction history. "Wolf 359" was the title of a 1964
      episode of The Outer Limits, and the star later became famous in Star Trek as
      the site of the Battle of Wolf 359. Ken MacLeod also used the name in the short
      story "Who's Afraid of Wolf 359?" The cultural material accompanies, rather than
      replaces, the astronomical reason for inclusion.

  - id: 61-cygni
    name: 61 Cygni
    designation: null
    already_in_main_inventory: false
    inventory_status: special-addition-needed
    observing_method: naked-eye
    tags: [astronomical-history, stellar-parallax, stellar-distance, binary-star, proper-motion]
    notes: >
      61 Cygni is a nearby binary star with a foundational place in astronomy.
      Friedrich Bessel used it in 1838 for the first generally accepted successful
      measurement of stellar parallax, providing a direct geometric distance to a
      star. The result helped transform the stars from lights on a celestial sphere
      into objects at measurable distances in three-dimensional space. The system
      also has substantial proper motion. It is accessible to the unaided eye under
      a dark sky, binoculars are useful for locating it, and a telescope is needed
      to resolve the pair.

  - id: epsilon-eridani
    name: Epsilon Eridani
    designation: ε Eridani
    already_in_main_inventory: false
    inventory_status: special-addition-needed
    observing_method: naked-eye
    tags: [stellar-neighborhood, exoplanets, debris-disk, seti, project-ozma, science-fiction, astronomical-history]
    notes: >
      Epsilon Eridani is a nearby, relatively young Sun-like star with planetary and
      debris material around it. It is bright enough for naked-eye observing. In 1960
      Frank Drake selected Epsilon Eridani, together with Tau Ceti, for Project Ozma,
      one of the foundational experiments of modern SETI. It bridges ordinary naked-eye
      observing, planetary-system science, and the scientific search for extraterrestrial
      intelligence. Its long history in science fiction adds cultural significance.

  - id: lalande-21185
    name: Lalande 21185
    designation: Gliese 411
    already_in_main_inventory: false
    inventory_status: special-addition-needed
    observing_method: binocular
    tags: [stellar-neighborhood, red-dwarf, exoplanets, faint-neighbor]
    notes: >
      Lalande 21185 is one of the nearest stellar systems to the Sun and a nearby red
      dwarf with confirmed planets. At roughly seventh magnitude it is not a practical
      naked-eye target for most observers but is well suited to binocular observing
      under favorable conditions. Like Proxima, Barnard's Star, and Wolf 359, it helps
      reveal the hidden red-dwarf population of the solar neighborhood.

  - id: 40-eridani-b
    name: 40 Eridani B
    designation: ο² Eridani B
    already_in_main_inventory: false
    inventory_status: special-addition-needed
    observing_method: telescope
    tags: [white-dwarf, stellar-evolution, astronomical-history, multiple-star]
    notes: >
      40 Eridani B is historically important as the first white dwarf to have been
      observed, although its extraordinary physical nature was understood only much
      later. It belongs to the multiple-star system 40 Eridani. The object provides
      a direct route into the story of stellar remnants: a star can end its ordinary
      luminous life by leaving behind a compact, hot white dwarf.

  - id: algol
    name: Algol
    designation: β Persei
    already_in_main_inventory: true
    inventory_status: alpha-beta
    observing_method: naked-eye
    tags: [eclipsing-binary, variable-star, prototype, astronomical-history, naked-eye-variability]
    notes: >
      Algol is already present in the main inventory as Beta Persei, but belongs
      independently on the Special Stars list. It is the prototype of Algol-type
      eclipsing binaries. Its brightness changes can be followed with the unaided eye.
      In the eighteenth century John Goodricke correctly proposed that the periodic
      fading was caused by one body passing in front of another, a remarkable early
      inference about the physical arrangement of an unresolved stellar system.

  - id: delta-cephei
    name: Delta Cephei
    designation: δ Cephei
    already_in_main_inventory: false
    inventory_status: special-addition-needed
    observing_method: naked-eye
    tags: [cepheid, variable-star, prototype, cosmic-distance-scale, astronomical-history]
    notes: >
      Delta Cephei is the prototype of the classical Cepheid variable stars. Its
      brightness varies through a range visible to the unaided eye on a period of
      about five and a third days. Cepheids became fundamental tools for measuring
      astronomical distances because their pulsation periods are related to their
      intrinsic luminosities. Delta Cephei connects a star an observer can watch
      change with humanity's ability to measure the scale of galaxies and the universe.

  - id: mira
    name: Mira
    designation: ο Ceti
    already_in_main_inventory: false
    inventory_status: special-addition-needed
    observing_method: variable
    tags: [mira-variable, variable-star, prototype, astronomical-history, naked-eye, binocular, telescope]
    notes: >
      Mira, Omicron Ceti, is the prototype of the long-period Mira variables and one
      of the historically important early variable stars. Its variability was
      recognized in the late sixteenth century. Mira changes by many magnitudes:
      near favorable maxima it can become an obvious naked-eye star, while near
      minimum it requires a telescope. Its changing observing method is itself part
      of the story.

  - id: tabbys-star
    name: Tabby's Star
    alternate_names: [Boyajian's Star]
    designation: KIC 8462852
    already_in_main_inventory: false
    inventory_status: special-addition-needed
    observing_method: telescope
    tags: [variable-star, kepler, citizen-science, astronomical-mystery, dust, seti, cultural-significance]
    notes: >
      Tabby's Star, also called Boyajian's Star, became famous after unusual and
      sometimes deep dimming events were identified in Kepler data with important
      help from citizen scientists in Planet Hunters. The behavior inspired hypotheses
      ranging from unusual circumstellar material to the culturally irresistible
      suggestion of an alien megastructure. Later wavelength-dependent observations
      strongly favored dust for at least the long-term dimming and argued against an
      opaque megastructure. The star shows science working in public: an anomaly is
      discovered, hypotheses are proposed, and observations progressively eliminate
      possibilities.

  - id: mu-cephei
    name: Herschel's Garnet Star
    designation: μ Cephei
    already_in_main_inventory: false
    inventory_status: special-addition-needed
    observing_method: naked-eye
    tags: [red-supergiant, variable-star, stellar-color, stellar-evolution, astronomical-history]
    notes: >
      Mu Cephei is a red supergiant famous for its striking color and commonly known
      as Herschel's Garnet Star after William Herschel's description of it. It is a
      naked-eye variable under suitable conditions. The star gives the reader an
      immediate observational connection between stellar color and stellar physics:
      its deep orange-red appearance is the visible signature of a comparatively cool
      photosphere on an enormous evolved star.

  - id: rr-lyrae
    name: RR Lyrae
    designation: RR Lyrae
    already_in_main_inventory: false
    inventory_status: special-addition-needed
    observing_method: binocular
    tags: [rr-lyrae-variable, variable-star, prototype, standard-candle, cosmic-distance-scale, globular-clusters]
    notes: >
      RR Lyrae is the prototype of the RR Lyrae variables, pulsating stars especially
      important as distance indicators in old stellar populations and globular
      clusters. It is normally around seventh to eighth magnitude and is therefore
      a practical binocular target rather than a naked-eye star for most observers.
      Together with Delta Cephei, it tells a complementary story about pulsating stars
      and the cosmic distance scale.

  - id: betelgeuse
    name: Betelgeuse
    designation: α Orionis
    already_in_main_inventory: true
    inventory_status: alpha-beta
    observing_method: naked-eye
    tags: [red-supergiant, variable-star, stellar-evolution, great-dimming, stellar-diameter, naked-eye]
    notes: >
      Betelgeuse is already included as Alpha Orionis but clearly deserves Special
      Star treatment. It is a red supergiant, visibly orange-red and intrinsically
      variable. The dramatic Great Dimming of 2019-2020 brought modern stellar
      astrophysics into public view and stimulated intensive study of its surface,
      mass loss, and surrounding dust. Betelgeuse also belongs to the history of
      attempts to measure stellar angular diameters.

  - id: vega
    name: Vega
    designation: α Lyrae
    already_in_main_inventory: true
    inventory_status: alpha-beta
    observing_method: naked-eye
    tags: [astronomical-history, astrophotography, spectroscopy, stellar-parallax, precession, pole-star, science-fiction, contact]
    notes: >
      Vega is one of the brightest stars in the northern sky and already appears as
      Alpha Lyrae. In 1850 it became the first star other than the Sun to be
      photographed. It also belongs to the nineteenth-century development of stellar
      spectroscopy and the early race to measure stellar parallax. Precession gives
      Vega an even longer human story: it lay near the north celestial pole in deep
      human prehistory and will approach the pole again in the distant future. When
      Vega last lay near the pole, fully modern humans were already observing the sky
      but had left no written record of what they called it. In Carl Sagan's Contact,
      and in the 1997 film, the extraterrestrial signal comes from the direction of Vega.

  - id: thuban
    name: Thuban
    designation: α Draconis
    already_in_main_inventory: true
    inventory_status: alpha-beta
    observing_method: naked-eye
    tags: [precession, pole-star, ancient-egypt, archaeoastronomy, astronomical-history]
    notes: >
      Thuban, Alpha Draconis, was near the north celestial pole during the age of
      ancient Egypt and was closest to the pole around the third millennium BCE.
      It vividly demonstrates that "North Star" is a temporary role produced by
      Earth's axial precession. The cardinal orientation of major Egyptian monuments,
      especially the pyramids, makes the ancient polar sky historically fascinating,
      although claims about precise intended alignments to individual stars should
      be presented cautiously. Together, Thuban, Polaris, and Vega turn precession
      into a human-scale narrative: past, present, and future pole stars.

  - id: polaris
    name: Polaris
    designation: α Ursae Minoris
    already_in_main_inventory: true
    inventory_status: alpha-beta
    observing_method: naked-eye
    tags: [pole-star, precession, navigation, cepheid, multiple-star, astronomical-history]
    notes: >
      Polaris is the present North Star and one of the most useful naked-eye reference
      points in the sky. Its apparent steadiness near the north celestial pole has made
      it central to navigation, yet the star itself is not physically static: Polaris
      is a Cepheid variable and part of a multiple-star system. Precession also means
      its role is temporary. Read together with Thuban and Vega, Polaris makes the slow
      movement of Earth's rotational axis understandable through stars readers can find.

  - id: arcturus
    name: Arcturus
    designation: α Boötis
    already_in_main_inventory: true
    inventory_status: alpha-beta
    observing_method: naked-eye
    tags: [astronomical-history, cultural-significance, worlds-fair, photoelectric-detection, stellar-distance]
    notes: >
      Arcturus is a brilliant naked-eye star already included as Alpha Boötis. On
      May 27, 1933, light from Arcturus was collected at observatories with
      photoelectric equipment; the resulting tiny electrical signals were amplified
      and transmitted to Chicago, where they triggered the lighting of the Century
      of Progress World's Fair. Organizers chose Arcturus because its distance was
      then believed to be about forty light-years, matching the forty years since
      Chicago's 1893 World's Columbian Exposition. Modern measurements put Arcturus
      closer, at roughly thirty-seven light-years, so the poetic arithmetic was not
      exact. The starlight did not supply the energy to illuminate the fair; it
      supplied the control signal. In modern language, Arcturus pressed the switch.

  - id: sirius
    name: Sirius
    designation: α Canis Majoris
    already_in_main_inventory: true
    inventory_status: alpha-beta
    observing_method: naked-eye
    tags: [brightest-night-star, white-dwarf, binary-star, astronomical-history, ancient-egypt, stellar-dynamics]
    notes: >
      Sirius is the brightest star in the night sky and already appears as Alpha
      Canis Majoris. Irregularities in Sirius's motion led astronomers to infer an
      unseen companion before that companion was directly observed. Sirius B was
      later recognized as a white dwarf, helping establish an entirely new class of
      compact stellar remnants. Sirius also has deep historical importance in ancient
      Egyptian calendrical astronomy. Its Special Star treatment can connect naked-eye
      brilliance, gravitational inference, binary stars, white dwarfs, and ancient
      sky watching.

  - id: antares
    name: Antares
    designation: α Scorpii
    already_in_main_inventory: true
    inventory_status: alpha-beta
    observing_method: naked-eye
    tags: [red-supergiant, stellar-color, stellar-evolution, cultural-significance, mars]
    notes: >
      Antares is a red supergiant and the bright heart of Scorpius. Its traditional
      name is commonly interpreted as "rival of Ares," or rival of Mars, because its
      reddish color invites comparison with the planet. That makes Antares especially
      useful in a book treating both stars and classical planets: readers can compare
      two reddish naked-eye objects whose colors arise from entirely different physical
      causes. Antares also belongs naturally with Betelgeuse in discussion of massive
      evolved stars.

  - id: rigel
    name: Rigel
    designation: β Orionis
    already_in_main_inventory: true
    inventory_status: alpha-beta
    observing_method: naked-eye
    tags: [blue-supergiant, stellar-color, stellar-evolution, massive-star]
    notes: >
      Rigel, Beta Orionis, is a luminous blue supergiant and provides a striking
      physical and visual counterpoint to the red supergiant Betelgeuse in the same
      constellation. The pair lets an observer use naked-eye color differences as
      an entrance into stellar temperature, mass, and evolution.

  - id: deneb
    name: Deneb
    designation: α Cygni
    already_in_main_inventory: true
    inventory_status: alpha-beta
    observing_method: naked-eye
    tags: [supergiant, luminosity, apparent-magnitude, stellar-distance, summer-triangle]
    notes: >
      Deneb is one of the three stars of the Summer Triangle and appears to the eye
      as another ordinary first-magnitude star. In reality it is vastly farther away
      than Vega and intrinsically enormously luminous. That contrast makes Deneb an
      excellent demonstration of the difference between apparent brightness and
      luminosity: stars that look comparable in our sky can be radically different
      physical objects at radically different distances.

candidates:

  - id: chi-cygni
    name: Chi Cygni
    designation: χ Cygni
    observing_method: variable
    tags: [mira-variable, variable-star, naked-eye, binocular, telescope]
    notes: >
      Chi Cygni is a long-period Mira variable with an enormous brightness range.
      Over its cycle the appropriate observing method can change from naked eye to
      binoculars to telescope. It is a vivid example of a star whose observational
      character changes with time.

  - id: eta-carinae
    name: Eta Carinae
    designation: η Carinae
    observing_method: binocular
    tags: [luminous-blue-variable, massive-star, great-eruption, stellar-evolution, astronomical-history]
    notes: >
      Eta Carinae is an extraordinary massive stellar system famous for its
      nineteenth-century Great Eruption, when it temporarily became one of the
      brightest stars in the sky. Its surrounding Homunculus Nebula records that
      violent mass loss. It is a strong candidate for representing extreme stellar
      instability and the late evolution of very massive stars.

  - id: r-coronae-borealis
    name: R Coronae Borealis
    designation: R Coronae Borealis
    observing_method: variable
    tags: [variable-star, prototype, carbon-star, dust, stellar-chemistry]
    notes: >
      R Coronae Borealis is the prototype of a rare class of hydrogen-deficient,
      carbon-rich variables that can fade suddenly when freshly formed carbon dust
      obscures the star. It offers a qualitatively different kind of variability:
      instead of simple periodic pulsation or eclipse, the star can apparently
      vanish behind its own soot.
