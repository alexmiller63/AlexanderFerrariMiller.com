<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Nativitas Generation Monitor</title><style>body{font:1.1rem system-ui;max-width:45rem;margin:2rem auto;padding:0 1rem;background:#101825;color:#edf2ff}a{color:#9acbff}progress{width:100%;height:2rem}small{color:#b9c4d8}</style><h1>Nativitas Library Monitor</h1><p id="state">Checking…</p><progress id="bar" max="345" value="0"></progress><p id="count"></p><p id="review"></p><p id="current"></p><p id="updated"></p><p><small>Refreshes every 30 seconds. GitHub Pages shows only committed checkpoints. Drafts are not independently verified.</small></p><p><a href="https://github.com/alexmiller63/AlexanderFerrariMiller.com/actions/workflows/nativitas-interpretation-drafts.yml">Open workflow</a></p><script>async function refresh(){try{const r=await fetch('generation-progress.json?t='+Date.now(),{cache:'no-store'});if(!r.ok)throw Error('Progress not yet published');const p=await r.json();document.querySelector('#state').textContent='Status: '+p.status;document.querySelector('#bar').value=p.cataloged;document.querySelector('#count').textContent=p.cataloged+' / '+p.total+' catalog slots; '+p.remaining_uncataloged+' not yet cataloged';document.querySelector('#review').textContent=p.approved+' marked reviewed; '+p.awaiting_review+' awaiting review; '+p.excluded+' astronomically unavailable';document.querySelector('#current').textContent='Last item: '+(p.current||'—');document.querySelector('#updated').textContent='Last checkpoint: '+p.updated_at;}catch(e){document.querySelector('#state').textContent=e.message;}}refresh();setInterval(refresh,30000);</script></html>
